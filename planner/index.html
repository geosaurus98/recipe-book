.5},"diet":["dairy-free","quick","leftovers"],"storage":[]},{"title":"Rigatoni all’Amatriciana","servings":"4","time":"45 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g Rigatoni (La Molisana brand)"},{"text":"200 g guanciale or streaky bacon"},{"text":"1 small onion (red or white)"},{"text":"2 cans whole tomatoes or 800 g passata"},{"text":"½ glass white wine"},{"text":"Extra virgin olive oil"},{"text":"100 g pecorino cheese"},{"text":"Salt and pepper, to taste"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Step 1 — Prepare the Onion Base:**","sub":["In a little olive oil over low heat, fry the onion until soft and translucent."]},{"text":"**Step 2 — Cook the Guanciale:**","sub":["Cut the guanciale or streaky bacon into cubes or strips.","Fry in a bit of oil until golden and slightly crisp."]},{"text":"**Step 3 — Deglaze with White Wine:**","sub":["Raise the heat and add the white wine.","Let the alcohol evaporate completely for a couple of minutes."]},{"text":"**Step 4 — Add the Tomatoes:**","sub":["Lower the heat and add the tomatoes or passata.","Season lightly with salt and pepper — remember that pecorino will add saltiness later.","Bring to a gentle boil."]},{"text":"**Step 5 — Simmer the Sauce:**","sub":["Reduce to medium-low heat and let the sauce simmer for about 30 minutes.","Stir occasionally until the sauce thickens and flavours deepen."]},{"text":"**Step 6 — Cook the Pasta:**","sub":["Boil the Rigatoni in salted water until al dente.","Drain well, reserving a small amount of the pasta water."]},{"text":"**Step 7 — Combine and Serve:**","sub":["Add the cooked pasta to the sauce pan and toss to coat evenly.","Mix in grated pecorino cheese, adding a splash of pasta water if needed to loosen the sauce.","Serve immediately with extra pecorino on top."]}]},{"kind":"notes","heading":"Notes","items":[{"text":"When combining pasta and sauce, use a large bowl: spread half the sauce on the bottom, add the pasta, mix well, then add the remaining sauce and mix again before serving."}]}],"id":"Italian-Rigatoni","file":"Italian/Rigatoni.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["500 g Rigatoni (La Molisana brand)","200 g guanciale or streaky bacon","1 small onion (red or white)","2 cans whole tomatoes or 800 g passata","½ glass white wine","Extra virgin olive oil","100 g pecorino cheese","Salt and pepper, to taste"],"shop":[{"key":"rigatoni","name":"Rigatoni","aisle":"Pasta, rice & grains","qty":500.0,"unit":"g","optional":false,"raw":"500 g Rigatoni (La Molisana brand)"},{"key":"bacon","name":"Bacon","aisle":"Meat & fish","qty":200.0,"unit":"g","optional":false,"raw":"200 g guanciale or streaky bacon"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 small onion (red or white)"},{"key":"passata","name":"Passata","aisle":"Cans, jars & pulses","qty":2.0,"unit":"can","optional":false,"raw":"2 cans whole tomatoes or 800 g passata"},{"key":"wine","name":"Wine (for cooking)","aisle":"Pantry: check first","qty":0.5,"unit":"","optional":false,"raw":"½ glass white wine"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Extra virgin olive oil"},{"key":"parmesan","name":"Parmesan","aisle":"Dairy, eggs & chilled","qty":100.0,"unit":"g","optional":false,"raw":"100 g pecorino cheese"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper, to taste"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper, to taste"}],"tags":["pork"],"nutrition":{"kcal":770,"protein":35,"carbs":103,"fat":21,"per":"serving","count":4},"diet":[],"storage":[]},{"title":"Sausage Ragu","servings":"4","time":"45 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"6 beef or pork sausages"},{"text":"1 onion, diced"},{"text":"400 g tinned diced tomatoes"},{"text":"125 ml red wine"},{"text":"150 ml beef stock (or chicken stock if using pork sausages)"},{"text":"4 garlic cloves, minced"},{"text":"2 tbsp tomato paste"},{"text":"1 tsp dried thyme (or dried oregano if using pork sausages)"},{"text":"1 tsp fennel seeds"},{"text":"½ tsp chilli flakes (optional)"},{"text":"Salt and black pepper, to taste"},{"text":"250 g frozen vegetables (peas, corn, or mixed)"},{"text":"350 g pasta (pappardelle, rigatoni, or penne)"},{"text":"Parmesan, to serve (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Squeeze the sausage meat out of the casings and discard the skins. Break into rough chunks."},{"text":"Heat a large pan or pot over high heat with a little oil. Brown the sausage meat, breaking it up as you go, until well coloured (about 5 min)."},{"text":"Reduce heat to medium. Add the onion and cook for 3–4 min until softened."},{"text":"Add garlic, tomato paste, thyme (or oregano), fennel seeds, and chilli flakes. Stir and cook for 1 min until fragrant."},{"text":"Pour in the red wine and scrape up any browned bits. Let it bubble and reduce by half (about 2 min)."},{"text":"Add the tomatoes and stock. Stir to combine, season, and bring to a boil."},{"text":"Reduce heat to low and simmer uncovered for 20 min, stirring occasionally, until the sauce is thickening nicely."},{"text":"Stir in the frozen vegetables and cook a further 5–10 min until heated through and the sauce is thick and rich."},{"text":"Meanwhile, cook the pasta in well-salted boiling water until al dente. Reserve a cup of pasta water before draining."},{"text":"Toss the drained pasta through the ragu, adding a splash of pasta water to loosen if needed. Serve with parmesan."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Beef sausages give a richer, deeper sauce; pork sausages are slightly lighter and milder. Fennel seeds can go in whole or be lightly crushed for stronger flavour."}]},{"kind":"variation","heading":"Extra Vegetables","text":"For a heartier, more vegetable-forward ragu, add 1 diced or grated carrot and 150 g sliced mushrooms along with the onion in Step 3, cooking until softened (5–6 min total). Grated carrot melts further into the sauce; diced keeps more texture. Diced capsicum can also be added at this stage. For extra greens, stir through a handful of fresh spinach with the pasta in Step 10 until just wilted. The frozen vegetable quantity can also be increased up to 300 g for an even heartier, more veg-forward sauce.","sections":[]}],"id":"Stovetop-Sausage_Ragu","file":"Stovetop/Sausage_Ragu.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["6 beef or pork sausages","1 onion, diced","400 g tinned diced tomatoes","125 ml red wine","150 ml beef stock (or chicken stock if using pork sausages)","4 garlic cloves, minced","2 tbsp tomato paste","1 tsp dried thyme (or dried oregano if using pork sausages)","1 tsp fennel seeds","½ tsp chilli flakes (optional)","Salt and black pepper, to taste","250 g frozen vegetables (peas, corn, or mixed)","350 g pasta (pappardelle, rigatoni, or penne)","Parmesan, to serve (optional)"],"shop":[{"key":"sausages","name":"Sausages","aisle":"Meat & fish","qty":6.0,"unit":"","optional":false,"raw":"6 beef or pork sausages"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"400 g tinned diced tomatoes"},{"key":"wine","name":"Wine (for cooking)","aisle":"Pantry: check first","qty":125.0,"unit":"ml","optional":false,"raw":"125 ml red wine"},{"key":"beef-stock","name":"Beef stock","aisle":"Pantry: check first","qty":150.0,"unit":"ml","optional":false,"raw":"150 ml beef stock (or chicken stock if using pork sausages)"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":4.0,"unit":"clove","optional":false,"raw":"4 garlic cloves, minced"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"thyme","name":"Dried thyme","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried thyme (or dried oregano if using pork sausages)"},{"key":"fennel-seeds","name":"Fennel seeds","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp fennel seeds"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":true,"raw":"½ tsp chilli flakes (optional)"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper, to taste"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper, to taste"},{"key":"frozen-mixed-veg","name":"Frozen mixed vegetables","aisle":"Frozen","qty":250.0,"unit":"g","optional":false,"raw":"250 g frozen vegetables (peas, corn, or mixed)"},{"key":"pasta","name":"Pasta","aisle":"Pasta, rice & grains","qty":350.0,"unit":"g","optional":false,"raw":"350 g pasta (pappardelle, rigatoni, or penne)"},{"key":"parmesan","name":"Parmesan","aisle":"Dairy, eggs & chilled","qty":null,"unit":"","optional":true,"raw":"Parmesan, to serve (optional)"}],"tags":["beef","pork"],"nutrition":{"kcal":700,"protein":29,"carbs":86,"fat":24,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":[]},{"title":"Sesame Beef, Edamame & Vegetable Noodles","servings":"4","time":"30 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g lean beef mince"},{"text":"250 g dried egg noodles"},{"text":"300 g frozen shelled edamame"},{"text":"700 g frozen stir-fry vegetables"},{"text":"1 onion, thinly sliced"},{"text":"3 garlic cloves, crushed"},{"text":"2 tsp grated ginger"},{"text":"4 tbsp reduced-salt soy sauce"},{"text":"1 tbsp sweet chilli sauce or honey"},{"text":"1 tbsp rice vinegar or lemon juice"},{"text":"1 tsp sesame oil"},{"text":"½ cup water"},{"text":"Chilli flakes, to taste (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Cook the noodles according to the packet instructions, then drain and set aside."},{"text":"Brown the mince in a large wok or deep frying pan over high heat for 5–6 min, breaking it up as it cooks. Drain excess fat if necessary."},{"text":"Add the onion, garlic and ginger and cook for a further 2 min."},{"text":"Add the frozen vegetables, edamame and water. Stir-fry for 5–6 min, until the water has cooked off and the vegetables are hot through."},{"text":"Stir in the soy sauce, sweet chilli sauce and vinegar."},{"text":"Toss through the noodles, finish with the sesame oil, and divide into four portions."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Roughly 40 g protein per serve."},{"text":"Defrost the mince overnight if frozen. The edamame and vegetables can go in straight from frozen."},{"text":"Egg noodles are the cheap default; udon or rice noodles also work."},{"text":"Extra veg is easy to add: a handful of shredded cabbage or grated carrot goes in with the frozen vegetables."}]}],"id":"Stovetop-Sesame_Beef_Edamame_Noodles","file":"Stovetop/Sesame_Beef_Edamame_Noodles.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["500 g lean beef mince","250 g dried egg noodles","300 g frozen shelled edamame","700 g frozen stir-fry vegetables","1 onion, thinly sliced","3 garlic cloves, crushed","2 tsp grated ginger","4 tbsp reduced-salt soy sauce","1 tbsp sweet chilli sauce or honey","1 tbsp rice vinegar or lemon juice","1 tsp sesame oil","½ cup water","Chilli flakes, to taste (optional)"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean beef mince"},{"key":"noodles","name":"Noodles","aisle":"Pasta, rice & grains","qty":250.0,"unit":"g","optional":false,"raw":"250 g dried egg noodles"},{"key":"edamame","name":"Frozen edamame","aisle":"Frozen","qty":300.0,"unit":"g","optional":false,"raw":"300 g frozen shelled edamame"},{"key":"frozen-stir-fry","name":"Frozen stir-fry vegetables","aisle":"Frozen","qty":700.0,"unit":"g","optional":false,"raw":"700 g frozen stir-fry vegetables"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, thinly sliced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, crushed"},{"key":"ginger","name":"Fresh ginger","aisle":"Fruit & veg","qty":2.0,"unit":"tsp","optional":false,"raw":"2 tsp grated ginger"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":4.0,"unit":"tbsp","optional":false,"raw":"4 tbsp reduced-salt soy sauce"},{"key":"sweet-chilli","name":"Sweet chilli sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp sweet chilli sauce or honey"},{"key":"rice-vinegar","name":"Rice vinegar","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp rice vinegar or lemon juice"},{"key":"sesame-oil","name":"Sesame oil","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp sesame oil"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Chilli flakes, to taste (optional)"}],"tags":["beef","mince"],"nutrition":{"kcal":670,"protein":47,"carbs":69,"fat":22,"per":"serving","count":4},"diet":["dairy-free","quick"],"storage":[]},{"title":"Sloppy Joes with Lentils","servings":"4","time":"10 min prep + 25 min","intro":"Sweet, tangy saucy beef in a bun, stretched with red lentils. Serve with slaw. Roughly 38–40 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g lean beef mince"},{"text":"1 onion, diced"},{"text":"1 capsicum, diced"},{"text":"2 garlic cloves, crushed"},{"text":"½ cup dry red lentils, rinsed"},{"text":"½ cup tomato sauce"},{"text":"2 tbsp tomato paste"},{"text":"1 tbsp Worcestershire sauce"},{"text":"1 tbsp mustard"},{"text":"1 tbsp brown sugar"},{"text":"1¼ cups water or beef stock"},{"text":"Salt and pepper"},{"text":"4 wholemeal burger buns"},{"group":"Quick slaw"},{"text":"2 cups shredded cabbage, 1 grated carrot, 2 tbsp mayonnaise or yoghurt, squeeze of lemon"}]},{"kind":"steps","heading":"Method","items":[{"text":"Brown the mince with the onion and capsicum in a large frying pan. Add the garlic for the last minute."},{"text":"Stir in the lentils, tomato sauce, tomato paste, Worcestershire, mustard, brown sugar and water."},{"text":"Simmer, partly covered, for 18–20 minutes, stirring often, until the lentils are soft and the sauce is thick. Add a splash of water if it catches."},{"text":"Mix the slaw ingredients."},{"text":"Season the mince and pile into toasted buns. Serve with the slaw."}]},{"kind":"notes","heading":"Notes","items":[{"text":"The filling freezes well — reheat and serve on buns, toast or jacket potatoes."}]}],"id":"Stovetop-Sloppy_Joes_Lentils","file":"Stovetop/Sloppy_Joes_Lentils.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["500 g lean beef mince","1 onion, diced","1 capsicum, diced","2 garlic cloves, crushed","½ cup dry red lentils, rinsed","½ cup tomato sauce","2 tbsp tomato paste","1 tbsp Worcestershire sauce","1 tbsp mustard","1 tbsp brown sugar","1¼ cups water or beef stock","Salt and pepper","4 wholemeal burger buns","2 cups shredded cabbage, 1 grated carrot, 2 tbsp mayonnaise or yoghurt, squeeze of lemon"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean beef mince"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"capsicum","name":"Capsicums","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 capsicum, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":2.0,"unit":"clove","optional":false,"raw":"2 garlic cloves, crushed"},{"key":"red-lentils","name":"Red lentils (dry)","aisle":"Cans, jars & pulses","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup dry red lentils, rinsed"},{"key":"tomato-sauce","name":"Tomato sauce","aisle":"Pantry: check first","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup tomato sauce"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"worcestershire","name":"Worcestershire sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp Worcestershire sauce"},{"key":"mustard","name":"Mustard","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp mustard"},{"key":"brown-sugar","name":"Brown sugar","aisle":"Baking","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp brown sugar"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper"},{"key":"buns","name":"Burger buns or rolls","aisle":"Bread & wraps","qty":4.0,"unit":"","optional":false,"raw":"4 wholemeal burger buns"},{"key":"cabbage","name":"Cabbage","aisle":"Fruit & veg","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups shredded cabbage, 1 grated carrot, 2 tbsp mayonnaise or yoghurt, squeeze of lemon"}],"tags":["beef","mince"],"nutrition":{"kcal":610,"protein":39,"carbs":69,"fat":19,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":["The filling freezes well — reheat and serve on buns, toast or jacket potatoes."]},{"title":"Spicy Arrabbiata-Style Mince Pasta","servings":"2","time":"30 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"400 g beef mince"},{"text":"350 g pasta (penne, rigatoni, or similar)"},{"text":"1 onion, diced"},{"text":"3 garlic cloves, minced"},{"text":"400 g tinned tomatoes (crushed or diced)"},{"text":"2 tbsp tomato paste"},{"text":"1 tsp chilli flakes (adjust to taste)"},{"text":"1 tsp smoked paprika"},{"text":"½ tsp cayenne pepper"},{"text":"½ tsp ground cumin"},{"text":"1 tbsp Worcestershire sauce"},{"text":"1 tbsp soy sauce"},{"text":"1 tbsp olive oil"},{"text":"Salt and black pepper, to taste"},{"text":"150–200 g frozen mixed vegetables (optional, for bulk)"},{"text":"Handful frozen spinach (optional)"},{"text":"Parmesan, grated, to serve"}]},{"kind":"steps","heading":"Method","items":[{"text":"Heat the olive oil in a large pan over medium-high heat. Add the mince and cook, breaking it up, until well browned all over (about 5 minutes) — don't rush this step, it's where a lot of the flavour comes from."},{"text":"Add the onion and cook for 3–4 minutes until softened."},{"text":"Add the garlic, chilli flakes, smoked paprika, cayenne, and cumin. Stir and toast for about 1 minute until fragrant — this blooms the spices and deepens the flavour."},{"text":"Stir in the Worcestershire sauce, soy sauce, and tomato paste. Cook for 1 minute."},{"text":"Add the tinned tomatoes. Season with salt and pepper, bring to a simmer, then reduce heat and simmer uncovered for 15–20 minutes, stirring occasionally, until thickened."},{"text":"If using, stir in the frozen vegetables and spinach for the last 5 minutes of simmering, until tender and wilted."},{"text":"Meanwhile, cook the pasta in well-salted boiling water until al dente. Reserve a cup of pasta water before draining."},{"text":"Toss the drained pasta through the sauce, loosening with a splash of pasta water if needed."},{"text":"Serve topped with grated Parmesan."}]},{"kind":"notes","heading":"Notes","items":[{"text":"For more heat, increase the chilli flakes or add a pinch of cayenne. The Worcestershire and soy sauce aren't traditional to arrabbiata, but they add a savoury depth that's well worth it."},{"text":"Frozen mixed vegetables and spinach are optional bulk-outs — the sauce holds up fine without them if you want something simpler."}]}],"id":"Stovetop-Spicy_Arrabbiata_Mince_Pasta","file":"Stovetop/Spicy_Arrabbiata_Mince_Pasta.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["400 g beef mince","350 g pasta (penne, rigatoni, or similar)","1 onion, diced","3 garlic cloves, minced","400 g tinned tomatoes (crushed or diced)","2 tbsp tomato paste","1 tsp chilli flakes (adjust to taste)","1 tsp smoked paprika","½ tsp cayenne pepper","½ tsp ground cumin","1 tbsp Worcestershire sauce","1 tbsp soy sauce","1 tbsp olive oil","Salt and black pepper, to taste","150–200 g frozen mixed vegetables (optional, for bulk)","Handful frozen spinach (optional)","Parmesan, grated, to serve"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":400.0,"unit":"g","optional":false,"raw":"400 g beef mince"},{"key":"pasta","name":"Pasta","aisle":"Pasta, rice & grains","qty":350.0,"unit":"g","optional":false,"raw":"350 g pasta (penne, rigatoni, or similar)"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, minced"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"400 g tinned tomatoes (crushed or diced)"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp chilli flakes (adjust to taste)"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp smoked paprika"},{"key":"cayenne","name":"Cayenne pepper","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp cayenne pepper"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp ground cumin"},{"key":"worcestershire","name":"Worcestershire sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp Worcestershire sauce"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp soy sauce"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp olive oil"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper, to taste"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper, to taste"},{"key":"frozen-mixed-veg","name":"Frozen mixed vegetables","aisle":"Frozen","qty":200.0,"unit":"g","optional":true,"raw":"150–200 g frozen mixed vegetables (optional, for bulk)"},{"key":"frozen-spinach","name":"Frozen spinach","aisle":"Frozen","qty":null,"unit":"","optional":true,"raw":"Handful frozen spinach (optional)"},{"key":"parmesan","name":"Parmesan","aisle":"Dairy, eggs & chilled","qty":null,"unit":"","optional":true,"raw":"Parmesan, grated, to serve"}],"tags":["beef","mince"],"nutrition":{"kcal":1180,"protein":67,"carbs":147,"fat":34,"per":"serving","count":2},"diet":["dairy-free","quick"],"storage":[]},{"title":"Spicy Beef Bolognese with Rigatoni","servings":"3–4","time":"40 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g beef mince"},{"text":"350–400 g rigatoni, cooked separately"},{"text":"1 onion, diced"},{"text":"3 garlic cloves, minced"},{"text":"400 g tinned tomatoes"},{"text":"2 tbsp tomato paste"},{"text":"1 tsp chilli flakes (adjust to taste)"},{"text":"1 tsp dried oregano (or Italian herbs)"},{"text":"Splash red wine (optional)"},{"text":"½–1 cup beef stock or water, to loosen the sauce"},{"text":"250 g frozen mixed vegetables"},{"text":"Handful frozen spinach"},{"text":"1 tbsp olive oil"},{"text":"Salt and black pepper, to taste"},{"text":"Mozzarella, grated, to finish"},{"text":"Parmesan, grated, to finish"}]},{"kind":"steps","heading":"Method","items":[{"text":"Heat the olive oil in a large pan or pot over medium-high heat. Add the mince and cook, breaking it up, until well browned all over (about 5 minutes)."},{"text":"Add the onion and cook for 3–4 minutes until softened."},{"text":"Add the garlic, tomato paste, chilli flakes, and oregano. Stir and cook for 1 minute until fragrant."},{"text":"If using red wine, pour it in now and let it bubble and reduce for a couple of minutes, scraping up any browned bits."},{"text":"Add the tinned tomatoes along with the beef stock or water — since the pasta is cooked separately this time rather than absorbing liquid in the pot, the sauce needs a bit more liquid than a standard bolognese to stay saucy. Season with salt and pepper."},{"text":"Bring to a simmer, then reduce heat and cook uncovered for 15–20 minutes, stirring occasionally, until rich and thickened."},{"text":"Stir in the frozen vegetables and spinach. Cook for a further 5–10 minutes until the vegetables are tender and the spinach has wilted."},{"text":"Meanwhile, cook the rigatoni in well-salted boiling water until al dente, then drain."},{"text":"Off the heat, toss the drained rigatoni through the sauce until well coated."},{"text":"Scatter mozzarella and Parmesan over the top and stir through while hot until melted, or transfer to an ovenproof dish and grill briefly until bubbling."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Originally a deconstructed lasagna concept — broken lasagna sheets cooked directly in the sauce. This rigatoni version is easier for a weeknight: pasta cooked separately, tossed through at the end."},{"text":"If you've already cooked the pasta before making the sauce, keep the extra stock/water in the sauce regardless — it needs the volume since the pasta won't be absorbing any of it."}]}],"id":"Stovetop-Spicy_Beef_Bolognese_Rigatoni","file":"Stovetop/Spicy_Beef_Bolognese_Rigatoni.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["500 g beef mince","350–400 g rigatoni, cooked separately","1 onion, diced","3 garlic cloves, minced","400 g tinned tomatoes","2 tbsp tomato paste","1 tsp chilli flakes (adjust to taste)","1 tsp dried oregano (or Italian herbs)","Splash red wine (optional)","½–1 cup beef stock or water, to loosen the sauce","250 g frozen mixed vegetables","Handful frozen spinach","1 tbsp olive oil","Salt and black pepper, to taste","Mozzarella, grated, to finish","Parmesan, grated, to finish"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g beef mince"},{"key":"rigatoni","name":"Rigatoni","aisle":"Pasta, rice & grains","qty":400.0,"unit":"g","optional":false,"raw":"350–400 g rigatoni, cooked separately"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, minced"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"400 g tinned tomatoes"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw" k first","qty":null,"unit":"","optional":false,"raw":"Quick pickle: carrot & cucumber with a splash of vinegar & sugar"},{"key":"coriander","name":"Fresh coriander","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Fresh coriander, sliced chilli (optional)"},{"key":"chilli","name":"Fresh chilli","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Fresh coriander, sliced chilli (optional)"},{"key":"mayonnaise","name":"Mayonnaise","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Light mayo; soy or Maggi seasoning"}],"tags":["pork","chicken"],"nutrition":{"kcal":260,"protein":29,"carbs":19,"fat":7,"per":"serving","count":2.5},"diet":["dairy-free"],"storage":[]},{"title":"Beef Mince & Lentil Shepherd's Pie","servings":"6","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g lean beef mince"},{"text":"1 cup red lentils, rinsed"},{"text":"2 cans diced tomatoes"},{"text":"1 onion, diced"},{"text":"2 carrots, diced"},{"text":"2 stalks celery, diced"},{"text":"1 tbsp Worcestershire sauce"},{"text":"1 cup beef stock"},{"text":"4 large kumara (sweet potato), peeled and cubed"},{"text":"Salt, pepper, butter for mash"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 180°C."},{"text":"Brown mince in a large oven-safe pan over medium-high heat. Drain excess fat."},{"text":"Add onion, carrots, and celery. Cook for 5 minutes until softened."},{"text":"Stir in lentils, diced tomatoes, Worcestershire sauce, and beef stock. Simmer for 20 minutes until lentils are soft."},{"text":"Meanwhile, boil kumara until tender, then mash with butter, salt, and pepper."},{"text":"Top the mince mixture with kumara mash. Bake for 25 minutes until golden."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 2.80/serve, 480 kcal, 42 g protein per serve."},{"text":"**Tip:** The red lentils bulk out the mince significantly — you'd never notice they're there, but the Lasagne","servings":"6–8","time":"2 hr 30 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"For the meat sauce (ragu)"},{"text":"600 g mince (beef and pork, 2:1 ratio)"},{"text":"1 carrot, finely chopped"},{"text":"1 celery stalk, finely chopped"},{"text":"1 onion, finely chopped"},{"text":"700 ml tomato purée (passata)"},{"text":"2 tbsp tomato paste"},{"text":"½ cup red wine"},{"text":"Extra virgin olive oil"},{"text":"Salt and pepper, to taste"},{"group":"For the béchamel sauce"},{"text":"1 L (4 cups) whole milk"},{"text":"100 g (7 tbsp) butter"},{"text":"100 g (¾ cup) plain flour"},{"text":"Nutmeg, to taste"},{"text":"Salt, to taste"},{"group":"Other ingredients"},{"text":"250–300 g fresh or dry egg lasagne sheets"},{"text":"100 g grated parmesan cheese"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Make the Ragu:**","sub":["Finely chop the onion, carrot, and celery.","Sauté the vegetables in a drizzle of olive oil until soft.","Add the ground meat and cook until browned.","Pour in the red wine and let it evaporate.","Add the tomato purée and paste, then season with salt and pepper.","Simmer covered on low heat for 1.5–2 hours, stirring occasionally. The longer it cooks, the richer the flavour."]},{"text":"**Make the Béchamel Sauce:**","sub":["Melt the butter in a saucepan.","Add the flour and stir to create a smooth paste (roux).","Gradually whisk in the milk to avoid lumps.","Cook over medium heat until thickened.","Season with salt and a pinch of nutmeg."]},{"text":"**Assemble the Lasagne:**","sub":["Spread a little béchamel and ragu on the bottom of a baking dish.","Add a layer of lasagne sheets, followed by ragu, béchamel, and a sprinkle of parmesan.","Continue layering until all ingredients are used, ending with béchamel and a generous layer of parmesan on top."]},{"text":"**Bake and Rest:**","sub":["Bake for 40–45 minutes at 180°C.","For a golden top, turn on the grill or broiler for the final 5 minutes.","Allow the lasagne to rest for 15–20 minutes before serving. This helps it set and enhances the flavour."]}]},{"kind":"notes","heading":"Notes","items":[{"text":"Pairs beautifully with a glass of full-bodied red wine."}]}],"id":"Italian-Lasagne","file":"Italian/Lasagne.tex","chapter":"oven","chapterName":"Oven","group":null,"ingredients":["600 g mince (beef and pork, 2:1 ratio)","1 carrot, finely chopped","1 celery stalk, finely chopped","1 onion, finely chopped","700 ml tomato purée (passata)","2 tbsp tomato paste","½ cup red wine","Extra virgin olive oil","Salt and pepper, to taste","1 L (4 cups) whole milk","100 g (7 tbsp) butter","100 g (¾ cup) plain flour","Nutmeg, to taste","Salt, to taste","250–300 g fresh or dry egg lasagne sheets","100 g grated parmesan cheese"],"shop":[{"key":"mince","name":"Mince (beef or pork)","aisle":"Meat & fish","qty":600.0,"unit":"g","optional":false,"raw":"600 g mince (beef and pork, 2:1 ratio)"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 carrot, finely chopped"},{"key":"celery","name":"Celery","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 celery stalk, finely chopped"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, finely chopped"},{"key":"passata","name":"Passata","aisle":"Cans, jars & pulses","qty":700.0,"unit":"ml","optional":false,"raw":"700 ml tomato purée (passata)"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"wine","name":"Wine (for cooking)","aisle":"Pantry: check first","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup red wine"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Extra virgin olive oil"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt an :"½ tsp dried oregano"},{"key":"cayenne","name":"Cayenne pepper","aisle":"Pantry: check first","qty":0.25,"unit":"tsp","optional":false,"raw":"¼ tsp cayenne pepper (or to taste)"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":2.25,"unit":"cup","optional":false,"raw":"2¼ cups chicken stock"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Salt, to taste"},{"key":"spring-onion","name":"Spring onions","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":true,"raw":"2 spring onions, sliced, to serve"}],"tags":[],"nutrition":{"kcal":320,"protein":7,"carbs":63,"fat":5,"per":"serving","count":4},"diet":["dairy-free","quick"],"storage":[]},{"title":"Coconut Rice","servings":"4","time":"25 min","intro":"Rich, lightly sweet rice cooked in lite coconut milk. Goes with curries, satay and anything spicy.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1½ cups jasmine rice"},{"text":"1 can (400 ml) lite coconut milk"},{"text":"¾ cup water"},{"text":"½ tsp salt"},{"text":"1 tsp sugar (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Rinse the rice in a sieve until the water runs mostly clear."},{"text":"Put the rice, coconut milk, water, salt and sugar in a saucepan with a tight lid. Bring to a simmer over medium heat, stirring so it doesn't catch on the bottom."},{"text":"Cover, turn the heat to the lowest setting and cook for 15 minutes without lifting the lid."},{"text":"Take off the heat and leave covered for 10 minutes. Fluff with a fork."}]},{"kind":"variation","heading":"Rice cooker","text":"Put everything in the rice cooker, stir well, and cook as normal. Leave on keep warm for 10 minutes, then fluff.","sections":[]},{"kind":"notes","heading":"Notes","items":[{"text":"Coconut milk can catch on the base — stir it before covering, and keep the heat really low."},{"text":"Top with toasted coconut or sliced spring onion."}]}],"id":"Sides-Coconut_Rice","file":"Sides/Coconut_Rice.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Rice & grains","ingredients":["1½ cups jasmine rice","1 can (400 ml) lite coconut milk","¾ cup water","½ tsp salt","1 tsp sugar (optional)"],"shop":[{"key":"jasmine-rice","name":"Jasmine rice","aisle":"Pasta, rice & grains","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups jasmine rice"},{"key":"coconut-milk","name":"Coconut milk","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can (400 ml) lite coconut milk"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp salt"},{"key":"sugar","name":"White sugar","aisle":"Baking","qty":1.0,"unit":"tsp","optional":true,"raw":"1 tsp sugar (optional)"}],"tags":[],"nutrition":{"kcal":420,"protein":7,"carbs":58,"fat":17,"per":"serving","count":4},"diet":["vegetarian","dairy-free","quick"],"storage":[]},{"title":"Coriander Lime Rice","servings":"4","time":"25 min","intro":"Fresh, zesty rice for burrito bowls, chilli, tacos and curries.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1½ cups long-grain white rice"},{"text":"2¼ cups water"},{"text":"½ tsp salt"},{"text":"1 tbsp butter or oil"},{"text":"Zest and juice of 1 lime"},{"text":"Large handful of fresh coriander, chopped"}]},{"kind":"steps","heading":"Method","items":[{"text":"Rinse the rice in a sieve until the water runs mostly clear."},{"text":"Put the rice, water and salt in a saucepan with a tight lid and bring to the boil."},{"text":"Cover, turn the heat to the lowest setting and cook for 12 minutes without lifting the lid."},{"text":"Take off the heat and leave covered for 10 minutes."},{"text":"Fluff with a fork and stir through the butter, lime zest, lime juice and coriander."}]},{"kind":"notes","heading":"Notes","items":[{"text":"In a rice cooker, cook the rice as usual and stir through the flavourings at the end."},{"text":"Cool leftover rice quickly and refrigerate within an hour. Reheat until steaming hot."}]}],"id":"Sides-Coriander_Lime_Rice","file":"Sides/Coriander_Lime_Rice.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Rice & grains","ingredients":["1½ cups long-grain white rice","2¼ cups water","½ tsp salt","1 tbsp butter or oil","Zest and juice of 1 lime","Large handful of fresh coriander, chopped"],"shop":[{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups long-grain white rice"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp salt"},{"key":"oil","name":"Cooking oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp butter or oil"},{"key":"lime","name":"Limes","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"Zest and juice of 1 lime"},{"key":"coriander","name":"Fresh coriander","aisle":"Fruit & veg","qty":null,"unit":"","optional":false,"raw":"Large handful of fresh coriander, chopped"}],"tags":[],"nutrition":{"kcal":280,"protein":5,"carbs":56,"fat":4,"per":"serving","count":4},"diet":["vegetarian","dairy-free","quick"],"storage":["Cool leftover rice quickly and refrigerate within an hour.","Reheat until steaming hot."]},{"title":"Egg Fried Rice","servings":"4","time":"15 min","intro":"The 15-minute fried rice that uses up leftover rice. A side for stir-fries, or a quick meal on its own. Roughly 9 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"4 cups cold cooked rice (from about 1⅓ cups uncooked, ideally day-old)"},{"text":"3 eggs, beaten"},{"text":"1 tbsp oil"},{"text":"3 spring onions, sliced (white and green parts separated)"},{"text":"2 garlic cloves, crushed"},{"text":"1 cup frozen peas or mixed vegetables"},{"text":"2 tbsp soy sauce"},{"text":"1 tsp sesame oil"},{"text":"Pinch of white pepper"}]},{"kind":"steps","heading":"Method","items":[{"text":"Break up any clumps in the rice with your fingers."},{"text":"Heat half the oil in a wok or large frying pan over high heat. Pour in the eggs and scramble until just set. Tip onto a plate."},{"text":"Add the rest of the oil, the white parts of the spring onion and the garlic, and stir-fry for 30 seconds."},{"text":"Add the frozen vegetables and stir-fry for 2 minutes."},{"text":"Add the rice and stir-fry for 3–4 minutes, pressing it against the pan, until hot through and starting to crisp."},{"text":"Add the soy sauce, sesame oil and white pepper, return the egg, and toss with the green spring onion."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Cold rice fries best — freshly cooked rice goes mushy. To make it the same day, spread hot rice on a tray and chill for 30 minutes."},{"text":"Cool cooked rice quickly, keep it in the fridge, and use it within a day."},{"text":"Add leftover meat, ham or prawns with the rice to make it a meal."}]}],"id":"Sides-Egg_Fried_Rice","file":"Sides/Egg_Fried_Rice.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Rice & grains","ingredients":["4 cups cold cooked rice (from about 1⅓ cups uncooked, ideally day-old)","3 eggs, beaten","1 tbsp oil","3 spring onions, sliced (white and green parts separated)","2 garlic cloves, crushed","1 cup frozen peas or mixed vegetables","2 tbsp soy sauce","1 tsp sesame oil","Pinch of white pepper"],"shop":[{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":1.25,"unit":"cup","optional":false,"raw":"4 cups cold cooked rice (from about 1⅓ cups uncooked, ideally day-old)"},{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":3.0,"unit":"","optional":false,"raw":"3 eggs, beaten"},{"key":"oil","name":"Cooking oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp oil"},{"key":"spring-onion","name":"Spring onions","aisle":"Fruit & veg","qty":3.0,"unit":"","optional":false,"raw":"3 spring onions, sliced (white and green parts separated)"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":2.0,"unit":"clove","optional":false,"raw":"2 garlic cloves, crushed"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup frozen peas or mixed vegetables"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp soy sauce"},{"key":"sesame-oil","name":"Sesame oil","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp sesame oil"},{"key":"white-pepper","name":"White pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Pinch of white pepper"}],"tags":[],"nutrition":{"kcal":340,"protein":12,"carbs":53,"fat":9,"per":"serving","count":4},"diet":["vegetarian","dairy-free","quick","leftovers"],"storage":["Cool cooked rice quickly, keep it in the fridge, and use it within a day."]},{"title":"Garlic Butter Rice","servings":"4","time":"25 min","intro":"Fluffy rice cooked in chicken stock with garlic butter. An easy upgrade on plain rice that goes with almost anything.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1½ cups long-grain white rice"},{"text":"20 g butter"},{"text":"3 garlic cloves, crushed"},{"text":"2¼ cups chicken stock"},{"text":"2 tbsp chopped parsley"},{"text":"Salt, to taste"}]},{"kind":"steps","heading":"Method","items":[{"text":"Rinse the rice in a sieve until the water runs mostly clear. Drain well."},{"text":"Melt the butter in a saucepan over medium heat. Cook the garlic for 1 minute, until fragrant but not brown."},{"text":"Add the rice and stir for 1 minute to coat in the butter."},{"text":"Pour in the stock and bring to the boil. Cover, turn the heat to the lowest setting and cook for 12 minutes."},{"text":"Take off the heat and leave covered for 10 minutes. Fluff with a fork, stir through the parsley, and taste for salt."}]},{"kind":"variation","heading":"Rice cooker"," ced"},{"text":"2 tbsp chopped parsley or mint"},{"text":"Salt and black pepper"}]},{"kind":"steps","heading":"Method","items":[{"text":"Put the couscous and oil in a heatproof bowl. Pour over the boiling stock, stir once, and cover with a plate."},{"text":"Leave for 5 minutes, until the stock has been absorbed."},{"text":"Fluff with a fork to break up any lumps."},{"text":"Stir through the lemon zest and juice, spring onion and herbs. Season to taste."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Use a 1:1 ratio of couscous to liquid. Too much liquid makes it mushy."},{"text":"Stir through a drained can of chickpeas and some crumbled feta to turn it into a light meal."}]}],"id":"Sides-Herbed_Couscous","file":"Sides/Herbed_Couscous.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Rice & grains","ingredients":["1 cup couscous","1 cup boiling chicken or vegetable stock","1 tbsp olive oil or butter","Zest and juice of ½ lemon","2 spring onions, finely sliced","2 tbsp chopped parsley or mint","Salt and black pepper"],"shop":[{"key":"couscous","name":"Couscous","aisle":"Pasta, rice & grains","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup couscous"},{"key":"stock","name":"Stock","aisle":"Pantry: check first","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup boiling chicken or vegetable stock"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp olive oil or butter"},{"key":"lemon","name":"Lemons","aisle":"Fruit & veg","qty":0.5,"unit":"","optional":false,"raw":"Zest and juice of ½ lemon"},{"key":"spring-onion","name":"Spring onions","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 spring onions, finely sliced"},{"key":"parsley","name":"Fresh parsley","aisle":"Fruit & veg","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp chopped parsley or mint"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper"}],"tags":["chicken"],"nutrition":{"kcal":200,"protein":6,"carbs":33,"fat":4,"per":"serving","count":4},"diet":["vegetarian","dairy-free","quick"],"storage":[]},{"title":"Lemon & Herb Quinoa","servings":"4","time":"25 min","intro":"Fluffy quinoa with a lemon, garlic and herb dressing. A higher-protein swap for rice, and good warm or cold.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 cup quinoa"},{"text":"2 cups water or stock"},{"text":"½ tsp salt"},{"group":"Dressing"},{"text":"Juice of 1 lemon"},{"text":"2 tbsp olive oil"},{"text":"1 small garlic clove, crushed"},{"text":"2 tbsp chopped parsley"},{"text":"1 tbsp chopped mint or chives"},{"text":"Black pepper"}]},{"kind":"steps","heading":"Method","items":[{"text":"Rinse the quinoa well in a fine sieve — this removes its bitter coating."},{"text":"Put the quinoa, water and salt in a saucepan and bring to the boil."},{"text":"Cover, turn the heat to low and simmer for 15 minutes, until the water has been absorbed."},{"text":"Take off the heat and leave covered for 5 minutes, then fluff with a fork."},{"text":"Whisk the lemon juice, oil and garlic, and stir through with the herbs and pepper."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Keeps 4 days in the fridge, so it's good for packed lunches."}]}],"id":"Sides-Lemon_Herb_Quinoa","file":"Sides/Lemon_Herb_Quinoa.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Rice & grains","ingredients":["1 cup quinoa","2 cups water or stock","½ tsp salt","Juice of 1 lemon","2 tbsp olive oil","1 small garlic clove, crushed","2 tbsp chopped parsley","1 tbsp chopped mint or chives","Black pepper"],"shop":[{"key":"quinoa","name":"Quinoa","aisle":"Pasta, rice & grains","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup quinoa"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp salt"},{"key":"lemon","name":"Lemons","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"Juice of 1 lemon"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp olive oil"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":1.0,"unit":"clove","optional":false,"raw":"1 small garlic clove, crushed"},{"key":"parsley","name":"Fresh parsley","aisle":"Fruit & veg","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp chopped parsley"},{"key":"mint","name":"Fresh mint","aisle":"Fruit & veg","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp chopped mint or chives"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Black pepper"}],"tags":[],"nutrition":{"kcal":220,"protein":6,"carbs":28,"fat":9,"per":"serving","count":4},"diet":["vegetarian","dairy-free","quick"],"storage":["Keeps 4 days in the fridge, so it's good for packed lunches."]},{"title":"Mexican Tomato Rice","servings":"4","time":"30 min","intro":"Toasted rice cooked in tomato and stock with cumin and smoked paprika. The classic side for chilli, burritos, tacos and enchiladas.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1½ cups long-grain white rice"},{"text":"1 tbsp oil"},{"text":"1 small onion, finely diced"},{"text":"2 garlic cloves, crushed"},{"text":"1 tsp ground cumin"},{"text":"1 tsp smoked paprika"},{"text":"½ cup passata (or 2 tbsp tomato paste)"},{"text":"1¾ cups chicken stock"},{"text":"½ tsp salt"},{"text":"½ cup frozen corn or peas (optional)"},{"text":"Chopped fresh coriander, to serve"}]},{"kind":"steps","heading":"Method","items":[{"text":"Rinse the rice and drain it really well."},{"text":"Heat the oil in a saucepan over medium heat. Add the rice and stir for 3–4 minutes, until some grains turn lightly golden."},{"text":"Add the onion and cook for 2 minutes, then the garlic, cumin and paprika for 30 seconds."},{"text":"Stir in the passata, stock and salt and bring to the boil. Cover, turn the heat to the lowest setting and cook for 15 minutes."},{"text":"Scatter over the corn, put the lid back on and take off the heat. Leave for 10 minutes."},{"text":"Fluff with a fork and top with coriander."}]},{"kind":"variation","heading":"Rice cooker","text":"Toast the rice with the onion, garlic and spices in a pan (or with the rice cooker's cook or sauté setting), then add to the rice cooker with the passata, stock and salt. Stir in the corn when it finishes and leave on keep warm for 10 minutes.","sections":[]},{"kind":"notes","heading":"Notes","items":[{"text":"Toasting the rice first gives the nutty flavour and keeps the grains separate."}]}],"id":"Sides-Mexican_Tomato_Rice","file":"Sides/Mexican_Tomato_Rice.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Rice & grains","ingredients":["1½ cups long-grain white rice","1 tbsp oil","1 small onion, finely diced","2 garlic cloves, crushed","1 tsp ground cumin","1 tsp smoked paprika","½ cup passata (or 2 tbsp tomato paste)","1¾ cups chicken stock","½ tsp salt","½ cup frozen corn or peas (optional)","Chopped fresh coriander, to serve"],"shop":[{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups long-grain white rice"},{"key":"oil","name":"Cooking oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp oil"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 small onion, finely diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":2.0,"unit":"clove","optional":false,"raw":"2 garlic cloves, crushed"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp ground cumin"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp smoked paprika"},{"key":"passata","name":"Passata","aisle":"Cans, jars & pulses","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup passata (or 2 tbsp tomato paste)"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":1.75,"unit":"cup","optional":false,"raw":"1¾ cups chicken stock"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp salt"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":0.5,"unit":"cup","optional":true,"raw":"½ cup frozen corn or peas (optional)"},{"key":"coriander","name":"Fresh coriander","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Chopped fresh coriander, to serve"}],"tags":[],"nutrition":{"kcal":310,"protein":7,"carbs":62,"fat":4,"per":"serving","count":4},"diet":["dairy-free","quick"],"storage":[]},{"title":"Rice with Peas & Parmesan","servings":"4","time":"25 min","intro":"Creamy-tasting rice with sweet peas, butter and parmesan, without the stirring of a risotto. Goes with chicken, fish and meatballs.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1½ cups long-grain white rice"},{"text":"2¼ cups chicken stock"},{"text":"1½ cups frozen peas"},{"text":"30 g parmesan, finely grated"},{"text":"15 g butter"},{"text":"Black pepper"},{"text":"Zest of ½ lemon (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Rinse the rice in a sieve until the water runs mostly clear."},{"text":"Put the rice and stock in a saucepan, bring to the boil, then cover and cook on the lowest heat for 12 minutes."},{"text":"Scatter the frozen peas over the top, put the lid back on and take off the heat. Leave for 10 minutes."},{"text":"Stir through the parmesan, butter, pepper and lemon zest."}]},{"kind":"variation","heading":"Rice cooker","text":"Cook the rice and stock as normal. When it finishes, scatter over the peas, close the lid and leave on keep warm for 10 minutes, then stir in the parmesan, butter, pepper and lemon.","sections":[]}],"id":"Sides-Rice_Peas_Parmesan","file":"Sides/Rice_Peas_Parmesan.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Rice & grains","ingredients":["1½ cups long-grain white rice","2¼ cups chicken stock","1½ cups frozen peas","30 g parmesan, finely grated","15 g butter","Black pepper","Zest of ½ lemon (optional)"],"shop":[{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups long-grain white rice"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":2.25,"unit":"cup","optional":false,"raw":"2¼ cups chicken stock"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups frozen peas"},{"key":"parmesan","name":"Parmesan","aisle":"Dairy, eggs & chilled","qty":30.0,"unit":"g","optional":false,"raw":"30 g parmesan, finely grated"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":15.0,"unit":"g","optional":false,"raw":"15 g butter"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Black pepper"},{"key":"lemon","name":"Lemons","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Zest of ½ lemon (optional)"}],"tags":[],"nutrition":{"kcal":350,"protein":11,"carbs":63,"fat":6,"per":"serving","count":4},"diet":["quick"],"storage":[]},{"title":"Turmeric Rice with Peas","servings":"4","time":"25 min","intro":"Golden, gently spiced basmati with peas. Goes with keema, biryani bowls and any curry.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1½ cups basmati rice"},{"text":"1 tbsp butter or oil"},{"text":"1 small onion, finely chopped (optional)"},{"text":"1 tsp ground turmeric"},{"text":"½ tsp ground cumin"},{"text":"1 bay leaf"},{"text":"½ tsp salt"},{"text":"2¼ cups water or chicken stock"},{"text":"1 cup frozen peas"}]},{"kind":"steps","heading":"Method","items":[{"text":"Rinse the rice in a sieve until the water runs mostly clear. Drain well."},{"text":"Heat the butter in a saucepan over medium heat and cook the onion for 3–4 minutes until soft. Stir in the turmeric and cumin for 30 seconds."},{"text":"Add the rice and stir to coat, then add the bay leaf, salt and water. Bring to the boil."},{"text":"Cover, turn the heat to the lowest setting and cook for 12 minutes."},{"text":"Scatter the frozen peas over the top, put the lid back on and take off the heat. Leave for 10 minutes — the steam cooks the peas."},{"text":"Remove the bay leaf and fluff with a fork."}]},{"kind":"variation","heading":"Rice cooker","text":"Soften the onion and spices in a pan (or skip the onion), then put everything except the peas in the rice cooker. When it finishes, scatter over the peas, close the lid and leave on keep warm for 10 minutes.","sections":[]},{"kind":"notes","heading":"Notes","items":[{"text":"Turmeric stains — wipe up spills straight away."}]}],"id":"Sides-Turmeric_Rice","file":"Sides/Turmeric_Rice.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Rice & grains","ingredients":["1½ cups basmati rice","1 tbsp butter or oil","1 small onion, finely chopped (optional)","1 tsp ground turmeric","½ tsp ground cumin","1 bay leaf","½ tsp salt","2¼ cups water or chicken stock","1 cup frozen peas"],"shop":[{"key":"basmati-rice","name":"Basmati rice","aisle":"Pasta, rice & grains","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups basmati rice"},{"key":"oil","name":"Cooking oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp butter or oil"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":true,"raw":"1 small onion, finely chopped (optional)"},{"key":"turmeric","name":"Turmeric","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp ground turmeric"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp ground cumin"},{"key":"bay-leaves","name":"Bay leaves","aisle":"Pantry: check first","qty":1.0,"unit":"","optional":false,"raw":"1 bay leaf"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp salt"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup frozen peas"}],"tags":[],"nutrition":{"kcal":310,"protein":7,"carbs":60,"fat":4,"per":"serving","count":4},"diet":["vegetarian","dairy-free","quick"],"storage":[]},{"title":"Asparagus with Capers and Parsley Mayonnaise","servings":"2–3","time":"45 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 bunch asparagus spears"},{"text":"6 capers, chopped"},{"text":"Sprigs of flat-leaf parsley"},{"text":"3 tbsp mayonnaise and/or 3 tbsp thick plain yoghurt"},{"text":"Sea salt flakes"},{"text":"Salt and pepper, to taste"},{"text":"Extra virgin olive oil"},{"text":"1 sheet baking paper"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Preheat the oven:** Set to 180°C."},{"text":"**Prepare the asparagus:** Arrange the asparagus spears in a neat layer in the centre of the baking paper. Drizzle with olive oil, sprinkle with sea salt flakes, and scatter parsley leaves on top."},{"text":"**Wrap and bake:** Fold the baking paper over the spears, tucking the ends under to form a tight parcel. Place on a tray and bake for 45 minutes, or until the spears are tender when pressed through the paper."},{"text":"**Make the sauce:** Finely chop the capers and stir into the mayonnaise (or yoghurt) in a small bowl. Mix until smooth and season with salt and pepper."},{"text":"**To serve:** Cut open the paper parcel, transfer the asparagus to a serving platter, and spoon the caper–parsley mayonnaise over the top."}]},{"kind":"notes","heading":"Notes","items":[{"text":"This method of baking asparagus in olive oil inside a paper parcel intensifies its flavour and creates a soft, delicate texture. For a lighter option, substitute the mayonnaise entirely with thick plain yoghurt, or combine both for extra creaminess. Serve as a side dish to grilled meats or enjoy as a simple starter."}]}],"id":"Italian-Asparagus","file":"Italian/Asparagus.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Vegetables & potatoes","ingredients":["1 bunch asparagus spears","6 capers, chopped","Sprigs of flat-leaf parsley","3 tbsp mayonnaise and/or 3 tbsp thick plain yoghurt","Sea salt flakes","Salt and pepper, to taste","Extra virgin olive oil","1 sheet baking paper"],"shop":[{"key":"asparagus","name":"Asparagus","aisle":"Fruit & veg","qty":1.0,"unit":"bunch","optional":false,"raw":"1 bunch asparagus spears"},{"key":"capers","name":"Capers","aisle":"Cans, jars & pulses","qty":6.0,"unit":"","optional":false,"raw":"6 capers, chopped"},{"key":"parsley","name":"Fresh parsley","aisle":"Fruit & veg","qty":null,"unit":"","optional":false,"raw":"Sprigs of flat-leaf parsley"},{"key":"mayonnaise","name":"Mayonnaise","aisle":"Pantry: check first","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp mayonnaise and/or 3 tbsp thick plain yoghurt"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Sea salt flakes"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper, to taste"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper, to taste"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Extra virgin olive oil"}],"tags":[],"nutrition":{"kcal":140,"protein":3,"carbs":5,"fat":13,"per":"serving","count":2.5},"diet":["freezes","vegetarian","dairy-free"],"storage":[]},{"title":"Cauliflower Cheese","servings":"4","time":"35 min","intro":"Tender cauliflower baked in a golden cheese sauce. A comforting side for roasts, sausages and meatloaf. Roughly 13 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 medium cauliflower, cut into florets"},{"group":"Cheese sauce"},{"text":"30 g butter"},{"text":"2 tbsp plain flour"},{"text":"1½ cups milk"},{"text":"1 tsp Dijon or wholegrain mustard"},{"text":"1 cup grated tasty cheese, plus ¼ cup to top"},{"text":"Salt and black pepper"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 200°C bake."},{"text":"Boil or steam the cauliflower for 5 minutes, until just tender. Drain well and put in a baking dish."},{"text":"Melt the butter in a saucepan over medium heat. Stir in the flour and cook for 1 minute."},{"text":"Gradually whisk in the milk and keep stirring until it boils and thickens, about 3–4 minutes."},{"text":"Take off the heat and stir in the mustard and 1 cup of cheese. Season."},{"text":"Pour the sauce over the cauliflower and sprinkle with the remaining cheese."},{"text":"Bake for 15–20 minutes, until bubbling and golden."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Add the milk slowly while whisking to keep the sauce smooth."},{"text":"Half broccoli, half cauliflower works well too."}]}],"id":"Sides-Cauliflower_Cheese","file":"Sides/Cauliflower_Cheese.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Vegetables & potatoes","ingredients":["1 medium cauliflower, cut into florets","30 g butter","2 tbsp plain flour","1½ cups milk","1 tsp Dijon or wholegrain mustard","1 cup grated tasty cheese, plus ¼ cup to top","Salt and black pepper"],"shop":[{"key":"cauliflower","name":"Cauliflower","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 medium cauliflower, cut into florets"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":30.0,"unit":"g","optional":false,"raw":"30 g butter"},{"key":"flour","name":"Plain flour","aisle":"Baking","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp plain flour"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups milk"},{"key":"mustard","name":"Mustard","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp Dijon or wholegrain mustard"},{"key":"cheese","name":"Tasty cheese","aisle":"Dairy, eggs & chilled","qty":1.0,"unit":"cup","optional":true,"raw":"1 cup grated tasty cheese, plus ¼ cup to top"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper"}],"tags":[],"nutrition":{"kcal":170,"protein":7,"carbs":15,"fat":10,"per":"serving","count":4},"diet":["vegetarian"],"storage":[]},{"title":"Crispy Smashed Potatoes","servings":"4","time":"10 min prep + 50 min","intro":"Boiled, squashed and roasted until the edges shatter. Better than roast potatoes with less effort.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 kg small or baby potatoes"},{"text":"2 tbsp olive oil"},{"text":"2 garlic cloves, crushed"},{"text":"1 tsp dried rosemary or thyme"},{"text":"½ tsp salt"},{"text":"Black pepper"}]},{"kind":"steps","heading":"Method","items":[{"text":"Put the potatoes in a pot of cold salted water, bring to the boil and simmer for 15–20 minutes, until a knife slides in easily."},{"text":"Preheat oven to 220°C bake while the potatoes cook."},{"text":"Drain the potatoes and leave in the colander for 5 minutes to steam dry."},{"text":"Spread half the oil on a large tray. Space out the potatoes and press each one flat with the bottom of a glass or a potato masher until about 1.5 cm thick."},{"text":"Mix the rest of the oil with the garlic and drizzle over. Sprinkle with the herbs, salt and pepper."},{"text":"Roast for 30–35 minutes, until deep golden and crisp at the edges."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Letting the boiled potatoes steam dry is what makes them crisp."},{"text":"Larger potatoes work too — cut them into 5 cm chunks before boiling."}]}],"id":"Sides-Crispy_Smashed_Potatoes","file":"Sides/Crispy_Smashed_Potatoes.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Vegetables & potatoes","ingredients":["1 kg small or baby potatoes","2 tbsp olive oil","2 garlic cloves, crushed","1 tsp dried rosemary or thyme","½ tsp salt","Black pepper"],"shop":[{"key":"potato","name":"Potatoes","aisle":"Fruit & veg","qty":1000.0,"unit":"g","optional":false,"raw":"1 kg small or baby potatoes"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp olive oil"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":2.0,"unit":"clove","optional":false,"raw":"2 garlic cloves, crushed"},{"key":"thyme","name":"Dried thyme","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried rosemary or thyme"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp salt"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Black pepper"}],"tags":[],"nutrition":{"kcal":260,"protein":5,"carbs":44,"fat":7,"per":"serving","count":4},"diet":["vegetarian","dairy-free"],"storage":[]},{"title":"Garlic Green Beans","servings":"4","time":"10 min","intro":"Bright green beans tossed in garlic butter. Works just as well with frozen beans.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"400 g green beans, trimmed (fresh or frozen)"},{"text":"1 tbsp butter or olive oil"},{"text":"2 garlic cloves, thinly sliced"},{"text":"Squeeze of lemon juice"},{"text":"Salt and black pepper"},{"text":"2 tbsp toasted sliced almonds (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Cook the beans in a pot of boiling salted water for 2–3 minutes (3–4 from frozen), until bright green and just tender. Drain."},{"text":"Melt the butter in a frying pan over medium heat and cook the garlic for about 1 minute, until fragrant and just golden."},{"text":"Add the beans and toss for 1 minute to coat."},{"text":"Finish with lemon juice, salt, pepper and almonds if using."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Don't let the garlic go brown — it turns bitter."}]}],"id":"Sides-Garlic_Green_Beans","file":"Sides/Garlic_Green_Beans.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Vegetables & potatoes","ingredients":["400 g green beans, trimmed (fresh or frozen)","1 tbsp butter or olive oil","2 garlic cloves, thinly sliced","Squeeze of lemon juice","Salt and black pepper","2 tbsp toasted sliced almonds (optional)"],"shop":[{"key":"green-beans","name":"Green beans","aisle":"Frozen","qty":400.0,"unit":"g","optional":false,"raw":"400 g green beans, trimmed (fresh or frozen)"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp butter or olive oil"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":2.0,"unit":"clove","optional":false,"raw":"2 garlic cloves, thinly sliced"},{"key":"lemon","name":"Lemons","aisle":"Fruit & veg","qty":null,"unit":"","optional":false,"raw":"Squeeze of lemon juice"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper"},{"key":"almonds","name":"Almonds","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":true,"raw":"2 tbsp toasted sliced almonds (optional)"}],"tags":[],"nutrition":{"kcal":60,"protein":2,"carbs":8,"fat":4,"per":"serving","count":4},"diet":["vegetarian","dairy-free","quick"],"storage":[]},{"title":"Kumara Mash","servings":"4","time":"25 min","intro":"Smooth, slightly sweet orange kumara mash. Great under slow-cooker stews and as a topping for cottage pie.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 kg orange kumara, peeled and cut into chunks"},{"text":"20 g butter"},{"text":"¼ cup milk"},{"text":"½ tsp salt"},{"text":"Black pepper"},{"text":"Pinch of ground cinnamon or nutmeg (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Put the kumara in a pot of salted water, bring to the boil and simmer for 12–15 minutes, until very tender."},{"text":"Drain well and return to the pot over low heat for 1 minute to dry out."},{"text":"Mash with the butter, milk, salt and pepper until smooth. Add the cinnamon or nutmeg if using."}]},{"kind":"notes","heading":"Notes","items":[{"text":"For half-and-half mash, use 500 g kumara and 500 g potatoes, boiled together."},{"text":"In the Instant Pot, cook the chunks on a trivet over 1 cup water on High for 8 minutes, then quick release."}]}],"id":"Sides-Kumara_Mash","file":"Sides/Kumara_Mash.tex","chapter":"sides","chapterName":"Salads & Sides","group":"Vegetables & potatoes","ingredients":["1 kg orange kumara, peeled and cut into chunks","20 g butter","¼ cup milk","½ tsp salt","Black pepper","Pinch of ground cinnamon or nutmeg (optional)"],"shop":[{"key":"kumara","name":"Kumara","aisle":"Fruit & veg","qty":1000.0,"unit":"g","optional":false,"raw":"1 kg orange kumara, peeled and cut into chunks"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":20.0,"unit":"g","optional":false,"raw":"20 g butter"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":0.25,"unit":"cup","optional":false,"raw":"¼ cup milk"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp salt"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty": ur, protein powder, baking powder, cinnamon, and salt. Mix until smooth."},{"text":"Heat a non-stick pan over medium heat with a light spray of oil."},{"text":"Pour small rounds of batter into the pan (about 3 tbsp each). Cook 2–3 minutes per side until golden and cooked through."},{"text":"Serve with Greek yoghurt, berries, and a drizzle of honey."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 1.00/serve (3 pancakes), 360 kcal, 30 g protein per serve."},{"text":"**Tip:** The riper the bananas, the sweeter the pancakes. Overripe spotty bananas are ideal and cheapest at the supermarket."}]}],"id":"Breakfast-Banana_Protein_Pancakes","file":"Breakfast/Banana_Protein_Pancakes.tex","chapter":"breakfast","chapterName":"Breakfast","group":null,"ingredients":["2 ripe bananas, mashed","4 eggs","1 scoop vanilla protein powder","½ cup rolled oats (blended into flour)","1 tsp baking powder","1 tsp cinnamon","Pinch of salt","**To serve:** Greek yoghurt, sliced banana, honey, mixed berries"],"shop":[{"key":"banana","name":"Bananas","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 ripe bananas, mashed"},{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":4.0,"unit":"","optional":false,"raw":"4 eggs"},{"key":"protein-powder","name":"Protein powder","aisle":"Pantry: check first","qty":1.0,"unit":"scoop","optional":false,"raw":"1 scoop vanilla protein powder"},{"key":"oats","name":"Rolled oats","aisle":"Pasta, rice & grains","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup rolled oats (blended into flour)"},{"key":"baking-powder","name":"Baking powder","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp baking powder"},{"key":"cinnamon","name":"Ground cinnamon","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp cinnamon"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Pinch of salt"},{"key":"greek-yoghurt","name":"Greek yoghurt","aisle":"Dairy, eggs & chilled","qty":null,"unit":"","optional":true,"raw":"To serve: Greek yoghurt, sliced banana, honey, mixed berries"},{"key":"banana","name":"Bananas","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"To serve: Greek yoghurt, sliced banana, honey, mixed berries"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"To serve: Greek yoghurt, sliced banana, honey, mixed berries"},{"key":"berries","name":"Berries","aisle":"Frozen","qty":null,"unit":"","optional":true,"raw":"To serve: Greek yoghurt, sliced banana, honey, mixed berries"}],"tags":[],"nutrition":{"kcal":90,"protein":7,"carbs":10,"fat":3,"per":"serving","count":9},"diet":["freezes","vegetarian"],"storage":[]},{"title":"Breakfast Burritos","servings":"6","time":"–","intro":"Makes 6 burritos — freeze and microwave as needed.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"8 eggs, whisked"},{"text":"200 g chorizo or pork breakfast sausage, sliced"},{"text":"1 can black beans, drained and rinsed"},{"text":"1 capsicum, diced"},{"text":"1 onion, diced"},{"text":"6 large flour tortillas"},{"text":"80 g cheddar cheese, grated"},{"text":"Salsa and Greek yoghurt to serve"},{"text":"Salt, pepper, cumin, smoked paprika"}]},{"kind":"steps","heading":"Method","items":[{"text":"Cook chorizo in a large frying pan over medium heat until browned. Set aside."},{"text":"In the same pan, sauté capsicum and onion until softened (about 5 minutes)."},{"text":"Add black beans and season with cumin, paprika, salt, and pepper. Cook for 2 minutes."},{"text":"Push vegetables to the side. Pour in whisked eggs and scramble until just cooked. Mix everything together."},{"text":"Lay out tortillas. Divide the filling evenly across all 6. Top with cheese."},{"text":"Roll tightly into burritos, folding in the sides as you go."},{"text":"Wrap each burrito individually in foil or cling wrap. Freeze."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 1.80/burrito, 480 kcal, 38 g protein per serve."},{"text":"**Reheat from frozen:** Remove foil, wrap in a damp paper towel, microwave for 2–3 minutes. Or reheat in foil in oven at 180°C for 15–20 minutes for a crispier result."}]}],"id":"Breakfast-Breakfast_Burritos","file":"Breakfast/Breakfast_Burritos.tex","chapter":"breakfast","chapterName":"Breakfast","group":null,"ingredients":["8 eggs, whisked","200 g chorizo or pork breakfast sausage, sliced","1 can black beans, drained and rinsed","1 capsicum, diced","1 onion, diced","6 large flour tortillas","80 g cheddar cheese, grated","Salsa and Greek yoghurt to serve","Salt, pepper, cumin, smoked paprika"],"shop":[{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":8.0,"unit":"","optional":false,"raw":"8 eggs, whisked"},{"key":"sausages","name":"Sausages","aisle":"Meat & fish","qty":200.0,"unit":"g","optional":false,"raw":"200 g chorizo or pork breakfast sausage, sliced"},{"key":"black-beans","name":"Black beans","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can black beans, drained and rinsed"},{"key":"capsicum","name":"Capsicums","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 capsicum, diced"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"tortillas","name":"Tortillas or wraps","aisle":"Bread & wraps","qty":6.0,"unit":"","optional":false,"raw":"6 large flour tortillas"},{"key":"cheese","name":"Tasty cheese","aisle":"Dairy, eggs & chilled","qty":80.0,"unit":"g","optional":false,"raw":"80 g cheddar cheese, grated"},{"key":"salsa","name":"Salsa","aisle":"Cans, jars & pulses","qty":null,"unit":"","optional":true,"raw":"Salsa and Greek yoghurt to serve"},{"key":"greek-yoghurt","name":"Greek yoghurt","aisle":"Dairy, eggs & chilled","qty":null,"unit":"","optional":true,"raw":"Salsa and Greek yoghurt to serve"},{"key":"salt","name":"Salt","aisle":"Pa t excess moisture)"},{"text":"1 capsicum, diced"},{"text":"Large handful of spinach"},{"text":"100 g feta, crumbled"},{"text":"2 garlic cloves, minced"},{"text":"1 tsp dried Italian herbs"},{"text":"Salt and pepper"},{"text":"Olive oil for cooking"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 180°C."},{"text":"Heat olive oil in a large oven-safe frying pan over medium heat. Sauté garlic, capsicum, and courgette for 4–5 minutes. Add spinach and wilt."},{"text":"Whisk eggs in a large bowl with Italian herbs, salt, and pepper. Stir in chicken and feta."},{"text":"Pour egg mixture over the vegetables in the pan. Stir gently to distribute."},{"text":"Cook on the stovetop for 4–5 minutes until the edges begin to set."},{"text":"Transfer to the oven and bake for 15–20 minutes until fully set and golden on top."},{"text":"Cool, then slice into 8 portions. Store in an airtight container in the fridge for up to 5 days."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 1.10/serve (2 slices), 380 kcal, 32 g protein per serve."},{"text":"**Reheat:** 60–90 seconds in the microwave or a few minutes in a dry frying pan. Eat 2 slices per serving."}]}],"id":"Breakfast-Frittata_Slices","file":"Breakfast/Frittata_Slices.tex","chapter":"breakfast","chapterName":"Breakfast","group":null,"ingredients":["10 eggs","150 g cooked chicken breast, diced","1 courgette, grated (squeeze out excess moisture)","1 capsicum, diced","Large handful of spinach","100 g feta, crumbled","2 garlic cloves, minced","1 tsp dried Italian herbs","Salt and pepper","Olive oil for cooking"],"shop":[{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":10.0,"unit":"","optional":false,"raw":"10 eggs"},{"key":"chicken-breast","name":"Chicken breast or tenderloins","aisle":"Meat & fish","qty":150.0,"unit":"g","optional":false,"raw":"150 g cooked chicken breast, diced"},{"key":"courgette","name":"Courgettes","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"r
