<style>
/* Layout: one column app shell — sticky header with tabs; the week view is three appliance "burners" side by side, stacking on phones. */
:root {
  --bg: #f2f5f1;
  --surface: #ffffff;
  --sunk: #e8ede8;
  --ink: #17221c;
  --muted: #5a6a61;
  --line: #d6dfd8;
  --accent: #2c6a4d;
  --accent-ink: #ffffff;
  --slow: #b25f17;
  --pressure: #2b5ca3;
  --quick: #367f47;
  --oven: #b0392c;
  --bake: #7a4d9e;
  --other: #66726b;
  --star: #b67a00;
  --shadow: 0 1px 2px rgb(23 34 28 / 6%), 0 4px 14px rgb(23 34 28 / 6%);
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713; --surface: #18201b; --sunk: #202a23; --ink: #e5ede8; --muted: #9aaaa1;
    --line: #2a362f; --accent: #7cc49b; --accent-ink: #0f1a14;
    --slow: #e59a55; --pressure: #7fa8e6; --quick: #7cc48d; --oven: #e98476; --bake: #bb95dc; --other: #a2aea7; --star: #f0b429;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 14px rgb(0 0 0 / 25%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713; --surface: #18201b; --sunk: #202a23; --ink: #e5ede8; --muted: #9aaaa1;
  --line: #2a362f; --accent: #7cc49b; --accent-ink: #0f1a14;
  --slow: #e59a55; --pressure: #7fa8e6; --quick: #7cc48d; --oven: #e98476; --bake: #bb95dc; --other: #a2aea7; --star: #f0b429;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 14px rgb(0 0 0 / 25%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; letter-spacing: -0.01em; }
.sync { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.books { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.books a { color: var(--ink); font-weight: 600; }
.tabs { display: flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tabs .count { font-family: var(--font-mono); font-size: 0.72rem; margin-left: 4px; color: var(--accent); }

main.wrap { padding-block: 20px 48px; display: grid; gap: 28px; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.section-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; }
.section-head p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 10px; font-weight: 600; font-size: 0.88rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn.small { padding: 4px 10px; font-size: 0.8rem; border-radius: 8px; }

/* Method colours: the one place colour carries meaning */
[data-m="slow"] { --m: var(--slow); }
[data-m="pressure"] { --m: var(--pressure); }
[data-m="quick"], [data-m="stovetop"], [data-m="sides"] { --m: var(--quick); }
[data-m="oven"] { --m: var(--oven); }
[data-m="baking"], [data-m="desserts"], [data-m="breadmaker"] { --m: var(--bake); }
[data-m="breakfast"], [data-m="snacks"], [data-m="shakes"], [data-m="extra"] { --m: var(--other); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--m, var(--muted)); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--m, var(--muted)); }

/* Week trio */
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 820px) { .trio { grid-template-columns: 1fr; } }
.slot { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; align-content: start; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.slot::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--m); }
.slot .hint { font-size: 0.8rem; color: var(--muted); margin: -4px 0 0; }
.slot h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; line-height: 1.25; }
.slot h3 button { all: unset; cursor: pointer; }
.slot h3 button:hover { text-decoration: underline; text-underline-offset: 3px; }
.slot h3 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.meta .kcal { color: var(--ink); }
.macros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0 4px; }
.macros div { background: var(--sunk); border-radius: 10px; padding: 8px 10px; }
.macros dt { font-size: 0.72rem; color: var(--muted); }
.macros dd { margin: 0; font-family: var(--font-mono); font-size: 0.95rem; color: var(--ink); }
.macros-note { font-size: 0.75rem; color: var(--muted); margin: 0 0 10px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.badge { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.card .badges { margin-top: 2px; }
.sheet-head .badges { margin-top: 8px; }
.storage { background: var(--sunk); border-radius: 12px; padding: 10px 14px; margin: 4px 0 16px; }
.storage strong { display: block; font-size: 0.8rem; margin-bottom: 4px; }
.storage ul { margin: 0; padding-left: 1.1em; font-size: 0.88rem; }
.scale { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 0.85rem; color: var(--muted); }
.scale .fchip { padding: 4px 12px; }
.scale-note { font-size: 0.75rem; color: var(--muted); margin: 6px 0 0; }
.times { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; color: var(--accent); }
.stars { display: inline-flex; align-items: center; gap: 0; }
.stars button { border: 0; background: none; padding: 2px 3px; font-size: 1.25rem; line-height: 1; color: var(--muted); opacity: 0.35; cursor: pointer; }
.stars button[aria-pressed="true"] { color: var(--star); opacity: 1; }
.rate-row { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
.fav { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
.fav[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.fav-mark { color: var(--star); }
.history-line { font-size: 0.8rem; color: var(--muted); margin: 8px 0 0; }
.share-btn { margin-left: 2px; }
.share-sheet p { color: var(--muted); font-size: 0.92rem; margin: 0 0 12px; }
.share-link { width: 100%; font-family: var(--font-mono); font-size: 0.8rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); color: var(--ink); margin-bottom: 12px; }
.cook { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.cook-top { display: flex; align-items: center; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
.cook-top .title { flex: 1; min-width: 0; font-weight: 600; font-size: 0.9rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cook-progress { height: 4px; background: var(--sunk); border-radius: 2px; max-width: 760px; width: 100%; margin: 10px auto 0; overflow: hidden; }
.cook-progress span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.cook-body { flex: 1; overflow-y: auto; max-width: 760px; width: 100%; margin: 0 auto; padding: 20px 0; }
.cook-label { font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); margin: 0 0 8px; }
.cook-step { font-size: clamp(1.3rem, 4.6vw, 1.9rem); line-height: 1.4; margin: 0 0 18px; }
.cook-step strong { font-weight: 700; }
.cook-uses { background: var(--sunk); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
.cook-uses strong { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
.cook-uses ul { margin: 0; padding-left: 1.1em; font-size: 1.05rem; }
.cook-ready { list-style: none; padding: 0; margin: 0; font-size: 1.1rem; }
.cook-ready li { padding: 8px 0; border-bottom: 1px solid var(--line); }
.cook-ready label { display: flex; gap: 10px; align-items: flex-start; }
.cook-ready input { width: 20px; height: 20px; margin-top: 3px; flex: none; }
.cook-ready .group { font-weight: 700; border: 0; padding-top: 14px; }
.cook-nav { display: flex; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
.cook-nav .btn { flex: 1; padding: 14px; font-size: 1.05rem; }
.timer-chip { font-family: var(--font-mono); font-weight: 600; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 4px 12px; border: 0; }
.timer-chip.done { background: var(--oven); }
.aisle li { position: relative; }
.have { position: absolute; top: 6px; right: 0; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; font-size: 0.72rem; font-weight: 600; padding: 2px 9px; cursor: pointer; }
.aisle > ul > li > label { padding-right: 70px; }
.at-home { margin-top: 14px; }
.at-home summary { cursor: pointer; font-weight: 600; color: var(--muted); }
.at-home p { font-size: 0.85rem; color: var(--muted); margin: 8px 0; }
.at-home ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.at-home li button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 0.82rem; cursor: pointer; }
.week-nutrition { margin: 4px 0 0; font-size: 0.9rem; color: var(--muted); }
.week-nutrition strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.slot .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.slot.empty { border-style: dashed; box-shadow: none; background: transparent; }
.slot.empty .placeholder { color: var(--muted); font-size: 0.92rem; }
.cooked-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); margin-left: auto; }
.slot.is-cooked h3 { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }

.extras { display: grid; gap: 8px; }
.extra-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.extra-row .title { flex: 1; min-width: 0; font-weight: 600; }
.extra-row .title button { all: unset; cursor: pointer; }
.empty-note { color: var(--muted); font-size: 0.9rem; margin: 0; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
.history { display: grid; gap: 6px; font-size: 0.88rem; }
.history li { color: var(--muted); }
.history strong { color: var(--ink); font-weight: 600; }

/* Recipes */
.filters { display: grid; gap: 10px; }
.search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.choosing { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-radius: 12px; background: var(--sunk); font-size: 0.9rem; }
.choosing strong { color: var(--m); }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.card:hover { border-color: var(--muted); }
.card .name { font-weight: 600; font-size: 0.98rem; line-height: 1.3; }
.card .planned { font-size: 0.72rem; font-weight: 700; color: var(--accent); }
.result-count { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Shopping */
.aisles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.aisle { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.aisle h3 { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
.aisle h3 span { font-family: var(--font-mono); letter-spacing: 0; }
.aisle ul { list-style: none; margin: 0; padding: 0; display: grid; }
.aisle input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
.aisle > ul > li { border-top: 1px solid var(--line); padding: 6px 0; }
.aisle > ul > li:first-child { border-top: 0; }
.aisle li label { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; cursor: pointer; border: 0; padding: 0; }
.aisle .txt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.aisle .item-name { font-weight: 600; }
.aisle .amt { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink); background: var(--sunk); padding: 0 6px; border-radius: 6px; }
.aisle .opt { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.aisle details { margin: 2px 0 0 28px; font-size: 0.8rem; color: var(--muted); }
.aisle summary { cursor: pointer; width: fit-content; }
.aisle summary:hover { color: var(--ink); }
.aisle .uses { list-style: none; padding: 4px 0 2px; margin: 0; display: grid; gap: 4px; }
.aisle .from { display: block; font-size: 0.72rem; color: var(--m); font-weight: 700; }
.aisle li.done .item-name, .aisle li.done .amt { text-decoration: line-through; color: var(--muted); }

/* Recipe sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgb(10 16 12 / 45%); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); border-radius: 18px; width: 100%; max-width: 720px; padding: 22px 24px 28px; display: grid; gap: 16px; box-shadow: var(--shadow); border-top: 5px solid var(--m); }
.sheet-head { display: grid; gap: 8px; }
.sheet-head .top-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.65rem; line-height: 1.2; }
.sheet .intro { color: var(--muted); margin: 0; max-width: 65ch; }
.sheet h4 { margin: 6px 0 4px; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--m); }
.sheet ul, .sheet ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; max-width: 65ch; }
.sheet ol > li { padding-left: 4px; }
.sheet li.group { list-style: none; margin: 8px 0 0 -1.3em; font-weight: 700; font-size: 0.9rem; }
.sheet ul ul { margin-top: 4px; }
.sheet p { margin: 0; max-width: 65ch; }
.variation { background: var(--sunk); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.variation h4 { margin-top: 0; }
.sheet .file { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 0.88rem; font-weight: 600; z-index: 30; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise 0.18s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}
@media (max-width: 520px) {
  .brand h1 { font-size: 1.25rem; }
  .sync { white-space: normal; }
  .tabs { width: 100%; }
  .tabs button { flex: 1; padding-inline: 6px; }
  .sheet { padding: 18px 16px 24px; }
}
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>George's Meal Planner</h1><span class="sync" id="sync">Loading…</span><button class="btn small ghost share-btn" id="share-btn" data-act="share" hidden>Share</button></div>
    <nav class="books" aria-label="Recipe books">PDF: <a href="books/main.pdf">Recipe Book</a> · <a href="books/palmer.pdf">GP's Book</a></nav>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" id="tab-week" aria-selected="true" data-tab="week">This week</button>
      <button role="tab" id="tab-recipes" aria-selected="false" data-tab="recipes">Recipes</button>
      <button role="tab" id="tab-shop" aria-selected="false" data-tab="shop">Shopping<span class="count" id="shop-count"></span></button>
    </nav>
  </div>
</header>

<main class="wrap" id="app"></main>
<div id="sheet-root"></div>

<script>
const RECIPES = [{"title":"Beef & Lentil Bolognese","servings":"4","time":"50 min","intro":"A high-protein bolognese in which lentils stretch the mince, lower the cost and make the sauce properly substantial. Tomatoes go in on top, unstirred, to avoid the “burn” warning.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Sauce base"},{"text":"600 g lean beef mince"},{"text":"¾ cup dry brown or green lentils, rinsed"},{"text":"1 onion, diced"},{"text":"3 garlic cloves, crushed"},{"text":"1 cup beef stock"},{"text":"2 cans crushed tomatoes"},{"text":"2 tbsp tomato paste"},{"text":"1 tsp dried oregano"},{"text":"1 tsp dried basil"},{"text":"½ tsp dried thyme"},{"text":"¼ tsp dried rosemary, crushed"},{"text":"1 tsp smoked paprika"},{"text":"1 tsp Worcestershire sauce"},{"text":"Salt and pepper, to taste"},{"group":"To finish"},{"text":"400 g frozen mixed vegetables"},{"group":"To serve"},{"text":"350 g wholemeal or regular pasta"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Sauté the onion.** Select Sauté, add a small amount of oil and cook the onion for 3 minutes."},{"text":"**Brown the mince.** Add the mince and cook until browned, breaking it apart as it cooks."},{"text":"**Add the aromatics.** Stir in the garlic, oregano, basil, thyme, rosemary and paprika. Cook for another 30 seconds."},{"text":"**Deglaze.** Pour in the stock and scrape the base of the pot thoroughly."},{"text":"**Layer.** Stir in the lentils and Worcestershire sauce. Pour the crushed tomatoes and tomato paste over the top **without stirring**."},{"text":"**Pressure cook.** Lid on, valve sealed. Pressure Cook on High for **10 minutes**, then **natural release** for 10 minutes."},{"text":"**Finish.** Stir in the frozen vegetables and use Sauté for 5 minutes. Add a splash of water if the sauce is too thick. Season to taste."},{"text":"**Pasta.** Meanwhile, cook the pasta separately and divide into four servings. Top with the sauce."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Roughly 46–50 g protein per serving with 600 g mince (42–46 g at 500 g). The herb blend replaces 2 tsp of Italian herbs: oregano and basil carry the flavour, with thyme and rosemary kept light as they are stronger."}]}],"id":"InstantPot-Beef_Lentil_Bolognese","file":"InstantPot/Beef_Lentil_Bolognese.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["600 g lean beef mince","¾ cup dry brown or green lentils, rinsed","1 onion, diced","3 garlic cloves, crushed","1 cup beef stock","2 cans crushed tomatoes","2 tbsp tomato paste","1 tsp dried oregano","1 tsp dried basil","½ tsp dried thyme","¼ tsp dried rosemary, crushed","1 tsp smoked paprika","1 tsp Worcestershire sauce","Salt and pepper, to taste","400 g frozen mixed vegetables","350 g wholemeal or regular pasta"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":600.0,"unit":"g","optional":false,"raw":"600 g lean beef mince"},{"key":"lentils","name":"Lentils","aisle":"Cans, jars & pulses","qty":0.75,"unit":"cup","optional":false,"raw":"¾ cup dry brown or green lentils, rinsed"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, crushed"},{"key":"beef-stock","name":"Beef stock","aisle":"Pantry: check first","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup beef stock"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":2.0,"unit":"can","optional":false,"raw":"2 cans crushed tomatoes"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"oregano","name":"Dried oregano","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried oregano"},{"key":"basil","name":"Fresh basil","ai reezing.","This recipe freezes well for up to 3 months.","Optional additions include frozen peas, frozen broccoli or cauliflower, or a handful of frozen spinach stirred through when reheating."]},{"title":"Beef & Red Lentil Moussaka-Style Stew","servings":"4","time":"15 min prep + 35 min","intro":"All the cinnamon-spiced beef and eggplant flavour of moussaka as a stew, topped with a garlicky yoghurt and feta sauce instead of béchamel. Roughly 38–42 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g lean beef mince"},{"text":"1 onion, diced"},{"text":"3 garlic cloves, crushed"},{"text":"1 large eggplant, cut into 2 cm cubes"},{"text":"1 tsp ground cinnamon"},{"text":"1 tsp dried oregano"},{"text":"1 tsp smoked paprika"},{"text":"1 cup beef stock"},{"text":"½ cup dry red lentils, rinsed"},{"text":"2 tbsp tomato paste"},{"text":"1 can crushed tomatoes"},{"text":"Salt and pepper"},{"group":"Topping"},{"text":"200 g Greek yoghurt"},{"text":"50 g feta, crumbled (or grated parmesan)"},{"text":"1 small garlic clove, crushed"},{"group":"To serve"},{"text":"Crusty bread, rice or roast potatoes"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Brown the beef.** Select Sauté and brown the mince with the onion. Add the garlic, cinnamon, oregano and paprika for the last 30 seconds."},{"text":"**Deglaze.** Pour in the stock and scrape the base completely clean."},{"text":"**Layer — don't stir.** Add the eggplant, scatter the lentils over, dot with tomato paste and pour the crushed tomatoes over the top. **Do not stir.**"},{"text":"**Pressure cook.** Lid on, valve sealed. Cook on High for **8 minutes**, then a **10-minute natural release**."},{"text":"**Finish.** Stir well — the eggplant will collapse into the sauce. Use Sauté for a few minutes if it needs thickening. Season."},{"text":"Mix the yoghurt, feta and garlic. Serve the stew with a big spoonful on top."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Layering the lentils and tomatoes on top keeps the base thin and avoids a burn warning."}]}],"id":"InstantPot-Beef_Lentil_Moussaka_Stew","file":"InstantPot/Beef_Lentil_Moussaka_Stew.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["500 g lean beef mince","1 onion, diced","3 garlic cloves, crushed","1 large eggplant, cut into 2 cm cubes","1 tsp ground cinnamon","1 tsp dried oregano","1 tsp smoked paprika","1 cup beef stock","½ cup dry red lentils, rinsed","2 tbsp tomato paste","1 can crushed tomatoes","Salt and pepper","200 g Greek yoghurt","50 g feta, crumbled (or grated parmesan)","1 small garlic clove, crushed","Crusty bread, rice or roast potatoes"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean beef mince"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, crushed"},{"key":"eggplant","name":"Eggplant","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 large eggplant, cut into 2 cm cubes"},{"key":"cinnamon","name":"Ground cinnamon","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp ground cinnamon"},{"key":"oregano","name":"Dried oregano","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried oregano"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp smoked paprika"},{"key":"beef-stock","name":"Beef stock","aisle":"Pantry: check first","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup beef stock"},{"key":"red-lentils","name":"Red lentils (dry)","aisle":"Cans, jars & pulses","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup dry red lentils, rinsed"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can crushed tomatoes"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper"},{"key":"greek-yoghurt","name":"Greek yoghurt","aisle":"Dairy, eggs & chilled","qty":200.0,"unit":"g","optional":false,"raw":"200 g Greek yoghurt"},{"key":"feta","name":"Feta","aisle":"Dairy, eggs & chilled","qty":50.0,"unit":"g","optional":false,"raw":"50 g feta, crumbled (or grated parmesan)"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":1.0,"unit":"clove","optional":false,"raw":"1 small garlic clove, crushed"},{"key":"bread","name":"Bread","aisle":"Bread & wraps","qty":null,"unit":"","optional":true,"raw":"Crusty bread, rice or roast potatoes"},{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":null,"unit":"","optional":true,"raw":"Crusty bread, rice or roast potatoes"},{"key":"potato","name":"Potatoes","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Crusty bread, rice or roast potatoes"}],"tags":["beef","mince"],"nutrition":{"kcal":490,"protein":41,"carbs":31,"fat":21,"per":"serving","count":4},"diet":["freezes"],"storage":[]},{"title":"Beef & Vegetable Stew","servings":"8","time":"Prep 10 min, cook 35 min pressure + 15 min natural release","intro":"","sections":[{"kind":"list","heading":"Why This Works","items":[{"text":"Extremely filling: protein, fibre, and volume"},{"text":"Built-in carbohydrates (no sides required)"},{"text":"Lentils stretch the beef without changing the flavour"},{"text":"Frozen vegetables reduce cost, prep time, and waste"},{"text":"Improves after resting overnight"},{"text":"Ideal cold-weather, low-effort meal"}]},{"kind":"list","heading":"Ingredients","items":[{"text":"1.2 kg beef chuck, cut into large cubes"},{"text":"1 cup red lentils (dry)"},{"text":"1 kg frozen mixed vegetables (peas, corn, carrot, beans)"},{"text":"800 g potatoes, diced into 2–3 cm chunks"},{"text":"2 large onion, diced"},{"text":"4 garlic cloves, minced"},{"text":"3 cups beef stock (750 ml)"},{"text":"3 tbsp tomato paste"},{"text":"2 tbsp Worcestershire sauce"},{"text":"2 tsp salt"},{"text":"1 tsp black pepper"},{"text":"2 tsp dried thyme or mixed herbs"},{"text":"1 tbsp olive oil"}]},{"kind":"steps","heading":"Method","items":[{"text":"Set the Instant Pot to **Sauté**. Add the olive oil."},{"text":"Cook the onion for approximately 5 minutes until softened."},{"text":"Add the garlic and cook for 30 seconds until fragrant."},{"text":"Add the beef cubes and stir briefly to coat in the onion mixture."},{"text":"Add the red lentils and diced potatoes."},{"text":"Stir in the tomato paste, Worcestershire sauce, herbs, salt, and pepper."},{"text":"Pour in the beef stock and mix well, scraping the bottom of the pot."},{"text":"Cancel **Sauté**. Secure the lid with the valve sealed."},{"text":"Cook on **High Pressure** for 35 minutes."},{"text":"Allow a **Natural Pressure Release** for 15 minutes, then vent remaining pressure."},{"text":"Open the lid and stir in the frozen mixed vegetables."},{"text":"Set to **Sauté** and simmer uncovered for 5–10 minutes until vegetables are heated through and the stew thickens slightly."},{"text":"Taste and adjust seasoning if required."}]},{"kind":"list","heading":"Storage","items":[{"text":"Refrigerate for up to 4 days"},{"text":"Freeze portions for up to 3 months"},{"text":"Flavour improves after 24 hours"}]},{"kind":"list","heading":"Serving Notes","items":[{"text":"Serve as-is; potatoes and lentils provide sufficient carbohydrates"},{"text":"Excellent with bread if extra calories are needed"},{"text":"Ideal for reheating on low heat"}]},{"kind":"list",  Cook the onion, carrots and mushrooms for 3–4 minutes. Add the garlic, thyme and paprika for the last 30 seconds."},{"text":"**Deglaze.** Pour in a splash of the stock and scrape the base thoroughly."},{"text":"**Combine.** Return the beef with the remaining stock, barley, tomato paste and Worcestershire sauce."},{"text":"**Pressure cook.** Lid on, valve sealed. Cook on High for **25 minutes**, then a **10-minute natural release**."},{"text":"**Finish.** Stir in the cannellini beans and frozen peas. Use Sauté for 5 minutes until hot and thickened. Season to taste."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Serve with: the barley makes it a full meal on its own. For bigger appetites, add crusty bread or a bread maker loaf, or green veg."},{"text":"**Advance prep:** defrost the beef in the fridge the night before; the vegetables can be chopped ahead."},{"text":"Barley keeps absorbing liquid as it sits — add a splash of water or stock when reheating."}]}],"id":"InstantPot-Beef_Barley_Mushroom_Stew","file":"InstantPot/Beef_Barley_Mushroom_Stew.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["500 g lean diced stewing beef","¾ cup dry pearl barley, rinsed","1 can cannellini beans, drained and rinsed","1 onion, diced","2 carrots, sliced","250 g mushrooms, sliced","3 garlic cloves, crushed","3 cups beef stock","2 tbsp tomato paste","1 tbsp Worcestershire sauce","1 tsp dried thyme","1 tsp smoked paprika","250 g frozen peas","Salt and pepper"],"shop":[{"key":"stewing-beef","name":"Stewing beef","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean diced stewing beef"},{"key":"barley","name":"Pearl barley","aisle":"Pasta, rice & grains","qty":0.75,"unit":"cup","optional":false,"raw":"¾ cup dry pearl barley, rinsed"},{"key":"cannellini","name":"Cannellini or butter beans","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can cannellini beans, drained and rinsed"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 carrots, sliced"},{"key":"mushrooms","name":"Mushrooms","aisle":"Fruit & veg","qty":250.0,"unit":"g","optional":false,"raw":"250 g mushrooms, sliced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, crushed"},{"key":"beef-stock","name":"Beef stock","aisle":"Pantry: check first","qty":3.0,"unit":"cup","optional":false,"raw":"3 cups beef stock"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"worcestershire","name":"Worcestershire sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp Worcestershire sauce"},{"key":"thyme","name":"Dried thyme","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried thyme"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp smoked paprika"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":250.0,"unit":"g","optional":false,"raw":"250 g frozen peas"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper"}],"tags":["beef"],"nutrition":{"kcal":510,"protein":42,"carbs":60,"fat":11,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":["Barley keeps absorbing liquid as it sits — add a splash of water or stock when reheating."]},{"title":"Beef, Red Lentil & Vegetable Cottage Pie Bowls","servings":"4","time":"20 min prep + 35 min","intro":"All the good parts of cottage pie without assembling and baking a pie. The filling and potatoes cook together: potatoes steam in a basket above the mince. Roughly 40–43 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Filling"},{"text":"500 g lean beef mince"},{"text":"¾ cup (140–150 g) dry split red lentils, rinsed"},{"text":"2 carrots, finely diced"},{"text":"1 onion, diced"},{"text":"3 garlic cloves, crushed"},{"text":"1½ cups beef stock"},{"text":"2 tbsp tomato paste"},{"text":"1 tbsp Worcestershire sauce"},{"text":"1 tsp dried thyme"},{"text":"1 tsp smoked paprika"},{"text":"300 g frozen peas"},{"group":"Mash"},{"text":"800 g potatoes, peeled and cut into chunks"},{"text":"½ cup low-fat milk"},{"text":"Salt and pepper"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Soften the veg.** Select Sauté and cook the onion and carrots in a little oil for 3–4 minutes."},{"text":"**Brown the mince.** Add the mince and cook until browned. Add the garlic, thyme and paprika for the last 30 seconds."},{"text":"**Deglaze.** Pour in the stock and scrape the base completely clean. Stir in the Worcestershire sauce."},{"text":"**Layer — don't stir.** Scatter the rinsed lentils evenly over the top so they sit in the liquid rather than settling on the base, then dot the tomato paste over them. **Do not stir.**"},{"text":"**Potatoes above.** Set a trivet or steamer basket over the filling and put the potatoes in it."},{"text":"**Pressure cook.** Lid on, valve sealed. Cook on High for **7 minutes**, then a **10-minute natural release**."},{"text":"**Mash.** Lift out the potatoes and mash with the milk, salt and pepper."},{"text":"**Finish the filling.** Stir the filling well (the lentils will have softened into the gravy), then stir in the frozen peas. Use Sauté for a few minutes if it needs thickening."},{"text":"Divide the filling between four bowls and spoon the mash over the top."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**Why the lentils go on top:** red lentils and tomato paste stirred into the base are a classic burn-warning trigger. Layering them over the deglazed mince keeps the base thin while they cook."},{"text":"Use **split red lentils** — canned brown lentils won't thicken the gravy. In a pinch, stir canned lentils in after pressure cooking with the peas."},{"text":"**Advance prep:** defrost the mince in the fridge the night before. Peel the potatoes shortly before cooking (or keep them submerged in water in the fridge)."}]}],"id":"InstantPot-Beef_Lentil_Cottage_Pie_Bowls","file":"InstantPot/Beef_Lentil_Cottage_Pie_Bowls.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["500 g lean beef mince","¾ cup (140–150 g) dry split red lentils, rinsed","2 carrots, finely diced","1 onion, diced","3 garlic cloves, crushed","1½ cups beef stock","2 tbsp tomato paste","1 tbsp Worcestershire sauce","1 tsp dried thyme","1 tsp smoked paprika","300 g frozen peas","800 g potatoes, peeled and cut into chunks","½ cup low-fat milk","Salt and pepper"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean beef mince"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 carrots, finely diced"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, crushed"},{"key":"beef-stock","name":"Beef stock","aisle":"Pantry: check first","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups beef stock"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"worcestershire","name":"Worcestershire sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp Worcestershire sauce"},{"key":"thyme","name":"Dried thyme","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried thyme"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp smoked paprika"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":300.0,"unit":"g","optional":false,"raw":"300 g frozen peas"},{"key":"potato","name":"Potatoes","aisle":"Fruit & veg","qty":800.0,"unit":"g","optional":false,"raw":"800 g potatoes, peeled and cut into chunks"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup low-fat milk"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper"}],"tags":["beef","mince"],"nutrition":{"kcal":540,"protein":36,"carbs":60,"fat":17,"per":"serving","count":4},"diet":["freezes"],"storage":["Peel the potatoes shortly before cooking (or keep them submerged in water in the fridge)."]},{"title":"Beefaroni","servings":"8","time":"30 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"2 tbsp olive oil"},{"text":"450 g beef mince"},{"text":"1 medium onion, diced"},{"text":"3 garlic cloves, minced"},{"text":"1 tbsp onion powder"},{"text":"2 tsp paprika"},{"text":"½ tsp chilli powder"},{"text":"1 tsp cumin"},{"text":"2 tsp Italian herbs (or dried oregano)"},{"text":"1 tsp salt"},{"text":"450 g dry elbow macaroni"},{"text":"2 cups tomato sauce (preferably tomato basil)"},{"text":"2 tbsp tomato paste"},{"text":"45 g butter, cubed"},{"text":"2 cups grated cheese (Cheddar, Jack, Parmesan, or mixed)"},{"text":"Spring onions or parsley, for garnish"}]},{"kind":"steps","heading":"Method","items":[{"text":"Press **Sauté** and heat the olive oil. Add beef mince and cook for 4–5 minutes until browned, breaking it apart as it cooks."},{"text":"Add diced onion, garlic, onion powder, paprika, chilli powder, cumin, Italian herbs, and salt; stir well."},{"text":"Pour in 2 cups of water and scrape the bottom of the pot to deglaze and prevent the Burn warning. Cancel **Sauté**."},{"text":"Add the pasta on top (do not stir), then spread tomato sauce and tomato paste over it. Scatter butter cubes on top."},{"text":"Lock the lid and set to **Manual/Pressure Cook — HIGH** for 4 minutes."},{"text":"When done, allow natural release for 5 minutes, then perform a quick release."},{"text":"Open the lid and stir well to combine."},{"text":"With the pot on **Keep Warm**, add the cheese and cover with a glass lid for 5 minutes to melt. Alternatively, transfer to a casserole dish and broil to melt cheese."},{"text":"Garnish with spring onions or parsley and serve hot."}]},{"kind":"notes","heading":"Notes","items":[{"text":"itemize Beef mince can be replaced with chicken mince, pork, or lamb. Any pasta sauce works—tomato basil adds great flavour. If using canned tomatoes instead, add a pinch more salt. Elbow macaroni is traditional, but penne or fusilli also work well. Store leftovers in the fridge for 2–3 days. Reheat with a splash of water or milk. For extra heat, increase the chilli powder or add a pinch of crushed red pepper. itemize"}]}],"id":"InstantPot-Beefaroni","file":"InstantPot/Beefaroni.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["2 tbsp olive oil","450 g beef mince","1 medium onion, diced","3 garlic cloves, minced","1 tbsp onion powder","2 tsp paprika","½ tsp chilli powder","1 tsp cumin","2 tsp Italian herbs (or dried oregano)","1 tsp salt","450 g dry elbow macaroni","2 cups tomato sauce (preferably tomato basil)","2 tbsp tomato paste","45 g butter, cubed","2 cups grated cheese (Cheddar, Jack, Parmesan, or mixed)","Spring onions or parsley, for garnish"],"shop":[{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp olive oil"},{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":450.0,"unit":"g","optional":false,"raw":"450 g beef mince"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 medium onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, minced"},{"key":"onion-powder","name":"Onion powder","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp onion powder"},{"key":"paprika","name":"Paprika","aisle":"Pantry: check first","qty":2.0,"unit":"tsp","optional":false,"raw":"2 tsp paprika"},{"key":"chilli-powder","name":"Chilli powder","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp chilli powder"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp cumin"},{"key":"mixed-herbs","name":"Mixed herbs","aisle":"Pantry: check first","qty":2.0,"unit":"tsp","optional":false,"raw":"2 tsp Italian herbs (or dried oregano)"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp salt"},{"key":"macaroni","name":"Macaroni","aisle":"Pasta, rice & grains","qty":450.0,"unit":"g","optional":false,"raw":"450 g dry elbow macaroni"},{"key":"tomato-sauce","name":"Tomato sauce","aisle":"Pantry: check first","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups tomato sauce (preferably tomato basil)"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":45.0,"unit":"g","optional":false,"raw":"45 g butter, cubed"},{"key":"cheese","name":"Tasty cheese","aisle":"Dairy, eggs & chilled","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups grated cheese (Cheddar, Jack, Parmesan, or mixed)"},{"key":"spring-onion","name":"Spring onions","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Spring onions or parsley, for garnish"},{"key":"parsley","name":"Fresh parsley","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Spring onions or parsley, for garnish"},{"key":"for-garnish","name":"For garnish","aisle":null,"qty":null,"unit":"","optional":true,"raw":"Spring onions or parsley, for garnish"}],"tags":["beef","mince"],"nutrition":{"kcal":570,"protein":26,"carbs":61,"fat":24,"per":"serving","count":8},"diet":["quick"],"storage":["Store leftovers in the fridge for 2–3 days.","Reheat with a splash of water or milk."]},{"title":"Butter Chicken-Style Chicken & Lentil Curry","servings":"4","time":"50 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 tbsp oil"},{"text":"1 onion, diced"},{"text":"4 garlic cloves, minced"},{"text":"1 tbsp grated ginger"},{"text":"8 chicken drumsticks, skin removed"},{"text":"800 g tinned diced tomatoes"},{"text":"150 g red lentils, rinsed"},{"text":"2 tbsp garam masala"},{"text":"1 tsp ground turmeric"},{"text":"1 tbsp chicken stock powder"},{"text":"1 tsp salt"},{"text":"½ tsp chilli flakes (optional)"},{"text":"400 ml water"},{"text":"100 ml light coconut cream (or coconut milk)"},{"text":"150 g long grain brown rice (dry), to serve"}]},{"kind":"steps","heading":"Method","items":[{"text":"Set the Instant Pot to Sauté. Heat the oil and cook the onion for 3–4 min until softened. Add the garlic and ginger and cook for 1 min more."},{"text":"Add the drumsticks, tomatoes, lentils, garam masala, turmeric, stock powder, salt, chilli flakes and water. Stir to combine and make sure the lentils are submerged."},{"text":"Seal the lid with the valve on sealing. Pressure cook on high for 12 min, then natural release for 10 min before venting any remaining pressure."},{"text":"Remove the drumsticks, shred the meat off the bone, discard the bones and stir the meat back through the sauce."},{"text":"Set back to Sauté and stir in the coconut cream. Simmer uncovered for 5–10 min to thicken slightly. Taste and adjust the seasoning."},{"text":"Serve over a small portion (½–¾ cup cooked) of brown rice."}]},{"kind":"variation","heading":"Stovetop Version","text":"Sauté the onion, garlic and ginger in a large pot. Add everything except the coconut cream, cover and simmer on low for 40–45 min, stirring occasionally, until the chicken is cooked through and the lentils have broken down. Shred the chicken, stir in the coconut cream and simmer uncovered for 5–10 min.","sections":[]},{"kind":"notes","heading":"Notes","items":[{"text":"Water is reduced to 400 ml (vs. 500 ml for the slow cooker version) as pressure cooking loses no liquid to evaporation."},{"text":"The coconut cream goes in after pressure cooking, as thick, fatty ingredients can trigger a burn warning."},{"text":"Brown rice: pressure cook 1:1.25 rice to water on high for 20–22 min with a 10 min natural release, or simmer for 30–35 min."},{"text":"Freezes well. Portion into containers for meal prep."}]}],"id":"InstantPot-Chicken_Lentil_Butter_Chicken","file":"InstantPot/Chicken_Lentil_Butter_Chicken.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["1 tbsp oil","1 onion, diced","4 garlic cloves, minced","1 tbsp grated ginger","8 chicken drumsticks, skin removed","800 g tinned diced tomatoes","150 g red lentils, rinsed","2 tbsp garam masala","1 tsp ground turmeric","1 tbsp chicken stock powder","1 tsp salt","½ tsp chilli flakes (optional)","400 ml water","100 ml light coconut cream (or coconut milk)","150 g long grain brown rice (dry), to serve"],"shop":[{"key":"oil","name":"Cooking oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp oil"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":4.0,"unit":"clove","optional":false,"raw":"4 garlic cloves, minced"},{"key":"ginger","name":"Fresh ginger","aisle":"Fruit & veg","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp grated ginger"},{"key":"chicken-drumstick","name":"Chicken drumsticks","aisle":"Meat & fish","qty":8.0,"unit":"","optional":false,"raw":"8 chicken drumsticks, skin removed"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":2.0,"unit":"can","optional":false,"raw":"800 g tinned diced tomatoes"},{"key":"red-lentils","name":"Red lentils (dry)","aisle":"Cans, jars & pulses","qty":150.0,"unit":"g","optional":false,"raw":"150 g red lentils, rinsed"},{"key":"garam-masala","name":"Garam masala","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp garam masala"},{"key":"turmeric","name":"Turmeric","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp ground turmeric"},{"key":"stock-powder","name":"Stock powder","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp chicken stock powder"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp salt"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":true,"raw":"½ tsp chilli flakes (optional)"},{"key":"coconut-cream","name":"Coconut cream","aisle":"Cans, jars & pulses","qty":0.5,"unit":"can","optional":false,"raw":"100 ml light coconut cream (or coconut milk)"},{"key":"brown-rice","name":"Brown rice","aisle":"Pasta, rice & grains","qty":150.0,"unit":"g","optional":true,"raw":"150 g long grain brown rice (dry), to serve"}],"tags":["chicken"],"nutrition":{"kcal":670,"protein":45,"carbs":36,"fat":36,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":["Freezes well."]},{"title":"Cajun Chicken, Bean & Rice Bowls","servings":"4","time":"45 min","intro":"A smoky one-pot chicken and rice meal with kidney beans, corn, carrot and spinach. Chicken tenderloins work particularly well if they're still cheaper than breast. The tomatoes are poured over the top without stirring so the rice cooks cleanly and doesn't trigger the “burn” warning.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Pressure-cook base"},{"text":"500 g chicken tenderloins or chicken breast, cut into large pieces"},{"text":"1½ cups dry long-grain white rice, rinsed until the water runs nearly clear"},{"text":"1 onion, diced"},{"text":"200 g carrots, grated (about 2 medium)"},{"text":"3 garlic cloves, crushed"},{"text":"1 tsp oil"},{"text":"1½ cups chicken stock"},{"text":"1 can (400 g) crushed tomatoes"},{"group":"Spices"},{"text":"2 tsp smoked paprika"},{"text":"1 tsp dried thyme"},{"text":"1 tsp dried oregano"},{"text":"½ tsp ground cumin"},{"text":"¼ tsp cayenne pepper, to taste"},{"text":"½ tsp black pepper"},{"text":"½ tsp salt, to taste (depends on how salty your stock is)"},{"group":"Stir in after pressure cooking"},{"text":"1 can (400 g) kidney beans, drained & rinsed"},{"text":"300 g frozen corn"},{"text":"100 g fresh spinach (about 2 big handfuls)"},{"group":"To finish"},{"text":"1 tbsp lemon or lime juice"},{"group":"To serve (optional)"},{"text":"Greek yoghurt, lime wedges, hot sauce, spring onion or coriander"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Soften the veg.** Set the pot to Sauté with the oil. Cook the onion and grated carrot for 2–3 minutes until softened."},{"text":"**Add garlic and spices.** Stir in the garlic, smoked paprika, thyme, oregano, cumin, cayenne, black pepper and salt for 30 seconds until fragrant."},{"text":"**Deglaze.** Pour in the stock and scrape the base of the pot completely clean — this is what prevents the burn notice."},{"text":"**Layer.** Stir in the rinsed rice and level it out, then spread the chicken over the top."},{"text":"**Tomatoes on top.** Pour the crushed tomatoes over the chicken. **Do not stir** them into the rice."},{"text":"**Pressure cook.** Lid on, valve sealed. Cook on High for **5 minutes** (about 10 min to come to pressure first), then leave for a **10-minute natural release** before releasing any remaining pressure."},{"text":"**Check the chicken.** The thickest piece should reach 75°C."},{"text":"**Stir in beans, corn and spinach.** Switch to Sauté and cook for 4–6 minutes, stirring regularly, until everything is hot and the spinach has wilted."},{"text":"**Finish.** Stir through the citrus juice, taste and adjust the salt, then divide into four portions."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**Per serve (estimate):** approximately 550–600 kcal and 38–41 g protein. Check against your product labels."},{"text":"**Advance preparation:** defrost the chicken overnight. The corn and beans can go in straight from the freezer or cupboard."},{"text":"**Burn notice:** if you get one, release the pressure, add ¼ cup water and restart without stirring the tomatoes in."},{"text":"**Rice:** rinse until the water runs nearly clear — gummy rice is the main way this goes wrong."},{"text":"**Storage:** refrigerate within 1 hour of cooking and eat within 3 days, or freeze in portions. Reheat until steaming hot."},{"text":"**Toppings:** Greek yoghurt adds protein and cools the heat for very few calories."}]},{"kind":"variation","heading":"Mexican Version","text":"Increase the cumin to 1 tsp, swap the oregano for 1 tsp ground coriander, and finish with extra lime juice and fresh coriander. Method is otherwise identical.","sections":[]},{"kind":"variation","heading":"Sausage Version","text":"For a sausage version, see Sausage & Rice in this chapter (Cajun variation).","sections":[]}],"id":"InstantPot-Cajun_Chicken_Bean_Rice_Bowls","file":"InstantPot/Cajun_Chicken_Bean_Rice_Bowls.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"i e wedges, hot sauce, spring onion or coriander"},{"key":"spring-onion","name":"Spring onions","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Greek yoghurt, lime wedges, hot sauce, spring onion or coriander"},{"key":"coriander","name":"Fresh coriander","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Greek yoghurt, lime wedges, hot sauce, spring onion or coriander"}],"tags":["chicken"],"nutrition":{"kcal":600,"protein":44,"carbs":91,"fat":6,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":["Storage: refrigerate within 1 hour of cooking and eat within 3 days, or freeze in portions.","Reheat until steaming hot."]},{"title":"Cheeseburger Macaroni with Hidden Lentils","servings":"4","time":"10 min prep + 25 min","intro":"Cheeseburger flavours in a one-pot pasta. The red lentils disappear into the sauce. Roughly 44–46 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g lean beef mince"},{"text":"1 onion, diced"},{"text":"2 garlic cloves, crushed"},{"text":"1 tsp smoked paprika"},{"text":"3½ cups low-salt beef stock"},{"text":"1 tbsp Worcestershire sauce"},{"text":"1 tbsp American or Dijon mustard"},{"text":"300 g dry macaroni"},{"text":"½ cup dry red lentils, rinsed"},{"text":"2 tbsp tomato paste"},{"group":"After pressure cooking"},{"text":"1 cup (100 g) grated tasty cheese"},{"text":"½ cup milk"},{"text":"300 g frozen peas"},{"text":"Chopped gherkins, to serve (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Brown the beef.** Select Sauté and brown the mince with the onion. Add the garlic and paprika for the last 30 seconds."},{"text":"**Deglaze.** Pour in 1 cup of the stock and scrape the base completely clean. Add the rest of the stock, Worcestershire and mustard."},{"text":"**Layer.** Add the macaroni and lentils and press them down so they're under the liquid. Dot the tomato paste on top. **Don't stir.**"},{"text":"**Pressure cook.** Lid on, valve sealed. Cook on High for **4 minutes** (half the macaroni packet time), then **quick release** carefully in short bursts — it can splutter."},{"text":"**Finish.** Stir well. Stir in the cheese, milk and frozen peas. Put the lid back on for 3–5 minutes to warm through."},{"text":"Serve topped with chopped gherkins, burger-style."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**Pasta rule:** pressure-cook pasta for half its packet time, then quick release."},{"text":"If it's a bit wet after stirring, it thickens within a few minutes of resting."}]}],"id":"InstantPot-Cheeseburger_Macaroni","file":"InstantPot/Cheeseburger_Macaroni.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["500 g lean beef mince","1 onion, diced","2 garlic cloves, crushed","1 tsp smoked paprika","3½ cups low-salt beef stock","1 tbsp Worcestershire sauce","1 tbsp American or Dijon mustard","300 g dry macaroni","½ cup dry red lentils, rinsed","2 tbsp tomato paste","1 cup (100 g) grated tasty cheese","½ cup milk","300 g frozen peas","Chopped gherkins, to serve (optional)"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean beef mince"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":2.0,"unit":"clove","optional":false,"raw":"2 garlic cloves, crushed"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp smoked paprika"},{"key":"beef-stock","name":"Beef stock","aisle":"Pantry: check first","qty":3.5,"unit":"cup","optional":false,"raw":"3½ cups low-salt beef stock"},{"key":"worcestershire","name":"Worcestershire sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp Worcestershire sauce"},{"key":"mustard","name":"Mustard", d","items":[{"text":"Add all ingredients to the Instant Pot. Place the chicken in whole."},{"text":"Stir gently to distribute lentils and vegetables."},{"text":"Secure the lid with the valve sealed."},{"text":"Cook on **High Pressure** for 15 minutes."},{"text":"Allow a **Natural Pressure Release** for 10 minutes, then vent remaining pressure."},{"text":"Remove the chicken and shred using two forks."},{"text":"Return the shredded chicken to the pot and stir well."},{"text":"Taste and adjust salt and pepper as required."},{"text":"If the soup is too thick, add additional water or stock."}]},{"kind":"list","heading":"Portioning & Storage","items":[{"text":"Portion into 8 equal containers"},{"text":"Refrigerate 6 servings for the week"},{"text":"Freeze 2 servings for later use (e.g. Friday dinners)"}]},{"kind":"list","heading":"Serving Notes","items":[{"text":"Serve as-is for a light meal"},{"text":"Add bread or toast if extra calories are needed"},{"text":"Thickens slightly after chilling; thin when reheating"}]},{"kind":"list","heading":"Notes","items":[{"text":"Frozen vegetables are added from frozen; no thawing required."},{"text":"Red lentils soften completely and blend into the stock."},{"text":"Chicken thighs provide more flavour; breast is leaner but still suitable."},{"text":"Optional frozen spinach can be stirred through when reheating individual portions."}]}],"id":"InstantPot-Chicken_and_Vegetable_Soup","file":"InstantPot/Chicken_and_Vegetable_Soup.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["1.2 kg chicken thighs or breast","1 kg frozen mixed vegetables (peas, corn, carrot, beans)","300–500 g optional frozen broccoli & cauliflower","1 large onion, diced","3 garlic cloves, minced","1 cup red lentils (dry), rinsed","3.5 L chicken stock","2 tsp salt (adjust to taste)","1 tsp black pepper","2 tsp dried mixed herbs","2 bay leaves (optional)"],"shop":[{"key":"chicken-thigh","name":"Chicken thighs","aisle":" in","intro":"A mild, warmly spiced rice dish with plenty of protein and only one pot to wash. Roughly 43–46 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g chicken breast or tenderloins, cut into bite-sized pieces"},{"text":"1 can chickpeas, drained and rinsed"},{"text":"250 g frozen shelled edamame"},{"text":"300 g frozen mixed vegetables"},{"text":"1½ cups basmati rice, rinsed thoroughly"},{"text":"1 onion, diced"},{"text":"3 garlic cloves, crushed"},{"text":"1 tbsp grated ginger"},{"text":"1½ cups chicken stock"},{"text":"1 tbsp tomato paste"},{"text":"2 tsp curry powder"},{"text":"1 tsp ground cumin"},{"text":"½ tsp turmeric"},{"text":"½ tsp garam masala"},{"text":"Salt and pepper"},{"group":"To serve (optional)"},{"text":"Low-fat Greek yoghurt and lemon wedges"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Soften the onion.** Select Sauté and cook the onion in a little oil for 3–4 minutes."},{"text":"**Add chicken and spices.** Add the chicken, garlic, ginger, tomato paste and spices. Cook for about 2 minutes — the chicken doesn't need to cook through."},{"text":"**Deglaze.** Pour in the stock and scrape the base thoroughly."},{"text":"**Layer.** Stir in the chickpeas. Spread the rinsed rice evenly over the top, but **don't stir** it down into the base."},{"text":"**Pressure cook.** Lid on, valve sealed. Cook on High for **5 minutes**, then a **10-minute natural release**."},{"text":"**Finish.** Fold through the frozen edamame and mixed vegetables. Replace the lid for 5 minutes, or use Sauté briefly, until the vegetables are hot."},{"text":"Divide into four bowls and add yoghurt and a squeeze of lemon if you like."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**Advance prep:** defrost the chicken in the fridge the night before. The edamame and veg can go in from frozen."},{"text":"Rinse the rice until the water runs nearly clear — it keeps the grains separate and helps avoid a burn wa ,{"text":"1 tbsp oil"},{"text":"1 tsp salt"},{"text":"½–1 lime, juiced"},{"text":"520 g basmati rice (uncooked)"}]},{"kind":"steps","heading":"Method (Instant Pot)","items":[{"text":"Set Instant Pot to **Sauté**. Add oil and cook onion for **5 minutes** until softened."},{"text":"Add garlic, red curry paste, cumin, and coriander. Stir for **1 minute** until fragrant."},{"text":"Add chicken, coconut milk, stock, and salt. Stir gently to combine."},{"text":"Pressure cook on **High** for **10 minutes**. Allow a **10-minute natural release**."},{"text":"Return to **Sauté**. Stir in lentils and frozen vegetables."},{"text":"Cook for **5–7 minutes** until vegetables are tender."},{"text":"Remove from heat and stir through lime juice. Adjust seasoning."}]},{"kind":"steps","heading":"Rice (Rice Cooker)","items":[{"text":"Rinse rice until water runs mostly clear."},{"text":"Cook rice with water according to rice cooker instructions."},{"text":"Fluff and portion (** 200 g cooked rice per serve**)."}]},{"kind":"notes","heading":"Nutrition (per serve)","items":[{"text":"680 kcal · 40 g protein · 17.4 g fat · 8.9 g saturated fat"}]}],"id":"InstantPot-Chicken_Lentil_Coconut_Curry","file":"InstantPot/Chicken_Lentil_Coconut_Curry.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["1.1–1.2 kg boneless, skinless chicken thighs","2 cans (400 g) lentils, drained and rinsed","2 large onions, diced","4 garlic cloves, minced","4 tbsp red curry paste","1 tsp each ground cumin and ground coriander","2 cans (400 ml) light coconut milk","1 cup chicken stock","600 g frozen mixed vegetables","400 g frozen broccoli & cauliflower","1 tbsp oil","1 tsp salt","½–1 lime, juiced","520 g basmati rice (uncooked)"],"shop":[{"key":"chicken-thigh","name":"Chicken thighs","aisle":"Meat & fish","qty":1200.0,"unit":"g","optional":false,"raw":"1.1–1.2 kg boneless, skinless chicken thighs"},{"key":"lentils","name":"Lentils","aisle":"Cans, jars & pulses","qty":2.0,"unit":"can","optional":false,"raw":"2 cans (400 g) lentils, drained and rinsed"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 large onions, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":4.0,"unit":"clove","optional":false,"raw":"4 garlic cloves, minced"},{"key":"curry-paste","name":"Curry paste","aisle":"Pantry: check first","qty":4.0,"unit":"tbsp","optional":false,"raw":"4 tbsp red curry paste"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp each ground cumin and ground coriander"},{"key":"coconut-milk","name":"Coconut milk","aisle":"Cans, jars & pulses","qty":2.0,"unit":"can","optional":false,"raw":"2 cans (400 ml) light coconut milk"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup chicken stock"},{"key":"frozen-mixed-veg","name":"Frozen mixed vegetables","aisle":"Frozen","qty":600.0,"unit":"g","optional":false,"raw":"600 g frozen mixed vegetables"},{"key":"frozen-broccoli-cauli","name":"Frozen broccoli & cauliflower","aisle":"Frozen","qty":400.0,"unit":"g","optional":false,"raw":"400 g frozen broccoli & cauliflower"},{"key":"oil","name":"Cooking oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp oil"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp salt"},{"key":"lime","name":"Limes","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"½–1 lime, juiced"},{"key":"basmati-rice","name":"Basmati rice","aisle":"Pasta, rice & grains","qty":520.0,"unit":"g","optional":false,"raw":"520 g basmati rice (uncooked)"}],"tags":["chicken"],"nutrition":{"kcal":680,"protein":40,"carbs":79,"fat":17,"per":"serving","count":8},"diet":["freezes","dairy-free"],"storage":[]},{"title":"Chicken, Rice & Lentils","servings":"3","time":"40 min","intro":"A protein-boosted take on Instant Pot chicken and rice. Red lentils cook alongside the rice in the same pressure cycle, so there are no extra steps — just a bit more stock to cover what the lentils soak up.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"400 g skinless chicken breast, diced into bite-sized pieces"},{"text":"1 cup long-grain white rice, rinsed"},{"text":"½ cup dried red lentils, rinsed"},{"text":"2½ cups chicken stock"},{"text":"1 medium onion, diced"},{"text":"3 garlic cloves, minced"},{"text":"1 tbsp olive oil"},{"text":"2 tbsp butter"},{"text":"1 tsp paprika"},{"text":"½ tsp dried oregano"},{"text":"1 tsp salt"},{"text":"¼ tsp black pepper"},{"text":"1 cup frozen peas or mixed vegetables (optional)"},{"text":"2 tbsp fresh parsley, chopped, to serve (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Sauté the aromatics.** Set the pot to Sauté. Add the olive oil and butter. Once melted, cook the onion for 2–3 minutes until softened, then add the garlic and cook for 30 seconds until fragrant."},{"text":"**Sear the chicken.** Push the onion to the side and add the diced chicken with the paprika, oregano, salt and pepper. Sear for 1–2 minutes, stirring occasionally — it only needs colour, not to cook through."},{"text":"**Add rice, lentils and stock.** Hit Cancel. Sprinkle the rice and lentils evenly over the chicken, then pour the stock over the top without stirring."},{"text":"**Pressure cook.** Lid on, valve sealed. Pressure Cook / Manual on High for **10 minutes**."},{"text":"**Release.** Allow a 10-minute natural release, then quick-release any remaining pressure."},{"text":"**Finish.** Stir through the frozen vegetables (if using) — the residual heat warms them through — and fluff everything together."},{"text":"Garnish with parsley and serve warm."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Stick with red or split lentils — brown or green lentils need longer and won't match the rice timing. The extra stock allows for the lentils soaking up liquid. Dicing the chicken means it cooks through fully under pressure. If you get a burn warning, scrape any stuck bits off the base before adding the rice and lentils. For a dairy-free batch, use extra olive oil in place of the butter. Leftovers reheat and freeze well."}]}],"id":"InstantPot-Chicken_Rice_Lentils","file":"InstantPot/Chicken_Rice_Lentils.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["400 g skinless chicken breast, diced into bite-sized pieces","1 cup long-grain white rice, rinsed","½ cup dried red lentils, rinsed","2½ cups chicken stock","1 medium onion, diced","3 garlic cloves, minced","1 tbsp olive oil","2 tbsp butter","1 tsp paprika","½ tsp dried oregano","1 tsp salt","¼ tsp black pepper","1 cup frozen peas or mixed vegetables (optional)","2 tbsp fresh parsley, chopped, to serve (optional)"],"shop":[{"key":"chicken-breast","name":"Chicken breast or tenderloins","aisle":"Meat & fish","qty":400.0,"unit":"g","optional":false,"raw":"400 g skinless chicken breast, diced into bite-sized pieces"},{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup long-grain white rice, rinsed"},{"key":"red-lentils","name":"Red lentils (dry)","aisle":"Cans, jars & pulses","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup dried red lentils, rinsed"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":2.5,"unit":"cup","optional":false,"raw":"2½ cups chicken stock"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 medium onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, minced"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp olive oil"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp butter"},{"key":"paprika","name":"Paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp paprika"},{"key":"oregano","name":"Dried oregano","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp dried oregano"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp salt"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":0.25,"unit":"tsp","optional":false,"raw":"¼ tsp black pepper"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":1.0,"unit":"cup","optional":true,"raw":"1 cup frozen peas or mixed vegetables (optional)"},{"key":"parsley","name":"Fresh parsley","aisle":"Fruit & veg","qty":2.0,"unit":"tbsp","optional":true,"raw":"2 tbsp fresh parsley, chopped, to serve (optional)"}],"tags":["chicken"],"nutrition":{"kcal":630,"protein":45,"carbs":73,"fat":16,"per":"serving","count":3},"diet":["freezes"],"storage":["Leftovers reheat and freeze well."]},{"title":"Coconut Chicken, Potato & Chickpea Curry","servings":"3–4","time":"30 min (+ 10 min natural release)","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"400 g chicken breast"},{"text":"200 g tinned tomatoes"},{"text":"2 tbsp red or green curry paste"},{"text":"250 ml chicken stock"},{"text":"3 garlic cloves, minced"},{"text":"1 tsp fresh or ground ginger"},{"text":"1 tbsp fish sauce or soy sauce"},{"text":"1 tsp brown sugar or honey"},{"text":"2 medium potatoes, peeled and diced into 2cm cubes"},{"text":"1 carrot, grated"},{"text":"1 can chickpeas, drained and rinsed (400 g)"},{"text":"1 can coconut milk (400 ml)"},{"text":"100 g frozen peas"},{"text":"200 g jasmine or basmati rice (dry)"},{"text":"1 tbsp lime juice (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Add tinned tomatoes, curry paste, stock, garlic, ginger, fish sauce, and sugar to the Instant Pot insert. Stir to combine — keep the mix thin and well stirred so nothing thick sits on the bottom."},{"text":"Place the whole chicken breast into the liquid, then scatter the diced potato around it. Do **not** stir again after this — leave the base layer undisturbed to avoid a burn warning."},{"text":"Seal the lid, set valve to Sealing, and cook on Manual/Pressure Cook on HIGH for **10 minutes**."},{"text":"Let pressure release naturally for 8–10 minutes, then carefully quick release any remaining pressure."},{"text":"Remove the chicken breast and shred it with two forks. Stir in the chickpeas and return the shredded chicken to the pot."},{"text":"Switch to Sauté mode. Stir in the coconut milk, grated carrot, and frozen peas. Heat through for 3–5 minutes, stirring occasionally, until everything is hot and the peas are cooked."},{"text":"Turn off Sauté. Add lime juice if using and taste for seasoning — more fish sauce for salt, more sugar to balance."},{"text":"Cook the rice according to packet instructions ( 15 min, or use the Instant Pot's rice function separately) and serve with the curry."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**Why the coconut milk goes in last:** Coconut milk and the thicker tomato/paste mix sitting on the bottom can trigger a burn warning under pressure. Keeping the base liquid thin (stock-heavy) and stirring the coconut milk in afterwards on Sauté avoids this."},{"text":"**Grated carrot:** Goes in with the coconut milk at the end rather than under pressure — it cooks through in a couple of minutes on Sauté and keeps a bit of texture and sweetness."},{"text":"**Chicken breast:** 10 minutes at high pressure plus the natural rest is enough for a single 400 g breast — don't add extra time or it will dry out. If cooking from frozen, add 3–4 minutes."}]}],"id":"InstantPot-Coconut_Chicken_Potato_Chickpea_Curry","file":"InstantPot/Coconut_Chicken_Potato_Chickpea_Curry.tex","chapter":"p key":"chickpeas","name":"Chickpeas","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can chickpeas, drained and rinsed (400 g)"},{"key":"coconut-milk","name":"Coconut milk","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can coconut milk (400 ml)"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":100.0,"unit":"g","optional":false,"raw":"100 g frozen peas"},{"key":"basmati-rice","name":"Basmati rice","aisle":"Pasta, rice & grains","qty":200.0,"unit":"g","optional":false,"raw":"200 g jasmine or basmati rice (dry)"},{"key":"lime","name":"Limes","aisle":"Fruit & veg","qty":0.5,"unit":"","optional":true,"raw":"1 tbsp lime juice (optional)"}],"tags":["chicken","fish"],"nutrition":{"kcal":780,"protein":43,"carbs":94,"fat":25,"per":"serving","count":3.5},"diet":["freezes","dairy-free"],"storage":[]},{"title":"Filipino-Style Pork Adobo with Edamame","servings":"4","time":"15 min prep + 35 min","intro":"Pork cooked under pressure in a sharp garlic, soy and vinegar sauce, with edamame stirred through for extra protein. Roughly 43–46 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g lean pork loin (or pork shoulder, see notes), cut into large cubes"},{"text":"1 onion, sliced"},{"text":"4 garlic cloves, crushed"},{"text":"½ cup water"},{"text":"⅓ cup reduced-salt soy sauce"},{"text":"⅓ cup white or apple-cider vinegar"},{"text":"1 tbsp honey or brown sugar"},{"text":"2 bay leaves"},{"text":"½ tsp black pepper"},{"text":"350 g frozen shelled edamame"},{"text":"300 g frozen mixed vegetables"},{"text":"1¼ cups dry rice, to serve"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Brown the pork.** Select Sauté and brown the pork in a little oil."},{"text":"**Onion and garlic.** Add the onion and cook for 2 minutes, then the garlic."},{"text":"**Deglaze.** Pour in the water and scrape the base thoroughly."},{"text":"**Sauce.** Add the soy sauce, vinegar, honey, bay leaves and pepper. The vinegar smells strong at this stage — it mellows as it cooks."},{"text":"**Pressure cook.** Lid on, valve sealed. Cook on High for **10 minutes** (**20 minutes** for shoulder), then a **10-minute natural release**."},{"text":"**Finish.** Remove the bay leaves. Stir in the edamame and frozen vegetables and use Sauté for 5–7 minutes until hot and the sauce has reduced slightly."},{"text":"Meanwhile, cook the rice. Divide into four servings."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**Loin vs shoulder:** loin is leaner but dries out easily under pressure — cut it into large cubes and don't add extra time. Pork shoulder is much more forgiving and more tender, but higher in fat; trim the thick fat and cook it for 20 minutes."},{"text":"**Advance prep:** defrost the pork in the fridge the night before. The edamame goes in from frozen."}]}],"id":"InstantPot-Pork_Adobo_with_Edamame","file":"InstantPot/Pork_Adobo_with_Edamame.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["500 g lean pork loin (or pork shoulder, see notes), cut into large cubes","1 onion, sliced","4 garlic cloves, crushed","½ cup water","⅓ cup reduced-salt soy sauce","⅓ cup white or apple-cider vinegar","1 tbsp honey or brown sugar","2 bay leaves","½ tsp black pepper","350 g frozen shelled edamame","300 g frozen mixed vegetables","1¼ cups dry rice, to serve"],"shop":[{"key":"pork-loin","name":"Pork loin","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean pork loin (or pork shoulder, see notes), cut into large cubes"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, sliced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":4.0,"unit":"clove","optional":false,"raw":"4 garlic cloves, crushed"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":0.3333333333333333,"unit":"cup","optional":
