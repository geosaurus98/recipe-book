l":false,"raw":"1 tbsp lime or lemon juice"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Chilli flakes (optional)"},{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":1.25,"unit":"cup","optional":false,"raw":"1¼ cups dry rice"}],"tags":["chicken"],"nutrition":{"kcal":710,"protein":46,"carbs":75,"fat":24,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":[]},{"title":"Savoury Mince with Barley & Veg","servings":"4","time":"15 min prep + 6 hr (low)","intro":"The Kiwi classic, bulked out with barley, a few red lentils and plenty of veg. Serve on toast, mash or rice. Roughly 35 g protein per serve, more with wholegrain toast.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Slow cooker base"},{"text":"500 g lean beef mince"},{"text":"1 onion, diced"},{"text":"2 carrots, diced"},{"text":"⅓ cup pearl barley, rinsed"},{"text":"¼ cup dry red lentils, rinsed"},{"text":"2 cups beef stock"},{"text":"2 tbsp tomato sauce"},{"text":"1 tbsp Worcestershire sauce"},{"text":"1 tsp dried mixed herbs"},{"group":"Last 30 minutes"},{"text":"400 g frozen mixed vegetables"},{"text":"1 tbsp cornflour mixed with 2 tbsp cold water (if needed)"},{"group":"To serve"},{"text":"Toast, mashed potato or rice"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Brown the mince.** In a frying pan, brown the mince and onion, breaking it up. Drain any excess fat."},{"text":"**Load the slow cooker.** Add the mince, carrots, barley, lentils, stock, tomato sauce, Worcestershire and herbs. Stir."},{"text":"**Slow cook.** Cook on Low for about 6 hours, until the barley is tender."},{"text":"**Finish.** Stir in the frozen veg. If it's thin, stir in the cornflour mixture. Cook for a final 30 minutes on High."},{"text":"Season and serve on toast, mash or rice."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Freezes well. A great one to have in the freezer for nights when nobody wants to cook."}]}],"id":"SlowCooker-Savoury_Mince_with_Barley","file":"SlowCooker/Savoury_Mince_with_Barley.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["500 g lean beef mince","1 onion, diced","2 carrots, diced","⅓ cup pearl barley, rinsed","¼ cup dry red lentils, rinsed","2 cups beef stock","2 tbsp tomato sauce","1 tbsp Worcestershire sauce","1 tsp dried mixed herbs","400 g frozen mixed vegetables","1 tbsp cornflour mixed with 2 tbsp cold water (if needed)","Toast, mashed potato or rice"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean beef mince"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 carrots, diced"},{"key":"barley","name":"Pearl barley","aisle":"Pasta, rice & grains","qty":0.3333333333333333,"unit":"cup","optional":false,"raw":"⅓ cup pearl barley, rinsed"},{"key":"red-lentils","name":"Red lentils (dry)","aisle":"Cans, jars & pulses","qty":0.25,"unit":"cup","optional":false,"raw":"¼ cup dry red lentils, rinsed"},{"key":"beef-stock","name":"Beef stock","aisle":"Pantry: check first","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups beef stock"},{"key":"tomato-sauce","name":"Tomato sauce","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato sauce"},{"key":"worcestershire","name":"Worcestershire sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp Worcestershire sauce"},{"key":"mixed-herbs","name":"Mixed herbs","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried mixed herbs"},{"key":"frozen-mixed-veg","name":"Frozen mixed vegetables","aisle":"Frozen","qty":400.0,"unit":"g","optional":false,"raw":"400 g frozen mixed vegetables"},{"key":"cornflour","name":"Cornflour","aisle":"Baking","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp cornflour mixed with 2 tbsp cold water (if needed)"},{"key":"toast","name":"Toast","aisle":null,"qty":null,"unit":"","optional":true,"raw":"Toast, mashed potato or rice"},{"key":"potato","name":"Potatoes","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Toast, mashed potato or rice"},{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":null,"unit":"","optional":true,"raw":"Toast, mashed potato or rice"}],"tags":["beef","mince"],"nutrition":{"kcal":460,"protein":34,"carbs":44,"fat":16,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":["Freezes well.","A great one to have in the freezer for nights when nobody wants to cook."]},{"title":"Smoky Chicken, Black Bean & Red Lentil Stew","servings":"4","time":"6–7 hr (slow cooker, low)","intro":"A dump-and-go slow cooker stew with smoky paprika, cumin and a Worcestershire backbone. The red lentils mostly disappear into the sauce, making it thicker and more filling without it tasting like obvious lentil punishment. Makes 4 large servings at roughly 45–50 g protein each.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Slow cooker base"},{"text":"1 onion, diced"},{"text":"2 carrots, diced or thinly sliced"},{"text":"2–3 garlic cloves, crushed"},{"text":"½ cup dry red lentils, rinsed"},{"text":"1 can crushed tomatoes"},{"text":"1½ cups chicken stock"},{"text":"2 tsp smoked paprika"},{"text":"2 tsp ground cumin"},{"text":"1 tsp dried oregano"},{"text":"½ tsp chilli powder (or to taste)"},{"text":"1 tbsp Worcestershire sauce"},{"text":"600 g chicken breast, left whole"},{"group":"Last 20–30 minutes"},{"text":"1 can black beans, drained & rinsed"},{"text":"350 g frozen mixed vegetables or corn (optional)"},{"group":"To finish & serve"},{"text":"½ tsp salt and ¼ tsp pepper"},{"text":"4 cups cooked rice"},{"text":"Squeeze of lime or splash of vinegar (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Build the base.** Add the onion, carrots, garlic, rinsed lentils, tomatoes, stock, spices and Worcestershire sauce to the slow cooker. Stir well so the lentils are spread through the liquid, not clumped on the bottom."},{"text":"**Add the chicken.** Lay the whole chicken breasts on top. They don't need to be submerged."},{"text":"**Slow cook.** Cook on Low for 6–7 hours. If you're home, 4–5 hours is enough for whole breasts and keeps them juicier."},{"text":"**Shred.** Lift out the chicken, shred it with two forks, and stir it back into the sauce."},{"text":"**Add the beans & veg.** Stir in the drained black beans and any frozen vegetables or corn. Cook for a final 20–30 minutes with the lid off (switch to High if needed) so the sauce reduces while everything heats through."},{"text":"**Adjust & serve.** Too thin → mash a few of the beans against the side of the pot and simmer a little longer. Too thick → loosen with a splash of water or stock. Season with salt and pepper, add a squeeze of lime or splash of vinegar if using, then serve over rice."}]},{"kind":"variation","heading":"No-tomato version","text":"Replace the crushed tomatoes with an extra 1½ cups of stock, and add 1 tbsp tomato paste, BBQ sauce or salsa for flavour. The tomatoes are the better fit here, though — use them if you have them.","sections":[]},{"kind":"variation","heading":"Instant Pot (pressure)","text":"Layer as above, but don't stir in the tomatoes — pour them on top of everything else and leave them, and add an extra ½ cup of stock. Lentils and thick tomato sauce on the base are a classic burn-error trigger. Finish the beans and veg on Sauté.","sections":[]},{"kind":"notes","heading":"Notes","items":[{"text":"**Keep the chicken whole** for the long cook, then shred at the end — it stays juicier than diced breast would over 6–7 hours."},{"text":"**Start wet, finish thick.** The red lentils soak up a lot of liquid over the long cook, so the base starts deliberately loose — it's easy to reduce at the end, but a dry pot can catch. The stew thickens again in the fridge, so loosen leftovers with a splash of water when reheating."},{"text":"**Beans go in late** so they hold their shape rather than turning to mush."},{"text":"**Grated carrot** works too if you'd rather it melted into the sauce instead of staying as visible pieces."}]}],"id":"SlowCooker-Smoky_Chicken_Bean_Lentil_Stew","file":"SlowCooker/Smoky_Chicken_Bean_Lentil_Stew.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["1 onion, diced","2 carrots, diced or thinly sliced","2–3 garlic cloves, crushed","½ cup dry red lentils, rinsed","1 can crushed tomatoes","1½ cups chicken stock","2 tsp smoked paprika","2 tsp ground cumin","1 tsp dried oregano","½ tsp chilli powder (or to taste)","1 tbsp Worcestershire sauce","600 g chicken breast, left whole","1 can black beans, drained & rinsed","350 g frozen mixed vegetables or corn (optional)","½ tsp salt and ¼ tsp pepper","4 cups cooked rice","Squeeze of lime or splash of vinegar (optional)"],"shop":[{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 carrots, diced or thinly sliced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"2–3 garlic cloves, crushed"},{"key":"red-lentils","name":"Red lentils (dry)","aisle":"Cans, jars & pulses","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup dry red lentils, rinsed"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can crushed tomatoes"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups chicken stock"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pa aprika"},{"text":"½ tsp ground cinnamon"},{"text":"½ tsp salt"},{"text":"2 tbsp chopped parsley"},{"group":"Couscous"},{"text":"1 cup dry couscous"},{"text":"1 cup hot chicken stock"},{"text":"1 can chickpeas, drained and rinsed"},{"text":"Squeeze of lemon"},{"group":"Yoghurt sauce"},{"text":"200 g Greek yoghurt"},{"text":"1 small garlic clove, crushed"},{"text":"Juice of ½ lemon"},{"text":"½ cucumber, grated (optional)"},{"group":"To serve"},{"text":"Tomato, cucumber and lettuce"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Kofta.** Mix all the kofta ingredients well with your hands. Shape into 12 sausages around 8 cm long."},{"text":"**Cook.** Pan-fry in a little oil over medium heat for 8–10 minutes, turning, until browned and cooked through. (Or bake at 200°C for 15 minutes.)"},{"text":"**Couscous.** Put the couscous and chickpeas in a bowl, pour over the hot stock, cover and leave for 5 minutes. Fluff with a fork and add lemon juice."},{"text":"**Sauce.** Mix the yoghurt, garlic, lemon and cucumber with a pinch of salt."},{"text":"Serve the kofta on couscous with salad and yoghurt sauce."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Wet your hands to shape the kofta — the mince won't stick."},{"text":"Works with pork mince or half-and-half too."}]}],"id":"Stovetop-Beef_Kofta_Couscous","file":"Stovetop/Beef_Kofta_Couscous.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["500 g lean beef mince","½ onion, grated","2 garlic cloves, crushed","1 tsp ground cumin","1 tsp ground coriander","1 tsp paprika","½ tsp ground cinnamon","½ tsp salt","2 tbsp chopped parsley","1 cup dry couscous","1 cup hot chicken stock","1 can chickpeas, drained and rinsed","Squeeze of lemon","200 g Greek yoghurt","1 small garlic clove, crushed","Juice of ½ lemon","½ cucumber, grated (optional)","Tomato, cucumber and lettuce"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw": nd serve with yoghurt and salsa."}]},{"kind":"notes","heading":"Notes","items":[{"text":"A good use for leftover Beef Mince Taco Filling (Slow Cooker) — skip straight to assembling."}]}],"id":"Stovetop-Beef_Black_Bean_Quesadillas","file":"Stovetop/Beef_Black_Bean_Quesadillas.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["500 g lean beef mince","1 onion, diced","1 tsp ground cumin","1 tsp smoked paprika","½ tsp chilli powder","2 tbsp tomato paste","¼ cup water","1 can black beans, drained, rinsed and lightly mashed","8 medium tortillas","100 g grated tasty cheese","Handful of baby spinach (optional)","Greek yoghurt, salsa, lettuce"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean beef mince"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp ground cumin"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp smoked paprika"},{"key":"chilli-powder","name":"Chilli powder","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp chilli powder"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"black-beans","name":"Black beans","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can black beans, drained, rinsed and lightly mashed"},{"key":"tortillas","name":"Tortillas or wraps","aisle":"Bread & wraps","qty":8.0,"unit":"","optional":false,"raw":"8 medium tortillas"},{"key":"cheese","name":"Tasty cheese","aisle":"Dairy, eggs & chilled","qty":100.0,"unit":"g","optional":false,"raw":"100 g grated tasty cheese"},{"key":"spinach","name":"Baby spinach","aisl hapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["500 g lean beef mince","1 bag (500 g) frozen stir fry vegetables","200 g frozen edamame (shelled)","3 tbsp soy sauce","2 tbsp oyster sauce","1 tbsp sesame oil","3 garlic cloves, minced","1 tsp fresh ginger, grated","**To serve:** jasmine rice or noodles"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean beef mince"},{"key":"frozen-stir-fry","name":"Frozen stir-fry vegetables","aisle":"Frozen","qty":1.0,"unit":"","optional":false,"raw":"1 bag (500 g) frozen stir fry vegetables"},{"key":"edamame","name":"Frozen edamame","aisle":"Frozen","qty":200.0,"unit":"g","optional":false,"raw":"200 g frozen edamame (shelled)"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp soy sauce"},{"key":"oyster-sauce","name":"Oyster sauce","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp oyster sauce"},{"key":"sesame-oil","name":"Sesame oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp sesame oil"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, minced"},{"key":"ginger","name":"Fresh ginger","aisle":"Fruit & veg","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp fresh ginger, grated"},{"key":"jasmine-rice","name":"Jasmine rice","aisle":"Pasta, rice & grains","qty":null,"unit":"","optional":true,"raw":"To serve: jasmine rice or noodles"},{"key":"noodles","name":"Noodles","aisle":"Pasta, rice & grains","qty":null,"unit":"","optional":true,"raw":"To serve: jasmine rice or noodles"}],"tags":["beef","mince"],"nutrition":{"kcal":260,"protein":23,"carbs":11,"fat":14,"per":"serving","count":6},"diet":["dairy-free"],"storage":[]},{"title":"Beef Schnitzel Rolls","servings":"4","time":"45 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"4 beef schnitzels (or chicken schnitzels)"},{"text":"4 slices Edam cheese"},{"text":"6 garlic cloves"},{"text":"Fresh rosemary"},{"text":"2–3 slices streaky bacon"},{"text":"1 cup flour (for dusting)"},{"text":"½ glass white wine"},{"text":"Olive oil"},{"text":"Salt and pepper, to taste"},{"text":"Toothpicks"},{"text":"Non-stick frypan with lid"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Prepare the pesto:** Crush the garlic and rosemary together in a mortar and pestle to form a coarse paste."},{"text":"**Marinate the meat:** Cut each schnitzel in half. Brush half of the slices with a little of the garlic–rosemary pesto and let marinate for 30 minutes. Afterward, gently remove excess pesto."},{"text":"**Assemble the rolls:** On each marinated schnitzel half, place a slice of cheese and half a slice of bacon. Cover with a second schnitzel half and roll tightly, securing with a toothpick. Alternatively, layer the two pieces flat (like a sandwich) and secure with toothpicks."},{"text":"**Coat the rolls:** Lightly dust each roll in flour."},{"text":"**Sear the rolls:** In a non-stick frypan, heat olive oil with a little garlic and rosemary until fragrant and golden. Add the schnitzel rolls, season with salt and pepper, and brown for about 2 minutes per side."},{"text":"**Deglaze and simmer:** Pour in the white wine and simmer uncovered for 4 minutes. Cover the pan with a lid and cook gently for another 5 minutes."},{"text":"**To serve:** Serve hot with crusty bread and seasonal vegetables."}]},{"kind":"notes","heading":"Notes","items":[{"text":"This dish works equally well with chicken schnitzel for a lighter version. For extra flavour, add a dash of lemon juice before serving or sprinkle with chopped parsley. The melted cheese and bacon make the rolls rich and savoury — perfect for a hearty dinner."}]}],"id":"Italian-Beef_Schnitzel_Rolls","file":"Italian/Beef_Schnitzel_Rolls.tex","chapter":"stovetop","cha "40 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"400 g chicken thighs, boneless and skinless, diced"},{"text":"1 onion, finely chopped"},{"text":"2 tsp garam masala"},{"text":"2 tsp cumin"},{"text":"2 tsp paprika"},{"text":"1 tsp turmeric"},{"text":"1 tsp ground coriander"},{"text":"2 garlic cloves, minced"},{"text":"1 tbsp grated ginger"},{"text":"400 g can crushed tomatoes (or tomato purée)"},{"text":"½ cup cream (or coconut cream)"},{"text":"2 tbsp butter"},{"text":"2 tbsp oil"},{"text":"Salt and pepper, to taste"},{"text":"Fresh coriander leaves, to garnish"},{"text":"Cooked basmati rice or naan bread, to serve"}]},{"kind":"steps","heading":"Method","items":[{"text":"Heat oil and butter in a large pan over medium heat. Add onion and cook until softened and golden."},{"text":"Add garlic, ginger, and all spices (garam masala, cumin, paprika, turmeric, ground coriander). Stir for 1–2 minutes until fragrant."},{"text":"Add chicken pieces and cook until lightly browned on all sides."},{"text":"Stir in crushed tomatoes. Reduce heat and simmer for 15 minutes, until chicken is cooked through."},{"text":"Stir in cream and simmer gently for another 5 minutes until the sauce is rich and creamy. Season with salt and pepper."},{"text":"Serve hot, garnished with fresh coriander, alongside rice or naan bread."}]},{"kind":"notes","heading":"Notes","items":[{"text":"For extra flavour, marinate the chicken in yoghurt, lemon juice, and half of the spices for 30 minutes before cooking. This dish can also be made with coconut cream for a dairy-free option."}]}],"id":"Fakeaways-Butter_Chicken","file":"Fakeaways/Butter_Chicken.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["400 g chicken thighs, boneless and skinless, diced","1 onion, finely chopped","2 tsp garam masala","2 tsp cumin","2 tsp paprika","1 tsp turmeric","1 tsp ground coriander","2 garlic cloves, minced","1 tbsp grated ginger","400 g can crushe prouts and frozen veg ready — stir-frying moves fast."},{"text":"Mix the soy sauce, oyster sauce, sesame oil, cornflour and water in a small bowl. Set aside."},{"text":"Heat the oil in a wok or large pan over high heat. Add the chicken and cook until browned and cooked through (5–6 min). Remove and set aside."},{"text":"In the same pan, add the onion and garlic. Stir-fry for 1 min until fragrant."},{"text":"Add the cabbage, julienned carrot, frozen veg and grated carrot. Stir-fry on high heat for 3–4 min, tossing frequently, until the cabbage softens but still has some bite."},{"text":"Return the chicken to the pan. Add the bean sprouts and pour over the sauce. Toss for 1–2 min until the sauce thickens and coats everything. Excess liquid should reduce quickly on high heat — don't let it pool."},{"text":"Divide into bowls with a small portion of brown rice on the side or underneath."}]},{"kind":"notes","heading":"Notes","items":[{"text":"High veg-to-protein ratio keeps calorie density low — roughly 350–400 kcal per serve depending on rice portion."},{"text":"Bean sprouts are added last to keep their crunch."},{"text":"Swap the frozen mixed veg for broccoli or snow peas if priced well."},{"text":"Optional add-ins: minced ginger with the garlic, chilli flakes, a beaten egg scrambled through at the end for extra protein, or a squeeze of lime to finish."}]},{"kind":"variation","heading":"Noodle / Pasta Version","text":"Swap the rice for 150 g (dry weight) hokkien or rice noodles, or pasta, tossed through at the end in step 7. Pasta and noodles soak up more liquid than rice, so add a splash of water or an extra tablespoon of soy sauce if it looks dry. Keep the veg quantities the same. Higher in calories than the rice version.","sections":[]}],"id":"Stovetop-Chicken_Veg_Stir_Fry_Bowl","file":"Stovetop/Chicken_Veg_Stir_Fry_Bowl.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["400 g chicken breast, diced","300 g cabbage, shredded","150 g bean s diced"},{"text":"3 garlic cloves, crushed"},{"text":"2 tbsp tomato paste"},{"text":"2 tsp Italian herbs"},{"text":"1 tsp smoked paprika"},{"text":"½ cup chicken stock or reserved pasta water"},{"text":"Salt and pepper"},{"text":"40–50 g reduced-fat grated cheese (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Pasta.** Cook the pasta according to the packet instructions. Reserve a cup of pasta water before draining."},{"text":"**Chicken.** Meanwhile, cook the chicken in a large frying pan with a little oil for 5–6 minutes (4–5 for tenderloins)."},{"text":"**Onion and spices.** Add the onion and cook for 3 minutes. Add the garlic, herbs and paprika for the last 30 seconds."},{"text":"**Sauce.** Add the tomatoes, tomato paste, stock and frozen vegetables. Simmer for 5–7 minutes, then stir in the cannellini beans."},{"text":"**Combine.** Toss the drained pasta through the sauce, loosening with pasta water if needed."},{"text":"Divide into four portions and top with a little cheese if you like."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**Advance prep:** defrost the chicken overnight."},{"text":"Keeps well for lunches — add a splash of water when reheating."}]}],"id":"Stovetop-Chicken_Tomato_White_Bean_Pasta","file":"Stovetop/Chicken_Tomato_White_Bean_Pasta.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["500 g chicken breast or tenderloins, diced","300 g dry pasta","1 can cannellini beans, drained and rinsed","1 can crushed tomatoes","300 g frozen spinach or mixed vegetables","1 onion, diced","3 garlic cloves, crushed","2 tbsp tomato paste","2 tsp Italian herbs","1 tsp smoked paprika","½ cup chicken stock or reserved pasta water","Salt and pepper","40–50 g reduced-fat grated cheese (optional)"],"shop":[{"key":"chicken-breast","name":"Chicken breast or tenderloins","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g chicken breast or tenderloins, diced"},{"key":"pasta","name":"Pasta" — add a splash of water when reheating."]},{"title":"Classic Spaghetti Bolognese","servings":"4","time":"Prep 5 min, Cook 25 min (Total 30 min)","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 tbsp olive oil"},{"text":"1 onion, finely diced"},{"text":"2 carrots, finely diced"},{"text":"2 celery sticks, finely diced"},{"text":"1 tbsp crushed garlic"},{"text":"500 g beef mince"},{"text":"3 tbsp tomato paste"},{"text":"1 tbsp Italian herbs"},{"text":"1 can (400 g) crushed tomatoes"},{"text":"½ cup beef stock"},{"text":"**To serve:** 500 g spaghetti (cooked), parmesan"}]},{"kind":"steps","heading":"Method","items":[{"text":"Heat olive oil in a large frying pan. Add onion, carrot, and celery. Cook, stirring, for about 5 minutes over medium heat."},{"text":"Stir in garlic. Add beef mince, breaking up with a wooden spoon. Cook 5 minutes until browned. Stir in tomato paste and herbs."},{"text":"Add Beef stock to pan with crushed tomatoes."},{"text":"Simmer 10–15 minutes on low, stirring occasionally, until liquid reduces and sauce thickens. Season with salt and pepper."},{"text":"Serve over spaghetti, topped with grated parmesan."}]},{"kind":"text","heading":null,"text":"**Source:** https://vjcooks.com/classic-spaghetti-bolognese/#mv-creation-346-jtrVJ Cooks – Classic Spaghetti Bolognese"},{"kind":"notes","heading":"Notes","items":[{"text":"itemize Freezes well. Double recipe to save one meal for later. itemize"}]}],"id":"Stovetop-Classic_Spaghetti_Bolognese","file":"Stovetop/Classic_Spaghetti_Bolognese.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["1 tbsp olive oil","1 onion, finely diced","2 carrots, finely diced","2 celery sticks, finely diced","1 tbsp crushed garlic","500 g beef mince","3 tbsp tomato paste","1 tbsp Italian herbs","1 can (400 g) crushed tomatoes","½ cup beef stock","**To serve:** 500 g spaghetti (cooked), parmesan"],"shop":[{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp olive oil"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, finely diced"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 carrots, finely diced"},{"key":"celery","name":"Celery","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 celery sticks, finely diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp crushed garlic"},{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g beef mince"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp tomato paste"},{"key":"mixed-herbs","name":"Mixed herbs","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp Italian herbs"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can (400 g) crushed tomatoes"},{"key":"beef-stock","name":"Beef stock","aisle":"Pantry: check first","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup beef stock"},{"key":"spaghetti","name":"Spaghetti","aisle":"Pasta, rice & grains","qty":500.0,"unit":"g","optional":true,"raw":"To serve: 500 g spaghetti (cooked), parmesan"}],"tags":["beef","mince"],"nutrition":{"kcal":350,"protein":28,"carbs":17,"fat":19,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":["itemize Freezes well."]},{"title":"Freezer Burritos with Beef, Beans & Rice","servings":"4 (8 burritos)","time":"40 min","intro":"Make a batch on Sunday and have lunches ready for the week. Two burritos per serve. Roughly 45 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"⅓ cup dry rice"},{"text":"500 g lean beef mince"},{"text":"1 onion, diced"},{"text":"2 tsp ground cumin"},{"text":"2 tsp smoked paprika"},{"text":"1 tsp chilli powder"},{"text":"1 tsp garlic powder"},{"text":"2 tbsp tomato paste"},{"text":"½ cup water"},{"text":"1 can black beans or kidney beans, drained and rinsed"},{"text":"1 cup frozen corn"},{"text":"100 g grated tasty cheese"},{"text":"8 large tortillas"}]},{"kind":"steps","heading":"Method","items":[{"text":"Cook the rice and cool it."},{"text":"Brown the mince and onion in a large frying pan. Add the spices for 30 seconds, then the tomato paste, water, beans and corn. Simmer for 5 minutes until thick, not wet. Cool for 10 minutes."},{"text":"Warm the tortillas briefly so they fold without cracking."},{"text":"Divide the rice, filling and cheese between the tortillas in a line just below the centre. Fold in the sides, then roll up tightly."},{"text":"Wrap each burrito in cling film or foil. Freeze flat, then transfer to a bag."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**Reheat from frozen:** unwrap, wrap in a damp paper towel and microwave for 2–3 minutes, turning halfway. Or bake in foil at 180°C for 25 minutes, then unwrap for 5 minutes to crisp."},{"text":"Keeps 3 months frozen. Make sure the filling is cool and fairly dry before rolling, or the tortillas go soggy."},{"text":"Leftover Beef Mince Taco Filling (Slow Cooker) works as the filling."}]}],"id":"Stovetop-Freezer_Burritos","file":"Stovetop/Freezer_Burritos.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["⅓ cup dry rice","500 g lean beef mince","1 onion, diced","2 tsp ground cumin","2 tsp smoked paprika","1 tsp chilli powder","1 tsp garlic powder","2 tbsp tomato paste","½ cup water","1 can black beans or kidney beans, drained and rinsed","1 cup frozen corn","100 g grated tasty cheese","8 large tortillas"],"shop":[{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":0.3333333333333333,"unit":"cup","optional":false,"raw":"⅓ cup dry rice"},{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean beef mince"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":2.0,"unit":"tsp","optional":false,"raw":"2 tsp ground cumin"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":2.0,"unit":"tsp","optional":false,"raw":"2 tsp smoked paprika"},{"key":"chilli-powder","name":"Chilli powder","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp chilli powder"},{"key":"garlic-powder","name":"Garlic powder","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp garlic powder"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"black-beans","name":"Black beans","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can black beans or kidney beans, drained and rinsed"},{"key":"corn","name":"Corn (frozen or canned)","aisle":"Frozen","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup frozen corn"},{"key":"cheese","name":"Tasty cheese","aisle":"Dairy, eggs & chilled","qty":100.0,"unit":"g","optional":false,"raw":"100 g grated tasty cheese"},{"key":"tortillas","name":"Tortillas or wraps","aisle":"Bread & wraps","qty":8.0,"unit":"","optional":false,"raw":"8 large tortillas"}],"tags":["beef","mince"],"nutrition":{"kcal":770,"protein":46,"carbs":75,"fat":30,"per":"serving","count":4},"diet":["freezes"],"storage":["Reheat from frozen: unwrap, wrap in a damp paper towel and microwave for 2–3 minutes, turning halfway."]},{"title":"Gnocchi alla Sorrentina","servings":"4","time":"90 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g Desiree or Agria potatoes"},{"text":"220 g high-grade flour (Champion brand)"},{"text":"2 tins crushed and sieved tomatoes"},{"text":"4 tbsp Parmesan cheese"},{"text":"1 small onion, chopped"},{"text":"1 garlic clove, halved"},{"text":"100 g grated mozzarella"},{"text":"Fresh basil leaves"},{"text":"Salt, to taste"},{"text":"Chilli or pepper, to taste"},{"text":"Extra virgin olive oil"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Boil the potatoes:** Place the potatoes (unpeeled) in salted water and boil until cooked through. Drain and keep warm."},{"text":"**Prepare the tomato sauce:** In a large pan, heat ¼ cup of olive oil over low heat. Add the halved garlic and chopped onion, and cook until golden."},{"text":"Add a pinch of chilli or pepper, then pour in the tomatoes. Cover and simmer on low heat for 45 minutes. Uncover for the final 15 minutes to reduce, then stir in fresh basil leaves."},{"text":"**Make the gnocchi dough:** Peel the potatoes and mash them with a ricer or masher onto a floured board. Form a well in the centre and gradually mix in the flour by hand to create a smooth dough ball."},{"text":"Cut off a quarter of the dough and roll it into a long sausage about 1.5 cm thick. Slice into 1 cm pieces to form individual gnocchi."},{"text":"On a floured surface, press each gnocco lightly against a fork to form ridges."},{"text":"**Cook the gnocchi:** Bring 3 L of salted water to a boil. Add the gnocchi; when they float to the surface, they’re ready. Drain gently."},{"text":"Return gnocchi to the pan, add 5 large spoons of tomato sauce and the mozzarella, and mix gently with a wooden spoon without mashing."},{"text":"**To serve:** Spoon onto a hot plate, i-lead with extra sauce, Parmesan, and fresh basil."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**From Wikipedia:** Gnocchi are soft Italian dumplings made from potato, flour, and other regional variations such as ricotta or semolina. Traditionally served as a primo piatto (first course), they can be paired with butter and sage, pesto, or tomato-based sauces. The Tuscan malfatti use ricotta and spinach, while Pugliese cavatielli are flour-based. Nowadays, fresh or packaged gnocchi are available in most supermarkets, both refrigerated and frozen."}]}],"id":"Italian-Gnocchi","file":"Italian/Gnocchi.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["500 g Desiree or Agria potatoes","220 g high-grade flour (Champion brand)","2 tins crushed and sieved tomatoes","4 tbsp Parmesan cheese","1 small onion, chopped","1 garlic clove, halved","100 g grated mozzarella","Fresh basil leaves","Salt, to taste","Chilli or pepper, to taste","Extra virgin olive oil"],"shop":[{"key":"potato","name":"Potatoes","aisle":"Fruit & veg","qty":500.0,"unit":"g","optional":false,"raw":"500 g Desiree or Agria potatoes"},{"key":"bread-flour","name":"High-grade flour","aisle":"Baking","qty":220.0,"unit":"g","optional":false,"raw":"220 g high-grade flour (Champion brand)"},{"key":"tomato","name":"Tomatoes","aisle":"Fruit & veg","qty":2.0,"unit":"can","optional":false,"raw":"2 tins crushed and sieved tomatoes"},{"key":"parmesan","name":"Parmesan","aisle":"Dairy, eggs & chilled","qty":4.0,"unit":"tbsp","optional":false,"raw":"4 tbsp Parmesan cheese"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 small onion, chopped"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":1.0,"unit":"clove","optional":false,"raw":"1 garlic clove, halved"},{"key":"mozzarella","name":"Mozzarella","aisle":"Dairy, eggs & chilled","qty":100.0,"unit":"g","optional":false,"raw":"100 g grated mozzarella"},{"key":"basil","name":"Fresh basil","aisle":"Fruit & veg","qty":null,"unit":"","optional":false,"raw":"Fresh basil leaves"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Salt, to taste"},{"key":"chilli","name":"Fresh chilli","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Chilli or pepper, to taste"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Chilli or pepper, to taste"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Extra virgin olive oil"}],"tags":[],"nutrition":{"kcal":440,"protein":19,"carbs":72,"fat":9,"per":"serving","count":4},"diet":["vegetarian"],"storage":["Nowadays, fresh or packaged gnocchi are available in most supermarkets, both refrigerated and frozen."]},{"title":"Greek-Style Chicken & Chickpea Couscous Bowls","servings":"4","time":"15 min prep + 15–20 min","intro":"Lemony oregano chicken, chickpeas and vegetables over couscous with a yoghurt dressing. Fresh-tasting, fast and barely harder than ordering takeaway. Roughly 42–45 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g chicken breast or tenderloins, cut into strips"},{"text":"1 can chickpeas, drained and rinsed"},{"text":"300 g frozen mixed vegetables"},{"text":"1½ cups dry couscous"},{"text":"1½ cups hot chicken stock or boiling water"},{"text":"2 garlic cloves, crushed"},{"text":"1 tsp dried oregano"},{"text":"1 tsp ground cumin"},{"text":"1 tsp paprika"},{"text":"Juice of 1 lemon"},{"text":"200 g low-fat Greek yoghurt"},{"text":"Salt and pepper"},{"group":"Optional"},{"text":"Cucumber, parsley or crumbled feta"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Season.** Toss the chicken with the oregano, cumin, paprika, salt and pepper."},{"text":"**Cook the chicken.** Cook in a large frying pan with a little oil for 6–8 minutes (4–5 for tenderloins) until browned and cooked through."},{"text":"**Add the rest.** Add the garlic, chickpeas and frozen vegetables. Cook for another 4–5 minutes, letting any extra moisture cook off."},{"text":"**Couscous.** Put the couscous in a bowl, pour over the hot stock, cover and leave for 5 minutes. Fluff with a fork."},{"text":"**Lemon.** Stir half the lemon juice through the chicken. Mix the rest into the yoghurt with a pinch of salt."},{"text":"Divide the couscous and chicken between four bowls and spoon over the yoghurt sauce."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**Advance prep:** defrost the chicken in the fridge. The vegetables work from frozen."},{"text":"Keep the yoghurt sauce separate if packing leftovers, and add it after reheating."}]}],"id":"Stovetop-Greek_Chicken_Chickpea_Couscous","file":"Stovetop/Greek_Chicken_Chickpea_Couscous.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["500 g chicken breast or tenderloins, cut into strips","1 can chickpeas, drained and rinsed","300 g frozen mixed vegetables","1½ cups dry couscous","1½ cups hot chicken stock or boiling water","2 garlic cloves, crushed","1 tsp dried oregano","1 tsp ground cumin","1 tsp paprika","Juice of 1 lemon","200 g low-fat Greek yoghurt","Salt and pepper","Cucumber, parsley or crumbled feta"],"shop":[{"key":"chicken-breast","name":"Chicken breast or tenderloins","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g chicken breast or tenderloins, cut into strips"},{"key":"chickpeas","name":"Chickpeas","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can chickpeas, drained and rinsed"},{"key":"frozen-mixed-veg","name":"Frozen mixed vegetables","aisle":"Frozen","qty":300.0,"unit":"g","optional":false,"raw":"300 g frozen mixed vegetables"},{"key":"couscous","name":"Couscous","aisle":"Pasta, rice & grains","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups dry couscous"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups hot chicken stock or boiling water"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":2.0,"unit":"clove","optional":false,"raw":"2 garlic cloves, crushed"},{"key":"oregano","name":"Dried oregano","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried oregano"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp ground cumin"},{"key":"paprika","name":"Paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp paprika"},{"key":"lemon","name":"Lemons","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"Juice of 1 lemon"},{"key":"greek-yoghurt","name":"Greek yoghurt","aisle":"Dairy, eggs & chilled","qty":200.0,"unit":"g","optional":false,"raw":"200 g low-fat Greek yoghurt"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and pepper"},{"key":"cucumber","name":"Cucumber","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Cucumber, parsley or crumbled feta"},{"key":"parsley","name":"Fresh parsley","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Cucumber, parsley or crumbled feta"},{"key":"feta","name":"Feta","aisle":"Dairy, eggs & chilled","qty":null,"unit":"","optional":true,"raw":"Cucumber, parsley or crumbled feta"}],"tags":["chicken"],"nutrition":{"kcal":570,"protein":49,"carbs":71,"fat":8,"per":"serving","count":4},"diet":[],"storage":["Keep the yoghurt sauce separate if packing leftovers, and add it after reheating."]},{"title":"Homemade Burgers & Fries","servings":"2","time":"40 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g lean beef mince"},{"text":"1 onion, finely chopped"},{"text":"1 egg"},{"text":"½ cup breadcrumbs (or oats)"},{"text":"1 tbsp Worcestershire Sauce"},{"text":"1 tbsp Ketchup"},{"text":"Salt, pepper"},{"text":"4-6 burger buns"},{"text":"Lettuce, tomato, cheese, gherkins, red onion"},{"text":"2 medium sweet potatoes, cut into wedges"},{"text":"Olive oil spray"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 200°C. Toss wedges with olive oil, bake 25–30 min."},{"text":"To a large bowl, add the beef mince, onion, egg, breadcrumbs, Worcestershire sauce, ketchup, salt and pepper. Use your hands to combine well."},{"text":"Divide the mixture into 4–6 portions, then use your hands to form patties. Their size ideally needs to be just bigger than the burger buns you are using as the patties will shrink slightly as they cook."},{"text":"Use your thumb to make an indent in one side of the patty. This helps the patties keep their shape during cooking."},{"text":"Heat the olive oil in a heavy-based frying pan over medium–high heat. Cook the burger patties for 10–12 minutes, turning once halfway through."},{"text":"Add the water to the pan in the last 2 minutes of cooking. This step is optional, it allows you to scrape up all of the delicious sticky bits in the base of the pan and they cling to the outside of the patties = more flavour!"},{"text":"Serve the buns topped with burger patties, cheese, tomato, red onion, gherkins, lettuce, mayonnaise, ketchup and mustard. Serve with fries."}]},{"kind":"text","heading":null,"text":"**Source:** https://simplehomeedit.com/recipe/homemade-beef-burger/Juicy Homemade Beef Burgers"},{"kind":"notes","heading":"Notes","items":[{"text":"For a delicious chargrilled result, you can cook the patties in a chargrill pan or cook them on a barbecue plate. Heat the plate to medium–high, spray the plate with oil just before cooking and cook the patties for 10–12 minutes, turning once halfway."}]}],"id":"Stovetop-Homemade_Burgers_and_Fries","file":"Stovetop/Homemade_Burgers_and_Fries.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["500 g lean beef mince","1 onion, finely chopped","1 egg","½ cup breadcrumbs (or oats)","1 tbsp Worcestershire Sauce","1 tbsp Ketchup","Salt, pepper","4-6 burger buns","Lettuce, tomato, cheese, gherkins, red onion","2 medium sweet potatoes, cut into wed t","heading":null,"text":"**Source:** https://www.bbcgoodfood.com/recipes/bibimbapBBC Good Food – Bibimbap"}],"id":"Stovetop-Korean_Bibimbap","file":"Stovetop/Korean_Bibimbap.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["2 cups cooked rice","200 g sliced beef or chicken (or tofu)","2 cups assorted veg (spinach, carrot, mushrooms, courgette)","2 eggs","2 tbsp soy sauce, 1 tsp sugar, 1 tsp sesame oil","Gochujang (Korean chilli paste) to serve"],"shop":[{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":0.75,"unit":"cup","optional":false,"raw":"2 cups cooked rice"},{"key":"chicken","name":"Chicken","aisle":"Meat & fish","qty":200.0,"unit":"g","optional":false,"raw":"200 g sliced beef or chicken (or tofu)"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups assorted veg (spinach, carrot, mushrooms, courgette)"},{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":2.0,"unit":"","optional":false,"raw":"2 eggs"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp soy sauce, 1 tsp sugar, 1 tsp sesame oil"},{"key":"chilli","name":"Fresh chilli","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Gochujang (Korean chilli paste) to serve"}],"tags":["beef","chicken"],"nutrition":{"kcal":410,"protein":28,"carbs":55,"fat":9,"per":"serving","count":2.5},"diet":["dairy-free","leftovers"],"storage":[]},{"title":"Korean-Style Steak Bowl","servings":"2","time":"40 min","intro":"Soy-garlic-sesame rump steak over rice with a big pile of stir-fried cabbage, carrot and onion, topped with a fried egg. Bold flavour, cheap, and high in veg.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"400 g rump steak"},{"text":"3 tbsp soy sauce"},{"text":"3 garlic cloves, minced"},{"text":"1 tbsp sesame oil (half for marinade, half to finish)"},{"text":"1 tbsp brown sugar"},{"text":"1 tsp grated ginger"},{"text":"2 cups shredded cabbage"},{"text":"2 carrots, grated (half stir-fried, half raw)"},{"text":"1 onion, sliced"},{"text":"1 cup bean sprouts (optional)"},{"text":"1 ¼ cups cooked rice (small portion)"},{"text":"2 eggs"},{"text":"2 spring onions, sliced"},{"text":"1 tsp sesame seeds"},{"text":"1 tbsp vegetable oil"},{"text":"½ tsp chilli flakes (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Marinate.** Slice the steak thinly against the grain. Toss with soy sauce, garlic, brown sugar, ginger and half the sesame oil. Leave for 10–15 minutes while you prep the veg."},{"text":"**Prep.** Shred the cabbage, grate the carrots, slice the onion and spring onions. Cook the rice if needed and keep warm."},{"text":"**Cook the veg first.** Heat half the vegetable oil in a pan or wok over high heat. Stir-fry the onion, cabbage and half the carrot, uncovered, for 3–4 minutes until just wilted. Let the water they release cook off before moving on. Tip out any pooled liquid, then remove the veg to a bowl."},{"text":"**Sear the steak.** Wipe the pan and heat the remaining oil until smoking. Lift the steak from the marinade, letting excess drip off, and sear in batches in a single layer, 60–90 seconds one side and 30–60 seconds the other. Don't crowd the pan."},{"text":"**Combine.** Return the veg to the pan with the steak for 30 seconds to heat through. Toss through the bean sprouts, if using, right at the end."},{"text":"**Eggs.** Fry the eggs in a separate pan, aiming for a runny yolk."},{"text":"**Assemble.** Divide the rice between bowls. Top with the steak and veg mix, the remaining raw carrot and a fried egg. Drizzle with the remaining sesame oil and scatter over spring onion, sesame seeds and chilli flakes."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Cabbage and carrot release a lot of water. Cooking them first in a hot, uncrowded, uncovered pan and letting the liquid evaporate keeps the stir-fry from turning into a stew."},{"text":"Searing the steak in batches with the marinade drained off gives a proper sear rather than steaming it."},{"text":"Cucumber was dropped on price. Raw carrot and bean sprouts cover the fresh crunch."},{"text":"A small drizzle of gochujang at the end is a cheap flavour lift if you have it."}]}],"id":"Stovetop-Korean_Steak_Bowl","file":"Stovetop/Korean_Steak_Bowl.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["400 g rump steak","3 tbsp soy sauce","3 garlic cloves, minced","1 tbsp sesame oil (half for marinade, half to finish)","1 tbsp brown sugar","1 tsp grated ginger","2 cups shredded cabbage","2 carrots, grated (half stir-fried, half raw)","1 onion, sliced","1 cup bean sprouts (optional)","1 ¼ cups cooked rice (small portion)","2 eggs","2 spring onions, sliced","1 tsp sesame seeds","1 tbsp vegetable oil","½ tsp chilli flakes (optional)"],"shop":[{"key":"steak","name":"Beef steak (rump or topside)","aisle":"Meat & fish","qty":400.0,"unit":"g","optional":false,"raw":"400 g rump steak"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp soy sauce"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, minced"},{"key":"sesame-oil","name":"Sesame oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp sesame oil (half for marinade, half to finish)"},{"key":"brown-sugar","name":"Brown sugar","aisle":"Baking","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp brown sugar"},{"key":"ginger","name":"Fresh ginger","aisle":"Fruit & veg","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp grated ginger"},{"key":"cabbage","name":"Cabbage","aisle":"Fruit & veg","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups shredded cabbage"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 carrots, grated (half stir-fried, half raw)"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, sliced"},{"key":"bean-sprouts","name":"Bean sprouts","aisle":"Fruit & veg","qty":1.0,"unit":"cup","optional":true,"raw":"1 cup bean sprouts (optional)"},{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":0.5,"unit":"cup","optional":false,"raw":"1 ¼ cups cooked rice (small portion)"},{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":2.0,"unit":"","optional":false,"raw":"2 eggs"},{"key":"spring-onion","name":"Spring onions","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 spring onions, sliced"},{"key":"sesame-seeds","name":"Sesame or poppy seeds","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp sesame seeds"},{"key":"oil","name":"Cooking oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp vegetable oil"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":true,"raw":"½ tsp chilli flakes (optional)"}],"tags":["beef"],"nutrition":{"kcal":800,"protein":60,"carbs":72,"fat":30,"per":"serving","count":2},"diet":["dairy-free","leftovers"],"storage":[]},{"title":"Lean Sausage Ragu with Brown Rice","servings":"4","time":"45 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"6 beef or pork sausages"},{"text":"1 red onion, diced"},{"text":"1 medium carrot, grated"},{"text":"400 g tinned diced tomatoes"},{"text":"125 ml red wine"},{"text":"150 ml beef stock (or chicken stock if using pork sausages)"},{"text":"4 garlic cloves, minced"},{"text":"2 tbsp tomato paste"},{"text":"1 tsp dried thyme (or dried oregano if using pork sausages)"},{"text":"1 tsp fennel seeds"},{"text":"½ tsp chilli flakes (optional)"},{"text":"Salt and black pepper, to taste"},{"text":"300 g frozen mixed vegetables"},{"text":"1 large handful frozen spinach"},{"text":"150 g brown rice, to serve"}]},{"kind":"steps","heading":"Method","items":[{"text":"Squeeze the sausage meat out of the casings and discard the skins. Heat a large pan over high heat with a little oil and brown the meat, breaking it up as you go, until well coloured (about 5 min)."},{"text":"Reduce heat to medium. Add the red onion and grated carrot and cook for 3–4 min until softened."},{"text":"Add the garlic, tomato paste, thyme (or oregano), fennel seeds, and chilli flakes. Stir and cook for 1 min until fragrant."},{"text":"Pour in the red wine and scrape up any browned bits. Let it bubble and reduce by half (about 2 min)."},{"text":"Add the tomatoes and stock. Stir to combine, season, and bring to a boil."},{"text":"Reduce heat to low and simmer uncovered for 20 min, stirring occasionally, until the sauce is thickening nicely."},{"text":"Stir in the frozen mixed vegetables and cook for 5 min, then add the frozen spinach (no need to thaw) and cook a further 3–5 min until wilted and the sauce is thick and rich."},{"text":"Meanwhile, cook the brown rice according to the packet instructions."},{"text":"Spoon the ragu over a modest portion of rice and serve."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Pasta is replaced with extra veg and a small side of rice to keep calorie density down — aim for roughly ⅓–½ cup cooked rice per serve. Frozen spinach releases water, so simmer a couple of extra minutes uncovered if the sauce looks loose. Beef stock gives a noticeably richer sauce than chicken stock. Fennel seeds can go in whole or lightly crushed for a stronger flavour. Keeps 3–4 days in the fridge and freezes well."}]}],"id":"Stovetop-Sausage_Ragu_Lean","file":"Stovetop/Sausage_Ragu_Lean.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["6 beef or pork sausages","1 red onion, diced","1 medium carrot, grated","400 g tinned diced tomatoes","125 ml red wine","150 ml beef stock (or chicken stock if using pork sausages)","4 lt and black pepper, to taste"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper, to taste"},{"key":"frozen-mixed-veg","name":"Frozen mixed vegetables","aisle":"Frozen","qty":300.0,"unit":"g","optional":false,"raw":"300 g frozen mixed vegetables"},{"key":"frozen-spinach","name":"Frozen spinach","aisle":"Frozen","qty":1.0,"unit":"","optional":false,"raw":"1 large handful frozen spinach"},{"key":"brown-rice","name":"Brown rice","aisle":"Pasta, rice & grains","qty":150.0,"unit":"g","optional":true,"raw":"150 g brown rice, to serve"}],"tags":["beef","pork"],"nutrition":{"kcal":420,"protein":19,"carbs":29,"fat":23,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":["Keeps 3–4 days in the fridge and freezes well."]},{"title":"Mapo Tofu with Pork Mince","servings":"4","time":"10 min prep + 15 min","intro":"The Sichuan classic: soft tofu and pork in a spicy, savoury chilli-bean sauce. The tofu does a lot of the protein work, so it uses less pork. Roughly 37–40 g protein per serve with rice.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"300 g pork mince"},{"text":"2 blocks (about 600 g) firm or medium tofu, cut into 2 cm cubes"},{"text":"2 tbsp chilli bean paste (doubanjiang)"},{"text":"3 garlic cloves, crushed"},{"text":"1 tbsp grated ginger"},{"text":"1 cup chicken stock"},{"text":"1 tbsp soy sauce"},{"text":"1 tsp sugar"},{"text":"1 tbsp cornflour mixed with 2 tbsp cold water"},{"text":"200 g frozen peas or 2 heads bok choy"},{"text":"½ tsp ground Sichuan pepper (optional)"},{"text":"Spring onion, sliced"},{"text":"1¼ cups dry rice, to serve"}]},{"kind":"steps","heading":"Method","items":[{"text":"Cook the rice."},{"text":"Fry the pork in a wok over high heat until browned and a little crispy."},{"text":"Add the chilli bean paste, garlic and ginger and fry for 1 minute until the oil turns red."},{"text":"Add the stock, soy and sugar and bring to a simmer. Gently slide in the tofu and peas and simmer for 4–5 minutes — push the tofu around gently rather than stirring so it doesn't break up."},{"text":"Stir in the cornflour mixture and simmer for 1 minute until glossy and thick."},{"text":"Sprinkle with Sichuan pepper and spring onion and serve over rice."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Chilli bean paste (doubanjiang) is at Asian supermarkets. At a pinch, use 1 tbsp gochujang plus 1 tbsp soy sauce."},{"text":"Medium tofu is more traditional and silky; firm tofu holds together better."}]}],"id":"Stovetop-Mapo_Tofu_Pork","file":"Stovetop/Mapo_Tofu_Pork.tex","chapter":"stovetop","chapterName":"Stovetop","group":null,"ingredients":["300 g pork mince","2 blocks (about 600 g) firm or medium tofu, cut into 2 cm cubes","2 tbsp chilli bean paste (doubanjiang)","3 garlic cloves, crushed","1 tbsp grated ginger","1 cup chicken stock","1 tbsp soy sauce","1 tsp sugar","1 tbsp cornflour mixed with 2 tbsp cold water","200 g frozen peas or 2 heads bok choy","½ tsp ground Sichuan pepper (optional)","Spring onion, sliced","1¼ cups dry rice, to serve"],"shop":[{"key":"pork-mince","name":"Pork mince","aisle":"Meat & fish","qty":300.0,"unit":"g","optional":false,"raw":"300 g pork mince"},{"key":"doubanjiang","name":"Chilli bean paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp chilli bean paste (doubanjiang)"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, crushed"},{"key":"ginger","name":"Fresh ginger","aisle":"Fruit & veg","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp grated ginger"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup chicken stock"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp soy sauce"},{"key":"sugar","name":"White sugar","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp sugar"},{"key":"cornflour","name":"Cornflour","aisle":"Baking","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp cornflour mixed with 2 tbsp cold water"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":200.0,"unit":"g","optional":false,"raw":"200 g frozen peas or 2 heads bok choy"},{"key":"sichuan-pepper","name":"Sichuan pepper","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":true,"raw":"½ tsp ground Sichuan pepper (optional)"},{"key":"spring-onion","name":"Spring onions","aisle":"Fruit & veg","qty":null,"unit":"","optional":false,"raw":"Spring onion, sliced"},{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":1.25,"unit":"cup","optional":true,"raw":"1¼ cups dry rice, to serve"}],"tags":["pork","mince"],"nutrition":{"kcal":240,"protein":18,"carbs":13,"fat":13,"per":"serving","count":4},"diet":["dairy-free","quick"],"storage":[]},{"title":"Old School Beef Tacos","servings":"4","time":"30 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 tbsp oil"},{"text":"2 garlic cloves, minced"},{"text":"1 onion, finely chopped"},{"text":"500 g beef mince"},{"text":"2 tbsp tomato paste"},{"text":"¼ cup (65 ml) water"}]},{"kind":"list","heading":"Homemade Taco Seasoning","items":[{"text":"1 tsp garlic powder"},{"text":"1 tsp onion powder"},{"text":"1 tsp dried oregano"},{"text":"2 tsp cumin powder"},{"text":"2 tsp paprika"},{"text":"¼ tsp cayenne pepper (optional, adjust to taste)"},{"text":"1 tsp salt"},{"text":"¼ tsp black pepper"}]},{"kind":"list","heading":"Toppings","items":[{"text":"10–12 crispy taco shells or soft tortillas"},{"text":"Shredded cheese (cheddar, tasty, or Monterey Jack if available)"},{"text":"Shredded iceberg lettuce"},{"text":"2 tomatoes, chopped"},{"text":"½ red or white onion, chopped"},{"text":"Taco sauce or salsa (optional)"},{"text":"Fresh coriander, jalapeños, or hot sauce
