lentils"}]},{"kind":"list","heading":"Vegetables (Frozen, Budget-Optimised)","items":[{"text":"600 g frozen mixed vegetables"},{"text":"300 g frozen broccoli & cauliflower mix"},{"text":"1 large onion, diced"},{"text":"3 garlic cloves, minced"}]},{"kind":"list","heading":"Tomato Base","items":[{"text":"2 cans (400 g) crushed tomatoes"},{"text":"3 tbsp tomato paste"},{"text":"1 cup water"}]},{"kind":"list","heading":"Seasoning","items":[{"text":"2 tbsp Italian herbs"},{"text":"1½ tsp salt"},{"text":"1 tsp black pepper"}]},{"kind":"steps","heading":"Method","items":[{"text":"Set the Instant Pot to **Sauté**. Cook the onion and garlic for 2–3 minutes until softened."},{"text":"If using beef mince, add it now and brown lightly. (Skip this step if using lentils only.)"},{"text":"Add lentils (if using), frozen vegetables, crushed tomatoes, tomato paste, water, herbs, salt, and pepper."},{"text":"Stir well, scraping the bottom of the pot to prevent sticking."},{"text":"Secure the lid with the valve sealed and cook on **High Pressure** for 15 minutes."},{"text":"Allow a **Natural Pressure Release** for 10 minutes, then vent remaining pressure."},{"text":"Stir thoroughly. Adjust thickness as required:","sub":["If too thick: add water","If too thin: use **Sauté** mode for 5 minutes, lid off"]}]},{"kind":"list","heading":"Pasta Prep (Cook Fresh)","items":[{"text":"600 g dry pasta (total for the week)"},{"text":"Cook per meal to prevent over-softening"}]},{"kind":"list","heading":"Portioning & Storage","items":[{"text":"Portion sauce into 6 containers"},{"text":"Refrigerate up to 4 days or freeze individual portions"}]},{"kind":"list","heading":"How to Eat It","items":[{"text":"**Lunch:** Sauce with 75–90 g dry pasta, plus extra vegetables if desired"},{"text":"**Dinner:** Sauce with 50–75 g dry pasta, plus a large vegetable portion"}]},{"kind":"list","heading":"Notes","items":[{"text":"Frozen vegetables reduce cost, waste, and prep time while maintaining volume."},{"text":"Lentils soften completely and blend into the sauce, increasing protein and fibre."},{"text":"This sauce freezes well without texture loss."},{"text":"Lower pasta portions at dinner support lighter digestion and improved sleep."}]}],"id":"InstantPot-High_Protein_Pasta_Sauce","file":"InstantPot/High_Protein_Pasta_Sauce.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["800 g lean beef mince (budget meat option)","600 g lean beef mince + 1 cup dried red lentils (budget extender)","2½ cups dried red lentils","600 g frozen mixed vegetables","300 g frozen broccoli & cauliflower mix","1 large onion, diced","3 garlic cloves, minced","2 cans (400 g) crushed tomatoes","3 tbsp tomato paste","1 cup water","2 tbsp Italian herbs","1½ tsp salt","1 tsp black pepper"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":800.0,"unit":"g","optional":false,"raw":"800 g lean beef mince (budget meat option)"},{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":600.0,"unit":"g","optional":false,"raw":"600 g lean beef mince + 1 cup dried red lentils (budget extender)"},{"key":"red-lentils","name":"Red lentils (dry)","aisle":"Cans, jars & pulses","qty":2.5,"unit":"cup","optional":false,"raw":"2½ cups dried red lentils"},{"key":"frozen-mixed-veg","name":"Frozen mixed vegetables","aisle":"Frozen","qty":600.0,"unit":"g","optional":false,"raw":"600 g frozen mixed vegetables"},{"key":"frozen-broccoli-cauli","name":"Frozen broccoli & cauliflower","aisle":"Frozen","qty":300.0,"unit":"g","optional":false,"raw":"300 g frozen broccoli & cauliflower mix"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 large onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, minced"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":2.0,"unit":"can","optional":false flower mix, higher fibre, slightly firmer texture"},{"text":"Garden peas, optional for added bulk and mild sweetness"},{"text":"Frozen spinach, optional; use as a nutrient boost rather than bulk"}]},{"kind":"steps","heading":"Method","items":[{"text":"Add the lentils, onion, garlic, curry powder, and ground cumin to the Instant Pot."},{"text":"Add the canned tomatoes, coconut milk, water, and salt."},{"text":"Stir well to combine, ensuring lentils are fully submerged."},{"text":"Secure the lid with the valve sealed and cook on **High Pressure** for 12 minutes."},{"text":"Allow a **Natural Pressure Release** for 10 minutes, then vent remaining pressure."},{"text":"Open the lid and stir thoroughly; the lentils will thicken rapidly."},{"text":"Stir in frozen vegetables."},{"text":"Select **Sauté** mode and cook for 5–7 minutes until vegetables are heated through."},{"text":"Adjust thickness with additional water if required."}]},{"kind":"list","heading":"Portioning & Storage","items":[{"text":"All 6 servings: refrigerate"},{"text":"Best consumed within 4 days"},{"text":"Thickens further after chilling; thin with water when reheating"}]},{"kind":"list","heading":"Rice","items":[{"text":"2½ cups dry rice"},{"text":"Makes about 7 cups cooked"}]},{"kind":"list","heading":"Vegetables","items":[{"text":"No additional vegetables required; curry is designed as a one-pot meal"},{"text":"Optional: extra steamed frozen veg for larger portions"}]},{"kind":"list","heading":"Serving Ideas","items":[{"text":"**Lunch:** Lentil coconut curry, ¾ cup rice"},{"text":"**Dinner:** Lentil coconut curry, ½ cup rice, extra vegetables if desired"}]},{"kind":"list","heading":"Notes","items":[{"text":"Frozen pumpkin or diced potatoes (2–3 cups) may be added for extra bulk without changing cook time."},{"text":"Full-fat coconut milk can be used for richer flavour if budget allows."},{"text":"This curry freezes well; texture will be thicker after thawing."}]}],"id":"InstantPot-Lentil_Coconut_Curry" en_and_Sugar_Snap_Peas_with_Noodles.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["570 g chicken tenderloins, cubed","3 tbsp cornflour","2 tbsp teriyaki sauce","2 tsp fresh garlic, minced","¼ tsp crushed red pepper","1 tsp dark sesame oil","2 cups chicken stock","¼ cup peanut butter","2½ cups sugar snap peas, trimmed","1 cup carrots, julienned","340 g spaghetti","½ cup green onion, sliced","¼ cup unsalted roasted peanuts, chopped","Lime wedges, for serving"],"shop":[{"key":"chicken-breast","name":"Chicken breast or tenderloins","aisle":"Meat & fish","qty":570.0,"unit":"g","optional":false,"raw":"570 g chicken tenderloins, cubed"},{"key":"cornflour","name":"Cornflour","aisle":"Baking","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp cornflour"},{"key":"teriyaki-sauce","name":"Teriyaki sauce","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp teriyaki sauce"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":2.0,"unit":"tsp","optional":false,"raw":"2 tsp fresh garlic, minced"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":0.25,"unit":"tsp","optional":false,"raw":"¼ tsp crushed red pepper"},{"key":"sesame-oil","name":"Sesame oil","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dark sesame oil"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups chicken stock"},{"key":"peanut-butter","name":"Peanut butter","aisle":"Pantry: check first","qty":0.25,"unit":"cup","optional":false,"raw":"¼ cup peanut butter"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":2.5,"unit":"cup","optional":false,"raw":"2½ cups sugar snap peas, trimmed"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup carrots, julienned"},{"key":"spaghetti","name":"Spaghetti","aisle":"Pasta, rice & grains","qty":340.0,"unit":"g","optional":false,"raw":"340 g spaghetti"},{"key":"spring-onion","name":"Spring onions","aisle":"Fruit & veg","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup green onion, sliced"},{"key":"peanuts","name":"Peanuts","aisle":"Pantry: check first","qty":0.25,"unit":"cup","optional":false,"raw":"¼ cup unsalted roasted peanuts, chopped"},{"key":"lime","name":"Limes","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Lime wedges, for serving"}],"tags":["chicken"],"nutrition":{"kcal":500,"protein":38,"carbs":59,"fat":12,"per":"serving","count":6},"diet":["dairy-free"],"storage":[]},{"title":"Pork Mince Congee with Edamame","servings":"4","time":"10 min prep + 50 min","intro":"Comforting Chinese-style rice porridge with gingery pork, edamame and a soft egg on top. Roughly 38–41 g protein per serve with the egg.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Pork"},{"text":"500 g pork mince"},{"text":"1 tbsp soy sauce"},{"text":"1 tsp cornflour"},{"text":"½ tsp white pepper"},{"group":"Congee"},{"text":"¾ cup jasmine rice, rinsed"},{"text":"6 cups chicken stock (or water plus stock powder)"},{"text":"1 tbsp grated ginger"},{"text":"2 garlic cloves, crushed"},{"text":"300 g frozen shelled edamame"},{"group":"To serve"},{"text":"4 soft-boiled eggs (optional)"},{"text":"Spring onion, soy sauce, sesame oil, chilli crisp"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Season the pork.** Mix the pork with the soy sauce, cornflour and white pepper."},{"text":"**Brown the pork.** Select Sauté and cook the pork, breaking it up, until browned and cooked through. Remove to a bowl."},{"text":"**Deglaze.** Add a splash of the stock and scrape the base clean. Add the rice, the rest of the stock, ginger and garlic."},{"text":"**Pressure cook.** Lid on, valve sealed. Cook on High (or Porridge) for **20 minutes**, then let the pressure release **fully naturally** — don't quick release, it will spray."},{"text":"**Finish.** Stir well (it thickens as you stir). Add the pork and edamame and use Sauté for 3–5 minutes until hot."},{"text":"Ladle into bowls and top with a halved egg, spring onion, a dash of soy and sesame oil, and chilli crisp."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Don't fill the pot more than half full — rice porridge foams under pressure."},{"text":"Congee thickens to a solid in the fridge; reheat with plenty of water."}]}],"id":"InstantPot-Pork_Congee_Edamame","file":"InstantPot/Pork_Congee_Edamame.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["500 g pork mince","1 tbsp soy sauce","1 tsp cornflour","½ tsp white pepper","¾ cup jasmine rice, rinsed","6 cups chicken stock (or water plus stock powder)","1 tbsp grated ginger","2 garlic cloves, crushed","300 g frozen shelled edamame","4 soft-boiled eggs (optional)","Spring onion, soy sauce, sesame oil, chilli crisp"],"shop":[{"key":"pork-mince","name":"Pork mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g pork mince"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp soy sauce"},{"key":"cornflour","name":"Cornflour","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp cornflour"},{"key":"white-pepper","name":"White pepper","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp white pepper"},{"key":"jasmine-rice","name":"Jasmine rice","aisle":"Pasta, rice & grains","qty":0.75,"unit":"cup","optional":false,"raw":"¾ cup jasmine rice, rinsed"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":6.0,"unit":"cup","optional":false,"raw":"6 cups chicken stock (or water plus stock powder)"},{"key":"ginger","name":"Fresh ginger","aisle":"Fruit & veg","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp grated ginger"},{"key":"garlic","name":"Garlic","aisl ice, to serve"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Brown the pork.** Select Sauté and brown the pork mince with the onion, breaking it up."},{"text":"**Deglaze.** Pour in the water and scrape the base clean."},{"text":"**Add the veg.** Add the carrots, potatoes and apple. Do **not** add the roux yet."},{"text":"**Pressure cook.** Lid on, valve sealed. Cook on High for **5 minutes**, then a **5-minute natural release**, then release the rest."},{"text":"**Add the roux.** Press Cancel. Stir in the roux pieces until fully dissolved."},{"text":"**Thicken.** Select Sauté, add the edamame, and simmer for 3–5 minutes, stirring, until thick and glossy."},{"text":"Serve over rice."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Curry roux is in the Asian aisle at most supermarkets. Mild, medium and hot are all available."},{"text":"The roux is thick and starchy — adding it before pressure cooking almost guarantees a burn warning."},{"text":"Thickens a lot in the fridge; add water when reheating."}]}],"id":"InstantPot-Pork_Japanese_Curry","file":"InstantPot/Pork_Japanese_Curry.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["500 g pork mince","1 onion, cut into wedges","2 carrots, cut into chunks","2 medium potatoes, cut into 3 cm chunks","1 apple, grated (optional — traditional sweetness)","2½ cups water","½ box (about 100 g) Japanese curry roux, e.g. Golden Curry, broken up","250 g frozen shelled edamame or peas","1¼ cups dry rice, to serve"],"shop":[{"key":"pork-mince","name":"Pork mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g pork mince"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, cut into wedges"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 carrots, cut into chunks"},{"key":"potato","name":"Potatoes","aisle":"Fruit & veg","qty":2.0,"unit  grated","700–800 g frozen vegetables","¼ cup water","2 cups jasmine or basmati rice (dry)","4 cups water","½ tsp salt"],"shop":[{"key":"chicken-thigh","name":"Chicken thighs","aisle":"Meat & fish","qty":800.0,"unit":"g","optional":false,"raw":"800 g chicken thighs (boneless)"},{"key":"edamame","name":"Frozen edamame","aisle":"Frozen","qty":225.0,"unit":"g","optional":false,"raw":"225 g frozen shelled edamame (half of a 454 g bag)"},{"key":"teriyaki-sauce","name":"Teriyaki sauce","aisle":"Pantry: check first","qty":0.75,"unit":"cup","optional":false,"raw":"¾ cup teriyaki sauce"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp soy sauce"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp honey or brown sugar"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, minced"},{"key":"ginger","name":"Fresh ginger","aisle":"Fruit & veg","qty":1.0,"unit":"tsp","optional":true,"raw":"1 tsp ginger (optional), grated"},{"key":"frozen-mixed-veg","name":"Frozen mixed vegetables","aisle":"Frozen","qty":800.0,"unit":"g","optional":false,"raw":"700–800 g frozen vegetables"},{"key":"basmati-rice","name":"Basmati rice","aisle":"Pasta, rice & grains","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups jasmine or basmati rice (dry)"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp salt"}],"tags":["chicken"],"nutrition":{"kcal":590,"protein":41,"carbs":76,"fat":14,"per":"serving","count":6},"diet":["freezes","dairy-free","quick"],"storage":["Refrigerate for up to 4 days","Freezes well for up to 3 months"]},{"title":"Thai Peanut Chicken","servings":"4","time":"30 min (pressure cooker)","intro":"Fast enough for a weeknight, no delay-timer food-safety worries, and the short cook keeps the breast tender. The rich, thick ingredients go in after pressure cooking to avoid the dreaded “burn” warning. Uses 400 g chicken bulked out with a tin of chickpeas.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Pressure-cook base"},{"text":"400 g chicken breast, diced into 2–3 cm cubes"},{"text":"1 onion, thinly sliced"},{"text":"3 garlic cloves, crushed"},{"text":"1 tbsp grated ginger (or 1–2 tsp jar ginger)"},{"text":"½ cup water or chicken stock"},{"text":"3 tbsp soy sauce"},{"text":"1 tbsp fish sauce"},{"text":"1½ tsp red curry paste"},{"group":"Stir in after pressure cooking"},{"text":"1 can coconut cream"},{"text":"¼ cup peanut butter"},{"text":"2 tbsp sweet chilli sauce"},{"text":"1 tbsp brown sugar or honey"},{"text":"1 can chickpeas, drained & rinsed"},{"text":"2 cups frozen stir-fry vegetables"},{"group":"To finish"},{"text":"2 tbsp peanut butter"},{"text":"1½ tbsp lime or lemon juice"},{"text":"1 tsp toasted sesame oil or rice vinegar (optional)"},{"text":"1 tbsp cornflour + 2 tbsp cold water, for slurry (optional)"},{"group":"To serve"},{"text":"Rice, crushed peanuts, fresh coriander, extra lime"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Sweat the aromatics (optional, worth it).** Set the pot to Sauté, add a splash of oil, and soften the onion, garlic and ginger for 2–3 minutes. Hit Cancel."},{"text":"**Build the base.** Add the chicken, water/stock, soy sauce, fish sauce and curry paste; stir. This is a thin liquid on purpose — it comes to pressure cleanly and won't burn. Make sure nothing thick is stuck to the base."},{"text":"**Pressure cook.** Lid on, valve sealed. Pressure Cook / Manual on High for **5 minutes** ( 10 min to come to pressure first). When it beeps, **quick-release** straight away so the chicken stops cooking."},{"text":"**Stir in sauce & bulk.** Switch to Sauté (low). Stir in the coconut cream, ¼ cup peanut butter, sweet chilli and sugar until smooth, then add the chickpeas and frozen veg. Simmer 4–5 minutes until the veg is tender and everything's hot."},{"text":"**Finish.** Heat off. Stir in the remaining 2 tbsp peanut butter and the lime juice (plus sesame oil/vinegar if using). If thin, stir in the cornflour slurry and bubble a minute on Sauté to thicken."},{"text":"**Taste & adjust.** Bland → more soy or fish sauce. Too rich → more lime. Sweeter → sweet chilli or honey. More heat → chilli flakes or sriracha."},{"text":"**Serve** over rice, topped with crushed peanuts, coriander and a squeeze of lime."}]},{"kind":"variation","heading":"Slow cooker version","text":"No burn risk here, so most of it goes in together. Put the sliced onion in the base and lay the chicken on top — keep the breasts whole or in big chunks rather than diced so they don't dry out. Pour over everything except the finishing peanut butter and lime. Slow Cook on Low for 3–4 hours if you're around (up to 6–8 if you're out all day — keep the chicken submerged and shred-and-return it the moment you're home so it drinks the moisture back up). Stir the chickpeas and frozen veg in for the last 20–30 minutes, then stir the finishing peanut butter and lime in off the heat. Avoid the delay-start timer with raw chicken — use a shorter cook that drops to Keep Warm instead.","sections":[]},{"kind":"notes","heading":"Notes","items":[{"text":"**The golden rule:** keep coconut cream, peanut butter, sweet chilli and sugar out of the pot during pressure cooking — they scorch on the base and trigger the burn error. Thin in first, thick in after."},{"text":"**Don't overcook:** 5 minutes high pressure is plenty for 2–3 cm cubes; longer makes breast rubbery. Quick-release to stop it dead."},{"text":"**Split the peanut butter** (most in the sauce, a little fresh at the end) to keep the flavour bright and nutty rather than flat."},{"text":"**Spinach**, if using, goes in right at the end — it only needs the residual heat."}]}],"id":"InstantPot-Thai_Peanut_Chicken","file":"InstantPot/Thai_Peanut_Chicken.tex","chapter":"pressure","chapterName":"Instant Pot & Pressure Cooker","group":null,"ingredients":["400 g chicken breast, diced into 2–3 cm cubes","1 onion, thinly sliced","3 garlic cloves, crushed","1 tbsp grated ginger (or 1–2 tsp jar ginger)","½ cup water or chicken stock","3 tbsp soy sauce","1 tbsp fish sauce","1½ tsp red curry paste","1 can coconut cream","¼ cup peanut butter","2 tbsp sweet chilli sauce","1 tbsp brown sugar or honey","1 can chickpeas, drained & rinsed","2 cups frozen stir-fry vegetables","2 tbsp peanut butter","1½ tbsp lime or lemon juice","1 tsp toasted sesame oil or rice vinegar (optional)","1 tbsp cornflour + 2 tbsp cold water, for slurry (optional)","Rice, crushed peanuts, fresh coriander, extra lime"],"shop":[{"key":"chicken-breast","name":"Chicken breast or tenderloins","aisle":"Meat & fish","qty":400.0,"unit":"g","optional":false,"raw":"400 g chicken breast, diced into 2–3 cm cubes"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, thinly sliced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, crushed"},{"key":"ginger","name":"Fresh ginger","aisle":"Fruit & veg","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp grated ginger (or 1–2 tsp jar ginger)"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp soy sauce"},{"key":"fish-sauce","name":"Fish sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp fish sauce"},{"key":"curry-paste","name":"Curry paste","aisle":"Pantry: check first","qty":1.5,"unit":"tsp","optional":false,"raw":"1½ tsp red curry paste"},{"key":"coconut-cream","name":"Coconut cream","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can coconut cream"},{"key":"peanut-butter","name":"Peanut butter","aisle":"Pantry: check first","qty":0.25,"unit":"cup","optional":false,"raw":"¼ cup peanut butter"},{"key":"sweet-chilli","name":"Sweet chilli sauce","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp sweet chilli sauce"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp brown sugar or honey"},{"key":"chickpeas","name":"Chickpeas","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can chickpeas, drained & rinsed"},{"key":"frozen-stir-fry","name":"Frozen stir-fry vegetables","aisle":"Frozen","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups frozen stir-fry vegetables"},{"key":"peanut-butter","name":"Peanut butter","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp peanut butter"},{"key":"lemon","name":"Lemons","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1½ tbsp lime or lemon juice"},{"key":"sesame-oil","name":"Sesame oil","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":true,"raw":"1 tsp toasted sesame oil or rice vinegar (optional)"},{"key":"cornflour","name":"Cornflour","aisle":"Baking","qty":1.0,"unit":"tbsp","optional":true,"raw":"1 tbsp cornflour + 2 tbsp cold water, for slurry (optional)"},{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":null,"unit":"","optional":true,"raw":"Rice, crushed peanuts, fresh coriander, extra lime"},{"key":"peanuts","name":"Peanuts","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Rice, crushed peanuts, fresh coriander, extra lime"},{"key":"coriander","name":"Fresh coriander","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Rice, crushed peanuts, fresh coriander, extra lime"},{"key":"lime","name":"Limes","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Rice, crushed peanuts, fresh coriander, extra lime"}],"tags":["chicken","fish"],"nutrition":{"kcal":660,"protein":38,"carbs":38,"fat":39,"per":"serving","count":4},"diet":["dairy-free","quick"],"storage":[]},{"title":"Apple-Mustard Pork & Split-Pea Stew","servings":"4","time":"15 min prep, 7–8 h on low","intro":"A hearty, inexpensive stew with pork shoulder, carrots and split peas. The apple cooks down into the stock, giving a gentle sweetness without turning dinner into dessert. About 38 g protein and roughly 430–470 kcal per serving.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Slow cooker base"},{"text":"500 g pork shoulder roast, trimmed of thick fat and cut into large cubes"},{"text":"1 cup dry yellow split peas, rinsed thoroughly"},{"text":"2 carrots (1 sliced, 1 grated)"},{"text":"1 onion, diced"},{"text":"3 garlic cloves, crushed"},{"text":"1 apple, cored and diced"},{"text":"4 cups chicken stock"},{"text":"1 tbsp wholegrain or Dijon mustard"},{"text":"1 tsp dried thyme"},{"text":"1 bay leaf"},{"group":"Last 25–30 minutes"},{"text":"300 g frozen mixed vegetables"},{"text":"60 g baby spinach (last 5 minutes)"},{"group":"To finish"},{"text":"1 tbsp apple-cider vinegar or lemon juice"},{"text":"½ tsp black pepper"},{"text":"Salt, to taste"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Load the cooker.** Put the split peas, pork, carrots, onion, garlic, apple, stock, mustard, thyme and bay leaf in the slow cooker. Stir briefly."},{"text":"**Cook low and slow.** Cook on low for 7–8 hours, until the peas are soft and the pork is tender enough to shred with a spoon."},{"text":"**Add the vegetables.** Stir in the frozen vegetables for the final 25–30 minutes, then the spinach for the last 5 minutes, until wilted."},{"text":"**Finish.** Remove the bay leaf. Stir in the vinegar or lemon juice and pepper, then taste and add salt if needed. Divide into four portions."},{"text":"**Adjust the thickness.** Add a splash of hot water if the stew is thicker than you prefer."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Serve with: mashed potatoes or kumara mash suit the apple and mustard best. Use 800 g–1 kg potatoes for four, mashed with some of the stew liquid instead of butter. Rice also works (1 cup dry makes about 3 cups cooked), or crusty bread. The stew is filling on its own, so the side is optional for a lighter meal."},{"text":"Split peas keep thickening as they sit, so add a splash of hot water when reheating."},{"text":"If the shoulder is bone-in, buy 650–700 g and remove the bone at the end."},{"text":"Add the vinegar at the end only — acid slows split peas from softening."},{"text":"Advance prep: cut the pork and vegetables the night before, and defrost any frozen pork in the fridge."}]},{"kind":"variation","heading":"Pork Loin Chop Version","text":"Swap the shoulder for 500 g trimmed pork loin chops, cut off the bone and cubed. Cook for about 6 hours on low instead of 7–8, as loin dries out faster. Protein rises to about 40–43 g per serving and calories drop by roughly 75 per portion. Method is otherwise identical.","sections":[]}],"id":"SlowCooker-Apple_Mustard_Pork_Split_Pea_Stew","file":"SlowCooker/Apple_Mustard_Pork_Split_Pea_Stew.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["500 g pork shoulder roast, trimmed of thick fat and cut into large cubes","1 cup dry yellow split peas, rinsed thoroughly","2 carrots (1 sliced, 1 grated)","1 onion, diced","3 garlic cloves, crushed","1 apple, cored and diced","4 cups chicken stock","1 tbsp wholegrain or Dijon mustard","1 tsp dried thyme","1 bay leaf","300 g frozen mixed vegetables","60 g baby spinach (last 5 minutes)","1 tbsp apple-cider vinegar or lemon juice","½ tsp black pepper","Salt, to taste"],"shop":[{"key":"pork-shoulder","name":"Pork shoulder","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g pork shoulder roast, trimmed of thick fat and cut into large cubes"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup dry yellow split peas, rinsed thoroughly"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 carrots (1 sliced, 1 grated)"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, crushed"},{"key":"apple","name":"Apples","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 apple, cored and diced"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":4.0,"unit":"cup","optional":false,"raw":"4 cups chicken stock"},{"key":"mustard","name":"Mustard","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp wholegrain or Dijon mustard"},{"key":"thyme","name":"Dried thyme","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried thyme"},{"key":"bay-leaves","name":"Bay leaves","aisle":"Pantry: check first","qty":1.0,"unit":"","optional":false,"raw":"1 bay leaf"},{"key":"frozen-mixed-veg","name":"Frozen mixed vegetables","aisle":"Frozen","qty":300.0,"unit":"g","optional":false,"raw":"300 g frozen mixed vegetables"},{"key":"spinach","name":"Baby spinach","aisle":"Fruit & veg","qty":60.0,"unit":"g","optional":false,"raw":"60 g baby spinach (last 5 minutes)"},{"key":"cider-vinegar","name":"Apple cider vinegar","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp apple-cider vinegar or lemon juice"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp black pepper"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Salt, to taste"}],"tags":["pork"],"nutrition":{"kcal":450,"protein":29,"carbs":32,"fat":24,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":["Split peas keep thickening as they sit, so add a splash of hot water when reheating."]},{"title":"Beef & Potato Stew over Rice","servings":"4–6","time":"15 min prep + 6–8 h cook","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"700–800 g beef for stewing (gravy beef, chuck, or similar), cut into chunks"},{"text":"4 medium potatoes, peeled if desired and cut into chunks"},{"text":"3 medium carrots, sliced"},{"text":"1 medium onion, diced"},{"text":"3 garlic cloves, minced (or 1 tsp garlic powder)"},{"text":"2 cups beef stock (or water + stock cubes)"},{"text":"1 tbsp Worcestershire sauce (optional but recommended)"},{"text":"1 tsp dried thyme"},{"text":"1 tsp dried rosemary"},{"text":"1 bay leaf (optional)"},{"text":"Salt and black pepper, to taste"},{"text":"2 tbsp plain flour **or** 1 tbsp cornflour (for thickening)"},{"text":"2–3 cups uncooked rice (for serving)"},{"text":"Optional extras:","sub":["1 tbsp tomato paste","1 punnet mushrooms, sliced","1 cup frozen peas (added near the end)"]},{"text":"**Protein Boost (optional):**","sub":["For extra thickness: ½ cup green or brown lentils (added at the start)","For creaminess + volume: 1 can (400 g) butter beans or cannellini beans, drained and rinsed (added in last 30 minutes)"]}]},{"kind":"steps","heading":"Method","items":[{"text":"Add the beef, potatoes, carrots, onion, and (if using) green/brown lentils to the slow cooker."},{"text":"Add the garlic, thyme, rosemary, bay leaf (if using), salt, and pepper. Add mushrooms now if using."},{"text":"Pour in the beef stock and Worcestershire sauce. If using tomato paste, stir it in. If using lentils, add an extra ½–1 cup of water or stock."},{"text":"Cover and cook on **LOW for 7–8 hours** or **HIGH for 4–5 hours**, until the beef is tender and the potatoes are soft."},{"text":"If using canned beans, stir them in during the last 30 minutes of cooking."},{"text":"To thicken the stew, mix the flour (or cornflour) with cold water to make a slurry, pour it in, and cook for 15–20 minutes on HIGH until thickened. Add peas during this stage if using."},{"text":"Taste and adjust seasoning. Remove bay leaf before serving."},{"text":"Cook rice according to packet instructions."},{"text":"Serve the beef and potato stew over rice while hot."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Lentils added at the beginning will naturally thicken the stew, so you may not need as much flour/cornflour. Butter beans or cannellini beans make the stew extra hearty without altering the flavour too much. This dish freezes well and makes excellent leftovers."}]}],"id":"SlowCooker-Beef_and_Potato_Stew","file":"SlowCooker/Beef_and_Potato_Stew.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["700–800 g beef for stewing (gravy beef, chuck, or similar), cut into chunks","4 medium potatoes, peeled if desired and cut into chunks","3 medium carrots, sliced","1 medium onion, diced","3 garlic cloves, minced (or 1 tsp garlic powder)","2 cups beef stock (or water + stock cubes)","1 tbsp Worcestershire sauce (optional but recommended)","1 tsp dried thyme","1 tsp dried rosemary","1 bay leaf (optional)","Salt and black pepper, to taste","2 tbsp plain flour **or** 1 tbsp cornflour (for thickening)","2–3 cups uncooked rice (for serving)","Optional extras:","1 tbsp tomato paste","1 punnet mushrooms, sliced","1 cup frozen peas (added near the end)","**Protein Boost (optional):**","For extra thickness: ½ cup green or brown lentils (added at the start)","For creaminess + volume: 1 can (400 g) butter beans or cannellini beans, drained and rinsed (added in last 30 minutes)"],"shop":[{"key":"stewing-beef","name":"Stewing beef","aisle":"Meat & fish","qty":800.0,"unit":"g","optional":false,"raw":"700–800 g beef for stewing (gravy beef, chuck, or similar), cut into chunks"},{"key":"potato","name":"Potatoes","aisle":"Fruit & veg","qty":4.0,"unit":"","optional":false,"raw":"4 medium potatoes, peeled if desired and cut into chunks"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":3.0,"unit":"","optional":false," "heading":"Ingredients","items":[{"text":"1 tbsp oil (optional, for browning the onion)"},{"text":"1 onion, diced"},{"text":"4 garlic cloves, minced"},{"text":"1 tbsp grated ginger"},{"text":"8 chicken drumsticks, skin removed"},{"text":"800 g tinned diced tomatoes"},{"text":"150 g red lentils, rinsed"},{"text":"2 tbsp garam masala"},{"text":"1 tsp ground turmeric"},{"text":"1 tbsp chicken stock powder"},{"text":"1 tsp salt"},{"text":"½ tsp chilli flakes (optional)"},{"text":"500 ml water"},{"text":"100 ml light coconut cream (or coconut milk)"},{"text":"150 g long grain brown rice (dry), to serve"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Soften the onion (optional, worth it).** Heat the oil in a frying pan and cook the onion for 3–4 min until softened. Add the garlic and ginger for 1 min more. If you're short on time, put them straight into the slow cooker raw."},{"text":"**Load the slow cooker.** Add the onion mixture, tomatoes, lentils, garam masala, turmeric, stock powder, salt, chilli flakes and water. Stir well so the lentils are spread through the liquid, not clumped on the bottom."},{"text":"**Add the chicken.** Nestle the drumsticks into the sauce so they are mostly submerged."},{"text":"**Slow cook.** Cook on Low for 6–7 hours or High for 3–4 hours, until the chicken pulls easily off the bone and the lentils have broken down."},{"text":"**Shred.** Lift out the drumsticks, shred the meat off the bone, discard the bones and stir the meat back through the sauce."},{"text":"**Finish.** Stir in the coconut cream. If the sauce is thin, leave the lid off on High for 15–20 min to thicken. Taste and adjust the seasoning."},{"text":"Serve over a small portion (½–¾ cup cooked) of brown rice."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Uses 500 ml water (vs. 400 ml in the Instant Pot version) to allow for evaporation over the long cook."},{"text":"The coconut cream goes in at the end so it doesn't split over the long cook."},{"text":"Drumsticks suit the slow cooker better than breast — they stay moist over 6–7 hours."},{"text":"Brown rice: simmer for 30–35 min, or cook it in the rice cooker."},{"text":"Freezes well. Portion into containers for meal prep."}]}],"id":"SlowCooker-Chicken_Lentil_Butter_Chicken","file":"SlowCooker/Chicken_Lentil_Butter_Chicken.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["1 tbsp oil (optional, for browning the onion)","1 onion, diced","4 garlic cloves, minced","1 tbsp grated ginger","8 chicken drumsticks, skin removed","800 g tinned diced tomatoes","150 g red lentils, rinsed","2 tbsp garam masala","1 tsp ground turmeric","1 tbsp chicken stock powder","1 tsp salt","½ tsp chilli flakes (optional)","500 ml water","100 ml light coconut cream (or coconut milk)","150 g long grain brown rice (dry), to serve"],"shop":[{"key":"oil","name":"Cooking oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":true,"raw":"1 tbsp oil (optional, for browning the onion)"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":4.0,"unit":"clove","optional":false,"raw":"4 garlic cloves, minced"},{"key":"ginger","name":"Fresh ginger","aisle":"Fruit & veg","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp grated ginger"},{"key":"chicken-drumstick","name":"Chicken drumsticks","aisle":"Meat & fish","qty":8.0,"unit":"","optional":false,"raw":"8 chicken drumsticks, skin removed"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":2.0,"unit":"can","optional":false,"raw":"800 g tinned diced tomatoes"},{"key":"red-lentils","name":"Red lentils (dry)","aisle":"Cans, jars & pulses","qty":150.0,"unit":"g","optional":false,"raw":"150 g red lentils, rinsed"},{"key":"garam-masala","name":"Garam masala","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp garam masala"},{"key": ount":6},"diet":["freezes","dairy-free"],"storage":[]},{"title":"Chicken & Yellow Split Pea Soup","servings":"4","time":"15 min prep + 7–8 hr (low)","intro":"A thick, filling chicken soup with smoky herbs and plenty of vegetables. The split peas soften into the stock and make it almost creamy without any cream. Roughly 43–46 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Slow cooker base"},{"text":"1 cup dry yellow split peas, rinsed"},{"text":"1 onion, diced"},{"text":"2 carrots, sliced"},{"text":"3 garlic cloves, crushed"},{"text":"1.5 L chicken stock"},{"text":"1 tsp dried thyme"},{"text":"1 tsp smoked paprika"},{"text":"1 tsp onion powder"},{"text":"1 tbsp Worcestershire sauce"},{"text":"500 g chicken breast or tenderloins, left whole"},{"group":"Last 20–30 minutes"},{"text":"400 g frozen mixed vegetables"},{"group":"To finish"},{"text":"Salt and pepper"},{"text":"Squeeze of lemon juice (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Build the base.** Put the split peas, onion, carrots, garlic, stock, seasonings and Worcestershire sauce into the slow cooker."},{"text":"**Add the chicken.** Lay the whole chicken on top."},{"text":"**Slow cook.** Cook on Low for 7–8 hours, until the split peas are completely tender."},{"text":"**Shred.** Shred the chicken and stir it back through the soup."},{"text":"**Add the veg.** Stir in the frozen vegetables for the final 20–30 minutes."},{"text":"**Finish.** Season, add lemon juice if using, and loosen with a little boiling water if it's thicker than you like."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**Advance prep:** chop the onion and carrots and defrost the chicken in the fridge the night before."},{"text":"Add the lemon only at the end — acid early on can stop split peas softening."},{"text":"Thickens a lot in the fridge; loosen leftovers with water when reheating."}]}],"id":"SlowCooker-Chicken_Yellow_Split_Pea_Soup","file":"SlowCooker/Chicken_Yellow_Split_Pea_Soup.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["1 cup dry yellow split peas, rinsed","1 onion, diced","2 carrots, sliced","3 garlic cloves, crushed","1.5 L chicken stock","1 tsp dried thyme","1 tsp smoked paprika","1 tsp onion powder","1 tbsp Worcestershire sauce","500 g chicken breast or tenderloins, left whole","400 g frozen mixed vegetables","Salt and pepper","Squeeze of lemon juice (optional)"],"shop":[{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup dry yellow split peas, rinsed"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 carrots, sliced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, crushed"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":1500.0,"unit":"ml","optional":false,"raw":"1.5 L chicken stock"},{"key":"thyme","name":"Dried thyme","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried thyme"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp smoked paprika"},{"key":"onion-powder","name":"Onion powder","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp onion powder"},{"key":"worcestershire","name":"Worcestershire sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp Worcestershire sauce"},{"key":"chicken-breast","name":"Chicken breast or tenderloins","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g chicken breast or tenderloins, left whole"},{"key":"frozen-mixed-veg","name":"Frozen mixed vegetables","aisle":"Frozen","qty":400.0,"unit":"g","optio n to taste, loosen with a splash of water if needed, and serve with rice or potatoes and toppings."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Freezes brilliantly — portion leftovers for nachos, jacket potatoes or burritos."},{"text":"For a quicker version, see Beef & Vegetable Chilli (Stovetop) or Beef & Mixed Bean Chilli (Instant Pot)."}]}],"id":"SlowCooker-Chilli_Con_Carne_Red_Lentils","file":"SlowCooker/Chilli_Con_Carne_Red_Lentils.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["500 g lean beef mince","1 onion, diced","1 capsicum, diced","3 garlic cloves, crushed","2 tsp chilli powder (or to taste)","2 tsp ground cumin","1 tsp smoked paprika","1 tsp dried oregano","½ cup dry red lentils, rinsed","2 cans kidney beans, drained and rinsed","1 can crushed tomatoes","2 tbsp tomato paste","1 cup beef stock","1 tsp cocoa powder (optional — adds depth)","Salt and pepper","Rice or baked potatoes, Greek yoghurt, grated cheese, coriander"],"shop":[{"key":"beef-mince","name":"Beef mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean beef mince"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"capsicum","name":"Capsicums","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 capsicum, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, crushed"},{"key":"chilli-powder","name":"Chilli powder","aisle":"Pantry: check first","qty":2.0,"unit":"tsp","optional":false,"raw":"2 tsp chilli powder (or to taste)"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":2.0,"unit":"tsp","optional":false,"raw":"2 tsp ground cumin"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp smoked paprika"},{"key":"oregano","name":"Dried oregano","aisle":"Pantry: che :null,"unit":"","optional":true,"raw":"Rice or baked potatoes, Greek yoghurt, grated cheese, coriander"}],"tags":["beef","mince"],"nutrition":{"kcal":520,"protein":42,"carbs":43,"fat":17,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":["Freezes brilliantly — portion leftovers for nachos, jacket potatoes or burritos."]},{"title":"Coconut Chicken, Kumara & Chickpea Curry","servings":"3–4","time":"6–7 hrs (low) / 3–4 hrs (high)","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"400 g chicken breast"},{"text":"1 can coconut milk (400 ml)"},{"text":"200 g tinned tomatoes"},{"text":"2 tbsp red or green curry paste"},{"text":"100 ml chicken stock"},{"text":"3 garlic cloves, minced"},{"text":"1 tsp fresh or ground ginger"},{"text":"1 tbsp fish sauce or soy sauce"},{"text":"1 tsp brown sugar or honey"},{"text":"1 medium kumara, peeled and diced into 2cm cubes"},{"text":"1 can chickpeas, drained and rinsed (400 g)"},{"text":"100 g frozen peas"},{"text":"200 g jasmine or basmati rice (dry)"},{"text":"1 tbsp lime juice (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Mix the sauce: in the slow cooker, combine coconut milk, tinned tomatoes, curry paste, stock, garlic, ginger, fish sauce, and sugar. Stir to combine."},{"text":"Add chicken and kumara: place the whole chicken breast into the sauce. Add the diced kumara around the chicken — it needs the full cook time to soften."},{"text":"Slow cook on LOW for 6–7 hours or HIGH for 3–4 hours, until the chicken is cooked through and the kumara is tender."},{"text":"Stir in the chickpeas. Cook for a further 30–60 minutes so they warm through and soak up some of the sauce."},{"text":"Remove the chicken breast and shred it with two forks. Return the shredded chicken to the slow cooker and stir through."},{"text":"Stir in the frozen peas. They'll be ready in about 10 minutes. Add lime juice if using, and taste for seasoning."},{"text":"Cook the rice according to packet instructions (usually 15 min). Fluff with a fork and serve with the curry."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Orange kumara works best here — it's sweeter and pairs well with coconut. Gold kumara also works fine."},{"text":"If you want even more body, mash a few chickpeas against the side of the slow cooker before serving — it thickens the sauce nicely."},{"text":"Ayam red curry paste is reliable and available at New World. Use 3 tbsp if you want more heat."}]}],"id":"SlowCooker-Coconut_Chicken_Kumara_Chickpea_Curry","file":"SlowCooker/Coconut_Chicken_Kumara_Chickpea_Curry.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["400 g chicken breast","1 can coconut milk (400 ml)","200 g tinned tomatoes","2 tbsp red or green curry paste","100 ml chicken stock","3 garlic cloves, minced","1 tsp fresh or ground ginger","1 tbsp fish sauce or soy sauce","1 tsp brown sugar or honey","1 medium kumara, peeled and diced into 2cm cubes","1 can chickpeas, drained and rinsed (400 g)","100 g frozen peas","200 g jasmine or basmati rice (dry)","1 tbsp lime juice (optional)"],"shop":[{"key":"chicken-breast","name":"Chicken breast or tenderloins","aisle":"Meat & fish","qty":400.0,"unit":"g","optional":false,"raw":"400 g chicken breast"},{"key":"coconut-milk","name":"Coconut milk","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can coconut milk (400 ml)"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":0.5,"unit":"can","optional":false,"raw":"200 g tinned tomatoes"},{"key":"curry-paste","name":"Curry paste","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp red or green curry paste"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":100.0,"unit":"ml","optional":false,"raw":"100 ml chicken stock"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, minced"},{"key":"ground-ginger","name":"Ground ginger","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp fresh or ground ginger"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp fish sauce or soy sauce"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp brown sugar or honey"},{"key":"kumara","name":"Kumara","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 medium kumara, peeled and diced into 2cm cubes"},{"key":"chickpeas","name":"Chickpeas","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can chickpeas, drained and rinsed (400 g)"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":100.0,"unit":"g","optional":false,"raw":"100 g frozen peas"},{"key":"basmati-rice","name":"Basmati rice","aisle":"Pasta, rice & grains","qty":200.0,"unit":"g","optional":false,"raw":"200 g jasmine or basmati rice (dry)"},{"key":"lime","name":"Limes","aisle":"Fruit & veg","qty":0.5,"unit":"","optional":true,"raw":"1 tbsp lime juice (optional)"}],"tags":["chicken","fish"],"nutrition":{"kcal":750,"protein":42,"carbs":88,"fat":25,"per":"serving","count":3.5},"diet":["freezes","dairy-free"],"storage":[]},{"title":"Honey Garlic Chicken","servings":"6","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 kg chicken thighs"},{"text":"1 can cannellini beans, drained and rinsed"},{"text":"4 garlic cloves, minced"},{"text":"3 tbsp honey"},{"text":"3 tbsp soy sauce"},{"text":"1 tbsp apple cider vinegar"},{"text":"1 tsp sesame oil"},{"text":"1 tsp cornflour mixed with 2 tbsp water (to thicken)"},{"text":"**To serve:** steamed rice, steamed broccoli or bok choy"}]},{"kind":"steps","heading":"Method","items":[{"text":"Mix garlic, honey, soy sauce, apple cider vinegar, and sesame oil together in a bowl."},{"text":"Place chicken thighs and cannellini beans in the slow cooker. Pour sauce over the top."},{"text":"Cook on **low for 6–7 hours**."},{"text":"In the last 20 minutes, stir in the cornflour mixture to thicken the sauce."},{"text":"Serve over steamed rice with broccoli or bok choy on the side."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 2.40/serve, 480 kcal, 46 g protein per serve."},{"text":"**Tip:** The cannellini beans soak up the honey garlic sauce beautifully and add extra protein without changing the flavour at all."}]}],"id":"SlowCooker-Honey_Garlic_Chicken","file":"SlowCooker/Honey_Garlic_Chicken.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["1 kg chicken thighs","1 can cannellini beans, drained and rinsed","4 garlic cloves, minced","3 tbsp honey","3 tbsp soy sauce","1 tbsp apple cider vinegar","1 tsp sesame oil","1 tsp cornflour mixed with 2 tbsp water (to thicken)","**To serve:** steamed rice, steamed broccoli or bok choy"],"shop":[{"key":"chicken-thigh","name":"Chicken thighs","aisle":"Meat & fish","qty":1000.0,"unit":"g","optional":false,"raw":"1 kg chicken thighs"},{"key":"cannellini","name":"Cannellini or butter beans","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can cannellini beans, drained and rinsed"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":4.0,"unit":"clove","optional":false,"raw":"4 garlic cloves, minced"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp honey"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp soy sauce"},{"key":"cider-vinegar","name":"Apple cider vinegar","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp apple cider vinegar"},{"key":"sesame-oil","name":"Sesame oil","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp sesame oil"},{"key":"cornflour","name":"Cornflour","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp cornflour mixed with 2 tbsp water (to thicken)"},{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":null,"unit":"","optional":true,"raw":"To serve: steamed rice, steamed broccoli or bok choy"},{"key":"broccoli","name":"Broccoli","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"To serve: steamed rice, steamed broccoli or bok choy"},{"key":"bok-choy","name":"Bok choy","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"To serve: steamed rice, steamed broccoli or bok choy"}],"tags":["chicken"],"nutrition":{"kcal":340,"protein":35,"carbs":16,"fat":14,"per":"serving","count":6},"diet":["dairy-free"],"storage":[]},{"title":"Honey-Mustard Chicken & White Bean Stew","servings":"4","time":"15 min prep + 6–7 hr (low)","intro":"A creamy-tasting but fairly light chicken stew with potatoes, carrots and cannellini beans. Roughly 41–44 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Slow cooker base"},{"text":"600 g potatoes, cut into 3 cm pieces"},{"text":"2 carrots, sliced"},{"text":"1 onion, diced"},{"text":"3 garlic cloves, crushed"},{"text":"1½ cups chicken stock"},{"text":"3 tbsp Dijon mustard"},{"text":"1 tbsp honey"},{"text":"1 tsp dried thyme"},{"text":"½ tsp smoked paprika"},{"text":"Black pepper"},{"text":"500 g chicken breast or tenderloins, left whole"},{"group":"Last 20–30 minutes"},{"text":"2 cans cannellini beans, drained and rinsed"},{"text":"300 g frozen green beans or mixed vegetables"},{"text":"⅓ cup low-fat milk (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Vegetables first.** Put the potatoes, carrots, onion and garlic into the slow cooker."},{"text":"**Sauce.** Mix the stock, mustard, honey, thyme, paprika and pepper, and pour it over the vegetables."},{"text":"**Chicken on top.** Lay the whole chicken on top."},{"text":"**Slow cook.** Cook on Low for 6–7 hours (check tenderloins after 5–6). It's fine to drop to Keep Warm afterwards."},{"text":"**Shred.** Shred the chicken and stir it back into the sauce."},{"text":"**Finish.** Stir in the cannellini beans, frozen vegetables and milk, if using. Cook for another 20–30 minutes."},{"text":"Taste before adding salt — the mustard and stock may already be salty enough."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Serve with: the potatoes and beans make it a full meal on its own. For bigger appetites, add crusty bread to mop up the sauce, or steamed greens."},{"text":"**Advance prep:** chop the vegetables the night before and defrost the chicken in the fridge."},{"text":"Potatoes go on the bottom, where they get the most heat; the chicken sits on top and stays juicier."}]}],"id":"SlowCooker-Honey_Mustard_Chicken_White_Bean_Stew","file":"SlowCooker/Honey_Mustard_Chicken_White_Bean_Stew.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["600 g potatoes, cut into 3 cm pieces","2 carrots, sliced","1 onion, diced","3 garlic cloves, crushed","1½ cups chicken stock","3 tbsp Dijon mustard","1 tbsp honey","1 tsp dried thyme","½ tsp smoked paprika","Black pepper","500 g chicken breast or tenderloins, left whole","2 cans cannellini beans, drained and rinsed","300 g frozen green beans or mixed vegetables","⅓ cup low-fat milk (optional)"],"shop":[{"key":"potato","name":"Potatoes","aisle":"Fruit & veg","qty":600.0,"unit":"g","optional":false,"raw":"600 g potatoes, cut into 3 cm pieces"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 carrots, sliced"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 onion, diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, crushed"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":1.5, ind":"steps","heading":"Method","items":[{"text":"Place chicken thighs in the slow cooker."},{"text":"Add black beans, corn, salsa, and all spices. Stir to combine."},{"text":"Cook on **low for 6–8 hours** or high for 3–4 hours."},{"text":"Shred the chicken with two forks directly in the slow cooker and stir through the sauce."},{"text":"Serve over rice with a dollop of Greek yoghurt and shredded cheese."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 2.20/serve, 470 kcal, 48 g protein per serve."},{"text":"**Tip:** Makes 6 serves. Leftovers keep in the fridge for 3–4 days or freeze for up to 3 months."}]}],"id":"SlowCooker-Mexican_Salsa_Chicken","file":"SlowCooker/Mexican_Salsa_Chicken.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["1 kg chicken thighs","1 can black beans, drained and rinsed","1 can corn, drained","1 jar medium salsa (400 g)","1 tsp cumin","1 tsp smoked paprika","1 tsp garlic powder","**To serve:** rice, Greek yoghurt, shredded cheese"],"shop":[{"key":"chicken-thigh","name":"Chicken thighs","aisle":"Meat & fish","qty":1000.0,"unit":"g","optional":false,"raw":"1 kg chicken thighs"},{"key":"black-beans","name":"Black beans","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can black beans, drained and rinsed"},{"key":"corn","name":"Corn (frozen or canned)","aisle":"Frozen","qty":1.0,"unit":"can","optional":false,"raw":"1 can corn, drained"},{"key":"salsa","name":"Salsa","aisle":"Cans, jars & pulses","qty":1.0,"unit":"jar","optional":false,"raw":"1 jar medium salsa (400 g)"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp cumin"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp smoked paprika"},{"key":"garlic-powder","name":"Garlic powder","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp garlic powder"},{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":null,"unit":"","optional":true,"raw":"To serve: rice, Greek yoghurt, shredded cheese"},{"key":"greek-yoghurt","name":"Greek yoghurt","aisle":"Dairy, eggs & chilled","qty":null,"unit":"","optional":true,"raw":"To serve: rice, Greek yoghurt, shredded cheese"},{"key":"cheese","name":"Tasty cheese","aisle":"Dairy, eggs & chilled","qty":null,"unit":"","optional":true,"raw":"To serve: rice, Greek yoghurt, shredded cheese"}],"tags":["chicken"],"nutrition":{"kcal":360,"protein":37,"carbs":19,"fat":14,"per":"serving","count":6},"diet":["freezes","dairy-free"],"storage":["Leftovers keep in the fridge for 3–4 days or freeze for up to 3 months."]},{"title":"Mexican Shredded Chicken","servings":"4–6","time":"10 min prep + 4–6 h cook","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"700–800 g chicken thighs (boneless, skinless)"},{"text":"1 can crushed tomatoes + 1 tbsp tomato paste"},{"text":"1 packet taco seasoning","sub":["Or homemade: 1 tbsp paprika, 1 tbsp ground cumin, 1 tsp garlic powder, 1 tsp onion powder, 1 tsp chilli powder, 1 tsp salt"]},{"text":"1 medium onion, sliced or diced"},{"text":"1 can black beans, drained and rinsed"},{"text":"1 cup frozen corn"},{"text":"1 tbsp brown sugar (optional, balances acidity if using plain tomatoes)"},{"text":"Salt and black pepper, to taste"},{"text":"Fresh coriander or spring onion, chopped (optional, for serving)"},{"text":"Wraps or tortillas (for wraps)"},{"text":"Corn chips (for nachos)"},{"text":"Grated cheese, sour cream or yoghurt (for serving, optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Place the chicken thighs in the bottom of the slow cooker in a single layer if possible."},{"text":"Add the sliced onion, black beans, and frozen corn on top of the chicken."},{"text":"Pour the crushed tomatoes and tomato paste over everything."},{"text":"Sprinkle over the taco seasoning (or your homemade spice mix). Add the brown sugar. Gently stir or nudge with a spoon so the seasoning is reasonably distributed, but you don’t need to mix perfectly."},{"text":"Cover and cook on **LOW for 4–6 hours** or **HIGH for about 2.5–3 hours**, until the chicken is very tender and easily pulls apart with a fork."},{"text":"Once cooked, remove the chicken pieces to a plate or board and shred with two forks. Return the shredded chicken to the slow cooker and stir to combine with the sauce."},{"text":"Taste and adjust seasoning: add salt, pepper, extra chilli, or a squeeze of lime to brighten the flavour."},{"text":"For **wraps**: fill tortillas with shredded chicken, a little sauce, grated cheese, sour cream or yoghurt, and any fresh herbs or salad you like."},{"text":"For **nachos**: spread corn chips on a tray or plate, spoon the hot chicken mixture over the top, add grated cheese and melt under a grill if desired. Finish with sour cream or yoghurt, coriander, and jalapeños if using."}]},{"kind":"notes","heading":"Notes","items":[{"text":"This recipe is designed so half the batch can be used for wraps and half for nachos, but you can easily change the ratio depending on what you feel like. Leftovers keep well in the fridge or freezer and are also great in quesadillas, burrito bowls, stuffed potatoes, or on rice."}]}],"id":"SlowCooker-Mexican_Shredded_Chicken","file":"SlowCooker/Mexican_Shredded_Chicken.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["700–800 g chicken thighs (boneless, skinless)","1 can crushed tomatoes + 1 tbsp tomato paste","1 packet taco seasoning","Or homemade: 1 tbsp paprika, 1 tbsp ground cumin, 1 tsp garlic powder, 1 tsp onion powder, 1 tsp chilli powder, 1 tsp salt","1 medium onion, sliced or diced","1 can black beans, drained and rinsed","1 cup frozen corn","1 tbsp brown sugar (optional, balances acidity if using plain tomatoes)","Salt and black pepper, to taste","Fresh coriander or spring onion, chopped (optional, for s ","optional":false,"raw":"1 tsp fresh ginger, grated"},{"key":"spinach","name":"Baby spinach","aisle":"Fruit & veg","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups baby spinach"},{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":null,"unit":"","optional":true,"raw":"To serve: rice or naan bread"},{"key":"bread","name":"Bread","aisle":"Bread & wraps","qty":null,"unit":"","optional":true,"raw":"To serve: rice or naan bread"}],"tags":["pork"],"nutrition":{"kcal":680,"protein":35,"carbs":36,"fat":43,"per":"serving","count":6},"diet":["freezes","dairy-free"],"storage":[]},{"title":"Pork & Lentil Bolognese","servings":"4","time":"6–7 hrs (slow cook)","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"400 g lean pork mince"},{"text":"¾ cup red lentils, rinsed"},{"text":"400 g crushed tomatoes (canned)"},{"text":"1 cup beef stock (low sodium)"},{"text":"1 brown onion, finely diced"},{"text":"3 garlic cloves, minced"},{"text":"1 carrot, finely diced"},{"text":"1 capsicum, finely diced"},{"text":"2 celery stalks, finely diced (optional, but recommended)"},{"text":"2 tbsp tomato paste"},{"text":"1 tsp dried oregano"},{"text":"1 tsp dried basil"},{"text":"½ tsp smoked paprika"},{"text":"½ tsp salt"},{"text":"¼ tsp black pepper"},{"text":"1 tbsp olive oil"},{"text":"1½ cups rice (uncooked)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Heat the olive oil in a frying pan over medium-high heat. Add the pork mince and cook, breaking it up, until browned all over. Drain any excess fat."},{"text":"In the same pan, add the onion, garlic, carrot, and capsicum (plus celery, if using). Cook for 3–4 minutes until softened. Stir in the tomato paste and cook for 1 minute."},{"text":"Transfer the browned pork and sautéed vegetables to the slow cooker. Add the lentils, crushed tomatoes, beef stock, oregano, basil, smoked paprika, salt, and pepper. Stir well."},{"text":"Place the lid on and cook on LOW for 6–7 hours, or HIGH for 3–4 hours. The lentils will absorb liquid and thicken the sauce."},{"text":"About 30–40 minutes before serving (timing depends on rice type), rinse the rice and cook according to packet instructions."},{"text":"Taste the bolognese and adjust seasoning if needed. Spoon generously over brown rice."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Keeps well in the fridge for 4 days and freezes for up to 3 months – great for batch cooking."},{"text":"For extra protein, stir through a drained can of chickpeas or extra lentils in the last 30 minutes."},{"text":"Approx. per serving (with rice): 480 cal, 38 g protein, 52 g carbs, 10 g fat."}]}],"id":"SlowCooker-Pork_and_Lentil_Bolognese","file":"SlowCooker/Pork_and_Lentil_Bolognese.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["400 g lean pork mince","¾ cup red lentils, rinsed","400 g crushed tomatoes (canned)","1 cup beef stock (low sodium)","1 brown onion, finely diced","3 garlic cloves, minced","1 carrot, finely diced","1 capsicum, finely diced","2 celery stalks, finely diced (optional, but recommended)","2 tbsp tomato paste","1 tsp dried oregano","1 tsp dried basil","½ tsp smoked paprika","½ tsp salt","¼ tsp black pepper","1 tbsp olive oil","1½ cups rice (uncooked)"],"shop":[{"key":"pork-mince","name":"Pork mince","aisle":"Meat & fish","qty":400.0,"unit":"g","optional":false,"raw":"400 g lean pork mince"},{"key":"red-lentils","name":"Red lentils (dry)","aisle":"Cans, jars & pulses","qty":0.75,"unit":"cup","optional":false,"raw":"¾ cup red lentils, rinsed"},{"key":"canned-tomatoes","name":"Canned tomatoes","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"400 g crushed tomatoes (canned)"},{"key":"beef-stock","name":"Beef stock","aisle":"Pantry: check first","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup beef stock (low sodium)"},{"key":"onion","name":"Onions","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 brown onion, finely diced"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":3.0,"unit":"clove","optional":false,"raw":"3 garlic cloves, minced"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 carrot, finely diced"},{"key":"capsicum","name":"Capsicums","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 capsicum, finely diced"},{"key":"celery","name":"Celery","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":true,"raw":"2 celery stalks, finely diced (optional, but recommended)"},{"key":"tomato-paste","name":"Tomato paste","aisle":"Cans, jars & pulses","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tomato paste"},{"key":"oregano","name":"Dried oregano","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried oregano"},{"key":"basil","name":"Fresh basil","aisle":"Fruit & veg","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp dried basil"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp smoked paprika"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp salt"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":0.25,"unit":"tsp","optional":false,"raw":"¼ tsp black pepper"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp olive oil"},{"key":"rice","name":"Rice","aisle":"Pasta, rice & grains","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups rice (uncooked)"}],"tags":["pork","mince"],"nutrition":{"kcal":700,"protein":35,"carbs":89,"fat":21,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":["Keeps well in the fridge for 4 days and freezes for up to 3 months – great for batch cooking."]},{"title":"Pork Mince, Barley & Vegetable Soup","servings":"4","time":"15 min prep + 6–7 hr (low)","intro":"A thick, hearty soup — all the flavour of a meatball soup without rolling any meatballs. Roughly 38–40 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Slow cooker base"},{"text":"500 g pork mince"},{"text":"1 onion, diced"},{"text":"2 carrots, diced"},{"text":"2 celery stalks, diced (optional)"},{"text":"3 garlic cloves, crushed"},{"text":"¾ cup pearl barley, rinsed"},{"text":"1 can crushed tomatoes"},{"text":"1.75 L chicken stock"},{"text":"1 tsp dried thyme"},{"text":"1 tsp smoked paprika"},{"group":"Last 30 minutes"},{"text":"2 cans cannellini beans, drained and rinsed"},{"text":"300 g frozen mixed vegetables or spinach"},{"group":"To finish"},{"text":"Salt and pepper"},{"text":"Grated parmesan (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Brown the pork.** In a frying pan, brown the pork mince with the onion, breaking it up. Drain any excess fat."},{"text":"**Load the slow cooker.** Add the pork, carrots, celery, garlic, barley, tomatoes, stock, thyme and paprika to the slow cooker. Stir."},{"text":"**Slow cook.** Cook on Low for 6–7 hours, until the barley is tender."},{"text":"**Finish.** Stir in the beans and frozen vegetables and cook for a final 30 minutes."},{"text":"Season, and loosen with boiling water if it's thicker than you like. Top with parmesan if using."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Barley keeps soaking up liquid — leftovers turn almost stew-like. Add water when reheating."},{"text":"Freezes well in portions."}]}],"id":"SlowCooker-Pork_Barley_Vegetable_Soup","file":"SlowCooker/Pork_Barley_Vegetable_Soup.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["500 g pork mince","1 onion, diced","2 carrots, diced","2 celery stalks, diced (optional)","3 garlic cloves, crushed","¾ cup pearl barley, rinsed","1 can crushed tomatoes","1.75 L chicken stock","1 tsp dried thyme","1 tsp smoked paprika","2 cans cannellini beans, drained and rinsed","300 g f onal":true,"raw":"Salt and pepper"},{"key":"parmesan","name":"Parmesan","aisle":"Dairy, eggs & chilled","qty":null,"unit":"","optional":true,"raw":"Grated parmesan (optional)"}],"tags":["pork","mince"],"nutrition":{"kcal":660,"protein":42,"carbs":67,"fat":23,"per":"serving","count":4},"diet":["freezes","dairy-free"],"storage":["Add water when reheating.","Freezes well in portions."]},{"title":"Pulled Pork Wraps","servings":"6","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 kg pork shoulder"},{"text":"1 tbsp smoked paprika"},{"text":"1 tsp cumin"},{"text":"1 tsp garlic powder"},{"text":"1 tsp brown sugar"},{"text":"1 cup chicken stock"},{"text":"1 can black beans, drained and rinsed"},{"text":"**To serve:** large flour tortillas, coleslaw, Greek yoghurt"}]},{"kind":"steps","heading":"Method","items":[{"text":"Mix smoked paprika, cumin, garlic powder, and brown sugar together to form a dry rub."},{"text":"Rub the spice mixture all over the pork shoulder."},{"text":"Place in slow cooker and pour chicken stock around the base."},{"text":"Cook on **low for 8 hours**."},{"text":"Shred the pork using two forks. Stir through the cooking juices."},{"text":"Warm black beans in a small pan with a pinch of cumin and smoked paprika."},{"text":"Serve in warmed tortillas with black beans, coleslaw and a dollop of Greek yoghurt."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 2.60/serve, 495 kcal, 54 g protein per serve."},{"text":"**Tip:** Pork shoulder is one of the cheapest cuts available. Buy it on special and freeze — it slow cooks perfectly from thawed."}]}],"id":"SlowCooker-Pulled_Pork_Wraps","file":"SlowCooker/Pulled_Pork_Wraps.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["1 kg pork shoulder","1 tbsp smoked paprika","1 tsp cumin","1 tsp garlic powder","1 tsp brown sugar","1 cup chicken stock","1 can black beans, drained and rinsed","**To serve:** large flour tortillas, coleslaw, Greek yoghurt"],"shop":[{"key":"pork-shoulder","name":"Pork shoulder","aisle":"Meat & fish","qty":1000.0,"unit":"g","optional":false,"raw":"1 kg pork shoulder"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp smoked paprika"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp cumin"},{"key":"garlic-powder","name":"Garlic powder","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp garlic powder"},{"key":"brown-sugar","name":"Brown sugar","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp brown sugar"},{"key":"chicken-stock","name":"Chicken stock","aisle":"Pantry: check first","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup chicken stock"},{"key":"black-beans","name":"Black beans","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can black beans, drained and rinsed"},{"key":"tortillas","name":"Tortillas or wraps","aisle":"Bread & wraps","qty":null,"unit":"","optional":true,"raw":"To serve: large flour tortillas, coleslaw, Greek yoghurt"},{"key":"cabbage","name":"Cabbage","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"To serve: large flour tortillas, coleslaw, Greek yoghurt"},{"key":"greek-yoghurt","name":"Greek yoghurt","aisle":"Dairy, eggs & chilled","qty":null,"unit":"","optional":true,"raw":"To serve: large flour tortillas, coleslaw, Greek yoghurt"}],"tags":["pork"],"nutrition":{"kcal":440,"protein":32,"carbs":8,"fat":30,"per":"serving","count":6},"diet":["freezes","dairy-free"],"storage":["Buy it on special and freeze — it slow cooks perfectly from thawed."]},{"title":"Satay Chicken & Red Lentil Curry","servings":"4","time":"15 min prep + 6–7 hr (low)","intro":"A creamy peanut and coconut curry in which the red lentils dissolve into the sauce. Serve over rice. Roughly 40–43 g protein per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Slow cooker base"},{"text":"½ cup dry split red lentils, rinsed"},{"text":"1 onion, diced"},{"text":"3 garlic cloves, crushed"},{"text":"1 tsp grated ginger"},{"text":"400 ml lite coconut milk"},{"text":"1 cup chicken stock"},{"text":"2 tbsp peanut butter"},{"text":"2 tbsp reduced-salt soy sauce"},{"text":"1 tbsp curry powder"},{"text":"500 g chicken breast or tenderloins, left whole"},{"group":"Last 20–30 minutes"},{"text":"400 g frozen stir-fry vegetables"},{"group":"To finish & serve"},{"text":"1 tbsp lime or lemon juice"},{"text":"Chilli flakes (optional)"},{"text":"1¼ cups dry rice"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Build the base.** Put the lentils, onion, garlic, ginger, coconut milk, stock, peanut butter, soy sauce and curry powder into the slow cooker. Mix well so the peanut butter and lentils are spread through the liquid."},{"text":"**Add the chicken.** Nestle the chicken into the sauce."},{"text":"**Slow cook.** Cook on Low for 6–7 hours (check tenderloins after 5–6). It's fine to drop to Keep Warm afterwards."},{"text":"**Shred.** Shred the chicken and stir it back through the sauce."},{"text":"**Add the veg.** Stir in the frozen vegetables for the final 20–30 minutes."},{"text":"**Finish.** Stir in the lime or lemon juice, and loosen with water if the sauce is thicker than you like."},{"text":"Cook the rice separately and divide everything into four servings."}]},{"kind":"notes","heading":"Notes","items":[{"text":"**Advance prep:** dice the onion and defrost the chicken in the fridge the night before."},{"text":"For a quicker Instant Pot satay, see Thai Peanut Chicken in the Instant Pot chapter."}]}],"id":"SlowCooker-Satay_Chicken_Red_Lentil_Curry","file":"SlowCooker/Satay_Chicken_Red_Lentil_Curry.tex","chapter":"slow","chapterName":"Slow Cooker","group":null,"ingredients":["½ cup dry split red lentils, rinsed","1 onion, diced","3 garlic cloves, crushed","1 tsp g
