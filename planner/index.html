ll to prevent clumping."},{"text":"Pour into jars or containers. Seal and refrigerate for at least 4 hours or overnight."},{"text":"In the morning, give it a stir — it should be thick and pudding-like. Add a splash of milk if too thick."},{"text":"Top with berries, mango, toasted coconut, or granola before eating."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 1.40/jar, 380 kcal, 32 g protein per serve."},{"text":"**Tip:** Chia seeds are high in omega-3 fats and fibre, which help keep you full throughout the morning. Available cheaply in bulk at Pak'nSave."}]}],"id":"Breakfast-High_Protein_Chia_Pudding","file":"Breakfast/High_Protein_Chia_Pudding.tex","chapter":"breakfast","chapterName":"Breakfast","group":null,"ingredients":["3 tbsp chia seeds","1 cup milk (or coconut milk for creamier result)","½ cup Greek yoghurt","1 scoop vanilla protein powder","1 tsp honey","**Toppings:** mixed berries, sliced mango, toasted coconut, granola"],"shop":[{"key":"chia","name":"Chia seeds","aisle":"Pantry: check first","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp chia seeds"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup milk (or coconut milk for creamier result)"},{"key":"greek-yoghurt","name":"Greek yoghurt","aisle":"Dairy, eggs & chilled","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup Greek yoghurt"},{"key":"protein-powder","name":"Protein powder","aisle":"Pantry: check first","qty":1.0,"unit":"scoop","optional":false,"raw":"1 scoop vanilla protein powder"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp honey"},{"key":"berries","name":"Berries","aisle":"Frozen","qty":null,"unit":"","optional":true,"raw":"Toppings: mixed berries, sliced mango, toasted coconut, granola"},{"key":"mango","name":"Mango","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Toppings: mixed berries, sliced mango, toasted coconu ","heading":"Method","items":[{"text":"Heat a frying pan or wok over medium-high heat with a splash of oil."},{"text":"Add rice and stir fry for 2–3 minutes until slightly crispy."},{"text":"Push rice to the side. Crack in 2 eggs and scramble until just set, then mix through the rice."},{"text":"Add ham or chicken and peas. Toss for 2 minutes."},{"text":"Season with soy sauce and sesame oil."},{"text":"Top with a fried egg, spring onions, and sriracha."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 1.30/serve, 410 kcal, 34 g protein per serve."},{"text":"**Tip:** This comes together in under 10 minutes and uses up leftovers. A great alternative when you want something warm and savoury in the morning."}]}],"id":"Breakfast-Savoury_Egg_and_Rice_Bowl","file":"Breakfast/Savoury_Egg_and_Rice_Bowl.tex","chapter":"breakfast","chapterName":"Breakfast","group":null,"ingredients":["1 cup cooked jasmine rice (day-old works best)","3 eggs","100 g diced ham or leftover cooked chicken","½ cup frozen peas or edamame","2 spring onions, sliced","1 tbsp soy sauce","1 tsp sesame oil","Sriracha or chilli flakes to taste"],"shop":[{"key":"jasmine-rice","name":"Jasmine rice","aisle":"Pasta, rice & grains","qty":0.25,"unit":"cup","optional":false,"raw":"1 cup cooked jasmine rice (day-old works best)"},{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":3.0,"unit":"","optional":false,"raw":"3 eggs"},{"key":"ham","name":"Ham","aisle":"Meat & fish","qty":100.0,"unit":"g","optional":false,"raw":"100 g diced ham or leftover cooked chicken"},{"key":"frozen-peas","name":"Frozen peas","aisle":"Frozen","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup frozen peas or edamame"},{"key":"spring-onion","name":"Spring onions","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 spring onions, sliced"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp soy sauce"},{"key":"sesame-oil","name":"Sesame oil","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp sesame oil"},{"key":"hot-sauce","name":"Hot sauce","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Sriracha or chilli flakes to taste"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Sriracha or chilli flakes to taste"}],"tags":["pork","chicken"],"nutrition":null,"diet":["dairy-free","leftovers"],"storage":[]},{"title":"Boiled Eggs & Crackers","servings":"1","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"3 eggs"},{"text":"6 wholegrain crackers"},{"text":"Salt, pepper, and a dash of hot sauce or mustard"}]},{"kind":"steps","heading":"Method","items":[{"text":"Bring a pot of water to the boil. Gently lower in eggs."},{"text":"Boil for 7–8 minutes for hard-boiled, or 6 minutes for a slightly jammy yolk."},{"text":"Transfer to cold water for 2 minutes before peeling."},{"text":"Season with salt, pepper, and hot sauce. Serve with crackers."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 0.60/serve, 210 kcal, 18 g protein per serve."},{"text":"**Tip:** Batch boil 6–8 eggs at once and keep them unpeeled in the fridge for up to a week — perfect grab-and-go snack."}]}],"id":"Snacks-Boiled_Eggs_and_Crackers","file":"Snacks/Boiled_Eggs_and_Crackers.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["3 eggs","6 wholegrain crackers","Salt, pepper, and a dash of hot sauce or mustard"],"shop":[{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":3.0,"unit":"","optional":false,"raw":"3 eggs"},{"key":"crackers","name":"Crackers","aisle":"Bread & wraps","qty":6.0,"unit":"","optional":false,"raw":"6 wholegrain crackers"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt, pepper, and a dash of hot sauce or mustard"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt, pepper, and a dash of hot sauce or mustard"},{"key":"hot-sauce","name":"Hot sauce","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt, pepper, and a dash of hot sauce or mustard"},{"key":"mustard","name":"Mustard","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt, pepper, and a dash of hot sauce or mustard"}],"tags":[],"nutrition":{"kcal":360,"protein":23,"carbs":22,"fat":20,"per":"serving","count":1},"diet":["vegetarian","dairy-free"],"storage":["Tip: Batch boil 6–8 eggs at once and keep them unpeeled in the fridge for up to a week — perfect grab-and-go snack."]},{"title":"Cheese & Marmite Scrolls","servings":"12 scrolls","time":"20 min prep + 20 min","intro":"The Kiwi lunchbox classic, made on a quick scone dough with no yeast. Roughly 8 g protein per scroll.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Scone dough"},{"text":"3 cups plain flour"},{"text":"6 tsp baking powder"},{"text":"¼ tsp salt"},{"text":"75 g cold butter, cubed"},{"text":"1–1¼ cups milk"},{"group":"Filling"},{"text":"2 tbsp Marmite (or Vegemite)"},{"text":"25 g butter, softened"},{"text":"1½ cups grated tasty cheese"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 200°C bake. Line a tray or 20 × 30 cm tin with baking paper."},{"text":"Sift the flour, baking powder and salt into a bowl. Rub in the butter with your fingertips until it looks like fine breadcrumbs."},{"text":"Add 1 cup of milk and mix quickly with a knife to a soft dough, adding more milk if needed."},{"text":"On a floured bench, roll or pat the dough into a rectangle about 30 × 40 cm."},{"text":"Mix the Marmite and softened butter and spread thinly over the dough. Sprinkle with the cheese, keeping a little back for the top."},{"text":"Roll up tightly from a long side and cut into 12 slices."},{"text":"Place cut-side up, just touching, in the tin. Sprinkle with the rest of the cheese."},{"text":"Bake for 18–20 minutes, until golden and cooked through."}]},{"kind":"variation","heading":"Pizza scrolls","text":"Swap the Marmite filling for 3 tbsp tomato paste mixed with 1 tsp dried oregano, 100 g diced ham, and the cheese.","sections":[]},{"kind":"notes","heading":"Notes","items":[{"text":"The scone base follows the Edmonds scone recipe used for the Cheese Scones."},{"text":"Mixing the Marmite with butter makes it spread thinly and evenly. A little goes a long way."},{"text":"Freeze in bags and pull out for lunches; they thaw by morning tea."}]}],"id":"Snacks-Cheese_Marmite_Scrolls","file":"Snacks/Cheese_Marmite_Scrolls.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["3 cups plain flour","6 tsp baking powder","¼ tsp salt","75 g cold butter, cubed","1–1¼ cups milk","2 tbsp Marmite (or Vegemite)","25 g butter, softened","1½ cups grated tasty cheese"],"shop":[{"key":"flour","name":"Plain flour","aisle":"Baking","qty":3.0,"unit":"cup","optional":false,"raw":"3 cups plain flour"},{"key":"baking-powder","name":"Baking powder","aisle":"Baking","qty":6.0,"unit":"tsp","optional":false,"raw":"6 tsp baking powder"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":0.25,"unit":"tsp","optional":false,"raw":"¼ tsp salt"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":75.0,"unit":"g","optional":false,"raw":"75 g cold butter, cubed"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":1.25,"unit":"cup","optional":false,"raw":"1–1¼ cups milk"},{"key":"marmite","name":"Marmite","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp Marmite (or Vegemite)"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":25.0,"unit":"g","optional":false,"raw":"25 g butter, softened"},{"key":"cheese","name":"Tasty cheese","aisle":"Dairy, eggs & chilled","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups grated tasty cheese"}],"tags":[],"nutrition":{"kcal":260,"protein":8,"carbs":27,"fat":12,"per":"serving","count":12},"diet":["freezes","vegetarian"],"storage":["Freeze in bags and pull out for lunches; they thaw by morning tea."]},{"title":"Cottage Cheese & Tomato Toast","servings":"1","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"2 slices wholegrain bread, toasted"},{"text":"½ cup cottage cheese"},{"text":"1 tomato, sliced"},{"text":"Salt, pepper, dried herbs or chilli flakes"}]},{"kind":"steps","heading":"Method","items":[{"text":"Toast bread until golden."},{"text":"Spread cottage cheese generously on each slice."},{"text":"Top with sliced tomato. Season with salt, pepper, and herbs."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 0.90/serve, 240 kcal, 22 g protein per serve."},{"text":"**Tip:** Cottage cheese is one of the cheapest high-protein foods available — around 4–5 for a 500 g tub at Pak'nSave. Also great with cucumber or smashed avocado on top."}]}],"id":"Snacks-Cottage_Cheese_and_Tomato_Toast","file":"Snacks/Cottage_Cheese_and_Tomato_Toast.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["2 slices wholegrain bread, toasted","½ cup cottage cheese","1 tomato, sliced","Salt, pepper, dried herbs or chilli flakes"],"shop":[{"key":"bread","name":"Bread","aisle":"Bread & wraps","qty":2.0,"unit":"slice","optional":false,"raw":"2 slices wholegrain bread, toasted"},{"key":"cottage-cheese","name":"Cottage cheese","aisle":"Dairy, eggs & chilled","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup cottage cheese"},{"key":"tomato","name":"Tomatoes","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"1 tomato, sliced"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt, pepper, dried herbs or chilli flakes"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt, pepper, dried herbs or chilli flakes"},{"key":"dried-herbs","name":"Dried herbs","aisle":null,"qty":null,"unit":"","optional":true,"raw":"Salt, pepper, dried herbs or chilli flakes"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt, pepper, dried herbs or chilli flakes"}],"tags":[],"nutrition":{"kcal":300,"protein":21,"carbs":41,"fat":6,"per":"serving","count":1},"diet":["vegetarian"],"storage":[]},{"title":"Crunchy Spiced Roasted Chickpeas","servings":"4","time":"5 min prep + 35 min","intro":"A crunchy, salty snack made from two tins of chickpeas. Roughly 7 g protein and a good amount of fibre per serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"2 cans (400 g) chickpeas, drained and rinsed"},{"text":"1 tbsp olive oil"},{"text":"½ tsp salt"},{"group":"Spice mix"},{"text":"1 tsp smoked paprika"},{"text":"½ tsp ground cumin"},{"text":"½ tsp garlic powder"},{"text":"Pinch of cayenne pepper (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 200°C bake. Line a large tray with baking paper."},{"text":"Dry the chickpeas really well with a clean tea towel, rubbing off any loose skins."},{"text":"Toss with the oil and salt and spread out in a single layer."},{"text":"Roast for 30–40 minutes, shaking the tray every 10 minutes, until golden and crunchy all the way through."},{"text":"Toss the hot chickpeas with the spice mix straight away."},{"text":"Cool on the tray — they crisp up more as they cool."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Drying the chickpeas properly is what makes them crunchy."},{"text":"The spices go on after roasting so they don't burn."},{"text":"Best on the day. They soften after a couple of days in an airtight container; re-crisp at 180°C for 5 minutes."}]}],"id":"Snacks-Roasted_Chickpeas","file":"Snacks/Roasted_Chickpeas.tex","chapter":"snacks","chapterName" :"Method","items":[{"text":"Lower the eggs into a pot of boiling water and boil for 10 minutes."},{"text":"Transfer to a bowl of cold water with ice for 5 minutes, then peel."},{"text":"Halve the eggs lengthways and scoop the yolks into a bowl."},{"text":"Mash the yolks with the yoghurt, mayonnaise, mustard, salt and pepper until smooth."},{"text":"Spoon or pipe the filling back into the whites."},{"text":"Sprinkle with paprika and chives."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Older eggs peel more easily than very fresh ones."},{"text":"Keep in a covered container in the fridge for up to 2 days."}]}],"id":"Snacks-Devilled_Eggs","file":"Snacks/Devilled_Eggs.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["6 eggs","2 tbsp Greek yoghurt","1 tbsp mayonnaise","1 tsp Dijon or American mustard","Salt and black pepper","Smoked paprika and chopped chives or spring onion, to garnish"],"shop":[{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":6.0,"unit":"","optional":false,"raw":"6 eggs"},{"key":"greek-yoghurt","name":"Greek yoghurt","aisle":"Dairy, eggs & chilled","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp Greek yoghurt"},{"key":"mayonnaise","name":"Mayonnaise","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp mayonnaise"},{"key":"mustard","name":"Mustard","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp Dijon or American mustard"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Smoked paprika and chopped chives or spring onion, to garnish"}],"tags":[],"nutrition":{"kcal":200,"protein":15,"carbs":1,"fat":15,"per":"serving","count":3},"diet":["vegetarian","quick"],"storage":["Keep in a covered container in the fridge for up to 2 days."]},{"title":"Edamame with Sea Salt","servings":"1","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"200 g frozen edamame (in pods or shelled)"},{"text":"Sea salt flakes"},{"text":"Optional: soy sauce or chilli flakes"}]},{"kind":"steps","heading":"Method","items":[{"text":"Cook edamame from frozen — either microwave in a bowl with a splash of water for 3–4 minutes, or boil in salted water for 4–5 minutes."},{"text":"Drain and sprinkle generously with sea salt."},{"text":"Serve with a small bowl of soy sauce for dipping if desired."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 1.00/serve, 190 kcal, 17 g protein per serve."},{"text":"**Tip:** One of the most satisfying low-calorie, high-protein snacks. Frozen bags are available cheaply at Pak'nSave and keep in the freezer for months."}]}],"id":"Snacks-Edamame_with_Sea_Salt","file":"Snacks/Edamame_with_Sea_Salt.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["200 g frozen edamame (in pods or shelled)","Sea salt flakes","Optional: soy sauce or chilli flakes"],"shop":[{"key":"edamame","name":"Frozen edamame","aisle":"Frozen","qty":200.0,"unit":"g","optional":false,"raw":"200 g frozen edamame (in pods or shelled)"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Sea salt flakes"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Optional: soy sauce or chilli flakes"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Optional: soy sauce or chilli flakes"}],"tags":[],"nutrition":{"kcal":240,"protein":24,"carbs":18,"fat":10,"per":"serving","count":1},"diet":["vegetarian","dairy-free"],"storage":["Frozen bags are available cheaply at Pak'nSave and keep in the freezer for months."]},{"title":"Greek Yoghurt & Berry Bowl","servings":"1","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"200 g full-fat Greek yoghurt"},{"text":"½ cup mixed berries (fresh or frozen/thawed)"},{"text":"1 tbsp honey"},{"text":"1 tbsp granola or crushed almonds"}]},{"kind":"steps","heading":"Method","items":[{"text":"Spoon Greek yoghurt into a bowl."},{"text":"Top with berries, a drizzle of honey, and granola or almonds."},{"text":"Eat immediately."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 1.20/serve, 220 kcal, 20 g protein per serve."},{"text":"**Tip:** Buy the 1 kg tub of Anchor or Cyclops Greek yoghurt at Pak'nSave — it's significantly cheaper per gram than individual pottles."}]}],"id":"Snacks-Greek_Yoghurt_and_Berry_Bowl","file":"Snacks/Greek_Yoghurt_and_Berry_Bowl.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["200 g full-fat Greek yoghurt","½ cup mixed berries (fresh or frozen/thawed)","1 tbsp honey","1 tbsp granola or crushed almonds"],"shop":[{"key":"greek-yoghurt","name":"Greek yoghurt","aisle":"Dairy, eggs & chilled","qty":200.0,"unit":"g","optional":false,"raw":"200 g full-fat Greek yoghurt"},{"key":"berries","name":"Berries","aisle":"Frozen","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup mixed berries (fresh or frozen/thawed)"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp honey"},{"key":"granola","name":"Granola","aisle":"Pasta, rice & grains","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp granola or crushed almonds"}],"tags":[],"nutrition":{"kcal":340,"protein":20,"carbs":37,"fat":12,"per":"serving","count":1},"diet":["vegetarian"],"storage":[]},{"title":"Homemade Hummus","servings":"6 (about ¼ cup each)","time":"10 min","intro":"Smooth, lemony hummus from one tin of chickpeas, for a fraction of the price of bought. Use it for Hummus & Vegetable Sticks, wraps or kofta.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 can (400 g) chickpeas, drained (keep the liquid)"},{"text":"2 tbsp tahini (or 1 tbsp peanut butter)"},{"text":"1 garlic clove, crushed"},{"text":"Juice of 1 lemon"},{"text":"2 tbsp olive oil"},{"text":"½ tsp ground cumin"},{"text":"¼ tsp salt"},{"text":"Smoked paprika, to serve (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Put the chickpeas, tahini, garlic, lemon juice, olive oil, cumin and salt in a blender or food processor."},{"text":"Blend, adding the reserved chickpea liquid 1 tbsp at a time, until very smooth — usually 2–4 tbsp."},{"text":"Taste and add more lemon or salt if needed."},{"text":"Spoon into a bowl, drizzle with a little oil and sprinkle with paprika."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Tahini is the traditional flavour. Peanut butter is a cheaper swap that still tastes good."},{"text":"Keeps 4–5 days in a sealed container in the fridge."},{"text":"For extra-smooth hummus, blend for a full 3–4 minutes."}]}],"id":"Snacks-Homemade_Hummus","file":"Snacks/Homemade_Hummus.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["1 can (400 g) chickpeas, drained (keep the liquid)","2 tbsp tahini (or 1 tbsp peanut butter)","1 garlic clove, crushed","Juice of 1 lemon","2 tbsp olive oil","½ tsp ground cumin","¼ tsp salt","Smoked paprika, to serve (optional)"],"shop":[{"key":"chickpeas","name":"Chickpeas","aisle":"Cans, jars & pulses","qty":1.0,"unit":"can","optional":false,"raw":"1 can (400 g) chickpeas, drained (keep the liquid)"},{"key":"tahini","name":"Tahini","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp tahini (or 1 tbsp peanut butter)"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":1.0,"unit":"clove","optional":false,"raw":"1 garlic clove, crushed"},{"key":"lemon","name":"Lemons","aisle":"Fruit & veg","qty":1.0,"unit":"","optional":false,"raw":"Juice of 1 lemon"},{"key":"olive-oil","name":"Olive oil","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp olive oil"},{"key":"cumin","name":"Ground cumin","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp ground cumin"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":0.25,"unit":"tsp","optional":false,"raw":"¼ tsp salt"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Smoked paprika, to serve (optional)"}],"tags":[],"nutrition":{"kcal":130,"protein":4,"carbs":9,"fat":8,"per":"serving","count":6},"diet":["vegetarian","dairy-free","quick"],"storage":["Keeps 4–5 days in a sealed container in the fridge."]},{"title":"Homemade Protein Balls","servings":"20","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 cup rolled oats"},{"text":"½ cup natural peanut butter"},{"text":"2 scoops vanilla protein powder"},{"text":"3 tbsp honey"},{"text":"3 tbsp dark chocolate chips"},{"text":"2 tbsp chia seeds"},{"text":"2–4 tbsp milk (to bind if needed)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Mix all ingredients together in a large bowl until well combined."},{"text":"If the mixture is too dry to hold together, add milk one tablespoon at a time."},{"text":"Refrigerate the mixture for 20–30 minutes to firm up."},{"text":"Roll into 20 balls (about the size of a large marble)."},{"text":"Store in an airtight container in the fridge for up to 2 weeks, or freeze for up to 2 months."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 0.50/ball (makes 20), 130 kcal/ball, 8 g/ball protein per serve."},{"text":"**Tip:** Eat 2–3 balls as a snack (260–390 kcal, 16–24 g protein). These are great to batch make once a fortnight. Swap peanut butter for almond butter or add desiccated coconut for variety."}]}],"id":"Snacks-Homemade_Protein_Balls","file":"Snacks/Homemade_Protein_Balls.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["1 cup rolled oats","½ cup natural peanut butter","2 scoops vanilla protein powder","3 tbsp honey","3 tbsp dark chocolate chips","2 tbsp chia seeds","2–4 tbsp milk (to bind if needed)"],"shop":[{"key":"oats","name":"Rolled oats","aisle":"Pasta, rice & grains","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup rolled oats"},{"key":"peanut-butter","name":"Peanut butter","aisle":"Pantry: check first","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup natural peanut butter"},{"key":"protein-powder","name":"Protein powder","aisle":"Pantry: check first","qty":2.0,"unit":"scoop","optional":false,"raw":"2 scoops vanilla protein powder"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp honey"},{"key":"choc-chips","name":"Chocolate chips","aisle":"Baking","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp dark chocolate chips"},{"key":"chia","name":"Chia seeds","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp chia seeds"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":4.0,"unit":"tbsp","optional":false,"raw":"2–4 tbsp milk (to bind if needed)"}],"tags":[],"nutrition":{"kcal":90,"protein":5,"carbs":8,"fat":5,"per":"serving","count":20},"diet":["freezes","vegetarian"],"storage":[]},{"title":"Hummus & Vegetable Sticks","servings":"1","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"½ cup hummus (store-bought or homemade)"},{"text":"2 carrots, cut into sticks"},{"text":"2 stalks celery, cut into sticks"},{"text":"½ capsicum, cut into strips"},{"text":"½ cucumber, cut into sticks"}]},{"kind":"steps","heading":"Method","items":[{"text":"Wash and cut all vegetables into dipping sticks."},{"text":"Portion hummus into a small container."},{"text":"Dip and enjoy."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 1.10/serve, 200 kcal, 9 g protein per serve."},{"text":"**Tip:** Prep a container of cut vegetables at the start of the week and keep in the fridge — it removes all friction from choosing this as a snack. Bluebird hummus is cheap and widely available at Pak'nSave."}]}],"id":"Snacks-Hummus_and_Vegetable_Sticks","file":"Snacks/Hummus_and_Vegetable_Sticks.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["½ cup hummus (store-bought or homemade)","2 carrots, cut into sticks","2 stalks celery, cut into sticks","½ capsicum, cut into strips","½ cucumber, cut into sticks"],"shop":[{"key":"hummus","name":"Hummus","aisle":"Dairy, eggs & chilled","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup hummus (store-bought or homemade)"},{"key":"carrot","name":"Carrots","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 carrots, cut into sticks"},{"key":"celery","name":"Celery","aisle":"Fruit & veg","qty":2.0,"unit":"stalk","optional":false,"raw":"2 stalks celery, cut into sticks"},{"key":"capsicum","name":"Capsicums","aisle":"Fruit & veg","qty":0.5,"unit":"","optional":false,"raw":"½ capsicum, cut into strips"},{"key":"cucumber","name":"Cucumber","aisle":"Fruit & veg","qty":0.5,"unit":"","optional":false,"raw":"½ cucumber, cut into sticks"}],"tags":[],"nutrition":{"kcal":520,"protein":13,"carbs":53,"fat":30,"per":"serving","count":1},"diet":["vegetarian","dairy-free"],"storage":["Tip: Prep a container of cut vegetables at the start of the week and keep in the fridge — it removes all friction from choosing this as a snack."]},{"title":"Microwave Mug Omelette","servings":"1","time":"3 min","intro":"A hot, high-protein snack in a mug in under three minutes. Roughly 20 g protein.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"2 eggs"},{"text":"2 tbsp milk"},{"text":"2 tbsp grated tasty cheese"},{"text":"30 g ham, diced (or 2 tbsp leftover cooked mince)"},{"text":"Small handful of baby spinach, chopped"},{"text":"Salt and black pepper"}]},{"kind":"steps","heading":"Method","items":[{"text":"Grease a large microwave-safe mug."},{"text":"Whisk the eggs and milk in the mug with a fork. Stir in the cheese, ham, spinach, salt and pepper."},{"text":"Microwave on high for 45 seconds. Stir."},{"text":"Microwave for another 30–45 seconds, until puffed and just set in the middle."},{"text":"Leave for 30 seconds before eating — it keeps cooking."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Microwaves vary. Start with shorter times; the eggs should be set, not rubbery."},{"text":"Use a mug at least twice the volume of the mixture — it rises while cooking."}]}],"id":"Snacks-Microwave_Mug_Omelette","file":"Snacks/Microwave_Mug_Omelette.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["2 eggs","2 tbsp milk","2 tbsp grated tasty cheese","30 g ham, diced (or 2 tbsp leftover cooked mince)","Small handful of baby spinach, chopped","Salt and black pepper"],"shop":[{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":2.0,"unit":"","optional":false,"raw":"2 eggs"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp milk"},{"key":"cheese","name":"Tasty cheese","aisle":"Dairy, eggs & chilled","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp grated tasty cheese"},{"key":"ham","name":"Ham","aisle":"Meat & fish","qty":30.0,"unit":"g","optional":false,"raw":"30 g ham, diced (or 2 tbsp leftover cooked mince)"},{"key":"spinach","name":"Baby spinach","aisle":"Fruit & veg","qty":null,"unit":"","optional":false,"raw":"Small handful of baby spinach, chopped"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":null,"unit":"","optional":true,"raw":"Salt and black pepper"}],"tags":["pork","mince"],"nutrition":{"kcal":270,"protein":24,"carbs":3,"fat":17,"per":"serving","count":1},"diet":["quick","leftovers"],"storage":[]},{"title":"Oven Beef Jerky","servings":"8 (about 25 g each)","time":"15 min prep + marinating + 3–4 hr drying","intro":"Chewy, smoky jerky made in a normal oven. Much cheaper than bought jerky and very high in protein. Roughly 14 g protein per 25 g serve.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"500 g lean beef (topside or rump), trimmed of all visible fat"},{"group":"Marinade"},{"text":"¼ cup reduced-salt soy sauce"},{"text":"1 tbsp Worcestershire sauce"},{"text":"1 tbsp brown sugar"},{"text":"1 tsp smoked paprika"},{"text":"1 tsp garlic powder"},{"text":"½ tsp onion powder"},{"text":"½ tsp black pepper"},{"text":"½ tsp chilli flakes (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Slice.** Freeze the beef for about 1 hour until firm, then slice into 3–5 mm strips. Slice along the grain for chewy jerky, across it for more tender jerky."},{"text":"**Marinate.** Mix the marinade in a container, add the beef and toss to coat. Cover and refrigerate for 4–24 hours."},{"text":"**Prepare the oven.** Heat the oven to 80°C (or 70°C fan bake). Set wire racks over lined oven trays."},{"text":"**Dry.** Pat the strips dry with paper towels and lay them on the racks without touching. Dry for 3–4 hours with the oven door propped open slightly with a wooden spoon, turning once, until the jerky bends and cracks but doesn't snap."},{"text":"**Make it safe.** Turn the oven up to 135°C and heat the jerky for 10 minutes. This kills any bacteria the low drying temperature might not."},{"text":"Cool completely before storing."}]},{"kind":"notes","heading":"Notes","items":[{"text":"The final 10 minutes at 135°C follows US food-safety (USDA) advice for home-dried meat. Don't skip it."},{"text":"Store in an airtight container in the fridge for up to 2 weeks."},{"text":"500 g raw beef makes roughly 200 g of jerky."}]}],"id":"Snacks-Oven_Beef_Jerky","file":"Snacks/Oven_Beef_Jerky.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["500 g lean beef (topside or rump), trimmed of all visible fat","¼ cup reduced-salt soy sauce","1 tbsp Worcestershire sauce","1 tbsp brown sugar","1 tsp smoked paprika","1 tsp garlic powder","½ tsp onion powder","½ tsp black pepper","½ tsp chilli flakes (optional)"],"shop":[{"key":"steak","name":"Beef steak (rump or topside)","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g lean beef (topside or rump), trimmed of all visible fat"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":0.25,"unit":"cup","optional":false,"raw":"¼ cup reduced-salt soy sauce"},{"key":"worcestershire","name":"Worcestershire sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp Worcestershire sauce"},{"key":"brown-sugar","name":"Brown sugar","aisle":"Baking","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp brown sugar"},{"key":"smoked-paprika","name":"Smoked paprika","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp smoked paprika"},{"key":"garlic-powder","name":"Garlic powder","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp garlic powder"},{"key":"onion-powder","name":"Onion powder","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp onion powder"},{"key":"pepper","name":"Black pepper","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp black pepper"},{"key":"chilli-flakes","name":"Chilli flakes","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optional":true,"raw":"½ tsp chilli flakes (optional)"}],"tags":["beef"],"nutrition":{"kcal":100,"protein":15,"carbs":3,"fat":3,"per":"serving","count":8},"diet":["dairy-free"],"storage":["Store in an airtight container in the fridge for up to 2 weeks."]},{"title":"Parmesan & Garlic Popcorn","servings":"4","time":"10 min","intro":"A big bowl of savoury popcorn made on the stove for well under a dollar. Lower in protein than the other snacks (about 4 g per serve) but cheap, filling and high in fibre.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"½ cup popcorn kernels"},{"text":"1 tbsp oil"},{"text":"20 g butter"},{"text":"½ tsp garlic powder"},{"text":"30 g parmesan, finely grated"},{"text":"¼ tsp salt"}]},{"kind":"steps","heading":"Method","items":[{"text":"Heat the oil and 3 kernels in a large pot with a lid over medium-high heat."},{"text":"When those kernels pop, add the rest in a single layer, cover and take off the heat for 30 seconds (this helps them all pop at once)."},{"text":"Return to the heat. Shake the pot gently as they pop, keeping the lid slightly ajar to let steam out."},{"text":"When the popping slows to 2–3 seconds between pops, tip into a large bowl."},{"text":"Melt the butter with the garlic powder and drizzle over. Toss with the parmesan and salt."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Plain popcorn kernels are much cheaper than microwave bags."},{"text":"Other toppings: smoked paprika and salt, or cinnamon and a little sugar."}]}],"id":"Snacks-Parmesan_Garlic_Popcorn","file":"Snacks/Parmesan_Garlic_Popcorn.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["½ cup popcorn kernels","1 tbsp oil","20 g butter","½ tsp garlic powder","30 g parmesan, finely grated","¼ tsp salt"],"shop":[{"key":"popcorn","name":"Popcorn kernels","aisle":"Pasta, rice & grains","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup popcorn kernels"},{"key":"oil","name":"Cooking oil","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp oil"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":20.0,"unit":"g","optional":false,"raw":"20 g butter"},{"key":"garlic-powder","name":"Garlic powder","aisle":"Pantry: check first","qty":0.5,"unit":"tsp","optio ,"raw":"Pinch of cinnamon"}],"tags":[],"nutrition":{"kcal":400,"protein":11,"carbs":56,"fat":17,"per":"serving","count":1},"diet":["freezes","vegetarian","dairy-free"],"storage":[]},{"title":"Pork Mince Rice Paper Rolls","servings":"4 (16 rolls)","time":"30 min","intro":"Fresh Vietnamese-style rolls with gingery pork mince, noodles and crunchy veg. A filling snack or light lunch. Roughly 25 g protein per serve of 4 rolls.","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Pork filling"},{"text":"500 g pork mince"},{"text":"2 garlic cloves, crushed"},{"text":"1 tbsp grated ginger"},{"text":"2 tbsp soy sauce"},{"text":"1 tbsp fish sauce"},{"text":"1 tsp sugar"},{"group":"Rolls"},{"text":"100 g rice vermicelli noodles"},{"text":"16 rice paper sheets"},{"text":"8 lettuce leaves, torn"},{"text":"1 carrot, cut into thin sticks"},{"text":"½ cucumber, cut into thin sticks"},{"text":"Handful of mint and coriander leaves"},{"group":"Dipping sauce"},{"text":"2 tbsp hoisin sauce"},{"text":"1 tbsp peanut butter"},{"text":"2–3 tbsp warm water"}]},{"kind":"steps","heading":"Method","items":[{"text":"**Pork.** Fry the pork in a frying pan over high heat, breaking it up, until browned and cooked through. Add the garlic and ginger for 1 minute, then the soy, fish sauce and sugar. Cook until any liquid has evaporated. Cool."},{"text":"**Noodles.** Soak the vermicelli in boiling water for 3–4 minutes, drain, rinse under cold water and drain well."},{"text":"**Sauce.** Whisk the hoisin, peanut butter and warm water until smooth."},{"text":"**Roll.** Dip one rice paper sheet in warm water for about 10 seconds until just soft, and lay it on a damp board. Put a little lettuce, noodles, carrot, cucumber, herbs and 2 tbsp of pork across the lower third. Fold in the sides and roll up tightly."},{"text":"Repeat with the rest, keeping finished rolls under a damp tea towel. Serve with the dipping sauce."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Best eaten the day they're made. To pack for lunch, wrap each roll in cling film so they don't stick together."},{"text":"The rice paper keeps softening after you take it out of the water, so don't over-soak it."}]}],"id":"Snacks-Pork_Rice_Paper_Rolls","file":"Snacks/Pork_Rice_Paper_Rolls.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["500 g pork mince","2 garlic cloves, crushed","1 tbsp grated ginger","2 tbsp soy sauce","1 tbsp fish sauce","1 tsp sugar","100 g rice vermicelli noodles","16 rice paper sheets","8 lettuce leaves, torn","1 carrot, cut into thin sticks","½ cucumber, cut into thin sticks","Handful of mint and coriander leaves","2 tbsp hoisin sauce","1 tbsp peanut butter","2–3 tbsp warm water"],"shop":[{"key":"pork-mince","name":"Pork mince","aisle":"Meat & fish","qty":500.0,"unit":"g","optional":false,"raw":"500 g pork mince"},{"key":"garlic","name":"Garlic","aisle":"Fruit & veg","qty":2.0,"unit":"clove","optional":false,"raw":"2 garlic cloves, crushed"},{"key":"ginger","name":"Fresh ginger","aisle":"Fruit & veg","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp grated ginger"},{"key":"soy-sauce","name":"Soy sauce","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp soy sauce"},{"key":"fish-sauce","name":"Fish sauce","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp fish sauce"},{"key":"sugar","name":"White sugar","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp sugar"},{"key":"rice-noodles","name":"Rice noodles","aisle":"Pasta, rice & grains","qty":100.0,"unit":"g","optional":false,"raw":"100 g rice vermicelli noodles"},{"key":"rice-paper","name":"Rice paper sheets","aisle":"Pasta, rice & grains","qty":16.0,"unit":"","optional":false,"raw":"16 rice paper sheets"},{"key":"lettuce","name":"Lettuce or salad leaves","aisle":"Fruit & veg","qty":8.0,"unit":"","optional":false,"raw":"8 lettuce leaves, torn"},{"key":"carrot","name":"Carrots","aisle":"F zen corn)"},{"text":"3 eggs"},{"text":"½ cup self-raising flour"},{"text":"¼ cup milk"},{"text":"½ cup grated tasty cheese"},{"text":"2 spring onions, sliced"},{"text":"Black pepper"},{"text":"1 tbsp oil, for frying"},{"text":"Sweet chilli sauce or Greek yoghurt, to serve"}]},{"kind":"steps","heading":"Method","items":[{"text":"Whisk the eggs and milk in a bowl, then stir in the flour until smooth."},{"text":"Fold in the tuna, corn, cheese, spring onion and a good grind of pepper."},{"text":"Heat a little oil in a large frying pan over medium heat."},{"text":"Drop in ¼-cup scoops of mixture, flatten slightly, and cook for 2–3 minutes each side until golden and set in the middle."},{"text":"Drain on paper towels and repeat with the rest, adding a little oil as needed."},{"text":"Serve with sweet chilli sauce or a spoonful of Greek yoghurt."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Freeze cooked fritters with baking paper between them. Reheat in a frying pan or the microwave."},{"text":"Swap the tuna for 1 can (415 g) salmon, drained and flaked."}]}],"id":"Snacks-Tuna_Sweetcorn_Fritters","file":"Snacks/Tuna_Sweetcorn_Fritters.tex","chapter":"snacks","chapterName":"Snacks","group":null,"ingredients":["2 cans (185 g) tuna in springwater, drained","1 can (410 g) whole kernel corn, drained (or 1½ cups frozen corn)","3 eggs","½ cup self-raising flour","¼ cup milk","½ cup grated tasty cheese","2 spring onions, sliced","Black pepper","1 tbsp oil, for frying","Sweet chilli sauce or Greek yoghurt, to serve"],"shop":[{"key":"tuna","name":"Tuna","aisle":"Cans, jars & pulses","qty":2.0,"unit":"can","optional":false,"raw":"2 cans (185 g) tuna in springwater, drained"},{"key":"corn","name":"Corn (frozen or canned)","aisle":"Frozen","qty":1.0,"unit":"can","optional":false,"raw":"1 can (410 g) whole kernel corn, drained (or 1½ cups frozen corn)"},{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":3.0,"unit":"","optional":false,"raw":"3 eggs"},{"key":"sr-f in shakes. Available in large bags at Pak'nSave. Swap mango for frozen pineapple for variety."}]}],"id":"Shakes-Mango_and_Coconut_Tropical_Shake","file":"Shakes/Mango_and_Coconut_Tropical_Shake.tex","chapter":"shakes","chapterName":"Protein Shakes","group":null,"ingredients":["1 scoop vanilla protein powder","1 cup frozen mango chunks","200 ml coconut milk (light)","100 ml water or milk","Juice of ½ lime","4–5 ice cubes"],"shop":[{"key":"protein-powder","name":"Protein powder","aisle":"Pantry: check first","qty":1.0,"unit":"scoop","optional":false,"raw":"1 scoop vanilla protein powder"},{"key":"mango","name":"Mango","aisle":"Fruit & veg","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup frozen mango chunks"},{"key":"coconut-milk","name":"Coconut milk","aisle":"Cans, jars & pulses","qty":0.5,"unit":"can","optional":false,"raw":"200 ml coconut milk (light)"},{"key":"lime","name":"Limes","aisle":"Fruit & veg","qty":0.5,"unit":"","optional":false,"raw":"Juice of ½ lime"}],"tags":[],"nutrition":{"kcal":560,"protein":27,"carbs":35,"fat":36,"per":"serving","count":1},"diet":["vegetarian"],"storage":[]},{"title":"Vanilla Cinnamon Shake","servings":"1","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 scoop vanilla protein powder"},{"text":"300 ml milk"},{"text":"1 tsp cinnamon"},{"text":"½ tsp vanilla essence"},{"text":"1 tsp honey or maple syrup"},{"text":"4–5 ice cubes"}]},{"kind":"steps","heading":"Method","items":[{"text":"Add all ingredients to a blender or shaker bottle."},{"text":"Blend or shake vigorously until combined."},{"text":"Pour over ice and drink immediately."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 1.20/shake, 310 kcal, 32 g protein per serve."},{"text":"**Tip:** The simplest shake in the book — works in a shaker bottle with no blender needed. Great for days when you just want something quick and simple."}]}],"id":"Shakes-Vanilla_Cinnamon_Shake","file":"Shakes/Vanilla_Cinnamon_Shake.tex","chapter":"shakes","chapterName":"Protein Shakes","group":null,"ingredients":["1 scoop vanilla protein powder","300 ml milk","1 tsp cinnamon","½ tsp vanilla essence","1 tsp honey or maple syrup","4–5 ice cubes"],"shop":[{"key":"protein-powder","name":"Protein powder","aisle":"Pantry: check first","qty":1.0,"unit":"scoop","optional":false,"raw":"1 scoop vanilla protein powder"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":300.0,"unit":"ml","optional":false,"raw":"300 ml milk"},{"key":"cinnamon","name":"Ground cinnamon","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp cinnamon"},{"key":"vanilla","name":"Vanilla essence","aisle":"Baking","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp vanilla essence"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp honey or maple syrup"}],"tags":[],"nutrition":{"kcal":340,"protein":33,"carbs":24,"fat":12,"per":"serving","count":1},"diet":["vegetarian"],"storage":[]},{"title":"Baked Cinnamon Apples","servings":"–","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"2 large apples, cored"},{"text":"2 tbsp rolled oats"},{"text":"1 tbsp honey"},{"text":"1 tsp cinnamon"},{"text":"1 tsp butter"},{"text":"Pinch of nutmeg"},{"text":"**To serve:** Greek yoghurt"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 180°C."},{"text":"Core apples, leaving the base intact. Place in a small baking dish."},{"text":"Mix oats, honey, cinnamon, butter, and nutmeg together. Spoon into the hollow of each apple."},{"text":"Add a splash of water to the base of the dish."},{"text":"Bake for 25–30 minutes until apples are tender and filling is golden."},{"text":"Serve warm with a generous dollop of Greek yoghurt."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 0.80/serve, 180 kcal, 5 g protein per serve."},{"text":"**Tip:** Feels indulgent but is incredibly wholesome. Royal Gala or Granny Smith apples work best. A great dessert for cold evenings."}]}],"id":"Desserts-Baked_Cinnamon_Apples","file":"Desserts/Baked_Cinnamon_Apples.tex","chapter":"desserts","chapterName":"Desserts","group":null,"ingredients":["2 large apples, cored","2 tbsp rolled oats","1 tbsp honey","1 tsp cinnamon","1 tsp butter","Pinch of nutmeg","**To serve:** Greek yoghurt"],"shop":[{"key":"apple","name":"Apples","aisle":"Fruit & veg","qty":2.0,"unit":"","optional":false,"raw":"2 large apples, cored"},{"key":"oats","name":"Rolled oats","aisle":"Pasta, rice & grains","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp rolled oats"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp honey"},{"key":"cinnamon","name":"Ground cinnamon","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp cinnamon"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp butter"},{"key":"nutmeg","name":"Nutmeg","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Pinch of nutmeg"},{"key":"greek-yoghurt","name":"Greek yoghurt","aisle":"Dairy, eggs & chilled","qty":null,"unit":"","optional":true,"raw":"To serve: Greek yoghurt"}],"tags":[],"nutrition":null,"diet":["vegetarian"],"storage":[]},{"title":"Banana Nice Cream","servings":"–","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"3 ripe bananas, peeled, sliced, and frozen overnight"},{"text":"½ scoop vanilla protein powder"},{"text":"2 tbsp peanut butter or cocoa powder (choose your flavour)"},{"text":"2–3 tbsp milk (as needed)"},{"text":"**Optional toppings:** dark chocolate chips, granola, sliced banana"}]},{"kind":"steps","heading":"Method","items":[{"text":"Add frozen banana slices to a blender or food processor."},{"text":"Blend, scraping down the sides as needed, until smooth and creamy (2–3 minutes)."},{"text":"Add protein powder and peanut butter or cocoa. Blend again until combined. Add a splash of milk if the mixture is too thick to blend."},{"text":"Serve immediately as soft-serve, or freeze for 30 minutes for a firmer consistency."},{"text":"Top with chocolate chips, granola, or fresh banana."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 0.60/serve, 210 kcal, 8 g protein per serve."},{"text":"**Tip:** Only works with completely frozen bananas — the riper and more spotted, the sweeter the result. Keep a bag of frozen bananas in the freezer at all times for both shakes and this dessert."}]}],"id":"Desserts-Banana_Nice_Cream","file":"Desserts/Banana_Nice_Cream.tex","chapter":"desserts","chapterName":"Desserts","group":null,"ingredients":["3 ripe bananas, peeled, sliced, and frozen overnight","½ scoop vanilla protein powder","2 tbsp peanut butter or cocoa powder (choose your flavour)","2–3 tbsp milk (as needed)","**Optional toppings:** dark chocolate chips, granola, sliced banana"],"shop":[{"key":"banana","name":"Bananas","aisle":"Fruit & veg","qty":3.0,"unit":"","optional":false,"raw":"3 ripe bananas, peeled, sliced, and frozen overnight"},{"key":"protein-powder","name":"Protein powder","aisle":"Pantry: check first","qty":0.5,"unit":"scoop","optional":false,"raw":"½ scoop vanilla protein powder"},{"key":"peanut-butter","name":"Peanut butter","aisle":"Pantry: check first","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp peanut butter or cocoa powder (choose your flavour)"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":3.0,"unit":"tbsp","optional":false,"raw":"2–3 tbsp milk (as needed)"},{"key":"choc-chips","name":"Chocolate chips","aisle":"Baking","qty":null,"unit":"","optional":true,"raw":"Optional toppings: dark chocolate chips, granola, sliced banana"},{"key":"granola","name":"Granola","aisle":"Pasta, rice & grains","qty":null,"unit":"","optional":true,"raw":"Optional toppings: dark chocolate chips, granola, sliced banana"},{"key":"banana","name":"Bananas","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Optional toppings: dark chocolate chips, granola, sliced banana"}],"tags":[],"nutrition":null,"diet":["freezes","vegetarian"],"storage":["Keep a bag of frozen bananas in the freezer at all times for both shakes and this dessert."]},{"title":"Chocolate Protein Mug Cake","servings":"–","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1 scoop chocolate protein powder"},{"text":"2 tbsp cocoa powder"},{"text":"1 egg"},{"text":"3 tbsp milk"},{"text":"1 tbsp honey or maple syrup"},{"text":"½ tsp baking powder"},{"text":"Pinch of salt"},{"text":"1 tbsp dark chocolate chips (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Mix all dry ingredients together in a large microwave-safe mug."},{"text":"Add egg, milk, and honey. Mix until smooth with no lumps."},{"text":"Stir in chocolate chips if using."},{"text":"Microwave on high for 60–90 seconds. Check at 60 seconds — it should be just set in the centre."},{"text":"Allow to cool for 1–2 minutes before eating directly from the mug."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 0.90/serve, 280 kcal, 26 g protein per serve."},{"text":"**Tip:** Don't overcook it — it will go rubbery. It's ready when the top is just set but still slightly moist. Top with a spoonful of Greek yoghurt for an extra protein boost."}]}],"id":"Desserts-Chocolate_Protein_Mug_Cake","file":"Desserts/Chocolate_Protein_Mug_Cake.tex","chapter":"desserts","chapterName":"Desserts","group":null,"ingredients":["1 scoop chocolate protein powder","2 tbsp cocoa powder","1 egg","3 tbsp milk","1 tbsp honey or maple syrup","½ tsp baking powder","Pinch of salt","1 tbsp dark chocolate chips (optional)"],"shop":[{"key":"protein-powder","name":"Protein powder","aisle":"Pantry: check first","qty":1.0,"unit":"scoop","optional":false,"raw":"1 scoop chocolate protein powder"},{"key":"cocoa","name":"Cocoa powder","aisle":"Baking","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp cocoa powder"},{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":1.0,"unit":"","optional":false,"raw":"1 egg"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp milk"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp honey or maple syrup"},{"key":"baking-powder","name":"Baking powder","aisle":"Baking","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp baking powder"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Pinch of salt"},{"key":"choc-chips","name":"Chocolate chips","aisle":"Baking","qty":1.0,"unit":"tbsp","optional":true,"raw":"1 tbsp dark chocolate chips (optional)"}],"tags":[],"nutrition":null,"diet":["freezes","vegetarian"],"storage":[]},{"title":"Chocolate Self-Saucing Pudding","servings":"6","time":"50 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Pudding"},{"text":"1 cup self-raising flour"},{"text":"½ cup white sugar"},{"text":"2 tbsp cocoa powder"},{"text":"½ cup milk"},{"text":"50 g butter, melted"},{"text":"1 egg"},{"text":"1 tsp vanilla essence"},{"group":"Sauce"},{"text":"½ cup brown sugar"},{"text":"4 tbsp cocoa powder"},{"text":"1 tbsp cornflour"},{"text":"2 cups boiling water"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 180°C bake. Grease a 1.5 L (6 cup) ovenproof dish."},{"text":"Sift the flour, sugar and cocoa into a bowl."},{"text":"Whisk the milk, melted butter, egg and vanilla together, then stir into the dry ingredients until smooth. Spread into the dish."},{"text":"Mix the brown sugar, cocoa and cornflour and sprinkle evenly over the batter."},{"text":"Carefully pour the boiling water over the back of a spoon so it covers the top without breaking up the batter. Don't stir."},{"text":"Bake for 35–40 minutes, until the top is firm and springs back. The sauce will have sunk to the bottom."},{"text":"Stand for 5 minutes, then serve with ice cream or yoghurt."}]},{"kind":"notes","heading":"Notes","items":[{"text":"The sauce follows the Edmonds recipe, which uses cornflour so it thickens properly. Serve soon after baking — the sauce soaks into the pudding as it sits. It looks wrong going into the oven — trust it. The water and sugar sink through the batter as it bakes to make the sauce underneath."}]}],"id":"Desserts-Chocolate_Self_Saucing_Pudding","file":"Desserts/Chocolate_Self_Saucing_Pudding.tex","chapter":"desserts","chapterName":"Desserts","group":null,"ingredients":["1 cup self-raising flour","½ cup white sugar","2 tbsp cocoa powder","½ cup milk","50 g butter, melted","1 egg","1 tsp vanilla essence","½ cup brown sugar","4 tbsp cocoa powder","1 tbsp cornflour","2 cups boiling water"],"shop":[{"key":"sr-flour","name":"Self-raising flour","aisle":"Baking","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup self-raising flour"},{"key":"sugar","name":"White sugar","aisle":"Baking","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup white sugar"},{"key":"cocoa","name":"Cocoa powder","aisle":"Baking","qty":2.0,"unit":"tbsp","optional":false,"raw":"2 tbsp cocoa powder"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup milk"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":50.0,"unit":"g","optional":false,"raw":"50 g butter, melted"},{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":1.0,"unit":"","optional":false,"raw":"1 egg"},{"key":"vanilla","name":"Vanilla essence","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp vanilla essence"},{"key":"brown-sugar","name":"Brown sugar","aisle":"Baking","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup brown sugar"},{"key":"cocoa","name":"Cocoa powder","aisle":"Baking","qty":4.0,"unit":"tbsp","optional":false,"raw":"4 tbsp cocoa powder"},{"key":"cornflour","name":"Cornflour","aisle":"Baking","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp cornflour"}],"tags":[],"nutrition":{"kcal":320,"protein":6,"carbs":54,"fat":10,"per":"serving","count":6},"diet":["vegetarian"],"storage":[]},{"title":"Feijoa & Apple Crumble","servings":"6","time":"50 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Fruit"},{"text":"3 apples, peeled, cored and sliced"},{"text":"2 cups feijoa flesh (15–20 feijoas), roughly chopped"},{"text":"2 tbsp white sugar"},{"text":"½ tsp ground cinnamon"},{"text":"¼ cup water"},{"group":"Crumble"},{"text":"1 cup plain flour"},{"text":"½ cup rolled oats"},{"text":"½ cup brown sugar"},{"text":"½ tsp ground cinnamon"},{"text":"100 g cold butter, cubed"},{"text":"¼ cup desiccated coconut (optional)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 180°C bake."},{"text":"Put the apples, sugar, cinnamon and water in a saucepan, cover and simmer for 5 minutes until the apples start to soften. Stir in the feijoas and tip into a baking dish."},{"text":"Rub the butter into the flour, oats, brown sugar and cinnamon with your fingertips until it forms rough crumbs. Stir in the coconut, if using."},{"text":"Scatter the crumble evenly over the fruit."},{"text":"Bake for 30–35 minutes, until golden and the fruit is bubbling at the edges."},{"text":"Serve warm with custard, yoghurt or ice cream."}]},{"kind":"notes","heading":"Notes","items":[{"text":"The topping is in line with Meadow Fresh's and Chelsea's oat crumbles. Pre-cooking the apples means they're soft by the time the topping is golden. Feijoas cook quickly, so they go in raw. Out of season, use all apples or add frozen berries."}]}],"id":"Desserts-Feijoa_Apple_Crumble","file":"Desserts/Feijoa_Apple_Crumble.tex","chapter":"desserts","chapterName":"Desserts","group":null,"ingredients":["3 app erving","count":8},"diet":["freezes","vegetarian"],"storage":["Tip: Keeps in the freezer for up to 2 months."]},{"title":"No-Bake Chocolate Oat Cookies","servings":"18","time":"–","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"2 cups rolled oats"},{"text":"1 scoop chocolate protein powder"},{"text":"½ cup natural peanut butter"},{"text":"½ cup honey"},{"text":"3 tbsp cocoa powder"},{"text":"½ cup milk"},{"text":"1 tsp vanilla essence"},{"text":"Pinch of salt"}]},{"kind":"steps","heading":"Method","items":[{"text":"Combine honey, peanut butter, cocoa powder, and milk in a saucepan over medium heat. Stir until smooth and just beginning to bubble."},{"text":"Remove from heat immediately. Stir in vanilla and salt."},{"text":"Add oats and protein powder. Mix until fully combined."},{"text":"Drop heaped tablespoons onto a baking paper-lined tray."},{"text":"Refrigerate for 1–2 hours until set firm."},{"text":"Store in the fridge for up to 2 weeks."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Approx. 0.40/cookie (makes 18), 140 kcal/cookie, 6 g/cookie protein per serve."},{"text":"**Tip:** Eat 2–3 cookies as a dessert (280–420 kcal, 12–18 g protein). These double as a snack too and are a great alternative to store-bought protein bars which are usually very overpriced."}]}],"id":"Desserts-No_Bake_Chocolate_Oat_Cookies","file":"Desserts/No_Bake_Chocolate_Oat_Cookies.tex","chapter":"desserts","chapterName":"Desserts","group":null,"ingredients":["2 cups rolled oats","1 scoop chocolate protein powder","½ cup natural peanut butter","½ cup honey","3 tbsp cocoa powder","½ cup milk","1 tsp vanilla essence","Pinch of salt"],"shop":[{"key":"oats","name":"Rolled oats","aisle":"Pasta, rice & grains","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups rolled oats"},{"key":"protein-powder","name":"Protein powder","aisle":"Pantry: check first","qty":1.0,"unit":"scoop","optional":false,"raw":"1 scoop chocolate protein powder"},{"key":"peanut-butter","name":"Peanut butter","aisle":"Pantry: check first","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup natural peanut butter"},{"key":"honey","name":"Honey","aisle":"Pantry: check first","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup honey"},{"key":"cocoa","name":"Cocoa powder","aisle":"Baking","qty":3.0,"unit":"tbsp","optional":false,"raw":"3 tbsp cocoa powder"},{"key":"milk","name":"Milk","aisle":"Dairy, eggs & chilled","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup milk"},{"key":"vanilla","name":"Vanilla essence","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp vanilla essence"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Pinch of salt"}],"tags":[],"nutrition":{"kcal":120,"protein":5,"carbs":16,"fat":5,"per":"serving","count":18},"diet":["vegetarian"],"storage":[]},{"title":"Pavlova","servings":"8","time":"20 min + 1 hr 15 min baking + cooling","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"4 egg whites, at room temperature"},{"text":"1 cup caster sugar"},{"text":"1 tsp white vinegar"},{"text":"1 tsp vanilla essence"},{"text":"1 tsp cornflour"},{"group":"To top"},{"text":"300 ml cream, whipped"},{"text":"Seasonal fruit: kiwifruit, strawberries, passionfruit or berries"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 120°C bake (not fan). Draw a 20cm circle on a sheet of baking paper and put it upside down on a tray."},{"text":"Beat the egg whites in a clean, dry bowl until soft peaks form."},{"text":"Add the sugar a spoonful at a time, beating well after each. Keep beating for 8–10 minutes until very thick and glossy and the sugar has dissolved (rub a little between your fingers — it shouldn't feel gritty)."},{"text":"Fold in the vinegar, vanilla and cornflour."},{"text":"Spoon onto the circle and shape into a round with slightly raised sides."},{"text":"Bake for 1 hour 15 minutes. Turn the oven off and leave the pavlova inside with the door closed until completely cold (ideally several hours or overnight)."},{"text":"Just before serving, top with whipped cream and fruit."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Recipes vary on temperature (Edmonds uses 150°C for 45 minutes with 6 whites; Chelsea uses 110°C). 120°C for this 4-white size is a common middle ground. Don't open the oven door while it bakes or cools — sudden temperature changes make it crack and collapse. An un-topped pavlova keeps in an airtight container for 2–3 days. Top only when serving, or it goes soggy."}]}],"id":"Desserts-Pavlova","file":"Desserts/Pavlova.tex","chapter":"desserts","chapterName":"Desserts","group":null,"ingredients":["4 egg whites, at room temperature","1 cup caster sugar","1 tsp white vinegar","1 tsp vanilla essence","1 tsp cornflour","300 ml cream, whipped","Seasonal fruit: kiwifruit, strawberries, passionfruit or berries"],"shop":[{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":4.0,"unit":"","optional":false,"raw":"4 egg whites, at room temperature"},{"key":"caster-sugar","name":"Caster sugar","aisle":"Baking","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup caster sugar"},{"key":"vinegar","name":"Vinegar","aisle":"Pantry: check first","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp white vinegar"},{"key":"vanilla","name":"Vanilla essence","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp vanilla essence"},{"key":"cornflour","name":"Cornflour","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp cornflour"},{"key":"cream","name":"Cream","aisle":"Dairy, eggs & chilled","qty":300.0,"unit":"ml","optional":false,"raw":"300 ml cream, whipped"},{"key":"kiwifruit","name":"Kiwifruit","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Seasonal fruit: kiwifruit, strawberries, passionfruit or berries"},{"key":"berries","name":"Berries","aisle":"Frozen","qty":null,"unit":"","optional":true,"raw":"Seasonal fruit: kiwifruit, strawberries, passionfruit or berries"},{"key":"passionfruit","name":"Passionfruit","aisle":"Fruit & veg","qty":null,"unit":"","optional":true,"raw":"Seasonal fruit: kiwifruit, strawberries, passionfruit or berries"}],"tags":[],"nutrition":{"kcal":270,"protein":4,"carbs":27,"fat":16,"per":"serving","count":8},"diet":["vegetarian"],"storage":["An un-topped pavlova keeps in an airtight container for 2–3 days."]},{"title":"Sticky Date Pudding","servings":"8","time":"1 hr","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"group":"Pudding"},{"text":"1¼ cups pitted dates, chopped"},{"text":"1¼ cups boiling water"},{"text":"1 tsp baking soda"},{"text":"60 g butter, softened"},{"text":"¾ cup brown sugar"},{"text":"2 eggs"},{"text":"1 cup self-raising flour"},{"group":"Butterscotch sauce"},{"text":"2 cups brown sugar"},{"text":"250 ml cream"},{"text":"50 g butter"},{"text":"1 tsp vanilla essence"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 180°C bake (160°C fan). Grease and line a 20cm square cake tin."},{"text":"Put the dates in a bowl, pour over the boiling water and stir in the baking soda (it will foam). Leave for 5 minutes."},{"text":"Cream the butter and brown sugar, then beat in the eggs one at a time."},{"text":"Fold in the flour, then the dates and all their liquid. The batter will be quite runny."},{"text":"Pour into the tin and bake for 35–40 minutes, until a skewer comes out clean."},{"text":"Meanwhile, make the sauce: stir the brown sugar, cream, butter and vanilla in a saucepan over low heat until the sugar dissolves and the butter melts, then simmer for 2–3 minutes."},{"text":"Serve the pudding warm in squares with the sauce poured over."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Quantities follow Chelsea Sugar's sticky date pudding with butterscotch sauce. The sauce makes plenty — leftovers keep in the fridge for a week. The pudding freezes well in portions. Reheat a square in the microwave and pour over warm sauce."}]}],"id":"Desserts-Sticky_Date_Pudding","file":"Desserts/Sticky_Date_Pudding.tex","chapter":"desserts","chapterName":"Desserts","group":null,"ingredients":["1¼ cups pitted dates, chopped","1¼ cups boiling water","1 tsp baking soda","60 g butter, softened","¾ cup brown sugar","2 eggs","1 cup self-raising flour","2 cups brown sugar","250 ml cream","50 g butter","1 tsp vanilla essence"],"shop":[{"key":"dates","name":"Pitted dates","aisle":"Baking","qty":1.25,"unit":"cup","optional":false,"raw":"1¼ cups pitted dates, chopped"},{"key":"baking-soda","name":"Baking soda","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp baking soda"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":60.0,"unit":"g","optional":false,"raw":"60 g butter, softened"},{"key":"brown-sugar","name":"Brown sugar","aisle":"Baking","qty":0.75,"unit":"cup","optional":false,"raw":"¾ cup brown sugar"},{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":2.0,"unit":"","optional":false,"raw":"2 eggs"},{"key":"sr-flour","name":"Self-raising flour","aisle":"Baking","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup self-raising flour"},{"key":"brown-sugar","name":"Brown sugar","aisle":"Baking","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups brown sugar"},{"key":"cream","name":"Cream","aisle":"Dairy, eggs & chilled","qty":250.0,"unit":"ml","optional":false,"raw":"250 ml cream"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":50.0,"unit":"g","optional":false,"raw":"50 g butter"},{"key":"vanilla","name":"Vanilla essence","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp vanilla essence"}],"tags":[],"nutrition":{"kcal":620,"protein":5,"carbs":99,"fat":24,"per":"serving","count":8},"diet":["freezes","vegetarian"],"storage":["The sauce makes plenty — leftovers keep in the fridge for a week.","The pudding freezes well in portions.","Reheat a square in the microwave and pour over warm sauce."]},{"title":"Afghan Biscuits","servings":"24 biscuits","time":"45 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"200 g butter, softened"},{"text":"½ cup white sugar"},{"text":"1¼ cups plain flour"},{"text":"¼ cup cocoa powder"},{"text":"2 cups cornflakes"}]},{"kind":"list","heading":"Chocolate Icing","items":[{"text":"1 cup icing sugar"},{"text":"2 tbsp cocoa powder"},{"text":"1 tsp butter, softened"},{"text":"2–3 tbsp boiling water"},{"text":"A few drops of vanilla essence"},{"text":"Walnut halves, to decorate"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 180°C bake. Line two trays with baking paper."},{"text":"Cream the butter and sugar until light and fluffy."},{"text":"Sift in the flour and cocoa and mix well, then gently fold in the cornflakes — don't crush them too much."},{"text":"Roll tablespoons of mixture into balls, place on the trays and flatten slightly."},{"text":"Bake for 15 minutes. Cool on a wire rack."},{"text":"For the icing, sift the icing sugar and cocoa into a bowl, add the butter, vanilla and enough boiling water to make a thick, spreadable icing."},{"text":"Ice the cooled biscuits and press a walnut half on top of each."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Quantities follow the Edmonds recipe. The biscuits must be completely cold before icing, or the icing will slide off. Use a name-brand cornflake if you can — Edmonds bakers report budget cornflakes turn hard and chewy."}]}],"id":"Baking-Afghan_Biscuits","file":"Baking/Afghan_Biscuits.tex","chapter":"baking","chapterName":"Baking & Breads","group":null,"ingredients":["200 g butter, softened","½ cup white sugar","1¼ cups plain flour","¼ cup cocoa powder","2 cups cornflakes","1 cup icing sugar","2 tbsp cocoa powder","1 tsp butter, softened","2–3 tbsp boiling water","A few drops of vanilla essence","Walnut halves, to decorate"],"shop":[{"key":"butter","name":"Bu led oats in a bowl."},{"text":"Melt the butter and golden syrup together."},{"text":"Dissolve the baking soda in the boiling water and stir it into the butter mixture — it will foam up."},{"text":"Stir the butter mixture into the dry ingredients."},{"text":"Place level tablespoonfuls on the trays and flatten with a fork. They don't spread much, so they can go fairly close together."},{"text":"Bake for about 15 minutes, until golden. Cool on a wire rack."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Quantities follow the Edmonds Cookery Book recipe. Double everything for a bigger batch. For chewy biscuits, use brown sugar and take them out at 10–12 minutes while still slightly soft; they firm up as they cool. If the mixture is too dry to hold together, add another teaspoon of boiling water."}]}],"id":"Baking-ANZAC_Biscuits","file":"Baking/ANZAC_Biscuits.tex","chapter":"baking","chapterName":"Baking & Breads","group":null,"ingredients":["½ cup plain flour","⅓ cup white sugar (or brown sugar for chewy biscuits)","⅔ cup desiccated coconut","¾ cup rolled oats","50 g butter","1 tbsp golden syrup","½ tsp baking soda","2 tbsp boiling water"],"shop":[{"key":"flour","name":"Plain flour","aisle":"Baking","qty":0.5,"unit":"cup","optional":false,"raw":"½ cup plain flour"},{"key":"sugar","name":"White sugar","aisle":"Baking","qty":0.3333333333333333,"unit":"cup","optional":false,"raw":"⅓ cup white sugar (or brown sugar for chewy biscuits)"},{"key":"coconut","name":"Desiccated coconut","aisle":"Baking","qty":0.6666666666666666,"unit":"cup","optional":false,"raw":"⅔ cup desiccated coconut"},{"key":"oats","name":"Rolled oats","aisle":"Pasta, rice & grains","qty":0.75,"unit":"cup","optional":false,"raw":"¾ cup rolled oats"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":50.0,"unit":"g","optional":false,"raw":"50 g butter"},{"key":"golden-syrup","name":"Golden syrup","aisle":"Pantry: check first","qty":1.0,"unit":"tbsp","optional":false,"raw":"1 tbsp golden syrup"},{"key":"baking-soda","name":"Baking soda","aisle":"Baking","qty":0.5,"unit":"tsp","optional":false,"raw":"½ tsp baking soda"}],"tags":[],"nutrition":{"kcal":90,"protein":1,"carbs":10,"fat":5,"per":"serving","count":18},"diet":["freezes","vegetarian","quick"],"storage":[]},{"title":"Apple & Feijoa Crumble Muffins","servings":"12","time":"40 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"2 cups plain flour"},{"text":"4 tsp baking powder"},{"text":"¼ tsp salt"},{"text":"¾ cup white sugar"},{"text":"1 tsp ground cinnamon"},{"text":"1 apple, peeled, cored and diced"},{"text":"1 cup chopped feijoa flesh (6–8 feijoas)"},{"text":"1 egg"},{"text":"1 cup milk"},{"text":"100 g butter, melted"}]},{"kind":"list","heading":"Crumble Topping","items":[{"text":"3 tbsp plain flour"},{"text":"3 tbsp brown sugar"},{"text":"3 tbsp rolled oats"},{"text":"30 g cold butter, cubed"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 200°C bake. Grease or line a 12-hole muffin tin."},{"text":"Make the crumble: rub the butter into the flour, brown sugar and oats with your fingertips until it looks like rough crumbs. Set aside."},{"text":"Sift the flour, baking powder, salt, sugar and cinnamon into a bowl. Stir in the apple and feijoa."},{"text":"Whisk the egg, milk and melted butter together, pour into the dry ingredients and fold until just combined."},{"text":"Spoon into the tin and scatter the crumble over the top, pressing it on lightly."},{"text":"Bake for 18–20 minutes, until golden and a skewer comes out clean."},{"text":"Cool in the tin for 5 minutes before moving to a wire rack."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Out of feijoa season, use 2 apples, or 1 apple and 1 cup frozen berries (added from frozen)."}]}],"id":"Baking-Apple_Feijoa_Crumble_Muffins","file":"Baking/Apple_Feijoa_Crumble_Muffins.tex","chapter":"baking","chapterName":"Baking & Breads","group":null,"ingredients":["2 cups elf-raising flour"},{"text":"1 cup grated tasty cheddar (plus extra to top)"},{"text":"1 cup whole kernel corn, drained (canned or frozen)"},{"text":"2 spring onions, sliced"},{"text":"Black pepper"},{"text":"1 egg"},{"text":"1 cup milk"},{"text":"50 g butter, melted"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 200°C bake. Grease or line a 12-hole muffin tin."},{"text":"Fry the bacon until crisp. Drain on paper towels and cool."},{"text":"Mix the flour, cheese, corn, spring onion, bacon and a good grind of pepper in a bowl."},{"text":"Whisk the egg, milk and melted butter together, pour into the dry ingredients and fold until just combined."},{"text":"Spoon into the tin and sprinkle with a little extra cheese."},{"text":"Bake for 15–18 minutes, until golden and a skewer comes out clean."}]},{"kind":"notes","heading":"Notes","items":[{"text":"Great for lunchboxes. They freeze well — reheat for 20–30 seconds in the microwave."}]}],"id":"Baking-Bacon_Corn_Cheddar_Muffins","file":"Baking/Bacon_Corn_Cheddar_Muffins.tex","chapter":"baking","chapterName":"Baking & Breads","group":null,"ingredients":["3 rashers bacon, diced","2 cups self-raising flour","1 cup grated tasty cheddar (plus extra to top)","1 cup whole kernel corn, drained (canned or frozen)","2 spring onions, sliced","Black pepper","1 egg","1 cup milk","50 g butter, melted"],"shop":[{"key":"bacon","name":"Bacon","aisle":"Meat & fish","qty":3.0,"unit":"rasher","optional":false,"raw":"3 rashers bacon, diced"},{"key":"sr-flour","name":"Self-raising flour","aisle":"Baking","qty":2.0,"unit":"cup","optional":false,"raw":"2 cups self-raising flour"},{"key":"cheese","name":"Tasty cheese","aisle":"Dairy, eggs & chilled","qty":1.0,"unit":"cup","optional":true,"raw":"1 cup grated tasty cheddar (plus extra to top)"},{"key":"corn","name":"Corn (frozen or canned)","aisle":"Frozen","qty":1.0,"unit":"cup","optional":false,"raw":"1 cup whole kernel corn, drained (canned or frozen)"},{"key":"spring-oni lsea's one-bowl banana loaf. The spottier the bananas, the sweeter and moister the loaf. Freeze overripe bananas in their skins and thaw them for this. Slices freeze well — toast them straight from frozen."}]}],"id":"Baking-Banana_Bread","file":"Baking/Banana_Bread.tex","chapter":"baking","chapterName":"Baking & Breads","group":null,"ingredients":["3 very ripe bananas, mashed (about 1¼ cups)","75 g butter, melted","¾ cup brown sugar","1 egg","1 tsp vanilla essence","1 tsp baking soda","Pinch of salt","1½ cups plain flour","½ cup chocolate chips or chopped walnuts (optional)"],"shop":[{"key":"banana","name":"Bananas","aisle":"Fruit & veg","qty":3.0,"unit":"","optional":false,"raw":"3 very ripe bananas, mashed (about 1¼ cups)"},{"key":"butter","name":"Butter","aisle":"Dairy, eggs & chilled","qty":75.0,"unit":"g","optional":false,"raw":"75 g butter, melted"},{"key":"brown-sugar","name":"Brown sugar","aisle":"Baking","qty":0.75,"unit":"cup","optional":false,"raw":"¾ cup brown sugar"},{"key":"eggs","name":"Eggs","aisle":"Dairy, eggs & chilled","qty":1.0,"unit":"","optional":false,"raw":"1 egg"},{"key":"vanilla","name":"Vanilla essence","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp vanilla essence"},{"key":"baking-soda","name":"Baking soda","aisle":"Baking","qty":1.0,"unit":"tsp","optional":false,"raw":"1 tsp baking soda"},{"key":"salt","name":"Salt","aisle":"Pantry: check first","qty":null,"unit":"","optional":false,"raw":"Pinch of salt"},{"key":"flour","name":"Plain flour","aisle":"Baking","qty":1.5,"unit":"cup","optional":false,"raw":"1½ cups plain flour"},{"key":"choc-chips","name":"Chocolate chips","aisle":"Baking","qty":0.5,"unit":"cup","optional":true,"raw":"½ cup chocolate chips or chopped walnuts (optional)"}],"tags":[],"nutrition":{"kcal":230,"protein":3,"carbs":38,"fat":7,"per":"slice","count":10},"diet":["freezes","vegetarian"],"storage":["Freeze overripe bananas in their skins and thaw them for this.","Slices freeze well — toast them straight from frozen."]},{"title":"Banana Chocolate Chip Muffins","servings":"12","time":"30 min","intro":"","sections":[{"kind":"ingredients","heading":"Ingredients","items":[{"text":"1½ cups plain flour (180 g)"},{"text":"1 tsp baking soda"},{"text":"½ tsp salt"},{"text":"⅔ cup sugar (113 g)"},{"text":"1 cup semisweet chocolate chips (plus extra for topping, optional)"},{"text":"3 medium ripe bananas (about 1 cup mashed)"},{"text":"⅓ cup melted butter, slightly cooled (75 g)"},{"text":"1 large egg"},{"text":"1 tsp vanilla essence (5 ml)"}]},{"kind":"steps","heading":"Method","items":[{"text":"Preheat oven to 190°C (375° F). Line a muffin tin with papers."},{"text":"In a bowl, whisk together flour, baking soda, salt, and sugar. Set aside."},{"text":"In a large bowl, mash the bananas. Add egg, melted butter, and vanilla. Mix to combine."},{"text":"Add the dry mixture to the wet ingredients and fold gently until almost combined."},{"text":"Fold in chocolate chips and mix until evenly distributed."},{"text":"Spoon batter into muffin tin and top with extra chocolate chips if desired."},{"text":"Bake for 17–20 minutes, or until a toothpick inserted in the centre comes out clean."}]},{"kind":"notes","heading":"Notes","items":[{"text":"For best results, use ripe bananas (skin mostly brown). Optional additions: ½ cup walnuts or pecans, or ½ tsp cinnamon. Muffins keep 5–7 days in an airtight container or can be frozen for up to 3 months. To ripen bananas quickly: bake whole bananas (in skins) at 180°C for 10 minutes, let cool, then mash."}]}],"id":"Baking-Banana_Chocolate_Chip_Muffins","file":"Baking/Banana_Chocolate_Chip_Muffins.tex","chapter":"baking","chapterName":"Baking & Breads","group":null,"ingredients":["1½ cups plain flour (180 g)","1 tsp baking soda","½ tsp salt","⅔ cup sugar (113 g)","1 cup semisweet chocolate chips (plus extra for topping, optional)","3 medium ripe bananas (about 1 cup mashed)","⅓ cup melted butter, slightly cooled (75 g)","1 large egg","1 tsp v
