<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>George's Meal Planner</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meals">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f2f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111713" media="(prefers-color-scheme: dark)">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one column app shell — sticky header with tabs; the week view is three appliance "burners" side by side, stacking on phones. */
:root {
  --bg: #f2f5f1;
  --surface: #ffffff;
  --sunk: #e8ede8;
  --ink: #17221c;
  --muted: #5a6a61;
  --line: #d6dfd8;
  --accent: #2c6a4d;
  --accent-ink: #ffffff;
  --slow: #b25f17;
  --pressure: #2b5ca3;
  --quick: #367f47;
  --oven: #b0392c;
  --bake: #7a4d9e;
  --other: #66726b;
  --star: #b67a00;
  --shadow: 0 1px 2px rgb(23 34 28 / 6%), 0 4px 14px rgb(23 34 28 / 6%);
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713; --surface: #18201b; --sunk: #202a23; --ink: #e5ede8; --muted: #9aaaa1;
    --line: #2a362f; --accent: #7cc49b; --accent-ink: #0f1a14;
    --slow: #e59a55; --pressure: #7fa8e6; --quick: #7cc48d; --oven: #e98476; --bake: #bb95dc; --other: #a2aea7; --star: #f0b429;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 14px rgb(0 0 0 / 25%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713; --surface: #18201b; --sunk: #202a23; --ink: #e5ede8; --muted: #9aaaa1;
  --line: #2a362f; --accent: #7cc49b; --accent-ink: #0f1a14;
  --slow: #e59a55; --pressure: #7fa8e6; --quick: #7cc48d; --oven: #e98476; --bake: #bb95dc; --other: #a2aea7; --star: #f0b429;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 14px rgb(0 0 0 / 25%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; letter-spacing: -0.01em; }
.sync { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.books { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.books a { color: var(--ink); font-weight: 600; }
.tabs { display: flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tabs .count { font-family: var(--font-mono); font-size: 0.72rem; margin-left: 4px; color: var(--accent); }

main.wrap { padding-block: 20px 48px; display: grid; gap: 28px; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.section-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; }
.section-head p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 10px; font-weight: 600; font-size: 0.88rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn.small { padding: 4px 10px; font-size: 0.8rem; border-radius: 8px; }

/* Method colours: the one place colour carries meaning */
[data-m="slow"] { --m: var(--slow); }
[data-m="pressure"] { --m: var(--pressure); }
[data-m="quick"], [data-m="stovetop"], [data-m="sides"] { --m: var(--quick); }
[data-m="oven"] { --m: var(--oven); }
[data-m="baking"], [data-m="desserts"], [data-m="breadmaker"] { --m: var(--bake); }
[data-m="breakfast"], [data-m="snacks"], [data-m="shakes"], [data-m="extra"] { --m: var(--other); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--m, var(--muted)); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--m, var(--muted)); }

/* Week trio */
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 820px) { .trio { grid-template-columns: 1fr; } }
.slot { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; align-content: start; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.slot::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--m); }
.slot .hint { font-size: 0.8rem; color: var(--muted); margin: -4px 0 0; }
.slot h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; line-height: 1.25; }
.slot h3 button { all: unset; cursor: pointer; }
.slot h3 button:hover { text-decoration: underline; text-underline-offset: 3px; }
.slot h3 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.meta .kcal { color: var(--ink); }
.macros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0 4px; }
.macros div { background: var(--sunk); border-radius: 10px; padding: 8px 10px; }
.macros dt { font-size: 0.72rem; color: var(--muted); }
.macros dd { margin: 0; font-family: var(--font-mono); font-size: 0.95rem; color: var(--ink); }
.macros-note { font-size: 0.75rem; color: var(--muted); margin: 0 0 10px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.badge { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.card .badges { margin-top: 2px; }
.sheet-head .badges { margin-top: 8px; }
.storage { background: var(--sunk); border-radius: 12px; padding: 10px 14px; margin: 4px 0 16px; }
.storage strong { display: block; font-size: 0.8rem; margin-bottom: 4px; }
.storage.dairy li strong { display: inline; font-size: inherit; }
.avoid { font-size: 0.75rem; font-weight: 600; color: var(--oven); }
.sheet-head .avoid { display: block; margin-top: 6px; }
.storage ul { margin: 0; padding-left: 1.1em; font-size: 0.88rem; }
.scale { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 0.85rem; color: var(--muted); }
.scale .fchip { padding: 4px 12px; }
.scale-note { font-size: 0.75rem; color: var(--muted); margin: 6px 0 0; }
.times { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; color: var(--accent); }
.stars { display: inline-flex; align-items: center; gap: 0; }
.stars button { border: 0; background: none; padding: 2px 3px; font-size: 1.25rem; line-height: 1; color: var(--muted); opacity: 0.35; cursor: pointer; }
.stars button[aria-pressed="true"] { color: var(--star); opacity: 1; }
.rate-row { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
.fav { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
.fav[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.fav-mark { color: var(--star); }
.history-line { font-size: 0.8rem; color: var(--muted); margin: 8px 0 0; }
.share-btn { margin-left: 2px; }
.profile { font-size: 0.78rem; color: var(--muted); white-space: nowrap; }
.profile select { font: inherit; font-weight: 600; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px 4px; margin-left: 2px; }
.share-sheet p { color: var(--muted); font-size: 0.92rem; margin: 0 0 12px; }
.share-link { width: 100%; font-family: var(--font-mono); font-size: 0.8rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); color: var(--ink); margin-bottom: 12px; }
.cook { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.cook-top { display: flex; align-items: center; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
.cook-top .title { flex: 1; min-width: 0; font-weight: 600; font-size: 0.9rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cook-progress { height: 4px; background: var(--sunk); border-radius: 2px; max-width: 760px; width: 100%; margin: 10px auto 0; overflow: hidden; }
.cook-progress span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.cook-body { flex: 1; overflow-y: auto; max-width: 760px; width: 100%; margin: 0 auto; padding: 20px 0; }
.cook-label { font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); margin: 0 0 8px; }
.cook-step { font-size: clamp(1.3rem, 4.6vw, 1.9rem); line-height: 1.4; margin: 0 0 18px; }
.cook-step strong { font-weight: 700; }
.cook-uses { background: var(--sunk); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
.cook-uses strong { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
.cook-uses ul { margin: 0; padding-left: 1.1em; font-size: 1.05rem; }
.cook-ready { list-style: none; padding: 0; margin: 0; font-size: 1.1rem; }
.cook-ready li { padding: 8px 0; border-bottom: 1px solid var(--line); }
.cook-ready label { display: flex; gap: 10px; align-items: flex-start; }
.cook-ready input { width: 20px; height: 20px; margin-top: 3px; flex: none; }
.cook-ready .group { font-weight: 700; border: 0; padding-top: 14px; }
.cook-nav { display: flex; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
.cook-nav .btn { flex: 1; padding: 14px; font-size: 1.05rem; }
.timer-chip { font-family: var(--font-mono); font-weight: 600; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 4px 12px; border: 0; }
.timer-chip.done { background: var(--oven); }
.aisle li { position: relative; }
.have { position: absolute; top: 6px; right: 0; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; font-size: 0.72rem; font-weight: 600; padding: 2px 9px; cursor: pointer; }
.aisle > ul > li > label { padding-right: 70px; }
.at-home { margin-top: 14px; }
.at-home summary { cursor: pointer; font-weight: 600; color: var(--muted); }
.at-home p { font-size: 0.85rem; color: var(--muted); margin: 8px 0; }
.at-home ul { list-style: none; padding: 0; margin: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.at-home li button { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 4px 10px; font-size: 0.82rem; cursor: pointer; }
.today { background: var(--surface); border: 1px solid var(--accent); border-radius: 14px; padding: 12px 16px; box-shadow: var(--shadow); }
.today h2 { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 4px; }
.today ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.tasks { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 0.86rem; }
.tasks li { display: grid; grid-template-columns: 4.6rem 1fr; gap: 8px; }
.tasks .at { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); padding-top: 2px; white-space: nowrap; }
.day-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.day { display: grid; grid-template-columns: 5.2rem 1fr; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.day.is-today { border-color: var(--accent); }
.day.empty { background: transparent; border-style: dashed; }
.day-name { font-weight: 700; font-size: 0.9rem; }
.day-name small { display: block; font-weight: 500; color: var(--muted); font-size: 0.75rem; }
.day-body { display: grid; gap: 6px; min-width: 0; }
.day-meal { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; }
.day-meal .title { font-weight: 600; min-width: 0; }
.day-meal .title button { all: unset; cursor: pointer; }
.day-select { font: inherit; font-size: 0.8rem; padding: 3px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.unscheduled { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 14px; border-radius: 12px; background: var(--sunk); font-size: 0.88rem; }
.unscheduled span { font-weight: 600; }
.dinner-at input { font: inherit; font-size: 0.85rem; padding: 3px 6px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }
.week-nutrition { margin: 4px 0 0; font-size: 0.9rem; color: var(--muted); }
.week-nutrition strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.slot .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.slot.empty { border-style: dashed; box-shadow: none; background: transparent; }
.slot.empty .placeholder { color: var(--muted); font-size: 0.92rem; }
.cooked-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); margin-left: auto; }
.slot.is-cooked h3 { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }

.extras { display: grid; gap: 8px; }
.extra-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.extra-row .title { flex: 1; min-width: 0; font-weight: 600; }
.extra-row .title button { all: unset; cursor: pointer; }
.empty-note { color: var(--muted); font-size: 0.9rem; margin: 0; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
.history { display: grid; gap: 6px; font-size: 0.88rem; }
.history li { color: var(--muted); }
.history strong { color: var(--ink); font-weight: 600; }

/* Recipes */
.filters { display: grid; gap: 10px; }
.search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.choosing { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-radius: 12px; background: var(--sunk); font-size: 0.9rem; }
.choosing strong { color: var(--m); }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.card:hover { border-color: var(--muted); }
.card .name { font-weight: 600; font-size: 0.98rem; line-height: 1.3; }
.card .planned { font-size: 0.72rem; font-weight: 700; color: var(--accent); }
.result-count { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Shopping */
.aisles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.aisle { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.aisle h3 { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
.aisle h3 span { font-family: var(--font-mono); letter-spacing: 0; }
.aisle ul { list-style: none; margin: 0; padding: 0; display: grid; }
.aisle input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
.aisle > ul > li { border-top: 1px solid var(--line); padding: 6px 0; }
.aisle > ul > li:first-child { border-top: 0; }
.aisle li label { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; cursor: pointer; border: 0; padding: 0; }
.aisle .txt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.aisle .item-name { font-weight: 600; }
.aisle .amt { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink); background: var(--sunk); padding: 0 6px; border-radius: 6px; }
.aisle .opt { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.aisle details { margin: 2px 0 0 28px; font-size: 0.8rem; color: var(--muted); }
.aisle summary { cursor: pointer; width: fit-content; }
.aisle summary:hover { color: var(--ink); }
.aisle .uses { list-style: none; padding: 4px 0 2px; margin: 0; display: grid; gap: 4px; }
.aisle .from { display: block; font-size: 0.72rem; color: var(--m); font-weight: 700; }
.aisle li.done .item-name, .aisle li.done .amt { text-decoration: line-through; color: var(--muted); }

/* Recipe sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgb(10 16 12 / 45%); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); border-radius: 18px; width: 100%; max-width: 720px; padding: 22px 24px 28px; display: grid; gap: 16px; box-shadow: var(--shadow); border-top: 5px solid var(--m); }
.sheet-head { display: grid; gap: 8px; }
.sheet-head .top-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.65rem; line-height: 1.2; }
.sheet .intro { color: var(--muted); margin: 0; max-width: 65ch; }
.sheet h4 { margin: 6px 0 4px; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--m); }
.sheet ul, .sheet ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; max-width: 65ch; }
.sheet ol > li { padding-left: 4px; }
.sheet li.group { list-style: none; margin: 8px 0 0 -1.3em; font-weight: 700; font-size: 0.9rem; }
.sheet ul ul { margin-top: 4px; }
.sheet p { margin: 0; max-width: 65ch; }
.variation { background: var(--sunk); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.variation h4 { margin-top: 0; }
.sheet .file { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 0.88rem; font-weight: 600; z-index: 30; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise 0.18s ease-out; }

<script>
const RECIPES = /*RECIPES*/[];
const BY_ID = Object.fromEntries(RECIPES.map(r => [r.id, r]));

// ─── Who's planning ─────────────────────────────────────────────────────────
// George plans a slow cooker, pressure cooker and quick meal from every
// recipe. GP plans three easy dinners from the basic recipes only: GP's book,
// plus anything quick and short with no slow cooker or Instant Pot. Each has
// their own week, shopping list, favourites and food log, stored separately
// (on the device, and in their own document when the household is shared).
// "#as=gp" in the link (e.g. on the share link) opens GP's planner.
const PROFILE_KEY = "george-meal-planner-profile";
const PROFILES = { george: { name: "George", suffix: "" }, gp: { name: "GP", suffix: "-gp" } };
const PROFILE = (() => {
  const asked = location.hash.match(/[#&]as=(george|gp)\b/);
  try {
    if (asked) localStorage.setItem(PROFILE_KEY, asked[1]);
    const p = asked ? asked[1] : localStorage.getItem(PROFILE_KEY);
    return PROFILES[p] ? p : "george";
  } catch { return asked ? asked[1] : "george"; }
})();
const GP = PROFILE === "gp";
const SUFFIX = PROFILES[PROFILE].suffix;
const BASIC_MINUTES = 45, BASIC_INGREDIENTS = 14;
function isBasic(r) {
  return !!(r.custom || r.palmer || (!["slow", "pressure"].includes(r.chapter) && r.minutes != null
    && r.minutes <= BASIC_MINUTES && r.ingredients.length <= BASIC_INGREDIENTS));
}
// GP is dairy-free, using these instead. His planner shows the swap on
// recipes, in cooking mode and on his shopping list.
const DAIRY_SWAPS = {
  butter: "Dairy-free margarine", milk: "Lactose-free milk", cheese: "Lactose-free cheese",
  mozzarella: "Lactose-free mozzarella", parmesan: "Lactose-free tasty cheese", feta: "Dairy-free feta",
  halloumi: "Firm tofu (or leave it out)", yoghurt: "Coconut yoghurt", "greek-yoghurt": "Coconut yoghurt",
  "sour-cream": "Coconut yoghurt", cream: "Coconut cream", "cream-cheese": "Dairy-free cream cheese",
  "cottage-cheese": "Dairy-free cream cheese", ricotta: "Dairy-free cream cheese",
  "milk-powder": "Lactose-free milk powder", "protein-powder": "Dairy-free protein powder",
};
const ALREADY_FREE = /lactose[- ]free|dairy[- ]free|margarine|coconut|plant[- ]based|oat milk|soy milk|almond milk/i;
// The recipe's dairy lines that need swapping (lines that already name a
// dairy-free option are left alone).
function dairySwaps(r) {
  const seen = new Set(), sw = mySwaps();
  const done = (i, to) => (DAIRY_SWAPS[i.key] && ALREADY_FREE.test(i.raw)) || i.raw.toLowerCase().includes(to.toLowerCase().split(/ \(| or /)[0]);
  return r.shop.filter(i => sw[i.key] && !done(i, sw[i.key]) && !seen.has(i.key) && seen.add(i.key))
    .map(i => ({ key: i.key, name: i.name, swap: sw[i.key] }));
}
function dairyBox(r) {
  const sw = dairySwaps(r);
  return sw.length ? `<div class="storage dairy"><strong>Your swaps</strong><ul>${sw.map(x => `<li>${esc(x.name)} → <strong>${esc(x.swap.toLowerCase())}</strong></li>`).join("")}</ul></div>` : "";
}
function visibleRecipes() { return GP ? RECIPES.filter(isBasic) : RECIPES; }

const SLOTS = GP ? [
  { key: "d1", label: "Dinner 1", hint: "Easy stovetop or oven", chapters: ["stovetop", "oven"] },
  { key: "d2", label: "Dinner 2", hint: "Easy stovetop or oven", chapters: ["stovetop", "oven"] },
  { key: "d3", label: "Dinner 3", hint: "Easy stovetop or oven", chapters: ["stovetop", "oven"] },
] : [
  { key: "slow", label: "Slow cooker", hint: "Start it in the morning", chapters: ["slow"] },
  { key: "pressure", label: "Pressure cooker", hint: "Instant Pot under pressure", chapters: ["pressure"] },
  { key: "quick", label: "Quick", hint: "Stovetop, sauté or oven", chapters: ["stovetop", "oven"] },
];
const CHAPTERS = [
  ["pressure", "Instant Pot"], ["slow", "Slow cooker"], ["stovetop", "Stovetop"], ["oven", "Oven"],
  ["sides", "Salads & sides"], ["breakfast", "Breakfast"], ["snacks", "Snacks"], ["shakes", "Shakes"],
  ["desserts", "Desserts"], ["baking", "Baking"], ["breadmaker", "Bread maker"],
];
const CHAPTER_LABEL = Object.fromEntries(CHAPTERS);
const DIET = [["freezes", "Freezer-friendly"], ["vegetarian", "Vegetarian"], ["dairy-free", "Dairy-free"], ["quick", "Under 30 min"], ["leftovers", "Uses leftovers"]];
const DIET_LABEL = Object.fromEntries(DIET);
const PROTEINS = [["mince", "Mince"], ["beef", "Beef"], ["pork", "Pork"], ["chicken", "Chicken"], ["fish", "Fish"]];

// ─── State ──────────────────────────────────────────────────────────────────
// Example week shown until a real plan is saved.
const EXAMPLE = GP ? {
  week: mondayOf(new Date()), slots: { d1: null, d2: null, d3: null },
  extras: [], cooked: {}, checked: {}, scale: {}, fav: {}, rating: {}, log: {}, pantry: {}, history: [], example: true,
  leftovers: {}, prices: {}, custom: {}, eaters: 2, waste: [], days: {}, dinner: "18:30",
} : {
  week: mondayOf(new Date()),
  slots: {
    slow: "SlowCooker-Smoky_Chicken_Bean_Lentil_Stew",
    pressure: "InstantPot-Cheeseburger_Macaroni",
    quick: "Stovetop-Pork_Larb",
  },
  extras: [], cooked: {}, checked: {}, scale: {}, fav: {}, rating: {}, log: {}, pantry: {}, history: [], example: true,
  leftovers: {}, prices: {}, custom: {}, eaters: 2, waste: [],
  days: { "SlowCooker-Smoky_Chicken_Bean_Lentil_Stew": 0, "InstantPot-Cheeseburger_Macaroni": 2, "Stovetop-Pork_Larb": 4 },
  dinner: "18:30",
};

let state = clone(EXAMPLE);
let ui = { tab: "week", q: "", chapter: null, group: null, protein: null, choosing: null, minceOnly: false, highProtein: false, diet: [], favOnly: false, open: null, cook: null };
let store = null;        // db document ref, or null
let saveMode = "local";  // "db" | "local" | "none"

function clone(x) { return JSON.parse(JSON.stringify(x)); }
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
}
function prettyWeek(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-NZ", { weekday: "short", day: "numeric", month: "short" });
}
function sanitize(s) {
  const out = Object.assign(clone(EXAMPLE), s || {});
  out.custom = Object.fromEntries(Object.entries(out.custom || {}).filter(([, c]) => c && c.title && Array.isArray(c.ingredients) && Array.isArray(c.method)));
  refreshCustom(out.custom);  // so planned custom recipes survive the checks below
  out.leftovers = out.leftovers || {}; out.prices = out.prices || {};
  out.waste = Array.isArray(out.waste) ? out.waste.slice(-60) : [];
  out.prefs = Object.assign({}, out.prefs);
  for (const k of ["avoid", "favour"]) if (out.prefs[k] && !Array.isArray(out.prefs[k])) delete out.prefs[k];
  out.eaters = [1, 2, 3, 4, 5, 6].includes(out.eaters) ? out.eaters : 2;
  out.slots = Object.fromEntries(SLOTS.map(sl => [sl.key, (out.slots || {})[sl.key] || null]));
  for (const k of Object.keys(out.slots)) if (out.slots[k] && !BY_ID[out.slots[k]]) out.slots[k] = null;
  out.extras = (out.extras || []).filter(id => BY_ID[id]);
  out.cooked = out.cooked || {}; out.checked = out.checked || {}; out.scale = out.scale || {};
  out.fav = out.fav || {}; out.rating = out.rating || {}; out.log = out.log || {}; out.pantry = out.pantry || {};
  out.days = out.days || {}; out.dinner = /^\d\d:\d\d$/.test(out.dinner || "") ? out.dinner : "18:30";
  out.history = (out.history || []).slice(0, 12);
  return out;
}

const LOCAL_KEY = "george-meal-planner" + SUFFIX;
function loadLocal() {
  try { const raw = localStorage.getItem(LOCAL_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
function saveLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); return true; } catch { return false; }
}

let saveTimer = null, saving = false, dirty = false;
function commit(mutator) {
  mutator(state);
  state.example = false;
  render();
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 500);
}
async function flush() {
  if (!dirty) return;
  if (saving) { saveTimer = setTimeout(flush, 300); return; }
  dirty = false;
  if (fb && saveMode === "shared") {
    saving = true;
    saveLocal();
    setSync("Saving…");
    try { await pushShared(); setSync("Shared · up to date"); }
    catch { dirty = true; setSync("Couldn't sync — will retry"); saveTimer = setTimeout(flush, 5000); }
    finally { saving = false; }
  } else if (store && saveMode === "db") {
    saving = true;
    setSync("Saving…");
    try { await store.set(clone(state)); setSync("Synced across your devices"); }
    catch (e) {
      if (e && e.code === "unavailable") { dirty = true; saveTimer = setTimeout(flush, 1500 + Math.random() * 1000); }
      else { saveMode = "local"; saveLocal(); setSync("Saved on this device only"); }
    } finally { saving = false; }
  } else {
    setSync(saveLocal() ? "Saved on this device" : "Not saved — storage is blocked");
  }
}
function setSync(t) { document.getElementById("sync").textContent = t; }

// ─── Sharing between people (Firebase Firestore) ────────────────────────────
// Everyone with the household link reads and writes households/{code}. The
// code is 24 random characters, so the link is the key. Changes go up as
// small field updates (one ticked item, one rating) so two people editing at
// once don't overwrite each other. The device copy in localStorage stays as
// a backup and for offline use.
const SYNC = /*SYNC*/null;
const FIREBASE_VERSION = "10.12.2";
const HOUSE_KEY = "george-meal-planner-household";
const MAP_KEYS = ["checked", "cooked", "scale", "fav", "rating", "log", "pantry", "days", "leftovers", "prices", "custom"];
let fb = null;          // { fs, ref } once connected
let lastSynced = null;  // the state as the server last saw it
function householdCode() { try { return localStorage.getItem(HOUSE_KEY); } catch { return null; } }
function setHouseholdCode(c) { try { if (c) localStorage.setItem(HOUSE_KEY, c); else localStorage.removeItem(HOUSE_KEY); } catch {} }
function newHouseholdCode() {
  const bytes = crypto.getRandomValues(new Uint8Array(24));
  return [...bytes].map(b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
}
function shareLink(code) { return `${location.origin}${location.pathname}#join=${code}&as=${PROFILE}`; }

// [[path...], value] for every part of the state that changed.
function diffState(a, b) {
  const out = [];
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) {
    if (MAP_KEYS.includes(k) && a[k] && b[k]) {
      for (const sk of new Set([...Object.keys(a[k]), ...Object.keys(b[k])]))
        if (JSON.stringify(a[k][sk]) !== JSON.stringify(b[k][sk])) out.push([[k, sk], b[k][sk]]);
    } else if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) out.push([[k], b[k]]);
  }
  return out;
}

async function startSharing(code, { upload = false } = {}) {
  setSync("Connecting…");
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
  const [{ initializeApp }, fs] = await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-firestore.js`)]);
  const ref = fs.doc(fs.getFirestore(initializeApp(SYNC)), "households", code + SUFFIX);
  const snap = await fs.getDoc(ref);
  if (upload || !snap.exists()) {
    await fs.setDoc(ref, { state: clone(state), updated: fs.serverTimestamp() });
    lastSynced = clone(state);
  }
  fb = { fs, ref };
  saveMode = "shared";
  watchOther(fs, ref);
  fs.onSnapshot(ref, snapshot => {
    if (snapshot.metadata.hasPendingWrites || dirty || saving) return;
    const data = snapshot.data();
    if (!data || !data.state) return;
    state = sanitize(data.state);
    lastSynced = clone(state);
    saveLocal();
    render();
    setSync("Shared · up to date");
  }, () => { saveMode = "local"; fb = null; setSync("Sharing paused — saved on this device"); });
}

async function pushShared() {
  const { fs, ref } = fb;
  const args = [];
  for (const [path, value] of diffState(lastSynced || {}, state))
    args.push(new fs.FieldPath("state", ...path), value === undefined ? fs.deleteField() : value);
  if (!args.length) return;
  const sent = clone(state);
  const slow = setTimeout(() => setSync("Waiting for signal to sync…"), 4000);
  try { await fs.updateDoc(ref, ...args, "updated", fs.serverTimestamp()); }
  finally { clearTimeout(slow); }
  lastSynced = sent;
}

// ─── Cooking mode ───────────────────────────────────────────────────────────
// Words that don't identify an ingredient on their own ("sauce" in "soy sauce").
const GENERIC = new Set(["fresh", "ground", "dried", "frozen", "canned", "sauce", "powder", "paste", "mixed", "white", "brown",
  "red", "green", "plain", "or", "and", "the", "can", "cans", "jar", "stock", "seeds", "leaves", "oil"]);
function ingredientWords(item) {
  // Stocks and oils show up in steps as just "stock" or "oil"; "chicken" alone means the meat.
  const end = item.key.match(/(stock|oil)$/);
  if (end) return [end[1]];
  const words = item.key.split("-").filter(w => w.length >= 3 && !GENERIC.has(w));
  return words.length ? words : [item.key.replace(/-/g, " ")];
}
function cookSteps(r) {
  const steps = [];
  const walk = (sections, prefix) => {
    for (const sec of sections) {
      if (sec.kind === "steps") {
        const label = sec.heading && !/^method$/i.test(sec.heading) ? sec.heading : prefix;
        for (const it of sec.items) if (it.text) steps.push({ text: it.text, sub: it.sub || [], label });
      }
    }
  };
  walk(r.sections, "");
  return steps;
}
// Ingredient lines a step mentions, with amounts at the current scale.
function stepUses(r, text, f) {
  const t = plain(text).toLowerCase();
  const out = [];
  for (const item of r.shop) {
    const hit = ingredientWords(item).some(w => new RegExp(`\\b${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(s|es)?\\b`).test(t));
    const line = scaleText(item.raw, f);
    if (hit && !out.includes(line)) out.push(line);
  }
  return out;
}
function stepMinutes(text) {
  const m = plain(text).match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*(minutes?|mins?|hours?|hrs?)\b/i);
  if (!m) return null;
  const n = Number(m[2] || m[1]);
  return /^h/i.test(m[3]) ? n * 60 : n;
}

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if (ui.cook && document.visibilityState === "visible") keepAwake(true); });

let timer = null;  // { end, label, done }
let timerTick = null;
function fmtClock(ms) {
  const sec = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s2 = sec % 60;
  return (h ? `${h}:${String(m).padStart(2, "0")}` : String(m)) + ":" + String(s2).padStart(2, "0");
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25, ctx.currentTime + t);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  } catch {}
}
function startTimer(min, label) {
  timer = { end: Date.now() + min * 60000, label, done: false };
  clearInterval(timerTick);
  timerTick = setInterval(() => {
    if (!timer) return clearInterval(timerTick);
    if (!timer.done && Date.now() >= timer.end) {
      timer.done = true;
      beep();
      navigator.vibrate?.([300, 150, 300, 150, 300]);
      toast(`Timer done: ${timer.label}`);
    }
    const chip = document.getElementById("timer-chip");
    if (chip) { chip.textContent = timer.done ? "Time's up" : fmtClock(timer.end - Date.now()); chip.classList.toggle("done", timer.done); }
  }, 500);
  renderSheet();
}

function cookView() {
  const r = BY_ID[ui.cook.id];
  const f = scaleOf(r.id);
  const steps = cookSteps(r);
  const total = steps.length + 1;  // step 0 is "Get ready"
  const i = Math.min(ui.cook.step, total - 1);
  let body;
  if (i === 0) {
    const items = r.sections.filter(sec => sec.kind === "ingredients").flatMap(sec => sec.items);
    body = `<p class="cook-label">Get ready${f !== 1 ? ` · ${SCALE_LABEL[f]} amounts` : ""}</p>
      ${dairyBox(r)}
      <ul class="cook-ready">${items.map((it, n) => it.group
        ? `<li class="group">${md(it.group)}</li>`
        : `<li><label><input type="checkbox" data-act="cook-have" data-n="${n}" ${ui.cook.have[n] ? "checked" : ""}><span>${md(scaleText(it.text, f))}</span></label></li>`).join("")}</ul>`;
  } else {
    const st = steps[i - 1];
    const uses = stepUses(r, st.text + " " + st.sub.join(" "), f);
    const min = stepMinutes(st.text);
    body = `<p class="cook-label">Step ${i} of ${steps.length}${st.label ? ` · ${esc(st.label)}` : ""}</p>
      <p class="cook-step">${md(st.text)}</p>
      ${st.sub.length ? `<ul class="cook-uses" style="font-size:1.05rem">${st.sub.map(x => `<li>${md(x)}</li>`).join("")}</ul>` : ""}
      ${uses.length ? `<div class="cook-uses"><strong>You'll need</strong><ul>${uses.map(x => `<li>${md(x)}</li>`).join("")}</ul></div>` : ""}
      ${min ? `<button class="btn" data-act="cook-timer" data-min="${min}">Start ${min >= 60 ? `${+(min / 60).toFixed(1)} hr` : `${min} min`} timer</button>` : ""}`;
  }
  const last = i === total - 1;
  return `<div class="cook" role="dialog" aria-modal="true" aria-label="Cooking ${esc(r.title)}">
    <div class="cook-top">
      <span class="title">${esc(r.title)}</span>
      ${timer ? `<button class="timer-chip${timer.done ? " done" : ""}" id="timer-chip" data-act="cook-timer-clear" title="Tap to clear">${timer.done ? "Time's up" : fmtClock(timer.end - Date.now())}</button>` : ""}
      <button class="btn small${ui.cook.speak ? " primary" : ""}" data-act="cook-speak" aria-pressed="${!!ui.cook.speak}">Read aloud</button>
      <button class="btn small${ui.cook.listen ? " primary" : ""}" data-act="cook-listen" aria-pressed="${!!ui.cook.listen}">Voice</button>
      <button class="btn small ghost" data-act="cook-exit">Exit</button>
    </div>
    ${ui.cook.listen ? `<p class="cook-hint">Listening: say "next", "back", "repeat" or "stop".</p>` : ""}
    <div class="cook-progress"><span style="width:${Math.round((i + 1) / total * 100)}%"></span></div>
    <div class="cook-body" id="cook-body">${body}</div>
    <div class="cook-nav">
      <button class="btn" data-act="cook-prev" ${i === 0 ? "disabled" : ""}>Back</button>
      <button class="btn primary" data-act="${last ? "cook-exit" : "cook-next"}">${last ? "Done" : i === 0 ? "Start" : "Next"}</button>
    </div>
  </div>`;
}
function cookGo(delta) {
  if (!ui.cook) return;
  const total = cookSteps(BY_ID[ui.cook.id]).length + 1;
  ui.cook.step = Math.max(0, Math.min(total - 1, ui.cook.step + delta));
  renderSheet();
}

function shareDialog() {
  const code = householdCode();
  const body = fb && code
    ? `<p>Send this link to anyone who should share the planner. You'll both see the same week, ticks and ratings as they change.</p>
       <input class="share-link" id="share-link" readonly value="${esc(shareLink(code))}" aria-label="Share link">
       <p class="muted-note">The link opens ${esc(PROFILES[PROFILE].name)}'s planner. Each person can switch with "Planning for" at the top; George's and GP's weeks are kept separate.</p>
       <div class="sheet-actions"><button class="btn primary" data-act="share-send">Share link</button><button class="btn" data-act="share-copy">Copy</button><button class="btn ghost" data-act="share-stop">Stop sharing on this device</button></div>
       <p style="margin-top:12px">Anyone with the link can see and change the planner, so only send it to people you plan meals with.</p>`

        <h2 id="share-title">Share the planner</h2>
      </div>
      ${body}

async function connect() {
  const local = loadLocal();
  if (local) { state = sanitize(local); render(); }
  if (SYNC) {
    document.getElementById("share-btn").hidden = false;
    const join = location.hash.match(/^#join=([a-z0-9]{20,})(&as=\w+)?$/);
    if (join) {
      setHouseholdCode(join[1]);
      history.replaceState(null, "", location.pathname);
    }
    const code = householdCode();
    if (code) {
      try { await startSharing(code); if (join) toast("Joined the shared planner"); return; }
      catch { setSync("Couldn't reach the shared planner — saved on this device"); return; }
    }
  }
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { setSync(local ? "Saved on this device" : "Example week — your changes save on this device"); return; }
  store = db.doc("planner/state" + SUFFIX);
  saveMode = "db";
  setSync("Syncing…");
  store.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites || dirty || saving) return;
    if (snap.exists) { state = sanitize(snap.data()); render(); setSync("Synced across your devices"); }
    else { setSync("Example week — pick your own and it will sync"); }
  }, () => { saveMode = "local"; setSync("Saved on this device only"); });
}

// ─── Helpers ────────────────────────────────────────────────────────────────
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const plain = s => String(s).replace(/\*\*/g, "");
function slotFor(r) {
  if (GP) return isBasic(r) && ["stovetop", "oven"].includes(r.chapter) ? (SLOTS.find(sl => !state.slots[sl.key]) || SLOTS[0]).key : null;
  return r.chapter === "slow" ? "slow" : r.chapter === "pressure" ? "pressure"
    : ["stovetop", "oven"].includes(r.chapter) ? "quick" : null;
}
function plannedIds() {
  return [...Object.values(state.slots).filter(Boolean), ...state.extras];
}
function recentIds() {
  return new Set(state.history.slice(0, 4).flatMap(h => h.ids));
}
function toast(msg) {
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { root.innerHTML = ""; }, 2200);
}
function isHighProtein(r) { return !!r.nutrition && r.nutrition.protein >= proteinGoal(); }
function macroSpans(r) {
  const n = r.nutrition;
  return n ? `<span class="kcal">${n.kcal} kcal</span><span class="kcal">${n.protein} g protein</span>` : "";
}
function badges(r) {
  return r.diet.length ? `<span class="badges">${r.diet.map(t => `<span class="badge">${esc(DIET_LABEL[t])}</span>`).join("")}</span>` : "";
}
function storageBox(r) {
  return r.storage.length ? `<div class="storage"><strong>Storage</strong><ul>${r.storage.map(x => `<li>${md(x)}</li>`).join("")}</ul></div>` : "";
}
function macroBlock(r) {
  const n = r.nutrition;
  if (!n) return "";
  const cell = (label, v) => `<div><dt>${label}</dt><dd>${v}</dd></div>`;
  return `<dl class="macros">${cell("Calories", n.kcal)}${cell("Protein", `${n.protein} g`)}${cell("Carbs", `${n.carbs} g`)}${cell("Fat", `${n.fat} g`)}</dl>
    <p class="macros-note">Per ${n.per}, estimated from the ingredients.</p>`;
}
function weekNutrition() {
  const meals = plannedIds().map(id => BY_ID[id]).filter(r => r && r.nutrition && r.nutrition.per === "serving");
  if (!meals.length) return "";
  let servings = 0, kcal = 0, protein = 0;
  for (const r of meals) {
    const n = r.nutrition.count * scaleOf(r.id);
    servings += n;
    kcal += r.nutrition.kcal * n;
    protein += r.nutrition.protein * n;
  }
  const s = Math.round(servings);
  return `<p class="week-nutrition">This week: <strong>${s}</strong> servings, averaging <strong>${Math.round(kcal / servings / 10) * 10} kcal</strong> and <strong>${Math.round(protein / servings)} g protein</strong> each (<strong>${Math.round(protein).toLocaleString()} g</strong> protein in total).</p>`;
}

// ─── Favourites, ratings and cooking history ───────────────────────────────
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function daysSince(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return Math.floor((Date.now() - new Date(y, m - 1, d).getTime()) / 86400000);
}
function moveDay(s, from, to) {
  if (from && to && from !== to && s.days[from] != null) { s.days[to] = s.days[from]; delete s.days[from]; }
}
function cookedRecently(id) { return (state.log[id] || []).some(d => daysSince(d) < 28); }
function stars(id, act) {
  const v = state.rating[id] || 0;
  return `<span class="stars" role="group" aria-label="Rating">${[1, 2, 3, 4, 5].map(n =>
    `<button data-act="${act}" data-id="${id}" data-v="${n}" aria-pressed="${n <= v}" aria-label="${n} star${n > 1 ? "s" : ""}">★</button>`).join("")}</span>`;
}
function historyLine(id) {
  const log = state.log[id] || [];
  if (!log.length) return "";
  const last = log[log.length - 1].split("-").map(Number);
  const when = new Date(last[0], last[1] - 1, last[2]).toLocaleDateString("en-NZ", { day: "numeric", month: "short" });
  return `<p class="history-line">Cooked ${log.length === 1 ? "once" : `${log.length} times`} · last on ${esc(when)}</p>`;
}
// Favourites and well-rated recipes come up more often; low ratings less.
const RATING_WEIGHT = { 1: 0.2, 2: 0.5, 3: 1, 4: 2, 5: 3 };
function weight(r) {
  return (state.fav[r.id] ? 3 : 1) * (RATING_WEIGHT[state.rating[r.id]] || 1) * (favours(r) ? 2 : 1);
}

function pickRandom(slotKey, exclude) {
  const slot = SLOTS.find(s => s.key === slotKey);
  const recent = recentIds();
  const used = new Set(plannedIds());
  let pool = withoutAvoided(visibleRecipes().filter(r => slot.chapters.includes(r.chapter) && r.id !== exclude && !used.has(r.id)));
  if (ui.minceOnly) pool = pool.filter(r => r.tags.includes("mince"));
  if (ui.highProtein) pool = pool.filter(isHighProtein);
  // Skip anything planned in the last four weeks or cooked in the last 28 days, if there's enough left.
  const fresh = pool.filter(r => !recent.has(r.id) && !cookedRecently(r.id));
  const from = fresh.length ? fresh : pool;
  if (!from.length) return null;
  let roll = Math.random() * from.reduce((a, r) => a + weight(r), 0);
  for (const r of from) { roll -= weight(r); if (roll <= 0) return r.id; }
  return from[from.length - 1].id;
}

// ─── Shopping list ──────────────────────────────────────────────────────────
const AISLES = ["Meat & fish", "Fruit & veg", "Dairy, eggs & chilled", "Frozen", "Bread & wraps", "Pasta, rice & grains", "Cans, jars & pulses", "Baking", "Pantry: check first"];
// Fallback for any ingredient the build step couldn't name. First match wins.
const AISLE_RULES = [
  ["Pantry: check first", /\bstock\b|broth|vinegar|soy sauce|fish sauce|oyster sauce|hoisin|worcestershire|peanut butter|\boil\b/],
  ["Frozen", /frozen/],
  ["Cans, jars & pulses", /\bcans?\b|\btins?\b|tinned|canned|beans|lentil|chickpea|passata|tomato paste|\bjam\b|salsa/],
  ["Meat & fish", /mince|chicken|beef|pork|sausage|bacon|\bham\b|steak|salmon|prawn|lamb/],
  ["Pasta, rice & grains", /\brice\b|pasta|noodle|couscous|barley|\boats\b/],
  ["Bread & wraps", /tortilla|\bwraps?\b|\bbuns?\b|bread|fries/],
  ["Dairy, eggs & chilled", /milk|cream|butter|cheese|yoghurt|yogurt|\beggs?\b/],
  ["Baking", /flour|sugar|cocoa|chocolate/],
  ["Fruit & veg", /onion|garlic|carrot|potato|lemon|lime|tomato|lettuce|tabbouleh/],
];
function aisleOf(line) {
  const t = plain(line).toLowerCase();
  for (const [aisle, re] of AISLE_RULES) if (re.test(t)) return aisle;
  return "Pantry: check first";
}

// ─── Scaling ────────────────────────────────────────────────────────────────
const SCALES = [[0.5, "½×"], [1, "1×"], [1.5, "1½×"], [2, "2×"], [3, "3×"]];
const SCALE_LABEL = Object.fromEntries(SCALES);
const FRAC = { "½": 0.5, "¼": 0.25, "¾": 0.75, "⅓": 1 / 3, "⅔": 2 / 3, "⅛": 0.125 };
const NUM = String.raw`(?:\d+(?:\.\d+)?\s*[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛])`;
function scaleOf(id) { return (state.scale && state.scale[id]) || 1; }
function toNum(t) {
  const m = t.replace(/\s+/g, "").match(/^(\d+(?:\.\d+)?)?([½¼¾⅓⅔⅛])?$/);
  return m ? (m[1] ? parseFloat(m[1]) : 0) + (m[2] ? FRAC[m[2]] : 0) : null;
}
function fmtNum(n) { return n >= 10 ? String(Math.round(n)) : nice(n); }
// "1½ cups stock" × 2 -> "3 cups stock"; "2–3 garlic cloves" × 2 -> "4–6 garlic cloves".
// Only the leading amount changes, so "(400 g)" can sizes stay as they are.
function scaleText(text, f) {
  if (f === 1) return text;
  const re = new RegExp(String.raw`^(\*\*)?(${NUM})(\s*(?:–|-|to)\s*)?(${NUM})?`);
  return text.replace(re, (all, bold, a, sep, b) => {
    const x = toNum(a), y = b ? toNum(b) : null;
    if (x == null) return all;
    const gap = t => (t || "").match(/\s*$/)[0];  // keep the space the number pattern swallowed
    return (bold || "") + fmtNum(x * f) + gap(a) + (sep || "") + (y != null ? fmtNum(y * f) + gap(b) : "");
  });
}
// "4 (8 burritos)" × 2 -> "8 (16 burritos)"; "(about ½ cup each)" is a portion size, so it stays.
function scaleServings(text, f) {
  if (f === 1) return text;
  return scaleText(text, f).replace(/\((\d+)([^)]*)\)/, (all, n, rest) => /each/.test(rest) ? all : `(${fmtNum(n * f)}${rest})`);
}
function scaledServingsText(r) {
  const f = scaleOf(r.id);
  return f === 1 ? r.servings : scaleServings(r.servings, f);
}

// ─── Adding up amounts ──────────────────────────────────────────────────────
const SPOON_TSP = { tsp: 1, tbsp: 3, cup: 48 };      // spoons and cups in teaspoons
const TO_ML = { tsp: 5, tbsp: 15, cup: 250, ml: 1 };
const COUNT_WORDS = { can: ["can", "cans"], clove: ["clove", "cloves"], sheet: ["sheet", "sheets"], bulb: ["bulb", "bulbs"],
  jar: ["jar", "jars"], packet: ["packet", "packets"], bunch: ["bunch", "bunches"], head: ["head", "heads"],
  stalk: ["stalk", "stalks"], rasher: ["rasher", "rashers"], slice: ["slice", "slices"], scoop: ["scoop", "scoops"],

    const n = parts.reduce((a, p) => a + (p.qty == null ? 0 : p.unit === "g" ? p.qty / w : p.unit === "" ? p.qty : 0), 0);

function shoppingList() {
  const rows = new Map();
  for (const src of listSources()) for (const id of src.ids) {
    const r = BY_ID[id];
    const f = src.scale(id);
    for (const item of r.shop) {
      let row = rows.get(item.key);
      if (!row) {
        row = { key: "item:" + item.key, name: item.name, aisle: item.aisle || aisleOf(item.raw), parts: [], uses: [], optional: true, who: new Set() };
        rows.set(item.key, row);
      }
      row.who.add(src.who);
      row.parts.push({ qty: item.qty == null ? null : item.qty * f, unit: item.unit });
      row.optional = row.optional && item.optional;
      const use = row.uses.find(u => u.recipe === r);
      const line = scaleText(item.raw, f);

  const groups = Object.fromEntries(AISLES.map(a => [a, []]));

    const mine = mySwaps()[row.key.slice(5)], theirs = otherSwaps()[row.key.slice(5)];
    const meName = mine || row.name;
    if (row.who.size > 1) row.name = theirs && theirs !== mine ? `${meName} + ${theirs.toLowerCase()} for ${PROFILES[OTHER].name}` : meName;
    else row.name = row.who.has(PROFILE) ? meName : (theirs || row.name);
    groups[row.aisle].push(row);
  }
  for (const a of AISLES) groups[a].sort((x, y) => (x.optional - y.optional) || x.name.localeCompare(y.name));

}

// ─── Day by day ─────────────────────────────────────────────────────────────

// Calendar file: one event per reminder, each with an alert at the time.

      lines.push("BEGIN:VEVENT", `UID:${state.week}-${n++}-${t.id}@meal-planner`, `DTSTAMP:${stamp(now)}`,

// ─── Nutrition and cost from ingredients ────────────────────────────────────
// NUTR mirrors planner/nutrition.py (per-100 g values and unit weights) so

const PRICES = /*PRICES*/{};
const NUTR = /*NUTR*/{};
function itemGrams(item) {
  if (item.g != null) return item.g;
  const { qty, unit } = item;
  if (qty == null || !NUTR.foods) return null;
  const key = item.key === "lentils" && unit === "can" ? "lentils-canned" : item.key;
  const entry = NUTR.foods[key];
  const per = entry ? entry[4] : {};
  if (unit === "g" || unit === "ml") return qty;
  if (unit === "kg" || unit === "L") return qty * 1000;
  if (unit === "") return per.each != null ? qty * per.each : null;

// ─── What can I make? ───────────────────────────────────────────────────────
// Tick what you have; recipes are ranked by how few other things they need.
// Spices and staples (the pantry aisle and anything marked "At home") count
// as had unless you turn that off.
const HAVE_KEY = "george-meal-planner-have" + SUFFIX;

  const count = new Map();

// ─── Plan my week ───────────────────────────────────────────────────────────
// Tries a few hundred random combinations for the week's three slots and
// keeps the best one that fits the budget and protein target, preferring
// recipes that share ingredients (so the second half of the bag of spinach
// gets used) and your favourites.
function slotCandidates(slot) {

    return pool[pool.length - 1];

    const rs = pools.map(pick);

    const cost = rs.reduce((a, r) => a + recipeCost(r).total, 0);
    const low = Math.min(...rs.map(r => r.nutrition.protein));
    const shared = sharedKeys(rs);

// ─── Meal-prep session ──────────────────────────────────────────────────────
// For cooking several of the week's meals in one go: what to start first,
// what can cook at the same time, all the chopping in one list, what to
// defrost, and how many containers you'll fill.
const APPLIANCE = { slow: "Slow cooker", pressure: "Instant Pot", stovetop: "Stovetop", oven: "Oven" };
const PREP_WORDS = /\b(finely chopped|roughly chopped|chopped|diced|sliced|grated|crushed|minced|cubed|shredded|julienned|halved|quartered)\b/i;
function prepRecipes() { return plannedIds().map(id => BY_ID[id]).filter(r => MEAL_CHAPTERS.includes(r.chapter)); }
function prepPlan() {
  const rs = prepRecipes().sort((a, b) => (cookMinutes(b) ?? 0) - (cookMinutes(a) ?? 0));
  const chop = new Map(), defrost = new Map();
  for (const r of rs) {
    const f = scaleOf(r.id);
    for (const item of r.shop) {
      if (item.optional) continue;
      const w = item.raw.match(PREP_WORDS);
      if (w && !["Pantry: check first", "Cans, jars & pulses", "Frozen"].includes(item.aisle)) {
        const c = chop.get(item.key) || { name: item.name, parts: [], how: new Set(), from: new Set() };
        c.parts.push({ qty: item.qty == null ? null : item.qty * f, unit: item.unit });
        c.how.add(w[1].toLowerCase()); c.from.add(r.title);
        chop.set(item.key, c);
      }
      if (item.aisle === "Meat & fish") {
        const d = defrost.get(item.key) || { name: item.name, parts: [] };
        d.parts.push({ qty: item.qty == null ? null : item.qty * f, unit: item.unit });
        defrost.set(item.key, d);
      }
    }
  }
  const portions = rs.reduce((a, r) => a + Math.round(servingsCountOf(r) * scaleOf(r.id)), 0);
  return { rs, chop: [...chop.entries()], defrost: [...defrost.entries()], portions, spare: Math.max(0, portions - state.eaters) };
}
function prepView() {
  const p = prepPlan();
  if (!p.rs.length) return sheetWrap("prep-title", "Prep session", `<p>Plan some meals first, then come back for a prep plan.</p>`);
  const fmtMin = m => m == null ? "time not set" : m >= 60 ? `${+(m / 60).toFixed(1)} hr` : `${m} min`;
  const apps = new Set(p.rs.map(r => r.chapter));
  const order = p.rs.map((r, i) => `<li><strong>${esc(APPLIANCE[r.chapter])}:</strong> ${esc(r.title)} <small>${fmtMin(cookMinutes(r))}</small>${i === 0 && p.rs.length > 1 ? " · start this first" : ""}</li>`).join("");
  const chop = p.chop.sort((a, b) => b[1].from.size - a[1].from.size || a[1].name.localeCompare(b[1].name))
    .map(([k, c]) => `<li><strong>${esc(c.name)}</strong> ${esc(amountText(c.parts, k))}, ${esc([...c.how].join(" / "))}<small>${[...c.from].map(esc).join(" · ")}</small></li>`).join("");
  const thaw = p.defrost.map(([k, d]) => `<li>${esc(d.name)} ${esc(amountText(d.parts, k))}</li>`).join("");
  const body = `
    <h3>1. Cooking order</h3>
    <ol class="prep-list">${order}</ol>
    ${apps.size > 1 ? `<p class="muted-note">${[...apps].map(a => APPLIANCE[a]).join(", ")} can all run at the same time${apps.has("pressure") && apps.has("stovetop") ? " (the Instant Pot's Sauté uses the pot, not a hob)" : ""}.</p>` : ""}
    ${thaw ? `<h3>2. The night before</h3><p class="muted-note">Move from the freezer to the fridge if frozen:</p><ul class="prep-list">${thaw}</ul>` : ""}
    ${chop ? `<h3>${thaw ? 3 : 2}. Chop everything first</h3><ul class="prep-list chop">${chop}</ul>` : ""}
    <h3>Containers</h3>
    <p>${p.portions} portions in all. With ${state.eaters} eating tonight, that's <strong>${p.spare} to store</strong>: keep 3 days' worth in the fridge and freeze the rest.</p>

  return sheetWrap("prep-title", "Prep session", body);

// ─── Hands-free cooking ─────────────────────────────────────────────────────
// Read aloud speaks each step as you reach it. Voice control listens for
// "next", "back", "repeat" and "stop" (Chrome and Edge; ignored while the
// planner itself is speaking so a step that says "next" doesn't skip ahead).
let recog = null;
function cookStepText() {
  const r = BY_ID[ui.cook.id], steps = cookSteps(r), i = ui.cook.step;
  if (i === 0) {
    const items = r.sections.filter(s => s.kind === "ingredients").flatMap(s => s.items).filter(it => !it.group);
    return `Get ready. You'll need: ${items.map(it => plain(scaleText(it.text, scaleOf(r.id)))).join(". ")}.`;
  }
  const st = steps[Math.min(i, steps.length) - 1];
  return `Step ${i}. ${plain(st.text)} ${st.sub.map(plain).join(". ")}`;
}
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-NZ"; u.rate = 0.95;
  speechSynthesis.speak(u);
}
function speakIfNeeded() {
  if (!ui.cook || !ui.cook.speak || ui.cook.spoken === ui.cook.step) return;
  ui.cook.spoken = ui.cook.step;
  speak(cookStepText());
}
function startListening() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast("Voice control needs Chrome or Edge. Read aloud still works."); ui.cook.listen = false; return; }
  recog = new SR();
  recog.lang = "en-NZ"; recog.continuous = true; recog.interimResults = false;
  recog.onresult = e => {
    if (window.speechSynthesis && speechSynthesis.speaking) return;
    const said = e.results[e.results.length - 1][0].transcript.toLowerCase();
    if (/\b(next|forward|done)\b/.test(said)) cookGo(1);
    else if (/\b(back|previous)\b/.test(said)) cookGo(-1);
    else if (/\b(repeat|again|what)\b/.test(said)) speak(cookStepText());
    else if (/\b(stop|quiet|shush)\b/.test(said)) { speechSynthesis.cancel(); }
  };
  recog.onend = () => { if (ui.cook && ui.cook.listen && recog) try { recog.start(); } catch {} };
  recog.onerror = e => { if (e.error === "not-allowed") { toast("Microphone access was blocked"); ui.cook.listen = false; stopListening(); renderSheet(); } };
  try { recog.start(); } catch {}
}
function stopListening() { if (recog) { const r = recog; recog = null; try { r.stop(); } catch {} } }

// ─── Weekly summary ─────────────────────────────────────────────────────────
function weekSummary() {
  const today = todayISO(), from = isoAdd(today, -6);
  const inWeek = d => d >= from && d <= today;
  const cooked = Object.entries(state.log).flatMap(([id, ds]) => ds.filter(inWeek).map(d => id)).filter(id => BY_ID[id]);
  const spent = cooked.reduce((a, id) => a + (recipeCost(BY_ID[id])?.total || 0) * scaleOf(id), 0);
  const days = Array.from({ length: 7 }, (_, i) => isoAdd(today, -i)).filter(d => dayEntries(d).length);
  const protein = days.length ? Math.round(days.reduce((a, d) => a + dayTotals(d).protein, 0) / days.length) : null;
  const wNow = weightTrend(today), wThen = weightTrend(isoAdd(today, -7));
  const binned = (state.waste || []).filter(w => inWeek(w.date)).reduce((a, w) => a + w.n, 0);
  const firsts = Object.entries(state.log).filter(([id, ds]) => BY_ID[id] && ds.length && inWeek(ds[0]) && state.rating[id])
    .sort((a, b) => state.rating[b[0]] - state.rating[a[0]]);
  const tile = (label, value, note = "") => `<div class="tile"><span>${label}</span><strong>${value}</strong>${note ? `<small>${note}</small>` : ""}</div>`;
  if (!cooked.length && !days.length && !binned) return "";
  return `<details class="summary"${[0, 1].includes(new Date().getDay()) ? " open" : ""}>
    <summary>Your last 7 days</summary>
    <div class="tiles">
      ${tile("Meals cooked", cooked.length)}
      ${tile("Spent on them", spent ? money(spent) : "–", "rough prices")}
      ${tile("Protein a day", protein != null ? `${protein} g` : "–", protein != null ? `${days.length} days logged` : "log food to see this")}
      ${tile("Weight", wNow != null && wThen != null ? `${wNow - wThen > 0 ? "+" : ""}${(wNow - wThen).toFixed(1)} kg` : "–", wNow != null ? `trend ${wNow.toFixed(1)} kg` : "")}
      ${tile("Leftovers thrown out", binned ? `${binned}` : "None", binned ? "portions" : "nice work")}
      ${tile("Best new recipe", firsts.length ? esc(BY_ID[firsts[0][0]].title) : "–", firsts.length ? "★".repeat(state.rating[firsts[0][0]]) : "rate new meals to see this")}
    </div>
  </details>`;
}

// Private to this device: kept under its own localStorage key and never part

  ["moderate", "Exercise 3–5 days a week", 1.55], ["active", "Hard exercise 6–7 days a week", 1.725],
  ["very", "Physical job plus training", 1.9],

const GOALS = [["lose", "Lose weight"], ["maintain", "Stay the same"], ["gain", "Build muscle"]];

  t = Object.assign({ profile: {}, targets: null, days: {}, weights: {}, foods: {} }, t || {});
  t.profile = Object.assign({ sex: "male", age: "", height: "", weight: "", activity: "moderate", goal: "maintain" }, t.profile);
  return t;
}
function trackCommit(mutator) {

function calcTargets(p) {

    }
    case "track-calc": {
      const val = id => document.getElementById(id).value;
      const profile = { sex: val("tp-sex"), age: val("tp-age"), height: val("tp-height"), weight: val("tp-weight"), activity: val("tp-activity"), goal: val("tp-goal") };
      const calc = calcTargets(profile);
      if (!calc) { toast("Check your age, height and weight"); return true; }
      trackCommit(t => { t.profile = profile; t.targets = calc; });
      toast(`Targets set: ${calc.kcal.toLocaleString()} kcal, ${calc.protein} g protein`);
      return true;
    }
    case "track-save-targets": {
      const next = Object.fromEntries(MACROS.map(([k]) => [k, Math.round(readNum(`tt-${k}`))]));
      if (!next.kcal) { toast("Calories can't be 0"); return true; }
      trackCommit(t => { t.targets = next; });
      toast("Targets saved");
      return true;
    }
  }
  return false;
}

// ─── Barcode scanning ───────────────────────────────────────────────────────
// Uses the browser's own barcode reader where there is one (Chrome on
// Android), otherwise loads ZXing. Product details come from Open Food Facts,
// a free shared database; found products are kept on this device.
const ZXING_URL = "https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";
let scanner = null;  // { stream, stop() }
function stopScanner() {
  if (scanner) { try { scanner.stop(); } catch {} scanner = null; }
}
function loadScript(src) {
  return new Promise((ok, fail) => {
    if (document.querySelector(`script[src="${src}"]`)) return ok();
    const s = document.createElement("script");
    s.src = src; s.onload = ok; s.onerror = () => fail(new Error("load"));
    document.head.appendChild(s);
  });
}
async function startScanner() {
  const video = document.getElementById("scan-video");
  const status = document.getElementById("scan-status");
  if (!video) return;
  const found = code => { stopScanner(); lookupBarcode(code); };
  try {
    if ("BarcodeDetector" in window) {
      const detector = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e"] });
      const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
      video.srcObject = stream; await video.play();
      let live = true;
      scanner = { stop() { live = false; stream.getTracks().forEach(t => t.stop()); } };
      const tick = async () => {
        if (!live) return;
        try { const codes = await detector.detect(video); if (codes.length) return found(codes[0].rawValue); } catch {}
        setTimeout(tick, 200);
      };
      tick();
    } else {
      status.textContent = "Starting the camera…";
      await loadScript(ZXING_URL);
      const reader = new ZXing.BrowserMultiFormatReader();
      scanner = { stop() { reader.reset(); } };
      reader.decodeFromVideoDevice(null, video, result => { if (result) found(result.getText()); });
    }
    status.textContent = "Point the camera at the barcode.";
  } catch (e) {
    stopScanner();
    status.textContent = e && e.name === "NotAllowedError" ? "Camera access was blocked. Allow it in your browser settings, or type the number below."
      : "The camera isn't available here. Type the number under the barcode instead.";
  }
}
function offNumbers(p) {
  const n = p.nutriments || {};
  const kcal = n["energy-kcal_100g"] ?? (n.energy_100g != null ? n.energy_100g / 4.184 : null);
  if (kcal == null) return null;
  return { kcal, protein: n.proteins_100g || 0, carbs: n.carbohydrates_100g || 0, fat: n.fat_100g || 0 };
}
async function lookupBarcode(code) {
  code = String(code).replace(/\D/g, "");
  if (code.length < 8) { toast("That doesn't look like a barcode number"); return; }
  const cached = tracker.foods && tracker.foods[code];
  if (cached) { ui.scan = { stage: "found", code, food: cached }; renderSheet(); return; }
  ui.scan = { stage: "looking", code }; renderSheet();
  try {
    const res = await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,brands,nutriments,serving_quantity,serving_size`);
    const data = await res.json();
    const p = data && data.status === 1 && data.product;
    const per100 = p && offNumbers(p);
    if (!ui.scan) return;
    if (!per100) { ui.scan = { stage: "missing", code }; renderSheet(); return; }
    const food = { name: [p.brands && p.brands.split(",")[0], p.product_name].filter(Boolean).join(" ") || `Barcode ${code}`, per100, serving: Number(p.serving_quantity) || null, servingText: p.serving_size || "" };
    trackCommit(t => { t.foods = Object.assign({}, t.foods, { [code]: food }); });
    ui.scan = { stage: "found", code, food }; renderSheet();
  } catch {
    if (ui.scan) { ui.scan = { stage: "offline", code }; renderSheet(); }
  }
}
function scanView() {
  const s = ui.scan;
  let body;
  if (s.stage === "camera") {
    body = `<div class="scan-box"><video id="scan-video" playsinline muted></video></div>

  } else if (s.stage === "looking") {

      <div class="fields"><label class="field wide"><span>How much did you have?</span><span class="with-unit"><input type="number" inputmode="decimal" id="scan-grams" value="${g}" min="0">g or ml</span></label></div>
      <div class="sheet-actions"><button class="btn primary" data-act="scan-add">Add to ${esc(MEALS.find(m => m[0] === (ui.trackMeal || mealNow()))[1].toLowerCase())}</button><button class="btn" data-act="scan-again">Scan another</button></div>
      <p class="muted-note">From Open Food Facts, a free database anyone can edit. Check it against the packet.</p>`;

    </article>

}

// ─── Bodyweight ─────────────────────────────────────────────────────────────
// tracker.weights[iso] = kg. The trend is the average of weigh-ins over the
// previous 7 days, which smooths out day-to-day water changes.
function weightTrend(iso) {
  const vals = Object.entries(tracker.weights || {}).filter(([d]) => d <= iso && d > isoAdd(iso, -7)).map(([, v]) => v);
  return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
}
function renderWeight(iso) {
  const w = tracker.weights || {};
  const days = Object.keys(w).sort();
  const latest = days.length ? days[days.length - 1] : null;
  const trend = latest ? weightTrend(latest) : null;
  const ago = latest ? weightTrend(isoAdd(latest, -28)) : null;
  const p = tracker.profile;
  const suggest = tracker.targets && trend && Number(p.weight) && Math.abs(trend - Number(p.weight)) >= 2;
  const change = trend != null && ago != null ? trend - ago : null;
  return `<section class="track-card">
    <h3>Weight</h3>
    <div class="weigh-row"><label class="field"><span>${esc(prettyDay(iso))}</span><span class="with-unit"><input type="number" inputmode="decimal" step="0.1" id="weigh-kg" value="${w[iso] ?? ""}" placeholder="kg">kg</span></label>
      <button class="btn" data-act="weigh-save">Save</button>${w[iso] != null ? `<button class="btn small ghost" data-act="weigh-del">Remove</button>` : ""}</div>
    ${trend != null ? `<p class="weight-summary">Trend <strong>${trend.toFixed(1)} kg</strong>${change != null ? `, ${Math.abs(change) < 0.05 ? "steady" : `${change < 0 ? "down" : "up"} ${Math.abs(change).toFixed(1)} kg`} over 4 weeks` : ""}.</p>` : `<p class="muted-note">Weigh in once or twice a week, at the same time of day, to see a trend.</p>`}
    ${days.length >= 2 ? weightChart() : ""}
    ${suggest ? `<p class="today">Your targets use ${Number(p.weight)} kg, but your trend is ${trend.toFixed(1)} kg. <button class="btn small primary" data-act="weigh-retarget">Update my targets</button></p>` : ""}
  </section>`;
}

// ─── Charts ─────────────────────────────────────────────────────────────────
// Single-series SVG charts in the accent colour, with a dashed target line.
// Each mark has a hover/long-press title, and the 7-day table gives the
// numbers as text.
const CH = { w: 640, h: 170, l: 40, r: 10, t: 12, b: 24 };
function niceMax(v) { const m = Math.pow(10, Math.floor(Math.log10(v || 1))); return Math.ceil(v / m / 0.5) * m * 0.5; }
function axis(max, unit, fmt = v => v.toLocaleString()) {
  const y = v => CH.t + (CH.h - CH.t - CH.b) * (1 - v / max);
  return [0, max / 2, max].map(v => `<line class="grid" x1="${CH.l}" x2="${CH.w - CH.r}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${CH.l - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v)}${unit}</text>`).join("");
}
function barChart(label, days, values, target, unit) {
  const max = niceMax(Math.max(target || 0, ...values) * 1.1);
  const n = days.length, plotW = CH.w - CH.l - CH.r, step = plotW / n, bw = Math.max(4, step - 3);
  const y = v => CH.t + (CH.h - CH.t - CH.b) * (1 - v / max);
  const base = y(0);
  const bars = values.map((v, i) => {
    const x = CH.l + i * step + (step - bw) / 2;
    const title = `<title>${prettyDay(days[i])}: ${v ? Math.round(v).toLocaleString() + unit : "nothing logged"}</title>`;
    const hit = `<rect class="hit" x="${CH.l + i * step}" y="${CH.t}" width="${step}" height="${base - CH.t}">${title}</rect>`;
    if (!v) return hit;
    const h = Math.max(2, base - y(v)), r = Math.min(4, bw / 2, h);
    return `<path class="bar-mark" d="M${x},${base} v${-(h - r)} q0,${-r} ${r},${-r} h${bw - 2 * r} q${r},0 ${r},${r} v${h - r} z"/>${hit}`;
  }).join("");
  const tl = target ? `<line class="target" x1="${CH.l}" x2="${CH.w - CH.r}" y1="${y(target)}" y2="${y(target)}"/><text class="tick target-label" x="${CH.w - CH.r}" y="${y(target) - 5}" text-anchor="end">Target ${target.toLocaleString()}${unit}</text>` : "";
  const xl = `<text class="tick" x="${CH.l}" y="${CH.h - 6}">${esc(prettyWeek(days[0]))}</text><text class="tick" x="${CH.w - CH.r}" y="${CH.h - 6}" text-anchor="end">${esc(prettyDay(days[n - 1]))}</text>`;
  return `<figure class="chart"><figcaption>${label}</figcaption><svg viewBox="0 0 ${CH.w} ${CH.h}" role="img" aria-label="${esc(label)}">${axis(max, unit)}${bars}${tl}${xl}</svg></figure>`;
}
function weightChart() {
  const w = tracker.weights;
  const last = Object.keys(w).sort().pop();
  const days = Array.from({ length: 84 }, (_, i) => isoAdd(last, i - 83)).filter(d => d >= Object.keys(w).sort()[0]);
  const vals = days.filter(d => w[d] != null).map(d => w[d]);
  const lo = Math.floor(Math.min(...vals) - 1), hi = Math.ceil(Math.max(...vals) + 1);
  const n = Math.max(2, days.length), plotW = CH.w - CH.l - CH.r;
  const x = i => CH.l + plotW * i / (n - 1);
  const y = v => CH.t + (CH.h - CH.t - CH.b) * (1 - (v - lo) / (hi - lo));
  const trend = days.map((d, i) => [i, weightTrend(d)]).filter(([, v]) => v != null);
  const path = trend.map(([i, v], k) => `${k ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  const dots = days.map((d, i) => w[d] != null ? `<circle class="dot" cx="${x(i)}" cy="${y(w[d])}" r="4"><title>${prettyDay(d)}: ${w[d]} kg</title></circle>` : "").join("");
  const grid = [lo, (lo + hi) / 2, hi].map(v => `<line class="grid" x1="${CH.l}" x2="${CH.w - CH.r}" y1="${y(v)}" y2="${y(v)}"/><text class="tick" x="${CH.l - 6}" y="${y(v) + 4}" text-anchor="end">${v % 1 ? v.toFixed(1) : v}</text>`).join("");
  const xl = `<text class="tick" x="${CH.l}" y="${CH.h - 6}">${esc(prettyWeek(days[0]))}</text><text class="tick" x="${CH.w - CH.r}" y="${CH.h - 6}" text-anchor="end">${esc(prettyDay(days[days.length - 1]))}</text>`;
  return `<figure class="chart"><figcaption>Weight (kg): dots are weigh-ins, the line is the 7-day trend</figcaption><svg viewBox="0 0 ${CH.w} ${CH.h}" role="img" aria-label="Weight over time">${grid}<path class="trend" d="${path}"/>${dots}${xl}</svg></figure>`;
}
function renderTrends(iso) {
  const days = Array.from({ length: 28 }, (_, i) => isoAdd(iso, i - 27));
  const logged = days.filter(d => dayEntries(d).length);
  if (logged.length < 2) return "";
  const t = tracker.targets;
  const kcal = days.map(d => dayTotals(d).kcal), protein = days.map(d => dayTotals(d).protein);
  const avg = k => Math.round(logged.reduce((s, d) => s + dayTotals(d)[k], 0) / logged.length);
  const perMeal = MEALS.map(([k, l]) => {
    const vals = logged.map(d => dayEntries(d).filter(e => e.meal === k).reduce((s, e) => s + e.protein, 0)).filter(v => v > 0);
    return vals.length ? `<li><span>${l}</span><strong>${Math.round(vals.reduce((a, b) => a + b, 0) / vals.length)} g</strong></li>` : "";
  }).join("");
  return `<section class="track-card">
    <h3>Last 4 weeks</h3>
    <p class="muted-note">${logged.length} days logged, averaging <strong>${avg("kcal").toLocaleString()} kcal</strong> and <strong>${avg("protein")} g protein</strong> a day.</p>
    ${barChart("Calories per day", days, kcal, t && t.kcal, "")}
    ${barChart("Protein per day (g)", days, protein, t && t.protein, " g")}
    ${perMeal ? `<div><strong class="small-head">Average protein per meal</strong><ul class="per-meal">${perMeal}</ul></div>` : ""}
  </section>`;
}

function trackClick2(act, el) {
  const iso = ui.trackDay || todayISO();
  switch (act) {
    case "scan-open": ui.scan = { stage: "camera" }; renderSheet(); return true;
    case "scan-again": stopScanner(); ui.scan = { stage: "camera" }; renderSheet(); return true;
    case "scan-lookup": { const c = document.getElementById("scan-code").value; stopScanner(); lookupBarcode(c); return true; }
    case "scan-quick": stopScanner(); ui.scan = null; ui.quickOpen = true; renderSheet(); render(); setTimeout(() => document.getElementById("qa-name")?.focus(), 50); return true;
    case "scan-add": {
      const f = ui.scan.food, g = readNum("scan-grams");
      if (!g) { toast("Enter how much you had"); return true; }
      const k = g / 100;
      logEntry(iso, { name: f.name, meal: ui.trackMeal || mealNow(), barcode: ui.scan.code, grams: g,
        kcal: Math.round(f.per100.kcal * k), protein: Math.round(f.per100.protein * k), carbs: Math.round(f.per100.carbs * k), fat: Math.round(f.per100.fat * k) });
      toast(`Added ${f.name} (${Math.round(f.per100.kcal * k)} kcal)`);
      ui.scan = null; renderSheet();
      return true;
    }
    case "weigh-save": {
      const kg = readNum("weigh-kg");
      if (!(kg >= 30 && kg <= 300)) { toast("Enter your weight in kg"); return true; }
      trackCommit(t => { t.weights = Object.assign({}, t.weights, { [iso]: Math.round(kg * 10) / 10 }); });
      toast("Weight saved");
      return true;
    }
    case "weigh-del": trackCommit(t => { delete t.weights[iso]; }); return true;
    case "weigh-retarget": {
      const days = Object.keys(tracker.weights).sort();
      const kg = Math.round(weightTrend(days[days.length - 1]) * 10) / 10;
      const profile = Object.assign({}, tracker.profile, { weight: String(kg) });
      const calc = calcTargets(profile);
      if (!calc) return true;
      trackCommit(t => { t.profile = profile; t.targets = calc; });
      toast(`Targets updated for ${kg} kg: ${calc.kcal.toLocaleString()} kcal, ${calc.protein} g protein`);
      return true;
    }
  }
  return false;
}

function filteredRecipes() {

    (!slot || slot.chapters.includes(r.chapter)) &&

    (!ui.group || r.group === ui.group) &&
    (!ui.protein || r.tags.includes(ui.protein)) &&
    (!ui.highProtein || isHighProtein(r)) &&
    ui.diet.every(t => r.diet.includes(t)) &&
