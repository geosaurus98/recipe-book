<style>
/* Layout: one column app shell — sticky header with tabs; the week view is three appliance "burners" side by side, stacking on phones. */
:root {
  --bg: #f2f5f1;
  --surface: #ffffff;
  --sunk: #e8ede8;
  --ink: #17221c;
  --muted: #5a6a61;
  --line: #d6dfd8;
  --accent: #2c6a4d;
  --accent-ink: #ffffff;
  --slow: #b25f17;
  --pressure: #2b5ca3;
  --quick: #367f47;
  --oven: #b0392c;
  --bake: #7a4d9e;
  --other: #66726b;
  --star: #b67a00;
  --shadow: 0 1px 2px rgb(23 34 28 / 6%), 0 4px 14px rgb(23 34 28 / 6%);
  --font-display: "Young Serif", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111713; --surface: #18201b; --sunk: #202a23; --ink: #e5ede8; --muted: #9aaaa1;
    --line: #2a362f; --accent: #7cc49b; --accent-ink: #0f1a14;
    --slow: #e59a55; --pressure: #7fa8e6; --quick: #7cc48d; --oven: #e98476; --bake: #bb95dc; --other: #a2aea7; --star: #f0b429;
    --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 14px rgb(0 0 0 / 25%);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111713; --surface: #18201b; --sunk: #202a23; --ink: #e5ede8; --muted: #9aaaa1;
  --line: #2a362f; --accent: #7cc49b; --accent-ink: #0f1a14;
  --slow: #e59a55; --pressure: #7fa8e6; --quick: #7cc48d; --oven: #e98476; --bake: #bb95dc; --other: #a2aea7; --star: #f0b429;
  --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 4px 14px rgb(0 0 0 / 25%);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
header.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  border-bottom: 1px solid var(--line);
}
.wrap { max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 12px; }
.brand { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-right: auto; min-width: 0; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; letter-spacing: -0.01em; }
.sync { font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.books { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
.books a { color: var(--ink); font-weight: 600; }
.tabs { display: flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; }
.tabs button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 0.9rem; color: var(--muted); }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.tabs .count { font-family: var(--font-mono); font-size: 0.72rem; margin-left: 4px; color: var(--accent); }

main.wrap { padding-block: 20px 48px; display: grid; gap: 28px; }
.section-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.section-head h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.35rem; }
.section-head p { margin: 2px 0 0; color: var(--muted); font-size: 0.9rem; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 7px 14px; border-radius: 10px; font-weight: 600; font-size: 0.88rem; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); padding-inline: 8px; }
.btn.ghost:hover { color: var(--ink); }
.btn.small { padding: 4px 10px; font-size: 0.8rem; border-radius: 8px; }

/* Method colours: the one place colour carries meaning */
[data-m="slow"] { --m: var(--slow); }
[data-m="pressure"] { --m: var(--pressure); }
[data-m="quick"], [data-m="stovetop"], [data-m="sides"] { --m: var(--quick); }
[data-m="oven"] { --m: var(--oven); }
[data-m="baking"], [data-m="desserts"], [data-m="breadmaker"] { --m: var(--bake); }
[data-m="breakfast"], [data-m="snacks"], [data-m="shakes"], [data-m="extra"] { --m: var(--other); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--m, var(--muted)); }
.chip::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--m, var(--muted)); }

/* Week trio */
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
@media (max-width: 820px) { .trio { grid-template-columns: 1fr; } }
.slot { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: grid; gap: 10px; align-content: start; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.slot::before { content: ""; position: absolute; inset: 0 0 auto; height: 4px; background: var(--m); }
.slot .hint { font-size: 0.8rem; color: var(--muted); margin: -4px 0 0; }
.slot h3 { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; line-height: 1.25; }
.slot h3 button { all: unset; cursor: pointer; }
.slot h3 button:hover { text-decoration: underline; text-underline-offset: 3px; }
.slot h3 button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-family: var(--font-mono); font-size: 0.75rem; color: var(--muted); }
.meta .kcal { color: var(--ink); }
.macros { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 12px 0 4px; }
.macros div { background: var(--sunk); border-radius: 10px; padding: 8px 10px; }
.macros dt { font-size: 0.72rem; color: var(--muted); }
.macros dd { margin: 0; font-family: var(--font-mono); font-size: 0.95rem; color: var(--ink); }
.macros-note { font-size: 0.75rem; color: var(--muted); margin: 0 0 10px; }
.badges { display: flex; flex-wrap: wrap; gap: 4px 6px; }
.badge { font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--sunk); color: var(--ink); white-space: nowrap; }
.card .badges { margin-top: 2px; }
.sheet-head .badges { margin-top: 8px; }
.storage { background: var(--sunk); border-radius: 12px; padding: 10px 14px; margin: 4px 0 16px; }
.storage strong { display: block; font-size: 0.8rem; margin-bottom: 4px; }
.storage ul { margin: 0; padding-left: 1.1em; font-size: 0.88rem; }
.scale { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin-top: 10px; font-size: 0.85rem; color: var(--muted); }
.scale .fchip { padding: 4px 12px; }
.scale-note { font-size: 0.75rem; color: var(--muted); margin: 6px 0 0; }
.times { font-family: var(--font-mono); font-size: 0.75rem; font-weight: 600; color: var(--accent); }
.stars { display: inline-flex; align-items: center; gap: 0; }
.stars button { border: 0; background: none; padding: 2px 3px; font-size: 1.25rem; line-height: 1; color: var(--muted); opacity: 0.35; cursor: pointer; }
.stars button[aria-pressed="true"] { color: var(--star); opacity: 1; }
.rate-row { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--muted); margin-top: 8px; }
.fav { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-weight: 600; font-size: 0.85rem; color: var(--muted); cursor: pointer; }
.fav[aria-pressed="true"] { color: var(--star); border-color: var(--star); }
.fav-mark { color: var(--star); }
.history-line { font-size: 0.8rem; color: var(--muted); margin: 8px 0 0; }
.share-btn { margin-left: 2px; }
.share-sheet p { color: var(--muted); font-size: 0.92rem; margin: 0 0 12px; }
.share-link { width: 100%; font-family: var(--font-mono); font-size: 0.8rem; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--sunk); color: var(--ink); margin-bottom: 12px; }
.cook { position: fixed; inset: 0; z-index: 40; background: var(--bg); display: flex; flex-direction: column;
  padding: calc(12px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.cook-top { display: flex; align-items: center; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
.cook-top .title { flex: 1; min-width: 0; font-weight: 600; font-size: 0.9rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cook-progress { height: 4px; background: var(--sunk); border-radius: 2px; max-width: 760px; width: 100%; margin: 10px auto 0; overflow: hidden; }
.cook-progress span { display: block; height: 100%; background: var(--accent); transition: width .2s; }
.cook-body { flex: 1; overflow-y: auto; max-width: 760px; width: 100%; margin: 0 auto; padding: 20px 0; }
.cook-label { font-family: var(--font-mono); font-size: 0.8rem; color: var(--accent); margin: 0 0 8px; }
.cook-step { font-size: clamp(1.3rem, 4.6vw, 1.9rem); line-height: 1.4; margin: 0 0 18px; }
.cook-step strong { font-weight: 700; }
.cook-uses { background: var(--sunk); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; }
.cook-uses strong { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
.cook-uses ul { margin: 0; padding-left: 1.1em; font-size: 1.05rem; }
.cook-ready { list-style: none; padding: 0; margin: 0; font-size: 1.1rem; }
.cook-ready li { padding: 8px 0; border-bottom: 1px solid var(--line); }
.cook-ready label { display: flex; gap: 10px; align-items: flex-start; }
.cook-ready input { width: 20px; height: 20px; margin-top: 3px; flex: none; }
.cook-ready .group { font-weight: 700; border: 0; padding-top: 14px; }
.cook-nav { display: flex; gap: 10px; max-width: 760px; width: 100%; margin: 0 auto; }
.cook-nav .btn { flex: 1; padding: 14px; font-size: 1.05rem; }
.timer-chip { font-family: var(--font-mono); font-weight: 600; background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 4px 12px; border: 0; }
.timer-chip.done { background: var(--oven); }
.week-nutrition { margin: 4px 0 0; font-size: 0.9rem; color: var(--muted); }
.week-nutrition strong { color: var(--ink); font-variant-numeric: tabular-nums; }
.slot .row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.slot.empty { border-style: dashed; box-shadow: none; background: transparent; }
.slot.empty .placeholder { color: var(--muted); font-size: 0.92rem; }
.cooked-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 0.82rem; color: var(--muted); margin-left: auto; }
.slot.is-cooked h3 { text-decoration: line-through; text-decoration-color: var(--muted); color: var(--muted); }

.extras { display: grid; gap: 8px; }
.extra-row { display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.extra-row .title { flex: 1; min-width: 0; font-weight: 600; }
.extra-row .title button { all: unset; cursor: pointer; }
.empty-note { color: var(--muted); font-size: 0.9rem; margin: 0; }
.toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 0.85rem; color: var(--muted); }
.history { display: grid; gap: 6px; font-size: 0.88rem; }
.history li { color: var(--muted); }
.history strong { color: var(--ink); font-weight: 600; }

/* Recipes */
.filters { display: grid; gap: 10px; }
.search { width: 100%; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.fchip { border: 1px solid var(--line); background: var(--surface); padding: 4px 11px; border-radius: 999px; font-size: 0.82rem; font-weight: 600; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.choosing { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 10px 14px; border-radius: 12px; background: var(--sunk); font-size: 0.9rem; }
.choosing strong { color: var(--m); }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 6px; align-content: start; }
.card:hover { border-color: var(--muted); }
.card .name { font-weight: 600; font-size: 0.98rem; line-height: 1.3; }
.card .planned { font-size: 0.72rem; font-weight: 700; color: var(--accent); }
.result-count { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }

/* Shopping */
.aisles { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; align-items: start; }
.aisle { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.aisle h3 { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; display: flex; justify-content: space-between; }
.aisle h3 span { font-family: var(--font-mono); letter-spacing: 0; }
.aisle ul { list-style: none; margin: 0; padding: 0; display: grid; }
.aisle input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 0 0; accent-color: var(--accent); }
.aisle > ul > li { border-top: 1px solid var(--line); padding: 6px 0; }
.aisle > ul > li:first-child { border-top: 0; }
.aisle li label { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; cursor: pointer; border: 0; padding: 0; }
.aisle .txt { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
.aisle .item-name { font-weight: 600; }
.aisle .amt { font-family: var(--font-mono); font-size: 0.8rem; color: var(--ink); background: var(--sunk); padding: 0 6px; border-radius: 6px; }
.aisle .opt { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
.aisle details { margin: 2px 0 0 28px; font-size: 0.8rem; color: var(--muted); }
.aisle summary { cursor: pointer; width: fit-content; }
.aisle summary:hover { color: var(--ink); }
.aisle .uses { list-style: none; padding: 4px 0 2px; margin: 0; display: grid; gap: 4px; }
.aisle .from { display: block; font-size: 0.72rem; color: var(--m); font-weight: 700; }
.aisle li.done .item-name, .aisle li.done .amt { text-decoration: line-through; color: var(--muted); }

/* Recipe sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgb(10 16 12 / 45%); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: calc(24px + env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--surface); border-radius: 18px; width: 100%; max-width: 720px; padding: 22px 24px 28px; display: grid; gap: 16px; box-shadow: var(--shadow); border-top: 5px solid var(--m); }
.sheet-head { display: grid; gap: 8px; }
.sheet-head .top-row { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.sheet h2 { font-family: var(--font-display); font-weight: 400; font-size: 1.65rem; line-height: 1.2; }
.sheet .intro { color: var(--muted); margin: 0; max-width: 65ch; }
.sheet h4 { margin: 6px 0 4px; font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--m); }
.sheet ul, .sheet ol { margin: 0; padding-left: 1.3em; display: grid; gap: 4px; max-width: 65ch; }
.sheet ol > li { padding-left: 4px; }
.sheet li.group { list-style: none; margin: 8px 0 0 -1.3em; font-weight: 700; font-size: 0.9rem; }
.sheet ul ul { margin-top: 4px; }
.sheet p { margin: 0; max-width: 65ch; }
.variation { background: var(--sunk); border-radius: 12px; padding: 12px 14px; display: grid; gap: 6px; }
.variation h4 { margin-top: 0; }
.sheet .file { font-family: var(--font-mono); font-size: 0.72rem; color: var(--muted); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 8px; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 999px; font-size: 0.88rem; font-weight: 600; z-index: 30; box-shadow: var(--shadow); }
@media (prefers-reduced-motion: no-preference) {
  .sheet { animation: rise 0.18s ease-out; }
  @keyframes rise { from { transform: translateY(8px); opacity: 0.6; } to { transform: none; opacity: 1; } }
}
@media (max-width: 520px) {
  .brand h1 { font-size: 1.25rem; }
  .sync { white-space: normal; }
  .tabs { width: 100%; }
  .tabs button { flex: 1; padding-inline: 6px; }
  .sheet { padding: 18px 16px 24px; }
}
</style>

<header class="top">
  <div class="wrap">

<script>
const RECIPES = /*RECIPES*/[];
const BY_ID = Object.fromEntries(RECIPES.map(r => [r.id, r]));

const SLOTS = [
  { key: "slow", label: "Slow cooker", hint: "Start it in the morning", chapters: ["slow"] },
  { key: "pressure", label: "Pressure cooker", hint: "Instant Pot under pressure", chapters: ["pressure"] },
  { key: "quick", label: "Quick", hint: "Stovetop, sauté or oven", chapters: ["stovetop", "oven"] },
];
const CHAPTERS = [
  ["pressure", "Instant Pot"], ["slow", "Slow cooker"], ["stovetop", "Stovetop"], ["oven", "Oven"],
  ["sides", "Salads & sides"], ["breakfast", "Breakfast"], ["snacks", "Snacks"], ["shakes", "Shakes"],
  ["desserts", "Desserts"], ["baking", "Baking"], ["breadmaker", "Bread maker"],
];
const CHAPTER_LABEL = Object.fromEntries(CHAPTERS);
const DIET = [["freezes", "Freezer-friendly"], ["vegetarian", "Vegetarian"], ["dairy-free", "Dairy-free"], ["quick", "Under 30 min"], ["leftovers", "Uses leftovers"]];
const DIET_LABEL = Object.fromEntries(DIET);
const PROTEINS = [["mince", "Mince"], ["beef", "Beef"], ["pork", "Pork"], ["chicken", "Chicken"], ["fish", "Fish"]];

// ─── State ──────────────────────────────────────────────────────────────────
// Example week shown until a real plan is saved.
const EXAMPLE = {
  week: mondayOf(new Date()),
  slots: {
    slow: "SlowCooker-Smoky_Chicken_Bean_Lentil_Stew",
    pressure: "InstantPot-Cheeseburger_Macaroni",
    quick: "Stovetop-Pork_Larb",
  },
  extras: [], cooked: {}, checked: {}, scale: {}, fav: {}, rating: {}, log: {}, history: [], example: true,
};

let state = clone(EXAMPLE);
let ui = { tab: "week", q: "", chapter: null, group: null, protein: null, choosing: null, hidePantry: false, minceOnly: false, highProtein: false, diet: [], favOnly: false, open: null, cook: null };
let store = null;        // db document ref, or null
let saveMode = "local";  // "db" | "local" | "none"

function clone(x) { return JSON.parse(JSON.stringify(x)); }
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const day = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - day);
  return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, "0")}-${String(x.getDate()).padStart(2, "0")}`;
}
function prettyWeek(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-NZ", { weekday: "short", day: "numeric", month: "short" });
}
function sanitize(s) {
  const out = Object.assign(clone(EXAMPLE), s || {});
  out.slots = Object.assign({ slow: null, pressure: null, quick: null }, out.slots || {});
  for (const k of Object.keys(out.slots)) if (out.slots[k] && !BY_ID[out.slots[k]]) out.slots[k] = null;
  out.extras = (out.extras || []).filter(id => BY_ID[id]);
  out.cooked = out.cooked || {}; out.checked = out.checked || {}; out.scale = out.scale || {};
  out.fav = out.fav || {}; out.rating = out.rating || {}; out.log = out.log || {};
  out.history = (out.history || []).slice(0, 12);
  return out;
}

const LOCAL_KEY = "george-meal-planner";
function loadLocal() {
  try { const raw = localStorage.getItem(LOCAL_KEY); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
function saveLocal() {
  try { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); return true; } catch { return false; }
}

let saveTimer = null, saving = false, dirty = false;
function commit(mutator) {
  mutator(state);
  state.example = false;
  render();
  dirty = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 500);
}
async function flush() {
  if (!dirty) return;
  if (saving) { saveTimer = setTimeout(flush, 300); return; }
  dirty = false;
  if (fb && saveMode === "shared") {
    saving = true;
    saveLocal();
    setSync("Saving…");
    try { await pushShared(); setSync("Shared · up to date"); }
    catch { dirty = true; setSync("Couldn't sync — will retry"); saveTimer = setTimeout(flush, 5000); }
    finally { saving = false; }
  } else if (store && saveMode === "db") {
    saving = true;
    setSync("Saving…");
    try { await store.set(clone(state)); setSync("Synced across your devices"); }
    catch (e) {
      if (e && e.code === "unavailable") { dirty = true; saveTimer = setTimeout(flush, 1500 + Math.random() * 1000); }
      else { saveMode = "local"; saveLocal(); setSync("Saved on this device only"); }
    } finally { saving = false; }
  } else {
    setSync(saveLocal() ? "Saved on this device" : "Not saved — storage is blocked");
  }
}
function setSync(t) { document.getElementById("sync").textContent = t; }

// ─── Sharing between people (Firebase Firestore) ────────────────────────────
// Everyone with the household link reads and writes households/{code}. The
// code is 24 random characters, so the link is the key. Changes go up as
// small field updates (one ticked item, one rating) so two people editing at
// once don't overwrite each other. The device copy in localStorage stays as
// a backup and for offline use.
const SYNC = /*SYNC*/null;
const FIREBASE_VERSION = "10.12.2";
const HOUSE_KEY = "george-meal-planner-household";
const MAP_KEYS = ["checked", "cooked", "scale", "fav", "rating", "log"];
let fb = null;          // { fs, ref } once connected
let lastSynced = null;  // the state as the server last saw it
function householdCode() { try { return localStorage.getItem(HOUSE_KEY); } catch { return null; } }
function setHouseholdCode(c) { try { if (c) localStorage.setItem(HOUSE_KEY, c); else localStorage.removeItem(HOUSE_KEY); } catch {} }
function newHouseholdCode() {
  const bytes = crypto.getRandomValues(new Uint8Array(24));
  return [...bytes].map(b => "abcdefghijkmnpqrstuvwxyz23456789"[b % 32]).join("");
}
function shareLink(code) { return `${location.origin}${location.pathname}#join=${code}`; }

// [[path...], value] for every part of the state that changed.
function diffState(a, b) {
  const out = [];
  for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) {
    if (MAP_KEYS.includes(k) && a[k] && b[k]) {
      for (const sk of new Set([...Object.keys(a[k]), ...Object.keys(b[k])]))
        if (JSON.stringify(a[k][sk]) !== JSON.stringify(b[k][sk])) out.push([[k, sk], b[k][sk]]);
    } else if (JSON.stringify(a[k]) !== JSON.stringify(b[k])) out.push([[k], b[k]]);
  }
  return out;
}

async function startSharing(code, { upload = false } = {}) {
  setSync("Connecting…");
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VERSION}`;
  const [{ initializeApp }, fs] = await Promise.all([import(`${base}/firebase-app.js`), import(`${base}/firebase-firestore.js`)]);
  const ref = fs.doc(fs.getFirestore(initializeApp(SYNC)), "households", code);
  const snap = await fs.getDoc(ref);
  if (upload || !snap.exists()) {
    await fs.setDoc(ref, { state: clone(state), updated: fs.serverTimestamp() });
    lastSynced = clone(state);
  }
  fb = { fs, ref };
  saveMode = "shared";
  fs.onSnapshot(ref, snapshot => {
    if (snapshot.metadata.hasPendingWrites || dirty || saving) return;
    const data = snapshot.data();
    if (!data || !data.state) return;
    state = sanitize(data.state);
    lastSynced = clone(state);
    saveLocal();
    render();
    setSync("Shared · up to date");
  }, () => { saveMode = "local"; fb = null; setSync("Sharing paused — saved on this device"); });
}

async function pushShared() {
  const { fs, ref } = fb;
  const args = [];
  for (const [path, value] of diffState(lastSynced || {}, state))
    args.push(new fs.FieldPath("state", ...path), value === undefined ? fs.deleteField() : value);
  if (!args.length) return;
  const sent = clone(state);
  const slow = setTimeout(() => setSync("Waiting for signal to sync…"), 4000);
  try { await fs.updateDoc(ref, ...args, "updated", fs.serverTimestamp()); }
  finally { clearTimeout(slow); }
  lastSynced = sent;
}

// ─── Cooking mode ───────────────────────────────────────────────────────────
// Words that don't identify an ingredient on their own ("sauce" in "soy sauce").
const GENERIC = new Set(["fresh", "ground", "dried", "frozen", "canned", "sauce", "powder", "paste", "mixed", "white", "brown",
  "red", "green", "plain", "or", "and", "the", "can", "cans", "jar", "stock", "seeds", "leaves", "oil"]);
function ingredientWords(item) {
  // Stocks and oils show up in steps as just "stock" or "oil"; "chicken" alone means the meat.
  const end = item.key.match(/(stock|oil)$/);
  if (end) return [end[1]];
  const words = item.key.split("-").filter(w => w.length >= 3 && !GENERIC.has(w));
  return words.length ? words : [item.key.replace(/-/g, " ")];
}
function cookSteps(r) {
  const steps = [];
  const walk = (sections, prefix) => {
    for (const sec of sections) {
      if (sec.kind === "steps") {
        const label = sec.heading && !/^method$/i.test(sec.heading) ? sec.heading : prefix;
        for (const it of sec.items) if (it.text) steps.push({ text: it.text, sub: it.sub || [], label });
      }
    }
  };
  walk(r.sections, "");
  return steps;
}
// Ingredient lines a step mentions, with amounts at the current scale.
function stepUses(r, text, f) {
  const t = plain(text).toLowerCase();
  const out = [];
  for (const item of r.shop) {
    const hit = ingredientWords(item).some(w => new RegExp(`\\b${w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")}(s|es)?\\b`).test(t));
    const line = scaleText(item.raw, f);
    if (hit && !out.includes(line)) out.push(line);
  }
  return out;
}
function stepMinutes(text) {
  const m = plain(text).match(/(\d+)(?:\s*[–-]\s*(\d+))?\s*(minutes?|mins?|hours?|hrs?)\b/i);
  if (!m) return null;
  const n = Number(m[2] || m[1]);
  return /^h/i.test(m[3]) ? n * 60 : n;
}

let wakeLock = null;
async function keepAwake(on) {
  try {
    if (on && "wakeLock" in navigator && !wakeLock) {
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    } else if (!on && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch { wakeLock = null; }
}
document.addEventListener("visibilitychange", () => { if (ui.cook && document.visibilityState === "visible") keepAwake(true); });

let timer = null;  // { end, label, done }
let timerTick = null;
function fmtClock(ms) {
  const sec = Math.max(0, Math.round(ms / 1000));
  const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, s2 = sec % 60;
  return (h ? `${h}:${String(m).padStart(2, "0")}` : String(m)) + ":" + String(s2).padStart(2, "0");
}
function beep() {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach(t => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25, ctx.currentTime + t);
      o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.2);
    });
  } catch {}
}
function startTimer(min, label) {
  timer = { end: Date.now() + min * 60000, label, done: false };
  clearInterval(timerTick);
  timerTick = setInterval(() => {
    if (!timer) return clearInterval(timerTick);
    if (!timer.done && Date.now() >= timer.end) {
      timer.done = true;
      beep();
      navigator.vibrate?.([300, 150, 300, 150, 300]);
      toast(`Timer done: ${timer.label}`);
    }
    const chip = document.getElementById("timer-chip");
    if (chip) { chip.textContent = timer.done ? "Time's up" : fmtClock(timer.end - Date.now()); chip.classList.toggle("done", timer.done); }
  }, 500);
  renderSheet();
}

function cookView() {
  const r = BY_ID[ui.cook.id];
  const f = scaleOf(r.id);
  const steps = cookSteps(r);
  const total = steps.length + 1;  // step 0 is "Get ready"
  const i = Math.min(ui.cook.step, total - 1);
  let body;
  if (i === 0) {
    const items = r.sections.filter(sec => sec.kind === "ingredients").flatMap(sec => sec.items);
    body = `<p class="cook-label">Get ready${f !== 1 ? ` · ${SCALE_LABEL[f]} amounts` : ""}</p>
      <ul class="cook-ready">${items.map((it, n) => it.group
        ? `<li class="group">${md(it.group)}</li>`
        : `<li><label><input type="checkbox" data-act="cook-have" data-n="${n}" ${ui.cook.have[n] ? "checked" : ""}><span>${md(scaleText(it.text, f))}</span></label></li>`).join("")}</ul>`;
  } else {
    const st = steps[i - 1];
    const uses = stepUses(r, st.text + " " + st.sub.join(" "), f);
    const min = stepMinutes(st.text);
    body = `<p class="cook-label">Step ${i} of ${steps.length}${st.label ? ` · ${esc(st.label)}` : ""}</p>
      <p class="cook-step">${md(st.text)}</p>
      ${st.sub.length ? `<ul class="cook-uses" style="font-size:1.05rem">${st.sub.map(x => `<li>${md(x)}</li>`).join("")}</ul>` : ""}
      ${uses.length ? `<div class="cook-uses"><strong>You'll need</strong><ul>${uses.map(x => `<li>${md(x)}</li>`).join("")}</ul></div>` : ""}
      ${min ? `<button class="btn" data-act="cook-timer" data-min="${min}">Start ${min >= 60 ? `${+(min / 60).toFixed(1)} hr` : `${min} min`} timer</button>` : ""}`;
  }
  const last = i === total - 1;
  return `<div class="cook" role="dialog" aria-modal="true" aria-label="Cooking ${esc(r.title)}">
    <div class="cook-top">
      <span class="title">${esc(r.title)}</span>
      ${timer ? `<button class="timer-chip${timer.done ? " done" : ""}" id="timer-chip" data-act="cook-timer-clear" title="Tap to clear">${timer.done ? "Time's up" : fmtClock(timer.end - Date.now())}</button>` : ""}
      <button class="btn small ghost" data-act="cook-exit">Exit</button>
    </div>
    <div class="cook-progress"><span style="width:${Math.round((i + 1) / total * 100)}%"></span></div>
    <div class="cook-body" id="cook-body">${body}</div>
    <div class="cook-nav">
      <button class="btn" data-act="cook-prev" ${i === 0 ? "disabled" : ""}>Back</button>
      <button class="btn primary" data-act="${last ? "cook-exit" : "cook-next"}">${last ? "Done" : i === 0 ? "Start" : "Next"}</button>
    </div>
  </div>`;
}
function cookGo(delta) {
  if (!ui.cook) return;
  const total = cookSteps(BY_ID[ui.cook.id]).length + 1;
  ui.cook.step = Math.max(0, Math.min(total - 1, ui.cook.step + delta));
  renderSheet();
}

function shareDialog() {
  const code = householdCode();
  const body = fb && code
    ? `<p>Send this link to anyone who should share the planner. You'll both see the same week, ticks and ratings as they change.</p>
       <input class="share-link" id="share-link" readonly value="${esc(shareLink(code))}" aria-label="Share link">
       <div class="sheet-actions"><button class="btn primary" data-act="share-send">Share link</button><button class="btn" data-act="share-copy">Copy</button><button class="btn ghost" data-act="share-stop">Stop sharing on this device</button></div>
       <p style="margin-top:12px">Anyone with the link can see and change the planner, so only send it to people you plan meals with.</p>`
    : `<p>Share this planner so someone else sees the same week, ticks off the same shopping list and adds their own ratings. Your current week and favourites are shared too.</p>
       <div class="sheet-actions"><button class="btn primary" data-act="share-start">Start sharing</button></div>`;
  return `<div class="overlay" data-act="close-overlay">
    <article class="sheet share-sheet" role="dialog" aria-modal="true" aria-labelledby="share-title">
      <div class="sheet-head">
        <div class="top-row"><span class="chip">Sharing</span><button class="btn small ghost" data-act="close" aria-label="Close">Close</button></div>
        <h2 id="share-title">Share the planner</h2>
      </div>
      ${body}
    </article>
  </div>`;
}

async function connect() {
  const local = loadLocal();
  if (local) { state = sanitize(local); render(); }
  if (SYNC) {
    document.getElementById("share-btn").hidden = false;
    const join = location.hash.match(/^#join=([a-z0-9]{20,})$/);
    if (join) {
      setHouseholdCode(join[1]);
      history.replaceState(null, "", location.pathname);
    }
    const code = householdCode();
    if (code) {
      try { await startSharing(code); if (join) toast("Joined the shared planner"); return; }
      catch { setSync("Couldn't reach the shared planner — saved on this device"); return; }
    }
  }
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use("db") : null; } catch { db = null; }
  if (!db) { setSync(local ? "Saved on this device" : "Example week — your changes save on this device"); return; }
  store = db.doc("planner/state");
  saveMode = "db";
  setSync("Syncing…");
  store.onSnapshot(snap => {
    if (snap.metadata.hasPendingWrites || dirty || saving) return;
    if (snap.exists) { state = sanitize(snap.data()); render(); setSync("Synced across your devices"); }
    else { setSync("Example week — pick your own and it will sync"); }
  }, () => { saveMode = "local"; setSync("Saved on this device only"); });
}

// ─── Helpers ────────────────────────────────────────────────────────────────
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const md = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
const plain = s => String(s).replace(/\*\*/g, "");
function slotFor(r) {
  return r.chapter === "slow" ? "slow" : r.chapter === "pressure" ? "pressure"
    : ["stovetop", "oven"].includes(r.chapter) ? "quick" : null;
}
function plannedIds() {
  return [...Object.values(state.slots).filter(Boolean), ...state.extras];
}
function recentIds() {
  return new Set(state.history.slice(0, 4).flatMap(h => h.ids));
}
function toast(msg) {
  const root = document.getElementById("toast-root");
  root.innerHTML = `<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { root.innerHTML = ""; }, 2200);
}
const HIGH_PROTEIN = 30; // g per serving
function isHighProtein(r) { return !!r.nutrition && r.nutrition.protein >= HIGH_PROTEIN; }
function macroSpans(r) {
  const n = r.nutrition;
  return n ? `<span class="kcal">${n.kcal} kcal</span><span class="kcal">${n.protein} g protein</span>` : "";
}
function badges(r) {
  return r.diet.length ? `<span class="badges">${r.diet.map(t => `<span class="badge">${esc(DIET_LABEL[t])}</span>`).join("")}</span>` : "";
}
function storageBox(r) {
  return r.storage.length ? `<div class="storage"><strong>Storage</strong><ul>${r.storage.map(x => `<li>${md(x)}</li>`).join("")}</ul></div>` : "";
}
function macroBlock(r) {
  const n = r.nutrition;
  if (!n) return "";
  const cell = (label, v) => `<div><dt>${label}</dt><dd>${v}</dd></div>`;
  return `<dl class="macros">${cell("Calories", n.kcal)}${cell("Protein", `${n.protein} g`)}${cell("Carbs", `${n.carbs} g`)}${cell("Fat", `${n.fat} g`)}</dl>
    <p class="macros-note">Per ${n.per}, estimated from the ingredients.</p>`;
}
function weekNutrition() {
  const meals = plannedIds().map(id => BY_ID[id]).filter(r => r && r.nutrition && r.nutrition.per === "serving");
  if (!meals.length) return "";
  let servings = 0, kcal = 0, protein = 0;
  for (const r of meals) {
    const n = r.nutrition.count * scaleOf(r.id);
    servings += n;
    kcal += r.nutrition.kcal * n;
    protein += r.nutrition.protein * n;
  }
  const s = Math.round(servings);
  return `<p class="week-nutrition">This week: <strong>${s}</strong> servings, averaging <strong>${Math.round(kcal / servings / 10) * 10} kcal</strong> and <strong>${Math.round(protein / servings)} g protein</strong> each (<strong>${Math.round(protein).toLocaleString()} g</strong> protein in total).</p>`;
}

// ─── Favourites, ratings and cooking history ───────────────────────────────
function todayISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function daysSince(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return Math.floor((Date.now() - new Date(y, m - 1, d).getTime()) / 86400000);
}
function cookedRecently(id) { return (state.log[id] || []).some(d => daysSince(d) < 28); }
function stars(id, act) {
  const v = state.rating[id] || 0;
  return `<span class="stars" role="group" aria-label="Rating">${[1, 2, 3, 4, 5].map(n =>
    `<button data-act="${act}" data-id="${id}" data-v="${n}" aria-pressed="${n <= v}" aria-label="${n} star${n > 1 ? "s" : ""}">★</button>`).join("")}</span>`;
}
function historyLine(id) {
  const log = state.log[id] || [];
  if (!log.length) return "";
  const last = log[log.length - 1].split("-").map(Number);
  const when = new Date(last[0], last[1] - 1, last[2]).toLocaleDateString("en-NZ", { day: "numeric", month: "short" });
  return `<p class="history-line">Cooked ${log.length === 1 ? "once" : `${log.length} times`} · last on ${esc(when)}</p>`;
}
// Favourites and well-rated recipes come up more often; low ratings less.
const RATING_WEIGHT = { 1: 0.2, 2: 0.5, 3: 1, 4: 2, 5: 3 };
function weight(r) {
  return (state.fav[r.id] ? 3 : 1) * (RATING_WEIGHT[state.rating[r.id]] || 1);
}

function pickRandom(slotKey, exclude) {
  const slot = SLOTS.find(s => s.key === slotKey);
  const recent = recentIds();
  const used = new Set(plannedIds());
  let pool = RECIPES.filter(r => slot.chapters.includes(r.chapter) && r.id !== exclude && !used.has(r.id));
  if (ui.minceOnly) pool = pool.filter(r => r.tags.includes("mince"));
  if (ui.highProtein) pool = pool.filter(isHighProtein);
  // Skip anything planned in the last four weeks or cooked in the last 28 days, if there's enough left.
  const fresh = pool.filter(r => !recent.has(r.id) && !cookedRecently(r.id));
  const from = fresh.length ? fresh : pool;
  if (!from.length) return null;
  let roll = Math.random() * from.reduce((a, r) => a + weight(r), 0);
  for (const r of from) { roll -= weight(r); if (roll <= 0) return r.id; }
  return from[from.length - 1].id;
}

// ─── Shopping list ──────────────────────────────────────────────────────────
const AISLES = ["Meat & fish", "Fruit & veg", "Dairy, eggs & chilled", "Frozen", "Bread & wraps", "Pasta, rice & grains", "Cans, jars & pulses", "Baking", "Pantry: check first"];
// Fallback for any ingredient the build step couldn't name. First match wins.
const AISLE_RULES = [
  ["Pantry: check first", /\bstock\b|broth|vinegar|soy sauce|fish sauce|oyster sauce|hoisin|worcestershire|peanut butter|\boil\b/],
  ["Frozen", /frozen/],
  ["Cans, jars & pulses", /\bcans?\b|\btins?\b|tinned|canned|beans|lentil|chickpea|passata|tomato paste|\bjam\b|salsa/],
  ["Meat & fish", /mince|chicken|beef|pork|sausage|bacon|\bham\b|steak|salmon|prawn|lamb/],
  ["Pasta, rice & grains", /\brice\b|pasta|noodle|couscous|barley|\boats\b/],
  ["Bread & wraps", /tortilla|\bwraps?\b|\bbuns?\b|bread|fries/],
  ["Dairy, eggs & chilled", /milk|cream|butter|cheese|yoghurt|yogurt|\beggs?\b/],
  ["Baking", /flour|sugar|cocoa|chocolate/],
  ["Fruit & veg", /onion|garlic|carrot|potato|lemon|lime|tomato|lettuce|tabbouleh/],
];
function aisleOf(line) {
  const t = plain(line).toLowerCase();
  for (const [aisle, re] of AISLE_RULES) if (re.test(t)) return aisle;
  return "Pantry: check first";
}

// ─── Scaling ────────────────────────────────────────────────────────────────
const SCALES = [[0.5, "½×"], [1, "1×"], [1.5, "1½×"], [2, "2×"], [3, "3×"]];
const SCALE_LABEL = Object.fromEntries(SCALES);
const FRAC = { "½": 0.5, "¼": 0.25, "¾": 0.75, "⅓": 1 / 3, "⅔": 2 / 3, "⅛": 0.125 };
const NUM = String.raw`(?:\d+(?:\.\d+)?\s*[½¼¾⅓⅔⅛]?|[½¼¾⅓⅔⅛])`;
function scaleOf(id) { return (state.scale && state.scale[id]) || 1; }
function toNum(t) {
  const m = t.replace(/\s+/g, "").match(/^(\d+(?:\.\d+)?)?([½¼¾⅓⅔⅛])?$/);
  return m ? (m[1] ? parseFloat(m[1]) : 0) + (m[2] ? FRAC[m[2]] : 0) : null;
}
function fmtNum(n) { return n >= 10 ? String(Math.round(n)) : nice(n); }
// "1½ cups stock" × 2 -> "3 cups stock"; "2–3 garlic cloves" × 2 -> "4–6 garlic cloves".
// Only the leading amount changes, so "(400 g)" can sizes stay as they are.
function scaleText(text, f) {
  if (f === 1) return text;
  const re = new RegExp(String.raw`^(\*\*)?(${NUM})(\s*(?:–|-|to)\s*)?(${NUM})?`);
  return text.replace(re, (all, bold, a, sep, b) => {
    const x = toNum(a), y = b ? toNum(b) : null;
    if (x == null) return all;
    const gap = t => (t || "").match(/\s*$/)[0];  // keep the space the number pattern swallowed
    return (bold || "") + fmtNum(x * f) + gap(a) + (sep || "") + (y != null ? fmtNum(y * f) + gap(b) : "");
  });
}
// "4 (8 burritos)" × 2 -> "8 (16 burritos)"; "(about ½ cup each)" is a portion size, so it stays.
function scaleServings(text, f) {
  if (f === 1) return text;
  return scaleText(text, f).replace(/\((\d+)([^)]*)\)/, (all, n, rest) => /each/.test(rest) ? all : `(${fmtNum(n * f)}${rest})`);
}
function scaledServingsText(r) {
  const f = scaleOf(r.id);
  return f === 1 ? r.servings : scaleServings(r.servings, f);
}

// ─── Adding up amounts ──────────────────────────────────────────────────────
const SPOON_TSP = { tsp: 1, tbsp: 3, cup: 48 };      // spoons and cups in teaspoons
const TO_ML = { tsp: 5, tbsp: 15, cup: 250, ml: 1 };
const COUNT_WORDS = { can: ["can", "cans"], clove: ["clove", "cloves"], sheet: ["sheet", "sheets"], bulb: ["bulb", "bulbs"],
  jar: ["jar", "jars"], packet: ["packet", "packets"], bunch: ["bunch", "bunches"], head: ["head", "heads"],
  stalk: ["stalk", "stalks"], rasher: ["rasher", "rashers"], slice: ["slice", "slices"], scoop: ["scoop", "scoops"],
  handful: ["handful", "handfuls"], block: ["block", "blocks"], box: ["box", "boxes"] };

function nice(n) {
  const whole = Math.floor(n + 1e-9);
  const rest = n - whole;
  const fracs = [[0, ""], [0.25, "¼"], [1 / 3, "⅓"], [0.5, "½"], [2 / 3, "⅔"], [0.75, "¾"], [1, ""]];
  let best = fracs[0];
  for (const f of fracs) if (Math.abs(rest - f[0]) < Math.abs(rest - best[0])) best = f;
  const w = best[0] === 1 ? whole + 1 : whole;
  return (w ? String(w) : (best[1] ? "" : "0")) + best[1];
}
function fmtMetric(n, small, big) {
  if (n >= 1000) return `${+(n / 1000).toFixed(n % 1000 ? 2 : 0)} ${big}`;
  return `${Math.round(n)} ${small}`;
}
function fmtSpoons(tsp) {
  if (tsp >= 12) return `${nice(Math.ceil(tsp / 12) / 4)} ${tsp > 48 ? "cups" : "cup"}`;
  if (tsp >= 3) return `${nice(Math.round(tsp / 1.5) / 2)} tbsp`;
  return `${nice(Math.round(tsp * 4) / 4)} tsp`;
}
// Rough weight of one, for veg that some recipes count and others weigh.
const PIECE_G = { carrot: 100, onion: 150, "red-onion": 150, potato: 200, capsicum: 150, apple: 150, courgette: 200, kumara: 300, tomato: 120 };
// parts: [{qty, unit}] for one ingredient across recipes -> "1.1 kg + 2", "3 cans", "1½ cups"
function amountText(parts, key) {
  const w = PIECE_G[key];
  if (w && parts.some(p => p.qty != null && p.unit === "") && parts.some(p => p.qty != null && p.unit === "g")) {
    const n = parts.reduce((a, p) => a + (p.qty == null ? 0 : p.unit === "g" ? p.qty / w : p.unit === "" ? p.qty : 0), 0);
    return `about ${Math.ceil(n)}`;
  }
  const has = u => parts.some(p => p.qty != null && p.unit === u);
  const sum = pred => parts.filter(p => p.qty != null && pred(p)).reduce((a, p) => a + p.qty, 0);
  const out = [];
  if (has("g")) out.push(fmtMetric(sum(p => p.unit === "g"), "g", "kg"));
  if (has("ml")) {
    // Mix of millilitres and cups: show it all as millilitres/litres.
    const ml = parts.filter(p => p.qty != null && TO_ML[p.unit]).reduce((a, p) => a + p.qty * TO_ML[p.unit], 0);
    out.push(fmtMetric(ml, "ml", "L"));
  } else if (parts.some(p => p.qty != null && SPOON_TSP[p.unit])) {
    out.push(fmtSpoons(parts.filter(p => p.qty != null && SPOON_TSP[p.unit]).reduce((a, p) => a + p.qty * SPOON_TSP[p.unit], 0)));
  }
  for (const [u, [one, many]] of Object.entries(COUNT_WORDS)) {
    if (has(u)) { const n = sum(p => p.unit === u); out.push(`${nice(n)} ${n > 1 ? many : one}`); }
  }
  if (has("")) out.push(nice(sum(p => p.unit === "")));
  return out.join(" + ");
}

function shoppingList() {
  const rows = new Map();
  for (const id of plannedIds()) {
    const r = BY_ID[id];
    const f = scaleOf(id);
    for (const item of r.shop) {
      let row = rows.get(item.key);
      if (!row) {
        row = { key: "item:" + item.key, name: item.name, aisle: item.aisle || aisleOf(item.raw), parts: [], uses: [], optional: true };
        rows.set(item.key, row);
      }
      row.parts.push({ qty: item.qty == null ? null : item.qty * f, unit: item.unit });
      row.optional = row.optional && item.optional;
      const use = row.uses.find(u => u.recipe === r);
      const line = scaleText(item.raw, f);
      if (use) { if (!use.lines.includes(line)) use.lines.push(line); }
      else row.uses.push({ recipe: r, lines: [line] });
    }
  }
  const groups = Object.fromEntries(AISLES.map(a => [a, []]));
  for (const row of rows.values()) {
    row.amount = amountText(row.parts, row.key.slice(5));
    groups[row.aisle].push(row);
  }
  for (const a of AISLES) groups[a].sort((x, y) => (x.optional - y.optional) || x.name.localeCompare(y.name));
  return groups;
}

// ─── Render ─────────────────────────────────────────────────────────────────
function render() {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.tab === ui.tab)));
  const groups = shoppingList();
  const total = Object.values(groups).flat().length;
  const left = Object.values(groups).flat().filter(x => !state.checked[x.key]).length;
  document.getElementById("shop-count").textContent = total ? left : "";
  const app = document.getElementById("app");
  app.innerHTML = ui.tab === "week" ? renderWeek() : ui.tab === "recipes" ? renderRecipes() : renderShop(groups);
  renderSheet();
}

function slotCard(s) {
  const id = state.slots[s.key];
  if (!id) {
    return `<article class="slot empty" data-m="${s.key}">
      <span class="chip">${s.label}</span>
      <p class="hint">${s.hint}</p>
      <p class="placeholder">Nothing picked yet.</p>
      <div class="row">
        <button class="btn small primary" data-act="shuffle-slot" data-slot="${s.key}">Pick for me</button>
        <button class="btn small" data-act="choose" data-slot="${s.key}">Browse</button>
      </div>
    </article>`;
  }
  const r = BY_ID[id];
  const cooked = !!state.cooked[id];
  return `<article class="slot${cooked ? " is-cooked" : ""}" data-m="${s.key}">
    <span class="chip">${s.label}</span>
    <h3><button data-act="open" data-id="${id}">${state.fav[id] ? `<span class="fav-mark" aria-label="Favourite">★</span> ` : ""}${esc(r.title)}</button></h3>
    <div class="meta">${scaleOf(id) !== 1 ? `<span class="times">${SCALE_LABEL[scaleOf(id)]}</span>` : ""}<span>Serves ${esc(scaledServingsText(r))}</span><span>${esc(r.time === "–" ? "Time not set" : r.time)}</span>${macroSpans(r)}</div>
    <div class="row">
      <button class="btn small" data-act="shuffle-slot" data-slot="${s.key}" title="Swap for another random recipe">Swap</button>
      <button class="btn small" data-act="choose" data-slot="${s.key}">Browse</button>

    </div>
    ${cooked ? `<div class="rate-row">${state.rating[id] ? "Your rating" : "How was it?"} ${stars(id, "rate")}</div>` : ""}
  </article>`;
}

function renderWeek() {
  const extras = state.extras.map(id => {
    const r = BY_ID[id];
    return `<div class="extra-row" data-m="${r.chapter}">
      <span class="chip">${esc(CHAPTER_LABEL[r.chapter])}</span>
      <span class="title"><button data-act="open" data-id="${id}">${esc(r.title)}</button>${scaleOf(id) !== 1 ? ` <span class="times">${SCALE_LABEL[scaleOf(id)]}</span>` : ""}</span>
      <button class="btn small ghost" data-act="remove-extra" data-id="${id}">Remove</button>
    </div>`;
  }).join("");
  const hist = state.history.slice(0, 6).map(h =>
    `<li><strong>${esc(prettyWeek(h.week))}</strong> · ${h.ids.map(id => esc(BY_ID[id]?.title || "Removed recipe")).join(" · ")}</li>`).join("");
  return `
  <section class="section-head">
    <div>
      <h2>Week of ${esc(prettyWeek(state.week))}</h2>

      ${weekNutrition()}
    </div>
    <div class="actions">
      <label class="toggle"><input type="checkbox" id="mince-only" data-act="mince-only" ${ui.minceOnly ? "checked" : ""}> Mince recipes only</label>
      <label class="toggle"><input type="checkbox" id="high-protein-week" data-act="high-protein" ${ui.highProtein ? "checked" : ""}> ${HIGH_PROTEIN} g+ protein</label>

      <button class="btn primary" data-act="new-week">Start next week</button>

  <section class="extras" aria-label="Extras">
    <div class="section-head">
      <div><h2>Extras</h2><p>Sides, baking, breakfasts or anything else you want on the shopping list.</p></div>
      <button class="btn" data-act="goto-recipes">Add from recipes</button>
    </div>
    ${extras || `<p class="empty-note">No extras this week.</p>`}

  ${hist ? `<section><div class="section-head"><div><h2>Recent weeks</h2><p>Shuffle avoids these for four weeks.</p></div></div><ul class="history">${hist}</ul></section>` : ""}`;

function filteredRecipes() {
  const q = ui.q.trim().toLowerCase();
  const slot = ui.choosing && SLOTS.find(s => s.key === ui.choosing);
  return RECIPES.filter(r =>
    (!slot || slot.chapters.includes(r.chapter)) &&
    (!ui.chapter || r.chapter === ui.chapter) &&
    (!ui.group || r.group === ui.group) &&
    (!ui.protein || r.tags.includes(ui.protein)) &&
    (!ui.highProtein || isHighProtein(r)) &&
    ui.diet.every(t => r.diet.includes(t)) &&
    (!ui.favOnly || state.fav[r.id]) &&
    (!q || r.title.toLowerCase().includes(q) || r.ingredients.some(l => l.toLowerCase().includes(q))));
}

function renderRecipes() {
  const slot = ui.choosing && SLOTS.find(s => s.key === ui.choosing);
  const list = filteredRecipes();
  const planned = new Set(plannedIds());
  const chapterChips = (slot ? CHAPTERS.filter(([k]) => slot.chapters.includes(k)) : CHAPTERS)
    .map(([k, l]) => `<button class="fchip" data-act="chapter" data-v="${k}" aria-pressed="${ui.chapter === k}">${l}</button>`).join("");
  // Chapters split into groups (e.g. Salads & sides) get a second row of chips.
  const groupNames = ui.chapter ? [...new Set(RECIPES.filter(r => r.chapter === ui.chapter && r.group).map(r => r.group))] : [];
  const groupChips = groupNames.map(g => `<button class="fchip" data-act="group" data-v="${esc(g)}" aria-pressed="${ui.group === g}">${esc(g)}</button>`).join("");
  const dietChips = DIET.map(([k, l]) => `<button class="fchip" data-act="diet" data-v="${k}" aria-pressed="${ui.diet.includes(k)}">${l}</button>`).join("");
  const proteinChips = PROTEINS.map(([k, l]) => `<button class="fchip" data-act="protein" data-v="${k}" aria-pressed="${ui.protein === k}">${l}</button>`).join("");
  const cards = list.map(r => `<button class="card" data-m="${r.chapter}" data-act="open" data-id="${r.id}">
      <span class="chip">${esc(CHAPTER_LABEL[r.chapter])}${r.group ? ` · ${esc(r.group)}` : ""}</span>
      <span class="name">${state.fav[r.id] ? `<span class="fav-mark" aria-label="Favourite">★</span> ` : ""}${esc(r.title)}${state.rating[r.id] ? ` <span class="fav-mark">${"★".repeat(state.rating[r.id])}</span>` : ""}</span>
      <span class="meta"><span>Serves ${esc(r.servings)}</span>${r.time !== "–" ? `<span>${esc(r.time)}</span>` : ""}${macroSpans(r)}</span>
      ${badges(r)}
      ${planned.has(r.id) ? `<span class="planned">On this week's plan</span>` : ""}
    </button>`).join("");
  return `
  <section class="section-head">
    <div><h2>Recipes</h2><p>All ${RECIPES.length} recipes from your book.</p></div>
  </section>
  ${slot ? `<div class="choosing" data-m="${slot.key}">Choosing the <strong>${slot.label}</strong> meal. Open a recipe and tap “Use this”. <button class="btn small ghost" data-act="cancel-choose">Cancel</button></div>` : ""}
  <section class="filters">
    <input class="search" id="search" type="search" placeholder="Search by name or ingredient, e.g. split peas" value="${esc(ui.q)}" aria-label="Search recipes">
    <div class="chips" role="group" aria-label="Chapter">${chapterChips}</div>
    ${groupChips ? `<div class="chips" role="group" aria-label="Section">${groupChips}</div>` : ""}
    <div class="chips" role="group" aria-label="Main protein">${proteinChips}<button class="fchip" data-act="high-protein-chip" aria-pressed="${ui.highProtein}">${HIGH_PROTEIN} g+ protein</button></div>
    <div class="chips" role="group" aria-label="Diet and meal prep">${dietChips}<button class="fchip" data-act="fav-only" aria-pressed="${ui.favOnly}">★ Favourites</button></div>
  </section>
  <p class="result-count">${list.length} ${list.length === 1 ? "recipe" : "recipes"}</p>
  <section class="list">${cards || `<p class="empty-note">No recipes match. Try clearing a filter.</p>`}</section>`;
}

function renderShop(groups) {
  const ids = plannedIds();
  if (!ids.length) {
    return `<section class="section-head"><div><h2>Shopping list</h2><p>Plan some meals and their ingredients will appear here, grouped by aisle.</p></div></section>`;
  }
  const aisleCards = AISLES.map(a => {
    const items = groups[a];
    if (ui.hidePantry && a.startsWith("Pantry")) return "";
    if (!items.length) return "";
    const left = items.filter(x => !state.checked[x.key]).length;
    return `<section class="aisle"><h3>${esc(a)}<span>${left}/${items.length}</span></h3><ul>${items.map(x => {
      const done = !!state.checked[x.key];
      const uses = x.uses.map(u => `<li><span class="from" data-m="${u.recipe.chapter}">${esc(u.recipe.title)}</span>${u.lines.map(l => esc(l)).join("; ")}</li>`).join("");
      return `<li class="${done ? "done" : ""}">
        <label><input type="checkbox" data-act="check" data-key="${esc(x.key)}" ${done ? "checked" : ""}>
          <span class="txt"><span class="item-name">${esc(x.name)}</span>${x.amount ? `<span class="amt">${esc(x.amount)}</span>` : ""}${x.optional ? `<span class="opt">optional</span>` : ""}</span>
        </label>
        <details><summary>${x.uses.length === 1 ? esc(x.uses[0].recipe.title) : `${x.uses.length} recipes`}</summary><ul class="uses">${uses}</ul></details>
      </li>`;
    }).join("")}</ul></section>`;
  }).join("");
  return `
  <section class="section-head">
    <div><h2>Shopping list</h2><p>${ids.length} ${ids.length === 1 ? "recipe" : "recipes"} this week. Amounts are added up across recipes. Tap a recipe name under an item to see exactly what each one needs.</p></div>
    <div class="actions">
      <label class="toggle"><input type="checkbox" id="hide-pantry" data-act="hide-pantry" ${ui.hidePantry ? "checked" : ""}> Hide pantry items</label>
      <button class="btn" data-act="share-list">Share list</button>
      <button class="btn ghost" data-act="copy-list">Copy list</button>
      <button class="btn ghost" data-act="uncheck-all">Untick all</button>
    </div>
  </section>
  <section class="aisles">${aisleCards}</section>`;
}

function renderItems(items, ordered, f = 1) {
  const tag = ordered ? "ol" : "ul";
  return `<${tag}>${items.map(it => it.group
    ? `<li class="group">${md(it.group)}</li>`
    : `<li>${md(scaleText(it.text, f))}${it.sub ? `<ul>${it.sub.map(s => `<li>${md(scaleText(s, f))}</li>`).join("")}</ul>` : ""}</li>`).join("")}</${tag}>`;
}
function renderSections(sections, f = 1) {
  return sections.map(s => {
    const h = s.heading ? `<h4>${esc(s.heading)}</h4>` : "";
    if (s.kind === "text") return `<div>${h}<p>${md(s.text)}</p></div>`;
    if (s.kind === "variation") return `<div class="variation"><h4>${esc(s.heading || "Variation")}</h4>${s.text ? `<p>${md(s.text)}</p>` : ""}${renderSections(s.sections || [])}</div>`;
    return `<div>${h}${renderItems(s.items, s.kind === "steps", s.kind === "ingredients" ? f : 1)}</div>`;
  }).join("");
}

function renderSheet() {
  const root = document.getElementById("sheet-root");
  if (ui.cook) { root.innerHTML = cookView(); return; }
  if (!ui.open) { root.innerHTML = ui.share ? shareDialog() : ""; return; }
  const r = BY_ID[ui.open];
  const target = ui.choosing || slotFor(r);
  const inSlot = Object.entries(state.slots).find(([, v]) => v === r.id);
  const inExtras = state.extras.includes(r.id);
  let actions;
  if (inSlot || inExtras) actions = `<button class="btn" data-act="unplan" data-id="${r.id}">Remove from this week</button>`;
  else if (ui.choosing) actions = `<button class="btn primary" data-act="use" data-id="${r.id}">Use this for ${esc(SLOTS.find(s => s.key === ui.choosing).label.toLowerCase())}</button>`;
  else if (target) actions = `<button class="btn primary" data-act="use" data-id="${r.id}">${state.slots[target] ? "Replace" : "Add as"} this week's ${esc(SLOTS.find(s => s.key === target).label.toLowerCase())} meal</button>
      <button class="btn" data-act="add-extra" data-id="${r.id}">Add as an extra</button>`;
  else actions = `<button class="btn primary" data-act="add-extra" data-id="${r.id}">Add to this week</button>`;
  root.innerHTML = `<div class="overlay" data-act="close-overlay">
    <article class="sheet" data-m="${r.chapter}" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="sheet-head">
        <div class="top-row"><span class="chip">${esc(r.chapterName)}${r.group ? ` · ${esc(r.group)}` : ""}</span><span class="row"><button class="fav" data-act="fav" data-id="${r.id}" aria-pressed="${!!state.fav[r.id]}">★ ${state.fav[r.id] ? "Favourite" : "Add to favourites"}</button><button class="btn small ghost" data-act="close" aria-label="Close recipe">Close</button></span></div>
        <h2 id="sheet-title">${esc(r.title)}</h2>
        <div class="meta"><span>Serves ${esc(scaledServingsText(r))}${scaleOf(r.id) !== 1 ? ` (recipe serves ${esc(r.servings)})` : ""}</span>${r.time !== "–" ? `<span>${esc(r.time)}</span>` : ""}</div>
        <div class="scale" role="group" aria-label="Scale the recipe">Make
          ${SCALES.map(([v, l]) => `<button class="fchip" data-act="scale" data-id="${r.id}" data-v="${v}" aria-pressed="${scaleOf(r.id) === v}">${l}</button>`).join("")}
        </div>
        ${scaleOf(r.id) !== 1 ? `<p class="scale-note">Ingredient amounts and the shopping list are scaled. Cooking times and pot size may need adjusting.</p>` : ""}
        ${badges(r)}
        <div class="rate-row">Your rating ${stars(r.id, "rate")}</div>
        ${historyLine(r.id)}
        ${macroBlock(r)}
        ${r.intro ? `<p class="intro">${md(r.intro)}</p>` : ""}
        <div class="sheet-actions">${cookSteps(r).length ? `<button class="btn primary" data-act="cook-start" data-id="${r.id}">Start cooking</button>` : ""}${actions}</div>
      </div>
      ${storageBox(r)}
      ${renderSections(r.sections, scaleOf(r.id))}
      <span class="file">${esc(r.file)}</span>
    </article>
  </div>`;
  root.querySelector('[data-act="close"]').focus({ preventScroll: true });
}

// ─── Events ─────────────────────────────────────────────────────────────────
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  if (act === "close-overlay" && e.target !== el) return;
  const id = el.dataset.id, slot = el.dataset.slot;
  switch (act) {
    case "open": ui.open = id; renderSheet(); break;
    case "close": case "close-overlay": ui.open = null; ui.share = false; renderSheet(); break;
    case "share": ui.share = true; renderSheet(); break;
    case "cook-start": ui.cook = { id, step: 0, have: {} }; keepAwake(true); renderSheet(); break;
    case "cook-next": cookGo(1); break;
    case "cook-prev": cookGo(-1); break;
    case "cook-exit": ui.cook = null; keepAwake(false); renderSheet(); break;
    case "cook-timer": startTimer(Number(el.dataset.min), plain(BY_ID[ui.cook.id].title)); break;
    case "cook-timer-clear": timer = null; clearInterval(timerTick); renderSheet(); break;
    case "share-start": {
      const code = newHouseholdCode();
      setHouseholdCode(code);
      startSharing(code, { upload: true }).then(() => { renderSheet(); setSync("Shared · up to date"); })
        .catch(() => { setHouseholdCode(null); toast("Couldn't start sharing — check your connection"); setSync("Saved on this device"); });
      break;
    }
    case "share-send": {
      const url = shareLink(householdCode());
      if (navigator.share) navigator.share({ title: "Meal planner", text: "Join our meal planner", url }).catch(() => {});
      else navigator.clipboard?.writeText(url).then(() => toast("Link copied"));
      break;
    }
    case "share-copy": {
      const input = document.getElementById("share-link");
      input.select();
      (navigator.clipboard ? navigator.clipboard.writeText(input.value) : Promise.reject()).then(() => toast("Link copied"), () => toast("Press Ctrl+C to copy"));
      break;
    }
    case "share-stop":
      setHouseholdCode(null);
      location.reload();
      break;
    case "shuffle-slot": {
      const pick = pickRandom(slot, state.slots[slot]);
      if (!pick) { toast("No other recipes fit that slot"); break; }
      commit(s => { s.slots[slot] = pick; delete s.cooked[pick]; });
      break;
    }
    case "shuffle-all":
      commit(s => {
        const old = { ...s.slots };
        for (const sl of SLOTS) s.slots[sl.key] = null;
        // pickRandom reads the live state, so each pick avoids the ones before it.
        for (const sl of SLOTS) s.slots[sl.key] = pickRandom(sl.key, old[sl.key]);
      });
      toast("New trio picked");
      break;
    case "choose": ui.choosing = slot; ui.chapter = null; ui.tab = "recipes"; render(); break;
    case "cancel-choose": ui.choosing = null; render(); break;
    case "goto-recipes": ui.choosing = null; ui.tab = "recipes"; render(); break;
    case "clear-slot": commit(s => { s.slots[slot] = null; }); break;
    case "remove-extra": commit(s => { s.extras = s.extras.filter(x => x !== id); }); break;
    case "use": {
      const target = ui.choosing || slotFor(BY_ID[id]);
      commit(s => { s.slots[target] = id; s.extras = s.extras.filter(x => x !== id); });
      ui.open = null; ui.choosing = null; ui.tab = "week"; render();
      toast(`Added to this week`);
      break;
    }
    case "add-extra": commit(s => { if (!s.extras.includes(id)) s.extras.push(id); }); ui.open = null; renderSheet(); toast("Added as an extra"); break;
    case "unplan": commit(s => {
      for (const k of Object.keys(s.slots)) if (s.slots[k] === id) s.slots[k] = null;
      s.extras = s.extras.filter(x => x !== id);
    }); renderSheet(); toast("Removed from this week"); break;
    case "new-week": {
      const ids = plannedIds();
      commit(s => {
        if (ids.length) s.history.unshift({ week: s.week, ids });
        s.history = s.history.slice(0, 12);
        const [y, m, d] = s.week.split("-").map(Number);
        const next = mondayOf(new Date(y, m - 1, d + 7));
        const thisWeek = mondayOf(new Date());
        s.week = next > thisWeek ? next : thisWeek;
        s.slots = { slow: null, pressure: null, quick: null };
        s.extras = []; s.cooked = {}; s.checked = {};
      });
      toast("Last week saved to history");
      break;
    }
    case "chapter": ui.chapter = ui.chapter === el.dataset.v ? null : el.dataset.v; ui.group = null; render(); break;
    case "group": ui.group = ui.group === el.dataset.v ? null : el.dataset.v; render(); break;
    case "protein": ui.protein = ui.protein === el.dataset.v ? null : el.dataset.v; render(); break;
    case "high-protein-chip": ui.highProtein = !ui.highProtein; render(); break;
    case "fav-only": ui.favOnly = !ui.favOnly; render(); break;
    case "fav": commit(s => { if (s.fav[id]) delete s.fav[id]; else s.fav[id] = true; }); break;
    case "rate": {
      const v = Number(el.dataset.v);
      commit(s => { if (s.rating[id] === v) delete s.rating[id]; else s.rating[id] = v; });
      break;
    }
    case "scale": {
      const id = el.dataset.id, v = Number(el.dataset.v);
      commit(s => { if (v === 1) delete s.scale[id]; else s.scale[id] = v; });
      break;
    }
    case "diet": {
      const t = el.dataset.v;
      ui.diet = ui.diet.includes(t) ? ui.diet.filter(x => x !== t) : [...ui.diet, t];
      render();
      break;
    }
    case "uncheck-all": commit(s => { s.checked = {}; }); break;
    case "copy-list": copyList(); break;
    case "share-list": shareList(); break;
  }
});
document.addEventListener("change", e => {
  const el = e.target;
  const act = el.dataset.act;
  if (act === "cooked") commit(s => {
    const id = el.dataset.id, today = todayISO();
    const log = s.log[id] || [];
    if (el.checked) {
      s.cooked[id] = true;
      if (log[log.length - 1] !== today) s.log[id] = [...log, today].slice(-20);
    } else {
      delete s.cooked[id];
      // Unticking straight away undoes today's entry.
      if (log[log.length - 1] === today) s.log[id] = log.slice(0, -1);
      if (s.log[id] && !s.log[id].length) delete s.log[id];
    }
  });
  if (act === "check") commit(s => { if (el.checked) s.checked[el.dataset.key] = true; else delete s.checked[el.dataset.key]; });
  if (act === "mince-only") { ui.minceOnly = el.checked; }
  if (act === "high-protein") { ui.highProtein = el.checked; }
  if (act === "hide-pantry") { ui.hidePantry = el.checked; render(); }
  if (act === "cook-have" && ui.cook) ui.cook.have[el.dataset.n] = el.checked;
});
document.addEventListener("input", e => {
  if (e.target.id !== "search") return;
  ui.q = e.target.value;
  const pos = e.target.selectionStart;
  render();
  const s = document.getElementById("search");
  s.focus(); s.setSelectionRange(pos, pos);
});
document.addEventListener("keydown", e => {
  if (ui.cook) {
    if (e.key === "ArrowRight") cookGo(1);
    else if (e.key === "ArrowLeft") cookGo(-1);
    else if (e.key === "Escape") { ui.cook = null; keepAwake(false); renderSheet(); }
    return;
  }
  if (e.key === "Escape" && (ui.open || ui.share)) { ui.open = null; ui.share = false; renderSheet(); }
});
// Swipe left/right between cooking steps
let touchX = null;
document.addEventListener("touchstart", e => { touchX = ui.cook ? e.touches[0].clientX : null; }, { passive: true });
document.addEventListener("touchend", e => {
  if (touchX == null || !ui.cook) return;
  const dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 70) cookGo(dx < 0 ? 1 : -1);
  touchX = null;
}, { passive: true });
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => {
  ui.tab = b.dataset.tab; if (ui.tab !== "recipes") ui.choosing = null; render(); window.scrollTo(0, 0);
}));

function listText() {
  const groups = shoppingList();
  return AISLES
    .filter(a => !(ui.hidePantry && a.startsWith("Pantry")))
    .map(a => [a, groups[a].filter(x => !state.checked[x.key])])
    .filter(([, items]) => items.length)
    .map(([a, items]) => `${a}\n${items.map(x => `- ${x.name}${x.amount ? ` (${x.amount})` : ""}${x.optional ? " [optional]" : ""}`).join("\n")}`)
    .join("\n\n");
}

// Opens the phone's share menu (Notes, WhatsApp, Messages, Keep...).
// Falls back to copying where sharing isn't available.
async function shareList() {
  const text = listText();
  if (!navigator.share) return copyList("Sharing isn't available here, so the list was copied instead");
  try { await navigator.share({ title: "Shopping list", text }); }
  catch (e) { if (e.name !== "AbortError") copyList("Couldn't open the share menu, so the list was copied instead"); }
}

async function copyList(msg) {
  const text = listText();
  try { await navigator.clipboard.writeText(text); toast(typeof msg === "string" ? msg : "Shopping list copied"); }
  catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    toast("Press Ctrl+C or Copy to copy the list");
    setTimeout(() => ta.remove(), 8000);
  }
}

render();
connect();
// Home-screen app: keep a copy on the phone so it opens with no signal
if ("serviceWorker" in navigator && location.protocol === "https:") {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
